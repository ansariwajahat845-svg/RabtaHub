
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mehfil - RabtaHub</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6fb;
  color:#222;
  padding-bottom:75px;
}

.header{
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  color:white;
  padding:13px 15px;
  position:sticky;
  top:0;
  z-index:20;
}

.header-row{
  max-width:650px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.header-title{
  font-size:20px;
  font-weight:bold;
}

.back-btn,
.refresh-btn{
  border:0;
  background:rgba(255,255,255,.16);
  color:white;
  border-radius:9px;
  padding:8px 12px;
  font-size:17px;
  cursor:pointer;
}

.container{
  max-width:650px;
  margin:auto;
  padding:10px;
}

.notice{
  display:none;
  background:white;
  padding:11px;
  border-radius:10px;
  margin-bottom:10px;
  text-align:center;
  box-shadow:0 2px 7px rgba(0,0,0,.06);
  font-size:13px;
}

.card{
  background:white;
  border-radius:12px;
  padding:13px;
  margin-bottom:10px;
  box-shadow:0 1px 5px rgba(0,0,0,.05);
}

.section-title{
  font-size:16px;
  font-weight:bold;
  margin-bottom:10px;
}

input,
textarea,
select{
  width:100%;
  border:1px solid #ddd;
  border-radius:9px;
  padding:10px;
  margin-bottom:9px;
  font-size:14px;
  outline:none;
}

textarea{
  resize:vertical;
  min-height:75px;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#6c5ce7;
}

.primary-btn{
  width:100%;
  border:0;
  border-radius:9px;
  padding:10px;
  background:#6c5ce7;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.secondary-btn{
  border:0;
  border-radius:8px;
  padding:8px 11px;
  background:#eee;
  color:#333;
  cursor:pointer;
}

.danger-btn{
  border:0;
  border-radius:8px;
  padding:8px 11px;
  background:#ffecec;
  color:#c0392b;
  cursor:pointer;
}

/* =========================
   MEHFIL LIST
========================= */

.mehfil-item{
  background:white;
  border-bottom:1px solid #eee;
  padding:13px 4px;
  cursor:pointer;
}

.mehfil-item:last-child{
  border-bottom:0;
}

.mehfil-name{
  font-weight:bold;
  font-size:16px;
}

.mehfil-description{
  color:#777;
  font-size:13px;
  margin-top:5px;
  line-height:1.4;
}

.mehfil-meta{
  margin-top:7px;
}

.privacy-badge{
  display:inline-block;
  padding:4px 7px;
  border-radius:7px;
  background:#f0edff;
  color:#6c5ce7;
  font-size:11px;
}

.member-badge{
  display:inline-block;
  padding:4px 7px;
  border-radius:7px;
  background:#f3f3f3;
  color:#666;
  font-size:11px;
}

/* =========================
   DETAIL
========================= */

.detail-header{
  padding:10px 4px 13px;
  border-bottom:1px solid #eee;
  background:transparent;
}

.detail-name{
  font-size:21px;
  font-weight:bold;
}

.detail-description{
  color:#777;
  font-size:13px;
  margin:5px 0 8px;
}

.detail-meta{
  margin-bottom:8px;
}

.action-row{
  display:flex;
  gap:7px;
}

.action-row button{
  flex:1;
}

/* =========================
   COMPOSER
========================= */

.composer{
  background:white;
  border-radius:10px;
  padding:11px;
  margin-bottom:10px;
  border:1px solid #eee;
}

.composer-label{
  font-size:14px;
  font-weight:bold;
  margin-bottom:7px;
}

.composer textarea{
  min-height:60px;
  margin-bottom:7px;
}

.photo-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
}

.photo-label{
  display:inline-block;
  background:#f0edff;
  color:#6c5ce7;
  border-radius:8px;
  padding:8px 11px;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
}

.photo-input{
  display:none;
}

.photo-name{
  flex:1;
  color:#888;
  font-size:11px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.image-preview{
  display:none;
  margin-bottom:9px;
  position:relative;
}

.image-preview.show{
  display:block;
}

.image-preview img{
  width:100%;
  max-height:300px;
  object-fit:contain;
  border-radius:9px;
  background:#f5f5f5;
}

.remove-image{
  position:absolute;
  top:7px;
  right:7px;
  border:0;
  background:rgba(0,0,0,.65);
  color:white;
  width:30px;
  height:30px;
  border-radius:50%;
  cursor:pointer;
  font-size:15px;
}

.send-row{
  display:flex;
  justify-content:flex-end;
}

.send-btn{
  border:0;
  background:#6c5ce7;
  color:white;
  border-radius:8px;
  padding:8px 18px;
  font-weight:bold;
  cursor:pointer;
}

/* =========================
   REPLY
========================= */

.reply-target{
  display:none;
  background:#f0edff;
  border-left:3px solid #6c5ce7;
  border-radius:7px;
  padding:7px 9px;
  margin-bottom:7px;
  color:#555;
  font-size:12px;
}

.reply-target.show{
  display:block;
}

.reply-target strong{
  color:#6c5ce7;
}

/* =========================
   FEED
========================= */

.feed{
  background:white;
  border-radius:10px;
  overflow:hidden;
}

.feed-title{
  padding:11px 12px;
  border-bottom:1px solid #eee;
  font-size:15px;
  font-weight:bold;
}

.activity{
  padding:12px;
  border-bottom:1px solid #eee;
  background:white;
}

.activity:last-child{
  border-bottom:0;
}

.activity-head{
  display:flex;
  align-items:center;
  gap:9px;
}

.activity-avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  object-fit:cover;
  background:#eee;
  flex-shrink:0;
}

.activity-info{
  min-width:0;
  flex:1;
}

.activity-user{
  font-size:14px;
  font-weight:bold;
}

.activity-time{
  color:#999;
  font-size:11px;
  margin-top:2px;
}

.activity-text{
  margin-left:47px;
  margin-top:7px;
  font-size:14px;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
}

.activity-image{
  margin-left:47px;
  margin-top:8px;
  max-width:calc(100% - 47px);
}

.activity-image img{
  width:100%;
  max-height:420px;
  object-fit:contain;
  border-radius:9px;
  background:#f5f5f5;
  display:block;
}

.activity-actions{
  margin-left:47px;
  margin-top:7px;
  display:flex;
  gap:9px;
}

.reply-btn,
.delete-btn{
  border:0;
  background:none;
  padding:3px 0;
  font-size:12px;
  cursor:pointer;
}

.reply-btn{
  color:#6c5ce7;
  font-weight:bold;
}

.delete-btn{
  color:#c0392b;
}

/* =========================
   REPLY ACTIVITY
========================= */

.reply-activity{
  background:#faf9ff;
}

.reply-reference{
  margin-left:47px;
  margin-top:6px;
  padding:6px 8px;
  background:#f1efff;
  border-radius:7px;
  color:#777;
  font-size:11px;
}

.reply-reference strong{
  color:#6c5ce7;
}

/* =========================
   MEMBERS
========================= */

.member-list{
  background:white;
  border-radius:10px;
  overflow:hidden;
}

.member{
  display:flex;
  align-items:center;
  gap:9px;
  padding:9px 10px;
  border-bottom:1px solid #eee;
}

.member:last-child{
  border-bottom:0;
}

.member-avatar{
  width:35px;
  height:35px;
  border-radius:50%;
  object-fit:cover;
  background:#eee;
}

.member-name{
  flex:1;
  font-size:13px;
}

.member-username{
  color:#999;
  font-size:10px;
  margin-top:2px;
}

.role{
  font-size:10px;
  padding:4px 6px;
  border-radius:6px;
  background:#f0edff;
  color:#6c5ce7;
}

/* =========================
   INVITE
========================= */

.invite-result{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 0;
  border-bottom:1px solid #eee;
}

.invite-result img{
  width:35px;
  height:35px;
  border-radius:50%;
  object-fit:cover;
}

.invite-result-name{
  flex:1;
  font-size:13px;
}

/* =========================
   STATES
========================= */

.loading,
.empty{
  text-align:center;
  color:#777;
  padding:20px;
  font-size:13px;
}

.hidden{
  display:none !important;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:66px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:30;
}

.nav-btn{
  border:0;
  background:none;
  color:#666;
  font-size:10px;
  text-align:center;
  cursor:pointer;
}

.nav-icon{
  display:block;
  font-size:19px;
  margin-bottom:2px;
}

.nav-btn.active{
  color:#6c5ce7;
  font-weight:bold;
}

</style>

</head>

<body>

<header class="header">

  <div class="header-row">

    <button
      class="back-btn"
      onclick="goHome()">
      ←
    </button>

    <div class="header-title">
      💬 Mehfil
    </div>

    <button
      class="refresh-btn"
      onclick="refreshCurrentPage()">
      ↻
    </button>

  </div>

</header>


<main class="container">

  <div
    id="notice"
    class="notice">
  </div>


  <!-- =========================
       MEHFIL LIST
  ========================== -->

  <div id="mehfilsPage">

    <div class="card">

      <div class="section-title">
        ✨ Create New Mehfil
      </div>

      <input
        id="newMehfilName"
        type="text"
        maxlength="100"
        placeholder="Mehfil name">

      <textarea
        id="newMehfilDescription"
        maxlength="500"
        placeholder="Mehfil ke bare mein likhein..."></textarea>

      <select id="newMehfilPrivacy">

        <option value="public">
          🌍 Public Mehfil
        </option>

        <option value="private">
          🔒 Private Mehfil
        </option>

        <option value="invite">
          📩 Invite Only
        </option>

      </select>

      <button
        class="primary-btn"
        onclick="createMehfil()">

        ➕ Create Mehfil

      </button>

    </div>


    <div class="card">

      <div class="section-title">
        💬 Mehfils
      </div>

      <input
        id="mehfilSearch"
        type="text"
        placeholder="🔎 Search Mehfil..."
        oninput="filterMehfils()">

      <div id="mehfilList">

        <div class="loading">
          Loading Mehfils...
        </div>

      </div>

    </div>

  </div>


  <!-- =========================
       DETAIL
  ========================== -->

  <div
    id="detailPage"
    class="hidden">

    <div class="detail-header">

      <div
        id="detailName"
        class="detail-name">
      </div>

      <div
        id="detailDescription"
        class="detail-description">
      </div>

      <div
        id="detailPrivacy"
        class="privacy-badge">
      </div>

      <div
        id="detailMeta"
        class="detail-meta">
      </div>

      <div
        id="detailActions"
        class="action-row">
      </div>

    </div>


    <!-- INVITE -->

    <div
      id="inviteCard"
      class="card hidden">

      <div class="section-title">
        📩 Invite User
      </div>

      <input
        id="inviteSearch"
        type="text"
        maxlength="50"
        placeholder="Username search..."
        oninput="searchUsers()">

      <div id="inviteResults"></div>

    </div>


    <!-- MEMBERS -->

    <div
      id="membersCard"
      class="card">

      <div class="section-title">
        👥 Members
      </div>

      <div
        id="memberList"
        class="member-list">

        <div class="loading">
          Loading members...
        </div>

      </div>

    </div>


    <!-- COMPOSER -->

    <div
      id="postComposer"
      class="composer hidden">

      <div class="composer-label">
        Message likhein:
      </div>


      <div
        id="replyTarget"
        class="reply-target">
      </div>


      <textarea
        id="mehfilPostText"
        maxlength="2000"
        placeholder="Message likhein..."></textarea>


      <div class="photo-row">

        <label
          class="photo-label"
          for="mehfilImage">

          📷 Upload Photo

        </label>

        <input
          id="mehfilImage"
          class="photo-input"
          type="file"
          accept="image/*"
          onchange="previewMehfilImage()">

        <div
          id="photoName"
          class="photo-name">

          No photo selected

        </div>

      </div>


      <div
        id="imagePreview"
        class="image-preview">

        <button
          class="remove-image"
          type="button"
          onclick="removeMehfilImage()">

          ×

        </button>

        <img
          id="imagePreviewImg"
          src=""
          alt="Preview">

      </div>


      <div class="send-row">

        <button
          class="send-btn"
          onclick="publishActivity()">

          OK

        </button>

      </div>

    </div>


    <!-- FEED -->

    <div
      id="feedCard"
      class="feed">

      <div class="feed-title">
        💬 Mehfil
      </div>

      <div id="mehfilPosts">

        <div class="loading">
          Loading...
        </div>

      </div>

    </div>

  </div>

</main>


<nav class="bottom-nav">

  <button
    class="nav-btn"
    onclick="goHome()">

    <span class="nav-icon">🏠</span>
    Home

  </button>


  <button
    class="nav-btn"
    onclick="goPrivate()">

    <span class="nav-icon">💬</span>
    Private

  </button>


  <button
    class="nav-btn"
    onclick="goProfile()">

    <span class="nav-icon">👤</span>
    Profile

  </button>


  <button
    class="nav-btn active">

    <span class="nav-icon">💬</span>
    Mehfil

  </button>


  <button
    class="nav-btn"
    onclick="goMore()">

    <span class="nav-icon">☰</span>
    More

  </button>

</nav>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://jhcpqjmxiovvqbghpxbf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentUser = null;
let currentMehfil = null;
let currentMembership = null;

let allMehfils = [];

let replyTarget = null;

let searchTimer = null;


/* =========================================
   INIT
========================================= */

async function init(){

  const {
    data:{
      session
    }
  } =
    await supabaseClient
      .auth
      .getSession();


  if(!session){

    window.location.href =
      "login.html";

    return;

  }


  currentUser =
    session.user;


  await loadMehfils();

}


/* =========================================
   LOAD MEHFILS
========================================= */

async function loadMehfils(){

  document.getElementById(
    "mehfilsPage"
  ).classList.remove("hidden");


  document.getElementById(
    "detailPage"
  ).classList.add("hidden");


  const list =
    document.getElementById(
      "mehfilList"
    );


  list.innerHTML =
    '<div class="loading">Loading Mehfils...</div>';


  const {
    data,
    error
  } =
    await supabaseClient
      .from("mehfils")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    console.error(
      "MEHFIL LOAD ERROR:",
      error
    );

    list.innerHTML =
      '<div class="empty">Mehfils load nahi ho sakin.</div>';

    return;

  }


  allMehfils =
    data || [];


  renderMehfilList(
    allMehfils
  );

}


/* =========================================
   RENDER LIST
========================================= */

function renderMehfilList(
  data
){

  const list =
    document.getElementById(
      "mehfilList"
    );


  if(!data || data.length === 0){

    list.innerHTML =
      '<div class="empty">Abhi koi Mehfil nahi bani.</div>';

    return;

  }


  list.innerHTML =
    data
      .map(mehfil => {

        const privacy =
          mehfil.privacy === "public"
            ? "🌍 Public"
            : mehfil.privacy === "private"
              ? "🔒 Private"
              : "📩 Invite Only";


        return `

          <div
            class="mehfil-item"
            onclick="openMehfil(${mehfil.id})">

            <div class="mehfil-name">
              💬 ${escapeHtml(mehfil.name)}
            </div>

            <div class="mehfil-description">
              ${escapeHtml(
                mehfil.description ||
                "Apni community banayein aur baat karein."
              )}
            </div>

            <div class="mehfil-meta">

              <span class="privacy-badge">
                ${privacy}
              </span>

            </div>

          </div>

        `;

      })
      .join("");

}


/* =========================================
   SEARCH
========================================= */

function filterMehfils(){

  const text =
    document.getElementById(
      "mehfilSearch"
    ).value
      .trim()
      .toLowerCase();


  if(!text){

    renderMehfilList(
      allMehfils
    );

    return;

  }


  const filtered =
    allMehfils.filter(
      mehfil =>
        String(
          mehfil.name || ""
        )
        .toLowerCase()
        .includes(text)
        ||
        String(
          mehfil.description || ""
        )
        .toLowerCase()
        .includes(text)
    );


  renderMehfilList(
    filtered
  );

}


/* =========================================
   CREATE MEHFIL
========================================= */

async function createMehfil(){

  const name =
    document.getElementById(
      "newMehfilName"
    ).value.trim();


  const description =
    document.getElementById(
      "newMehfilDescription"
    ).value.trim();


  const privacy =
    document.getElementById(
      "newMehfilPrivacy"
    ).value;


  if(!name){

    showNotice(
      "Mehfil name zaroori hai."
    );

    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("mehfils")
      .insert({

        creator_id:
          currentUser.id,

        name:
          name,

        description:
          description,

        privacy:
          privacy

      })
      .select()
      .single();


  if(error){

    showNotice(
      "Mehfil create nahi hui: " +
      error.message
    );

    return;

  }


  const {
    error:memberError
  } =
    await supabaseClient
      .from("mehfil_members")
      .insert({

        mehfil_id:
          data.id,

        user_id:
          currentUser.id,

        role:
          "admin",

        status:
          "approved"

      });


  if(memberError){

    showNotice(
      "Mehfil bani lekin admin member add nahi hua."
    );

    return;

  }


  document.getElementById(
    "newMehfilName"
  ).value = "";


  document.getElementById(
    "newMehfilDescription"
  ).value = "";


  showNotice(
    "✅ Mehfil create ho gayi."
  );


  await loadMehfils();

}


/* =========================================
   OPEN MEHFIL
========================================= */

async function openMehfil(
  mehfilId
){

  const {
    data:mehfil,
    error
  } =
    await supabaseClient
      .from("mehfils")
      .select("*")
      .eq(
        "id",
        mehfilId
      )
      .single();


  if(error || !mehfil){

    showNotice(
      "Mehfil nahi mili."
    );

    return;

  }


  currentMehfil =
    mehfil;


  const {
    data:membership,
    error:membershipError
  } =
    await supabaseClient
      .from("mehfil_members")
      .select("*")
      .eq(
        "mehfil_id",
        mehfilId
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .maybeSingle();


  if(membershipError){

    console.error(
      "MEMBERSHIP ERROR:",
      membershipError
    );

  }


  currentMembership =
    membership || null;


  replyTarget =
    null;


  clearReplyTarget();


  removeMehfilImage();


  document.getElementById(
    "mehfilsPage"
  ).classList.add("hidden");


  document.getElementById(
    "detailPage"
  ).classList.remove("hidden");


  document.getElementById(
    "detailName"
  ).textContent =
    mehfil.name;


  document.getElementById(
    "detailDescription"
  ).textContent =
    mehfil.description || "";


  document.getElementById(
    "detailPrivacy"
  ).textContent =
    mehfil.privacy === "public"
      ? "🌍 Public"
      : mehfil.privacy === "private"
        ? "🔒 Private"
        : "📩 Invite Only";


  await loadMemberCount();

  await renderMehfilActions();

}


/* =========================================
   MEMBER COUNT
========================================= */

async function loadMemberCount(){

  const meta =
    document.getElementById(
      "detailMeta"
    );


  const {
    count,
    error
  } =
    await supabaseClient

async function doUserSearch(){

    document.getElementById(
      "inviteSearch"
    );


  const text =
    input.value.trim();


  const results =
    document.getElementById(
      "inviteResults"
    );

    results.innerHTML = "";

  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "id,username,name,avatar_url"

      .ilike(

      )
      .limit(10);

async function sendInvite(
  inviteeId
){

  if(
    !currentMehfil ||
    currentMehfil.creator_id !==
    currentUser.id
  ){

    showNotice(
      "Sirf Mehfil Admin invite bhej sakta hai."
    );

    return;

  }


  const {
    data:existing
  } =
    await supabaseClient
      .from("mehfil_members")
      .select("id")
      .eq(
        "mehfil_id",
        currentMehfil.id
      )
      .eq(
        "user_id",
        inviteeId
      )
      .maybeSingle();


  if(existing){

    showNotice(
      "Ye user already member hai."
    );

    return;

  }


  const {
    data:oldInvite
  } =
    await supabaseClient
      .from("mehfil_invites")
      .select("id")
      .eq(
        "mehfil_id",
        currentMehfil.id
      )
      .eq(
        "invitee_id",
        inviteeId
      )
      .eq(
        "status",
        "pending"
      )
      .maybeSingle();


  if(oldInvite){

    showNotice(
      "Is user ko already invite bheji hui hai."
    );

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("mehfil_invites")
      .insert({

        mehfil_id:
          currentMehfil.id,

        inviter_id:
          currentUser.id,

        invitee_id:
          inviteeId,

        status:
          "pending"

      });


  if(error){

    showNotice(
      "Invite nahi bheji ja saki: " +
      error.message
    );

    return;

  }


  showNotice(
    "📩 Invite bhej di gayi."
  );

}


/* =========================================
   IMAGE PREVIEW
========================================= */

function previewMehfilImage(){

  const input =
    document.getElementById(
      "mehfilImage"
    );


  const preview =
    document.getElementById(
      "imagePreview"
    );


  const image =
    document.getElementById(
      "imagePreviewImg"
    );


  const name =
    document.getElementById(
      "photoName"
    );


  if(!input.files || !input.files[0]){

    removeMehfilImage();

    return;

  }


  const file =
    input.files[0];


  if(!file.type.startsWith("image/")){

    showNotice(
      "Sirf image select karein."
    );

    removeMehfilImage();

    return;

  }


  if(file.size > 8 * 1024 * 1024){

    showNotice(
      "Image 8MB se choti honi chahiye."
    );

    removeMehfilImage();

    return;

  }


  name.textContent =
    file.name;


  const reader =
    new FileReader();


  reader.onload =
    function(event){

      image.src =
        event.target.result;

      preview.classList.add(
        "show"
      );

    };


  reader.readAsDataURL(
    file
  );

}

   REMOVE IMAGE
========================================= */

function removeMehfilImage(){

  const input =
    document.getElementById(
      "mehfilImage"

  const preview =

    );


  const image =
    document.getElementById(
      "imagePreviewImg"
    );


  const name =
    document.getElementById(
      "photoName"
    );


  if(input){

    input.value = "";

  }


  if(image){

    image.src = "";

  }


  if(preview){

    preview.classList.remove(
      "show"
    );

  }


  if(name){

    name.textContent =
      "No photo selected";

  }

}


/* =========================================
   UPLOAD IMAGE
========================================= */

async function uploadMehfilImage(
  file
){

  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const safeExtension =
    /^[a-z0-9]+$/.test(
      extension
    )
      ? extension
      : "jpg";


  const fileName =
    currentUser.id +
    "_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2,8) +
    "." +
    safeExtension;


  const filePath =
    currentMehfil.id +
    "/" +
    fileName;


  const {
    error
  } =
    await supabaseClient
      .storage
      .from("mehfil-images")
      .upload(
        filePath,
        file,
        {
          cacheControl:"3600",
          upsert:false
        }
      );


  if(error){

    throw error;

  }


  const {
    data
  } =
    supabaseClient
      .storage
      .from("mehfil-images")
      .getPublicUrl(
        filePath
      );


  return data.publicUrl;

}


/* =========================================
   PUBLISH ACTIVITY
========================================= */

async function publishActivity(){

  if(
    !currentMembership ||
    currentMembership.status !==
    "approved"
  ){

    showNotice(
      "Pehle Mehfil join karein."
    );

    return;

  }


  const input =
    document.getElementById(
      "mehfilPostText"
    );


  const text =
    input.value.trim();


  const imageInput =
    document.getElementById(
      "mehfilImage"
    );


  const imageFile =
    imageInput.files &&
    imageInput.files[0]
      ? imageInput.files[0]
      : null;


  /* =========================
     REPLY
  ========================= */

  if(replyTarget){

    if(imageFile){

      showNotice(
        "Reply mein filhal sirf text bhejein."
      );

      return;

    }


    if(!text){

      showNotice(
        "Reply likhein."
      );

      return;

    }


    const target =
      replyTarget;


    const {
      error
    } =
    await supabaseClient
      .from("mehfil_replies")
      .insert({

        mehfil_post_id:
          target.postId,

        user_id:
          currentUser.id,

        reply:
          text

      });


    if(error){

      showNotice(
        "Reply nahi hui: " +
        error.message
      );

      return;

    }


    input.value = "";

    clearReplyTarget();

    replyTarget = null;


    await loadFeed();


    showNotice(
      "✅ Reply Mehfil ke top par aa gayi."
    );

    return;

  }


  /* =========================
     TEXT / IMAGE POST
  ========================= */

  if(!text && !imageFile){

    showNotice(
      "Message ya photo select karein."
    );

    return;

  }


  let imageUrl =
    null;


  if(imageFile){

    try{

      imageUrl =
        await uploadMehfilImage(
          imageFile
        );

    }catch(error){

      console.error(
        "MEHFIL IMAGE UPLOAD ERROR:",
        error
      );

      showNotice(
        "Photo upload nahi hui: " +
        error.message
      );

      return;

    }

  }


  const {
    data:newPost,
    error
  } =
    await supabaseClient
      .from("mehfil_posts")
      .insert({

        mehfil_id:
          currentMehfil.id,

        user_id:
          currentUser.id,

        content:
          text || "📷 Photo",

        image_url:
          imageUrl

      })
      .select()
      .single();


  if(error){

    showNotice(
      "Message publish nahi hua: " +
      error.message
    );

    return;

  }


  input.value = "";


  removeMehfilImage();


  await loadFeed();


  showNotice(
    imageUrl
      ? "✅ Photo Mehfil mein aa gayi."
      : "✅ Message Mehfil mein aa gaya."
  );

}

/* =========================================
   LOAD FEED
========================================= */

async function loadFeed(){

  const list =
    document.getElementById(
      "mehfilPosts"
    );


  list.innerHTML =
    '<div class="loading">Loading...</div>';


  const {
    data:posts,
    error:postError
  } =
    await supabaseClient
      .from("mehfil_posts")
      .select("*")
      .eq(
        "mehfil_id",
        currentMehfil.id
      );


  if(postError){

    console.error(
      "MEHFIL POSTS ERROR:",
      postError
    );

    list.innerHTML =
      '<div class="empty">Messages load nahi ho sake.</div>';

    return;

  }


  const postIds =
    (posts || [])
      .map(
        post =>
          post.id
      );


  let replies = [];


  if(postIds.length){

    const {
      data,
      error
    } =
      await supabaseClient
        .from("mehfil_replies")
        .select("*")
        .in(
          "mehfil_post_id",
          postIds
        );


    if(!error){

      replies =
        data || [];

    }

  }


  let feedItems = [];


  (posts || [])
    .forEach(post => {

      feedItems.push({

        type:"post",

        data:post

      });

    });


  replies
    .forEach(reply => {

      feedItems.push({

        type:"reply",

        data:reply

      });

    });


  feedItems.sort(
    (a,b) =>
      new Date(
        b.data.created_at
      ) -
      new Date(
        a.data.created_at
      )
  );


  if(feedItems.length === 0){

    list.innerHTML =
      '<div class="empty">Abhi koi Mehfil activity nahi hai.</div>';

    return;

  }


  const userIds =
    [
      ...new Set(
        feedItems
          .map(
            item =>
              item.data.user_id
          )
          .filter(Boolean)
      )
    ];


  const {
    data:profiles
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "id,username,name,avatar_url"
      )
      .in(
        "id",
        userIds
      );


  const profileMap = {};


  (profiles || [])
    .forEach(profile => {

      profileMap[
        profile.id
      ] = profile;

    });


  const postMap = {};


  (posts || [])
    .forEach(post => {

      postMap[
        post.id
      ] = post;

    });


  list.innerHTML =
    feedItems
      .map(item => {

        if(
          item.type ===
          "post"
        ){

          return renderPost(
            item.data,
            profileMap[
              item.data.user_id
            ]
          );

        }


        const originalPost =
          postMap[
            item.data.mehfil_post_id
          ];


        const originalProfile =
          profileMap[
            originalPost?.user_id
          ];


        return renderReplyActivity(
          item.data,
          profileMap[
            item.data.user_id
          ],
          originalPost,
          originalProfile
        );

      })
      .join("");

}


/* =========================================
   RENDER POST
========================================= */

function renderPost(
  post,
  profile
){

  const avatar =
    profile?.avatar_url ||
    "https://via.placeholder.com/100";


  const username =
    profile?.username ||
    profile?.name ||
    "User";


  const own =
    post.user_id ===
    currentUser.id;


  const imageHtml =
    post.image_url
      ? `

        <div class="activity-image">

          <img
            src="${escapeHtml(
              post.image_url
            )}"
            alt="Mehfil Photo"
            loading="lazy">

        </div>

      `
      : "";


  const textHtml =
    post.content &&
    post.content !== "📷 Photo"
      ? `

        <div class="activity-text">

          ${escapeHtml(
            post.content
          )}

        </div>

      `
      : "";


  return `

    <div
      class="activity"
      id="mehfil-post-${post.id}">

      <div class="activity-head">

        <img
          class="activity-avatar"
          src="${escapeHtml(
            avatar
          )}"
          alt="">

        <div class="activity-info">

          <div class="activity-user">

            ${escapeHtml(
              username
            )}

          </div>

          <div class="activity-time">

            ${formatDate(
              post.created_at
            )}

          </div>

        </div>

      </div>


      ${textHtml}


      ${imageHtml}


      <div class="activity-actions">

        <button
          class="reply-btn"
          onclick="
            startReply(
              ${post.id},
              '${escapeJs(
                username
              )}'
            )
          ">

          Reply

        </button>


        ${
          own
            ? `

              <button
                class="delete-btn"

                    )}'
                  )

              </button>

            `
            : ""
        }

      </div>

    </div>

  `;

}

/* =========================================
   DELETE IMAGE FROM STORAGE
========================================= */

async function deleteMehfilImage(
  imageUrl
){

  if(!imageUrl){

    return;

  }


  try{

    const marker =
      "/storage/v1/object/public/mehfil-images/";

    const index =
      imageUrl.indexOf(
        marker
      );


    if(index === -1){

      return;

    }


    const path =
      decodeURIComponent(
        imageUrl.substring(
          index + marker.length
        )
      );


    await supabaseClient
      .storage
      .from("mehfil-images")
      .remove([
        path
      ]);

  }catch(error){

    console.error(
      "IMAGE DELETE ERROR:",
      error
    );

  }

}

/* =========================================
   DATE
========================================= */

function formatDate(
  date
){

  const d =
    new Date(date);


  return d.toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================================
   ESCAPE JS
========================================= */

function escapeJs(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  )
  .replace(
    /"/g,
    '\\"'
  )
  .replace(
    /\n/g,
    "\\n"
  )
  .replace(
    /\r/g,
    "\\r"
  );

}
