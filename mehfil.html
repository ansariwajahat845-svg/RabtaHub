<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Mehfil - RabtaHub</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;

}

button,

.header{

.header-title{

/* MEHFIL LIST */

.mehfil-card{

/* CHAT */

.chat-page{

}

.chat-info{

  border-radius:15px;

}

.chat-info-title{

}

.chat-info-desc{

.chat-actions{

.username{

.composer-wrap{

.message-input{

.composer-row{

}

.image-preview{

.remove-image{

}

/* PAGES */

.sub-page{

}

}

.back-btn{
  border:0;
  background:#eeeaff;

}

.member-row,

/* BOTTOM NAV */

}

.bottom-nav-inner{

.empty{

<body>

<div class="header">
  <div class="header-row">

      <div class="header-title" id="headerTitle">💬 Mehfil</div>
      <div class="header-sub" id="headerSub">RabtaHub</div>

  <!-- MEHFIL LIST -->

</div>


<!-- COMPOSER -->
<div id="composerWrap" class="composer-wrap hidden">

<!-- BOTTOM NAV -->

</div>


<!-- CREATE MODAL -->

</div>


<!-- EDIT MODAL -->

  <div class="modal-box">

    <h3>✏️ Edit Mehfil</h3>

    <input
      id="editName"
      class="form-input"
      placeholder="Mehfil name">

    <textarea
      id="editDescription"
      class="form-textarea"
      placeholder="Description"></textarea>

    <select id="editPrivacy" class="form-input">
      <option value="public">Public Mehfil</option>
      <option value="private">Private Mehfil</option>
    </select>

    <div class="modal-buttons">

      <button class="cancel-btn" onclick="closeEditModal()">
        Cancel
      </button>

      <button class="save-btn" onclick="saveEditMehfil()">
        Save
      </button>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://jhcpqjmxiovvqbghpxbf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   GLOBALS
========================================================= */

const MAX_MEHFIL_MEMBERS = 100;

let currentUser = null;
let currentUsername = "User";
let currentMehfil = null;
let currentMembership = null;

let replyTo = null;
let selectedImageData = null;

let refreshTimer = null;


/* =========================================================
   INIT
========================================================= */

document.addEventListener("DOMContentLoaded", async () => {

  const {
    data:{
      session
    }
  } = await supabaseClient.auth.getSession();

  if(!session){
    location.href = "login.html";
    return;
  }

  currentUser = session.user;

  currentUsername =
    currentUser.user_metadata?.username ||
    currentUser.user_metadata?.name ||
    currentUser.email?.split("@")[0] ||
    "User";

  await loadMehfils();

});


/* =========================================================
   PAGE HELPERS
========================================================= */

function hideAllPages(){

  document
    .getElementById("listPage")
    .classList.add("hidden");

  document
    .getElementById("chatPage")
    .classList.add("hidden");

  document
    .getElementById("membersPage")
    .classList.add("hidden");

  document
    .getElementById("settingsPage")
    .classList.add("hidden");

  document
    .getElementById("applicationsPage")
    .classList.add("hidden");

}


function showComposer(){

  document
    .getElementById("composerWrap")
    .classList.remove("hidden");

}


function hideComposer(){

  document
    .getElementById("composerWrap")
    .classList.add("hidden");

}


function backToChat(){

  hideAllPages();

  document
    .getElementById("chatPage")
    .classList.remove("hidden");

  if(currentMehfil){
    document.getElementById("headerTitle").textContent =
      "💬 " + currentMehfil.name;

    document.getElementById("headerSub").textContent =
      "RabtaHub Mehfil";
  }

  showComposer();

}


function goHome(){

  location.href = "index.html";

}


function goPrivate(){

  location.href = "private.html";

}


function goProfile(){

  location.href = "profile.html";

}


function goMehfil(){

  loadMehfils();

}


function goMore(){

  location.href = "more.html";

}


/* =========================================================
   MEHFILS
========================================================= */

async function loadMehfils(){

  hideAllPages();

  document
    .getElementById("listPage")
    .classList.remove("hidden");

  hideComposer();

  document.getElementById("headerTitle").textContent =
    "🏮 Mehfil";

  document.getElementById("headerSub").textContent =
    "RabtaHub";

  const box =
    document.getElementById("mehfilList");

  box.innerHTML =
    '<div class="loading">Mehfil load ho rahi hai...</div>';

  const {
    data,
    error
  } = await supabaseClient
    .from("mehfils")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){

    box.innerHTML =
      `<div class="notice">
        Mehfil load nahi ho saki.<br>
        ${escapeHtml(error.message)}
      </div>`;

    return;
  }

  if(!data || !data.length){

    box.innerHTML =
      '<div class="empty">Abhi koi Mehfil nahi hai.</div>';

    return;
  }

  box.innerHTML = "";

  for(const mehfil of data){

    const card =
      document.createElement("div");

    card.className = "mehfil-card";

    const privateText =
      mehfil.is_private === true ||
      mehfil.privacy === "private"
        ? "🔒 Private"
        : "🌍 Public";

    card.innerHTML = `
      <div class="mehfil-card-title">
        ${escapeHtml(mehfil.name || "Mehfil")}
      </div>

      <div class="mehfil-card-desc">
        ${escapeHtml(mehfil.description || "")}
      </div>

      <div class="mehfil-meta">
        ${privateText}
      </div>

      <div class="card-actions">
        <button class="open-btn">
          Open
        </button>
      </div>
    `;

    card
      .querySelector(".open-btn")
      .onclick = () => openMehfil(mehfil);

    box.appendChild(card);

  }

}


/* =========================================================
   OPEN MEHFIL
========================================================= */

async function openMehfil(mehfil){

  currentMehfil = mehfil;

  const membership =
    await getMembership(
      mehfil.id,
      currentUser.id
    );

  currentMembership = membership;

  if(!membership){

    const {
      count,
      error:countError
    } = await supabaseClient
      .from("mehfil_members")
      .select("*",{count:"exact",head:true})
      .eq("mehfil_id",mehfil.id)
      .eq("status","approved");

    if(countError){

      alert(countError.message);
      return;

    }

    if((count || 0) >= MAX_MEHFIL_MEMBERS){

      alert(
        "Ye Mehfil 100 members ki limit complete kar chuki hai."
      );

      return;

    }

    const isPrivate =
      mehfil.is_private === true ||
      mehfil.privacy === "private";

    const status =
      isPrivate ? "pending" : "approved";

    const {
      error
    } = await supabaseClient
      .from("mehfil_members")
      .insert({
        mehfil_id:mehfil.id,
        user_id:currentUser.id,
        username:currentUsername,
        role:"member",
        status:status
      });

    if(error){

      alert(error.message);
      return;

    }

    if(status === "pending"){

      alert(
        "Private Mehfil hai. Join request bhej di gayi hai."
      );

      await loadMehfils();
      return;

    }

    currentMembership =
      await getMembership(
        mehfil.id,
        currentUser.id
      );

  }

  if(
    currentMembership &&
    currentMembership.status &&
    currentMembership.status !== "approved"
  ){

    alert(

/* =========================================================
   MESSAGE DATA
========================================================= */

function parseMessageContent(content){

  if(
    typeof content !== "string" ||
    !content.startsWith("[[MEHFIL]]")
  ){

    return {
      text:content || "",
      image:null,
      replyTo:null
    };

  }

  try{

    const json =
      JSON.parse(
        content.substring(9)
      );

    return {
      text:json.text || "",
      image:json.image || null,
      replyTo:json.replyTo || null
    };

  }catch(e){

    return {
      text:content,
      image:null,
      replyTo:null
    };

  }

}


function makeMessageContent(
  text,
  image,
  reply
){

  return (
    "[[MEHFIL]]" +
    JSON.stringify({
      text:text || "",
      image:image || null,
      replyTo:reply || null
    })
  );

}


/* =========================================================
   RENDER MESSAGE
========================================================= */

function renderMessage(item){

  const div =
    document.createElement("div");

  div.className = "message";

  const parsed =
    parseMessageContent(
      item.content
    );

  const username =
    item.username ||
    "User";

  const own =
    item.user_id ===
    currentUser.id;

  let html = `
    <div class="message-head">

      <div class="username">
        ${escapeHtml(username)}
      </div>

      <div class="message-time">
        ${formatDate(item.created_at)}
      </div>

    </div>
  `;

  if(parsed.replyTo){

    html += `
      <div class="reply-preview">
        ↩️ Replying to
        <strong>
          @${escapeHtml(parsed.replyTo)}
        </strong>
      </div>
    `;

  }

  if(parsed.text){

    html += `
      <div class="message-text">
        ${escapeHtml(parsed.text)}
      </div>
    `;

  }

  if(parsed.image){

    html += `
      <img
        class="message-image"
        src="${parsed.image}"
        alt="Image"
        loading="lazy">
    `;

  }

  html += `
    <div class="message-tools">

      <button onclick='startReply(${JSON.stringify(
        username
      )})'>
        ↩️ Reply
      </button>
  `;

  if(own){

    html += `
      <button
        class="delete"
        onclick="deleteMessage('${item.id}')">
        🗑️ Delete
      </button>
    `;

  }

  html += `
    </div>
  `;

  div.innerHTML = html;

  return div;

}

/* =========================================================
   IMAGE
========================================================= */

function selectImage(event){

  const file =
    event.target.files?.[0];

  if(!file)
    return;

  if(!file.type.startsWith("image/")){

    alert("Sirf image select karein.");
    return;

  }

  if(file.size > 8 * 1024 * 1024){

    alert(
      "Image 8MB se choti honi chahiye."
    );

    event.target.value = "";
    return;

  }

  const reader =
    new FileReader();

  reader.onload = function(){

    compressImage(
      reader.result
    );

  };

  reader.readAsDataURL(file);

}


function compressImage(dataUrl){

  const img =
    new Image();

  img.onload = function(){

    const max =
      1000;

    let width =
      img.width;

    let height =
      img.height;

    if(width > max || height > max){

      if(width > height){

        height =
          Math.round(
            height * max / width
          );

        width = max;

      }else{

        width =
          Math.round(
            width * max / height
          );

        height = max;

      }

    }

    const canvas =
      document.createElement("canvas");

    canvas.width =
      width;

    canvas.height =
      height;

    const ctx =
      canvas.getContext("2d");

    ctx.drawImage(
      img,
      0,
      0,
      width,
      height
    );

    selectedImageData =
      canvas.toDataURL(
        "image/jpeg",
        .72
      );

    document
      .getElementById("imagePreview")
      .src =
      selectedImageData;

    document
      .getElementById("imagePreviewWrap")
      .style.display =
      "block";

  };

  img.src =
    dataUrl;

}


function removeSelectedImage(){

  selectedImageData = null;

  document
    .getElementById("imageInput")
    .value = "";

  document
    .getElementById("imagePreview")
    .src = "";

  document
    .getElementById("imagePreviewWrap")
    .style.display =
    "none";

}

/* =========================================================
   DATE
========================================================= */

function formatDate(date){

  if(!date)
    return "";

  const d =
    new Date(date);

  const now =
    new Date();

  const seconds =
    Math.floor(
      (now-d)/1000
    );

  if(seconds < 10)
    return "Just now";

  if(seconds < 60)
    return seconds + " sec ago";

  const minutes =
    Math.floor(
      seconds/60
    );

  if(minutes < 60)
    return minutes + " min ago";

  const hours =
    Math.floor(
      minutes/60
    );

  if(hours < 24)
    return hours + " hr ago";

  const days =
    Math.floor(
      hours/24
    );

  if(days < 7)
    return days + " day ago";

  return d.toLocaleDateString();

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
