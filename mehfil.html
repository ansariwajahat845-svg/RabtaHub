<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6fb;
  color:#222;
  padding-bottom:75px;
}

.header{
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  color:white;
  padding:13px 15px;
  position:sticky;
  top:0;
  z-index:20;

.header-row{

  font-weight:bold;

.back-btn,

  border:0;

  color:white;
  border-radius:9px;
  padding:8px 12px;
  font-size:17px;
  cursor:pointer;
}

.container{
  max-width:650px;
  margin:auto;
  padding:10px;
}

.notice{
  display:none;
  background:white;
  padding:11px;
  border-radius:10px;
  margin-bottom:10px;
  text-align:center;
  box-shadow:0 2px 7px rgba(0,0,0,.06);
  font-size:13px;
}

.card{

}

.section-title{

  font-weight:bold;
  margin-bottom:10px;
}

input,
textarea,
select{
  width:100%;
  border:1px solid #ddd;
  border-radius:9px;
  padding:10px;
  margin-bottom:9px;
  font-size:14px;
  outline:none;
}

textarea{
  resize:vertical;
  min-height:75px;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#6c5ce7;
}

.primary-btn{
  width:100%;
  border:0;
  border-radius:9px;
  padding:10px;
  background:#6c5ce7;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.secondary-btn{
  border:0;
  border-radius:8px;
  padding:8px 11px;
  background:#eee;
  color:#333;
  cursor:pointer;
}

.danger-btn{
  border:0;
  border-radius:8px;
  padding:8px 11px;
  background:#ffecec;
  color:#c0392b;
  cursor:pointer;
}

/* =========================
   MEHFIL LIST
========================= */

.mehfil-item{
  background:white;
  border-bottom:1px solid #eee;
  padding:13px 4px;
  cursor:pointer;
}

.mehfil-item:last-child{
  border-bottom:0;
}

.mehfil-name{
  font-weight:bold;
  font-size:16px;
}

.mehfil-description{
  color:#777;
  font-size:13px;
  margin-top:5px;
  line-height:1.4;
}

.mehfil-meta{
  margin-top:7px;
}
