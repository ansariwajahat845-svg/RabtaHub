
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mehfil - RabtaHub</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6fb;
  color:#222;
  padding-bottom:75px;
}

button,
input,
textarea,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.header{
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  color:#fff;
  padding:12px 14px;
  position:sticky;
  top:0;
  z-index:50;
}

.header-row{
  max-width:650px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:10px;
}

.header-title{
  flex:1;
  font-size:20px;
  font-weight:bold;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.header-btn{
  border:0;
  background:rgba(255,255,255,.16);
  color:#fff;
  border-radius:9px;
  padding:8px 11px;
  font-size:16px;
}

.container{
  max-width:650px;
  margin:auto;
  padding:10px;
}

.notice{
  display:none;
  background:#fff;
  padding:11px;
  border-radius:10px;
  margin-bottom:10px;
  text-align:center;
  box-shadow:0 2px 7px rgba(0,0,0,.06);
  font-size:13px;
}

.notice.show{
  display:block;
}

.card{
  background:#fff;
  border-radius:12px;
  padding:13px;
  margin-bottom:10px;
  box-shadow:0 1px 5px rgba(0,0,0,.05);
}

.section-title{
  font-size:16px;
  font-weight:bold;
  margin-bottom:10px;
}

input,
textarea,
select{
  width:100%;
  border:1px solid #ddd;
  border-radius:9px;
  padding:10px;
  margin-bottom:9px;
  font-size:14px;
  outline:none;
  background:#fff;
}

textarea{
  min-height:75px;
  resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#6c5ce7;
}

.primary-btn{
  width:100%;
  border:0;
  border-radius:9px;
  padding:10px;
  background:#6c5ce7;
  color:#fff;
  font-weight:bold;
}

.secondary-btn{
  border:0;
  border-radius:8px;
  padding:8px 11px;
  background:#eee;
  color:#333;
}

.danger-btn{
  border:0;
  border-radius:8px;
  padding:7px 10px;
  background:#ffecec;
  color:#c0392b;
}

/* LIST */

.mehfil-list{
  overflow:hidden;
  border-radius:12px;
}

.mehfil-item{
  background:#fff;
  padding:13px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}

.mehfil-item:last-child{
  border-bottom:0;
}

.mehfil-name{
  font-size:16px;
  font-weight:bold;
}

.mehfil-description{
  color:#777;
  font-size:13px;
  line-height:1.4;
  margin-top:5px;
}

.mehfil-meta{
  margin-top:7px;
  font-size:12px;
  color:#777;
}

.privacy-badge{
  display:inline-block;
  background:#f0edff;
  color:#6c5ce7;
  padding:4px 7px;
  border-radius:7px;
  margin-right:5px;
}

/* DETAIL */

.detail-head{
  display:flex;
  align-items:center;
  gap:10px;
}

.detail-info{
  flex:1;
  min-width:0;
}

.detail-name{
  font-size:19px;
  font-weight:bold;
  word-break:break-word;
}

.detail-description{
  color:#777;
  font-size:13px;
  margin-top:4px;
  line-height:1.4;
}

.detail-actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:12px;
}

.detail-actions button{
  border:0;
  border-radius:8px;
  padding:8px 10px;
  background:#eee;
}

.detail-actions .leave{
  background:#ffecec;
  color:#c0392b;
}

/* COMPOSER */

.reply-target{
  display:none;
  background:#f0edff;
  color:#6c5ce7;
  padding:9px;
  border-radius:8px;
  margin-bottom:8px;
  font-size:13px;
  font-weight:bold;
}

.reply-target.show{
  display:block;
}

.photo-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:9px;
}

.photo-label{
  display:inline-block;
  background:#f0edff;
  color:#6c5ce7;
  padding:8px 11px;
  border-radius:8px;
  font-size:13px;
  font-weight:bold;
}

.photo-input{
  display:none;
}

.image-preview{
  display:none;
  position:relative;
  margin-bottom:9px;
}

.image-preview img{
  width:100%;
  max-height:300px;
  object-fit:cover;
  border-radius:10px;
}

.remove-photo{
  position:absolute;
  top:8px;
  right:8px;
  border:0;
  border-radius:50%;
  width:30px;
  height:30px;
  background:rgba(0,0,0,.7);
  color:#fff;
  font-size:17px;
}

/* FEED */

.feed{
  margin-top:5px;
}

.activity{
  background:#fff;
  padding:13px 12px;
  border-bottom:1px solid #eee;
}

.activity:first-child{
  border-radius:12px 12px 0 0;
}

.activity:last-child{
  border-radius:0 0 12px 12px;
}

.activity-head{
  display:flex;
  align-items:center;
  gap:9px;
}

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#eee;
  object-fit:cover;
  flex-shrink:0;
}

.activity-user{
  flex:1;
  min-width:0;
}

.activity-username{
  font-weight:bold;
  font-size:14px;
  word-break:break-word;
}

.activity-time{
  color:#999;
  font-size:11px;
  margin-top:3px;
}

.activity-message{
  margin:10px 0 8px 49px;
  font-size:14px;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
}

.activity-image{
  margin:8px 0 8px 49px;
}

.activity-image img{
  width:100%;
  max-height:380px;
  object-fit:cover;
  border-radius:10px;
  display:block;
}

.activity-actions{
  margin-left:49px;
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.activity-actions button{
  border:0;
  background:#f2f2f2;
  border-radius:7px;
  padding:6px 9px;
  font-size:12px;
}

.activity-actions .delete{
  color:#c0392b;
  background:#fff0f0;
}

/* MEMBERS */

.member-row{
  display:flex;
  align-items:center;
  gap:9px;
  padding:9px 0;
  border-bottom:1px solid #eee;
}

.member-row:last-child{
  border-bottom:0;
}

.member-info{
  flex:1;
  min-width:0;
}

.member-name{
  font-size:14px;
  font-weight:bold;
  word-break:break-word;
}

.member-username{
  color:#888;
  font-size:12px;
  margin-top:2px;
}

.member-role{
  font-size:11px;
  color:#6c5ce7;
  margin-top:3px;
}

/* INVITE */

.invite-box{
  background:#faf9ff;
  border:1px solid #e8e3ff;
  border-radius:10px;
  padding:10px;
}

.invite-result{
  display:flex;
  align-items:center;
  gap:9px;
  padding:8px 0;
  border-bottom:1px solid #eee;
}

.invite-result:last-child{
  border-bottom:0;
}

.invite-result-info{
  flex:1;
  min-width:0;
}

.invite-result-name{
  font-weight:bold;
  font-size:13px;
}

.invite-result-username{
  color:#888;
  font-size:11px;
}

/* EMPTY */

.loading,
.empty{
  background:#fff;
  border-radius:12px;
  padding:25px 15px;
  text-align:center;
  color:#777;
}

.error-box{
  background:#fff0f0;
  color:#c0392b;
  border-radius:10px;
  padding:12px;
  font-size:13px;
  word-break:break-word;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:65px;
  background:#fff;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:center;
  z-index:100;
  box-shadow:0 -2px 8px rgba(0,0,0,.06);
}

.bottom-inner{
  width:100%;
  max-width:650px;
  display:flex;
}

.nav-btn{
  flex:1;
  border:0;
  background:#fff;
  color:#777;
  font-size:11px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
}

.nav-btn.active{
  color:#6c5ce7;
  font-weight:bold;
}

.nav-icon{
  font-size:20px;
}

.hidden{
  display:none !important;
}

</style>
</head>

<body>

<header class="header">

  <div class="header-row">

    <button
      class="header-btn"
      onclick="goBack()">
      ←
    </button>

    <div
      class="header-title"
      id="headerTitle">
      💬 Mehfil
    </div>

    <button
      class="header-btn"
      onclick="refreshCurrent()">
      ↻
    </button>

  </div>

</header>


<main class="container">

  <div
    id="notice"
    class="notice">
  </div>


  <!-- MEHFIL LIST -->

  <section id="listPage">

    <div class="card">

      <div class="section-title">
        💬 Mehfil
      </div>

      <input
        id="searchInput"
        type="text"
        placeholder="Mehfil search karein..."
        oninput="filterMehfils()">

      <button
        class="primary-btn"
        onclick="showCreateMehfil()">
        ＋ New Mehfil
      </button>

    </div>


    <div
      id="createBox"
      class="card hidden">

      <div class="section-title">
        Create New Mehfil
      </div>

      <input
        id="newMehfilName"
        type="text"
        maxlength="80"
        placeholder="Mehfil name">

      <textarea
        id="newMehfilDescription"
        maxlength="300"
        placeholder="Mehfil description"></textarea>

      <select id="newMehfilPrivacy">

        <option value="public">
          🌐 Public
        </option>

        <option value="private">
          🔒 Private
        </option>

        <option value="invite">
          📩 Invite Only
        </option>

      </select>

      <button
        class="primary-btn"
        onclick="createMehfil()">
        Create Mehfil
      </button>

    </div>


    <div
      id="mehfilList"
      class="mehfil-list">

      <div class="loading">
        Mehfil load ho rahi hain...
      </div>

    </div>

  </section>


  <!-- DETAIL -->

  <section
    id="detailPage"
    class="hidden">


    <div class="card">

      <div class="detail-head">

        <div class="detail-info">

          <div
            id="detailName"
            class="detail-name">
          </div>

          <div
            id="detailDescription"
            class="detail-description">
          </div>

          <div
            id="detailMeta"
            class="mehfil-meta">
          </div>

        </div>

      </div>


      <div
        id="detailActions"
        class="detail-actions">
      </div>

    </div>


    <!-- INVITE -->

    <div
      id="inviteCard"
      class="card hidden">

      <div class="section-title">
        📩 Invite User
      </div>

      <div class="invite-box">

        <input
          id="inviteSearch"
          type="text"
          placeholder="@username search karein"
          oninput="searchInviteUsers()">

        <div id="inviteResults"></div>

      </div>

    </div>


    <!-- MEMBERS -->

    <div class="card">

      <div class="section-title">
        👥 Members
      </div>

      <div id="membersList">

        <div class="loading">
          Members load ho rahe hain...
        </div>

      </div>

    </div>


    <!-- COMPOSER -->

    <div
      id="composerCard"
      class="card hidden">

      <div
        id="replyTarget"
        class="reply-target">
      </div>

      <textarea
        id="messageInput"
        maxlength="5000"
        placeholder="Message likhein...">
      </textarea>


      <div
        id="imagePreview"
        class="image-preview">

        <img id="previewImage">

        <button
          class="remove-photo"
          onclick="removeSelectedImage()">
          ×
        </button>

      </div>


      <div class="photo-row">

        <label
          class="photo-label"
          for="mehfilImage">
          🖼️ Upload Photo
        </label>

        <input
          id="mehfilImage"
          class="photo-input"
          type="file"
          accept="image/*"
          onchange="previewMehfilImage()">

      </div>


      <button
        class="primary-btn"
        onclick="publishActivity()">
        OK
      </button>

    </div>


    <!-- FEED -->

    <div
      id="feed"
      class="feed">

      <div class="loading">
        Mehfil activity load ho rahi hai...
      </div>

    </div>

  </section>

</main>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <div class="bottom-inner">

    <button
      class="nav-btn"
      onclick="goHome()">

      <span class="nav-icon">🏠</span>
      <span>Home</span>

    </button>


    <button
      class="nav-btn"
      onclick="goPrivate()">

      <span class="nav-icon">💬</span>
      <span>Private</span>

    </button>


    <button
      class="nav-btn"
      onclick="goProfile()">

      <span class="nav-icon">👤</span>
      <span>Profile</span>

    </button>


    <button
      class="nav-btn active"
      onclick="goMehfil()">

      <span class="nav-icon">💬</span>
      <span>Mehfil</span>

    </
```
