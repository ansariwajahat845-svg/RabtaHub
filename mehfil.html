
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mehfil - RabtaHub</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6fb;
  color:#222;
  padding-bottom:75px;
}

button,
input,
textarea,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.header{
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  color:#fff;
  padding:12px 14px;
  position:sticky;
  top:0;
  z-index:50;
}

.header-row{
  max-width:650px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:10px;
}

.header-title{
  flex:1;
  font-size:20px;
  font-weight:bold;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.header-btn{
  border:0;
  background:rgba(255,255,255,.16);
  color:#fff;
  border-radius:9px;
  padding:8px 11px;
  font-size:16px;
}

.container{
  max-width:650px;
  margin:auto;
  padding:10px;
}

.notice{
  display:none;
  background:#fff;
  padding:11px;
  border-radius:10px;
  margin-bottom:10px;
  text-align:center;
  box-shadow:0 2px 7px rgba(0,0,0,.06);
  font-size:13px;
}

.notice.show{
  display:block;
}

.card{
  background:#fff;
  border-radius:12px;
  padding:13px;
  margin-bottom:10px;
  box-shadow:0 1px 5px rgba(0,0,0,.05);
}

.section-title{
  font-size:16px;
  font-weight:bold;
  margin-bottom:10px;
}

input,
textarea,
select{
  width:100%;
  border:1px solid #ddd;
  border-radius:9px;
  padding:10px;
  margin-bottom:9px;
  font-size:14px;
  outline:none;
  background:#fff;
}

textarea{
  min-height:75px;
  resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#6c5ce7;
}

.primary-btn{
  width:100%;
  border:0;
  border-radius:9px;
  padding:10px;
  background:#6c5ce7;
  color:#fff;
  font-weight:bold;
}

.secondary-btn{
  border:0;
  border-radius:8px;
  padding:8px 11px;
  background:#eee;
  color:#333;
}

.danger-btn{
  border:0;
  border-radius:8px;
  padding:7px 10px;
  background:#ffecec;
  color:#c0392b;
}

.hidden{
  display:none !important;
}

/* LIST */

.mehfil-list{
  overflow:hidden;
  border-radius:12px;
}

.mehfil-item{
  background:#fff;
  padding:13px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}

.mehfil-item:last-child{
  border-bottom:0;
}

.mehfil-name{
  font-size:16px;
  font-weight:bold;
}

.mehfil-description{
  color:#777;
  font-size:13px;
  line-height:1.4;
  margin-top:5px;
}

.mehfil-meta{
  margin-top:7px;
  font-size:12px;
  color:#777;
}

.privacy-badge{
  display:inline-block;
  background:#f0edff;
  color:#6c5ce7;
  padding:4px 7px;
  border-radius:7px;
  margin-right:5px;
}

/* DETAIL */

.detail-head{
  display:flex;
  align-items:center;
  gap:10px;
}

.detail-info{
  flex:1;
  min-width:0;
}

.detail-name{
  font-size:19px;
  font-weight:bold;
  word-break:break-word;
}

.detail-description{
  color:#777;
  font-size:13px;
  margin-top:4px;
  line-height:1.4;
}

.detail-actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:12px;
}

.detail-actions button{
  border:0;
  border-radius:8px;
  padding:8px 10px;
  background:#eee;
}

.detail-actions .leave{
  background:#ffecec;
  color:#c0392b;
}

/* COMPOSER */

.reply-target{
  display:none;
  background:#f0edff;
  color:#6c5ce7;
  padding:9px;
  border-radius:8px;
  margin-bottom:8px;
  font-size:13px;
  font-weight:bold;
}

.reply-target.show{
  display:block;
}

.photo-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:9px;
}

.photo-label{
  display:inline-block;
  background:#f0edff;
  color:#6c5ce7;
  padding:8px 11px;
  border-radius:8px;
  font-size:13px;
  font-weight:bold;
}

.photo-input{
  display:none;
}

.image-preview{
  display:none;
  position:relative;
  margin-bottom:9px;
}

.image-preview img{
  width:100%;
  max-height:300px;
  object-fit:cover;
  border-radius:10px;
}

.remove-photo{
  position:absolute;
  top:8px;
  right:8px;
  border:0;
  border-radius:50%;
  width:30px;
  height:30px;
  background:rgba(0,0,0,.7);
  color:#fff;
  font-size:17px;
}

/* FEED */

.feed{
  margin-top:5px;
}

.activity{
  background:#fff;
  padding:13px 12px;
  border-bottom:1px solid #eee;
}

.activity:first-child{
  border-radius:12px 12px 0 0;
}

.activity:last-child{
  border-radius:0 0 12px 12px;
}

.activity-head{
  display:flex;
  align-items:center;
  gap:9px;
}

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#eee;
  object-fit:cover;
  flex-shrink:0;
}

.activity-user{
  flex:1;
  min-width:0;
}

.activity-username{
  font-weight:bold;
  font-size:14px;
  word-break:break-word;
}

.activity-time{
  color:#999;
  font-size:11px;
  margin-top:3px;
}

.activity-message{
  margin:10px 0 8px 49px;
  font-size:14px;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
}

.activity-image{
  margin:8px 0 8px 49px;
}

.activity-image img{
  width:100%;
  max-height:380px;
  object-fit:cover;
  border-radius:10px;
  display:block;
}

.activity-actions{
  margin-left:49px;
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.activity-actions button{
  border:0;
  background:#f2f2f2;
  border-radius:7px;
  padding:6px 9px;
  font-size:12px;
}

.activity-actions .delete{
  color:#c0392b;
  background:#fff0f0;
}

/* MEMBERS */

.member-row{
  display:flex;
  align-items:center;
  gap:9px;
  padding:9px 0;
  border-bottom:1px solid #eee;
}

.member-row:last-child{
  border-bottom:0;
}

.member-info{
  flex:1;
  min-width:0;
}

.member-name{
  font-size:14px;
  font-weight:bold;
  word-break:break-word;
}

.member-username{
  color:#888;
  font-size:12px;
  margin-top:2px;
}

.member-role{
  font-size:11px;
  color:#6c5ce7;
  margin-top:3px;
}

/* INVITE */

.invite-box{
  background:#faf9ff;
  border:1px solid #e8e3ff;
  border-radius:10px;
  padding:10px;
}

.invite-result{
  display:flex;
  align-items:center;
  gap:9px;
  padding:8px 0;
  border-bottom:1px solid #eee;
}

.invite-result:last-child{
  border-bottom:0;
}

.invite-result-info{
  flex:1;
  min-width:0;
}

.invite-result-name{
  font-weight:bold;
  font-size:13px;
}

.invite-result-username{
  color:#888;
  font-size:11px;
}

/* EMPTY */

.loading,
.empty{
  background:#fff;
  border-radius:12px;
  padding:25px 15px;
  text-align:center;
  color:#777;
}

.error-box{
  background:#fff0f0;
  color:#c0392b;
  border-radius:10px;
  padding:12px;
  font-size:13px;
  word-break:break-word;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:65px;
  background:#fff;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:center;
  z-index:100;
  box-shadow:0 -2px 8px rgba(0,0,0,.06);
}

.bottom-inner{
  width:100%;
  max-width:650px;
  display:flex;
}

.nav-btn{
  flex:1;
  border:0;
  background:#fff;
  color:#777;
  font-size:11px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
}

.nav-btn.active{
  color:#6c5ce7;
  font-weight:bold;
}

.nav-icon{
  font-size:20px;
}

</style>
</head>

<body>

<header class="header">

  <div class="header-row">

    <button
      class="header-btn"
      onclick="goBack()">
      ←
    </button>

    <div
      class="header-title"
      id="headerTitle">
      💬 Mehfil
    </div>

    <button
      class="header-btn"
      onclick="refreshCurrent()">
      ↻
    </button>

  </div>

</header>


<main class="container">

  <div
    id="notice"
    class="notice">
  </div>


  <!-- =========================
       MEHFIL LIST
  ========================== -->

  <section id="listPage">

    <div class="card">

      <div class="section-title">
        💬 Mehfil
      </div>

      <input
        id="searchInput"
        type="text"
        placeholder="Mehfil search karein..."
        oninput="filterMehfils()">

      <button
        class="primary-btn"
        onclick="showCreateMehfil()">
        ＋ New Mehfil
      </button>

    </div>


    <div
      id="createBox"
      class="card"
      style="display:none;">

      <div class="section-title">
        Create New Mehfil
      </div>

      <input
        id="newMehfilName"
        type="text"
        maxlength="80"
        placeholder="Mehfil name">

      <textarea
        id="newMehfilDescription"
        maxlength="300"
        placeholder="Mehfil description"></textarea>

      <select id="newMehfilPrivacy">

        <option value="public">
          🌐 Public
        </option>

        <option value="private">
          🔒 Private
        </option>

        <option value="invite">
          📩 Invite Only
        </option>

      </select>

      <button
        class="primary-btn"
        onclick="createMehfil()">
        Create Mehfil
      </button>

    </div>


    <div
      id="mehfilList"
      class="mehfil-list">

      <div class="loading">
        Mehfil load ho rahi hain...
      </div>

    </div>

  </section>


  <!-- =========================
       MEHFIL DETAIL
  ========================== -->

  <section
    id="detailPage"
    style="display:none;">


    <div class="card">

      <div class="detail-head">

        <div class="detail-info">

          <div
            id="detailName"
            class="detail-name">
          </div>

          <div
            id="detailDescription"
            class="detail-description">
          </div>

          <div
            id="detailMeta"
            class="mehfil-meta">
          </div>

        </div>

      </div>


      <div
        id="detailActions"
        class="detail-actions">
      </div>

    </div>


    <!-- INVITE -->

    <div
      id="inviteCard"
      class="card"
      style="display:none;">

      <div class="section-title">
        📩 Invite User
      </div>

      <div class="invite-box">

        <input
          id="inviteSearch"
          type="text"
          placeholder="@username search karein"
          oninput="searchInviteUsers()">

        <div id="inviteResults"></div>

      </div>

    </div>


    <!-- MEMBERS -->

    <div class="card">

      <div class="section-title">
        👥 Members
      </div>

      <div id="membersList">

        <div class="loading">
          Members load ho rahe hain...
        </div>

      </div>

    </div>


    <!-- COMPOSER -->

    <div
      id="composerCard"
      class="card"
      style="display:none;">

      <div
        id="replyTarget"
        class="reply-target">
      </div>

      <textarea
        id="messageInput"
        maxlength="5000"
        placeholder="Message likhein...">
      </textarea>


      <div
        id="imagePreview"
        class="image-preview">

        <img id="previewImage">

        <button
          class="remove-photo"
          onclick="removeSelectedImage()">
          ×

      <div class="photo-row">

        <label
          class="photo-label"
          for="mehfilImage">
          🖼️ Upload Photo
        </label>

        <input
          id="mehfilImage"
          class="photo-input"
          type="file"
          accept="image/*"
          onchange="previewMehfilImage()">

        OK
      </button>

    </div>


    <!-- FEED -->

    <div
      id="feed"
      class="feed">

      <div class="loading">
        Mehfil activity load ho rahi hai...
      </div>

    </div>

  </section>

</main>


<!-- =========================
     BOTTOM NAV
========================== -->

<nav class="bottom-nav">

  <div class="bottom-inner">

    <button
      class="nav-btn"
      onclick="goHome()">

      <span class="nav-icon">🏠</span>
      <span>Home</span>

    </button>


    <button
      class="nav-btn"
      onclick="goPrivate()">

      <span class="nav-icon">💬</span>
      <span>Private</span>

    </button>


    <button
      class="nav-btn"
      onclick="goProfile()">

      <span class="nav-icon">👤</span>
      <span>Profile</span>

    </button>


    <button
      class="nav-btn active"
      onclick="goMehfil()">

      <span class="nav-icon">💬</span>
      <span>Mehfil</span>

    </button>


    <button
      class="nav-btn"
      onclick="goMore()">

      <span class="nav-icon">☰</span>
      <span>More</span>

    </button>

  </div>

</nav>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://jhcpqjmxiovvqbghpxbf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   GLOBALS
===================================================== */

let currentUser = null;
let allMehfils = [];
let currentMehfil = null;
let currentMembers = [];
let replyToUser = null;
let selectedImageFile = null;
let inviteTimer = null;
let noticeTimer = null;


/* =====================================================
   INIT
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  initMehfil
);


async function initMehfil(){

  const list =
    document.getElementById(
      "mehfilList"
    );

  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .getUser();


    if(error){
      throw error;
    }


    currentUser =
      data?.user || null;


    if(!currentUser){

      list.innerHTML =
        `<div class="error-box">
          Login required hai.
        </div>`;

      setTimeout(
        () => {
          window.location.href =
            "login.html";
        },
        1000
      );

      return;
    }


    /*
      IMPORTANT:
      Profiles ko yahan load nahi kar rahe.
      Is wajah se profiles/RLS issue hone par
      Mehfil Loading par nahi atke gi.
    */

    await loadMehfils();


  }catch(error){

    console.error(
      "INIT ERROR:",
      error
    );


    list.innerHTML = `

      <div class="error-box">

        Mehfil load nahi ho saki.

        <br><br>

        ${escapeHtml(
          error?.message ||
          String(error)
        )}

      </div>

    `;

  }

}


/* =====================================================
   LOAD MEHFILS
===================================================== */

async function loadMehfils(){

  const list =
    document.getElementById(
      "mehfilList"
    );


  list.innerHTML =
    '<div class="loading">Mehfil load ho rahi hain...</div>';


  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from("mehfils")
        .select(
          "id,creator_id,name,description,avatar_url,privacy,created_at"
        )
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(error){
      throw error;
    }


    allMehfils =
      data || [];


    renderMehfils(
      allMehfils
    );


  }catch(error){

    console.error(
      "MEHFILS ERROR:",
      error
    );


    list.innerHTML = `

      <div class="error-box">

        Mehfil load nahi ho saki.

        <br><br>

        ${escapeHtml(
          error?.message ||
          String(error)
        )}

      </div>

    `;

  }

}


/* =====================================================
   RENDER MEHFILS
===================================================== */

function renderMehfils(
  items
){

  const list =
    document.getElementById(
      "mehfilList"
    );


  if(!items.length){

    list.innerHTML =
      `<div class="empty">
        Abhi koi Mehfil nahi bani.
      </div>`;

    return;
  }


  list.innerHTML =
    items
      .map(
        mehfil => `

          <div
            class="mehfil-item"
            onclick="openMehfil(${Number(mehfil.id)})">

            <div class="mehfil-name">
              ${escapeHtml(
                mehfil.name ||
                "Mehfil"
              )}
            </div>

            <div class="mehfil-description">
              ${escapeHtml(
                mehfil.description ||
                "No description"
              )}
            </div>

            <div class="mehfil-meta">

              <span class="privacy-badge">
                ${getPrivacyText(
                  mehfil.privacy
                )}
              </span>

            </div>

          </div>

        `
      )
      .join("");

}


/* =====================================================
   SEARCH MEHFILS
===================================================== */

function filterMehfils(){

  const input =
    document.getElementById(
      "searchInput"
    );


  const value =
    input.value
      .trim()
      .toLowerCase();


  if(!value){

    renderMehfils(
      allMehfils
    );

    return;
  }


  renderMehfils(
    allMehfils.filter(
      mehfil =>
        String(
          mehfil.name || ""
        )
        .toLowerCase()
        .includes(value)
    )
  );

}


/* =====================================================
   CREATE BOX
===================================================== */

function showCreateMehfil(){

  const box =
    document.getElementById(
      "createBox"
    );


  box.style.display =
    box.style.display === "none"
      ? "block"
      : "none";

}


/* =====================================================
   CREATE MEHFIL
===================================================== */

async function createMehfil(){

  const name =
    document.getElementById(
      "newMehfilName"
    )
    .value
    .trim();


  const description =
    document.getElementById(
      "newMehfilDescription"
    )
    .value
    .trim();


  const privacy =
    document.getElementById(
      "newMehfilPrivacy"
    )
    .value;


  if(!name){

    showNotice(
      "Mehfil name likhein."
    );

    return;
  }


  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from("mehfils")
        .insert({

          creator_id:
            currentUser.id,

          name:name,

          description:
            description,

          privacy:privacy

        })
        .select()
        .single();


    if(error){
      throw error;
    }


    /*
      Creator ko automatically member.
    */

    const memberResult =
      await supabaseClient
        .from("mehfil_members")
        .insert({

          mehfil_id:
            data.id,

          user_id:
            currentUser.id,

          role:"admin",

          status:"approved"

        });


    if(memberResult.error){

      console.warn(
        "CREATOR MEMBER ERROR:",
        memberResult.error
      );

    }


    document.getElementById(
      "newMehfilName"
    ).value = "";


    document.getElementById(
      "newMehfilDescription"
    ).value = "";


    document.getElementById(
      "createBox"
    ).style.display =
      "none";


    await loadMehfils();


    showNotice(
      "Mehfil create ho gayi."
    );


    openMehfil(
      data.id
    );


  }catch(error){

    console.error(
      "CREATE MEHFIL ERROR:",
      error
    );


    showNotice(
      "Mehfil create nahi hui: " +
      error.message
    );

  }

}


/* =====================================================
   OPEN MEHFIL
===================================================== */

async function openMehfil(
  id
){

  currentMehfil =
    allMehfils.find(
      item =>
        Number(item.id) ===
        Number(id)
    );


  if(!currentMehfil){

    showNotice(
      "Mehfil nahi mili."
    );

    return;
  }


  document.getElementById(
    "listPage"
  ).style.display =
    "none";


  document.getElementById(
    "detailPage"
  ).style.display =
    "block";


  document.getElementById(
    "headerTitle"
  ).textContent =
    "💬 " +
    (
      currentMehfil.name ||
      "Mehfil"
    );


  document.getElementById(
    "detailName"
  ).textContent =
    currentMehfil.name ||
    "Mehfil";


  document.getElementById(
    "detailDescription"
  ).textContent =
    currentMehfil.description ||
    "";


  document.getElementById(
    "detailMeta"
  ).innerHTML =
    `<span class="privacy-badge">
      ${getPrivacyText(
        currentMehfil.privacy
      )}
    </span>`;


  /*
    Har operation separately.
    Ek fail ho to baaki page band nahi hoga.
  */

  await checkMembership();

  await loadMembers();

  await loadFeed();

}


/* =====================================================
   MEMBERSHIP
===================================================== */

async function checkMembership(){

  const actions =
    document.getElementById(
      "detailActions"
    );


  const composer =
    document.getElementById(
      "composerCard"
    );


  const invite =
    document.getElementById(
      "inviteCard"

/* =====================================================
   LOAD MEMBERS
===================================================== */

async function loadMembers(){

  const list =
    document.getElementById(
      "membersList"
    );


  if(!list || !currentMehfil){
    return;
  }


  list.innerHTML =
    '<div class="loading">Members load ho rahe hain...</div>';


  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from("mehfil_members")
        .select(
          "id,mehfil_id,user_id,role,status,created_at"
        )
        .eq(
          "mehfil_id",
          currentMehfil.id
        )
        .order(
          "created_at",
          {
            ascending:true
          }
        );


    if(error){
      throw error;
    }


    currentMembers =
      data || [];


    if(!currentMembers.length){

      list.innerHTML =
        '<div class="empty">Abhi members nahi hain.</div>';

      return;
    }


    /*
      Profile query ko Members ke
      display ke liye use karna hai,
      lekin agar fail ho to Members
      completely break nahi honge.
    */

    let profiles = [];


    try{

      const result =
        await supabaseClient
          .from("profiles")
          .select(
            "id,username,name,avatar_url"
          );


      if(!result.error){

        profiles =
          result.data || [];

      }

    }catch(profileError){

      console.warn(
        "PROFILE LOAD:",
        profileError
      );

    }


    const map = {};


    profiles.forEach(
      profile => {

        map[
          String(profile.id)
        ] = profile;

      }
    );


    list.innerHTML =
      currentMembers
        .map(member => {

          const id =
            String(
              member.user_id || ""
            );


          let profile =
            map[id];


          /*
            Current user fallback.
          */

          if(
            !profile &&
            currentUser &&
            id ===
            String(
              currentUser.id
            )
          ){

            profile = {

              username:
                currentUser
                  ?.user_metadata
                  ?.username ||
                currentUser
                  ?.email
                  ?.split("@")[0] ||
                "Alone",

              name:
                currentUser
                  ?.user_metadata
                  ?.name ||
                "Wajahat",

              avatar_url:""

            };

          }


          const username =
            String(
              profile?.username ||
              profile?.name ||
              "User"
            );


          const name =
            String(
              profile?.name ||
              profile?.username ||
              "User"
            );


          let role =
            String(
              member.role ||
              "member"
            );


          if(
            role === "admin"
          ){

            role = "Admin";

          }
          else if(
            role === "moderator"
          ){

            role = "Moderator";

          }
          else{

            role = "Member";

          }


          const avatar =
            profile?.avatar_url ||
            defaultAvatar();


          return `

            <div class="member-row">

              <img
                class="avatar"
                src="${safeUrl(avatar)}"
                onerror="
                  this.src='${defaultAvatar()}'
                ">


              <div class="member-info">

                <div class="member-name">
                  ${escapeHtml(name)}
                </div>

                <div class="member-username">
                  @${escapeHtml(username)}
                </div>

                <div class="member-role">
                  ${escapeHtml(role)}
                </div>

              </div>

            </div>

          `;

        })
        .join("");


  }catch(error){

    console.error(
      "MEMBERS ERROR:",
      error
    );


    list.innerHTML =
      `<div class="error-box">
        Members load nahi ho sake.
        <br><br>
        ${escapeHtml(
          error?.message ||
          String(error)
        )}
      </div>`;

  }

}


/* =====================================================
   LOAD FEED
===================================================== */

async function loadFeed(){

  const feed =
    document.getElementById(
      "feed"
    );


  if(!feed || !currentMehfil){
    return;
  }


  feed.innerHTML =
    '<div class="loading">Mehfil activity load ho rahi hai...</div>';


  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from("mehfil_posts")
        .select("*")
        .eq(
          "mehfil_id",
          currentMehfil.id
        )
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(error){
      throw error;
    }


    const posts =
      data || [];


    if(!posts.length){

      feed.innerHTML =
        `<div class="empty">
          Abhi Mehfil mein koi activity nahi.
        </div>`;

      return;
    }


    /*
      Profile lookup.
      Fail hone par feed phir bhi show hogi.
    */

    let profiles = [];


    try{

      const ids =
        [
          ...new Set(
            posts
              .map(
                post =>
                  post.user_id
              )
              .filter(Boolean)
          )
        ];


      if(ids.length){

        const result =
          await supabaseClient
            .from("profiles")
            .select(
              "id,username,name,avatar_url"
            )
            .in(
              "id",
              ids
            );


        if(!result.error){

          profiles =
            result.data || [];

        }

      }

    }catch(profileError){

      console.warn(
        "FEED PROFILE ERROR:",
        profileError
      );

    }


    const map = {};


    profiles.forEach(
      profile => {

        map[
          String(profile.id)
        ] = profile;

      }
    );


    feed.innerHTML =
      posts
        .map(
          post =>
            renderPost(
              post,
              map[
                String(
                  post.user_id
                )
              ]
            )
        )
        .join("");


  }catch(error){

    console.error(
      "FEED ERROR:",
      error
    );


    feed.innerHTML =
      `<div class="error-box">
        Activity load nahi ho saki.
        <br><br>
        ${escapeHtml(
          error?.message ||
          String(error)
        )}
      </div>`;

  }

}


/* =====================================================
   RENDER POST
===================================================== */

function renderPost(
  post,
  profile
){

  let username =
    profile?.username ||
    profile?.name ||
    "";


  /*
    Current user fallback
  */

  if(
    !username &&
    currentUser &&
    String(post.user_id) ===
    String(currentUser.id)
  ){

    username =
      currentUser
        ?.user_metadata
        ?.username ||
      currentUser
        ?.email
        ?.split("@")[0] ||
      "Alone";

  }


  if(!username){

    username =
      "User";

  }


  const avatar =
    profile?.avatar_url ||
    defaultAvatar();


  const own =
    currentUser &&
    String(post.user_id) ===
    String(currentUser.id);


  const image =
    post.image_url
      ? `

        <div class="activity-image">

          <img
            src="${safeUrl(
              post.image_url
            )}"
            alt="Mehfil image">

        </div>

      `
      : "";


  return `

    <article class="activity">

      <div class="activity-head">

        <img
          class="avatar"
          src="${safeUrl(avatar)}"
          onerror="
            this.src='${defaultAvatar()}'
          ">


        <div class="activity-user">

          <div class="activity-username">
            ${escapeHtml(username)}
          </div>

          <div class="activity-time">
            ${formatDate(
              post.created_at
            )}
          </div>

        </div>

      </div>


      ${
        post.content
        ?
        `
          <div class="activity-message">
            ${escapeHtml(
              post.content
            )}
          </div>
        `
        :
        ""
      }


      ${image}


      <div class="activity-actions">

        <button
          onclick="startReply(
            '${escapeJs(username)}'
          )">
          Reply
        </button>


        ${
          own
          ?
          `
            <button
              class="delete"
              onclick="deletePost(
                ${Number(post.id)},
                ${post.image_url
                  ? `'${escapeJs(
                      post.image_url
                    )}'`
                  : "null"}
              )">
              🗑️ Delete
            </button>
          `
          :
          ""
        }

      </div>

    </article>

  `;

}

/* =====================================================
   PUBLISH ACTIVITY
===================================================== */

async function publishActivity(){

  if(!currentMehfil){
    return;
  }


  const input =
    document.getElementById(
      "messageInput"
    );


  let content =
    input.value.trim();


  if(
    !content &&
    !selectedImageFile
  ){

    showNotice(
      "Message ya image add karein."
    );

    return;
  }


  try{

    /*
      Reply ko normal activity ke
      top feed mein publish karna hai.
    */

    if(
      replyToUser &&
      content
    ){

      content =
        "@" +
        replyToUser +
        " " +
        content;

    }


    let imageUrl = "";


    if(selectedImageFile){

      const extension =
        (
          selectedImageFile.name
            .split(".")
            .pop() ||
          "jpg"
        )
        .toLowerCase();


      const path =
        currentUser.id +
        "/" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .slice(2) +
        "." +
        extension;


      const upload =
        await supabaseClient
          .storage
          .from("mehfil-images")
          .upload(
            path,
            selectedImageFile,
            {
              cacheControl:"3600",
              upsert:false
            }
          );


      if(upload.error){
        throw upload.error;
      }


      const publicUrl =
        supabaseClient
          .storage
          .from("mehfil-images")
          .getPublicUrl(
            path
          );


      imageUrl =
        publicUrl
          ?.data
          ?.publicUrl ||
        "";

    }


    const {
      error
    } =
      await supabaseClient
        .from("mehfil_posts")
        .insert({

          mehfil_id:
            currentMehfil.id,

          user_id:
            currentUser.id,

          content:
            content ||
            "",

          image_url:
            imageUrl ||
            null

        });


    if(error){
      throw error;
    }


    input.value = "";

    selectedImageFile =
      null;

    document.getElementById(
      "mehfilImage"
    ).value = "";


    document.getElementById(
      "imagePreview"
    ).style.display =
      "none";


    document.getElementById(
      "previewImage"
    ).src = "";


    replyToUser =
      null;


    document.getElementById(
      "replyTarget"
    ).textContent = "";


    document.getElementById(
      "replyTarget"
    ).classList.remove(
      "show"
    );


    await loadFeed();


  }catch(error){

    console.error(
      "PUBLISH ERROR:",
      error
    );


    showNotice(
      "Publish nahi hua: " +
      error.message
    );

  }

}


/* =====================================================
   IMAGE PREVIEW
===================================================== */

function previewMehfilImage(){

  const input =
    document.getElementById(
      "mehfilImage"
    );


  const file =
    input.files?.[0];


  if(!file){
    return;
  }


  if(
    !file.type.startsWith(
      "image/"
    )
  ){

    showNotice(
      "Sirf image upload karein."
    );

    input.value = "";

    return;
  }


  if(
    file.size >
    8 * 1024 * 1024
  ){

    showNotice(
      "Image 8MB se chhoti honi chahiye."
    );

    input.value = "";

    return;
  }


  selectedImageFile =
    file;


  const reader =
    new FileReader();


  reader.onload =
    event => {

      document.getElementById(
        "previewImage"
      ).src =
        event.target.result;


      document.getElementById(
        "imagePreview"
      ).style.display =
        "block";

    };


  reader.readAsDataURL(
    file
  );

}

/* =====================================================
   DELETE POST
===================================================== */

async function deletePost(
  postId,
  imageUrl
){

  if(
    !confirm(
      "Ye activity delete karni hai?"
    )
  ){

    return;

  }


  try{

    const {
      error
    } =
      await supabaseClient
        .from("mehfil_posts")
        .delete()
        .eq(
          "id",
          postId
        )
        .eq(
          "user_id",
          currentUser.id
        );


    if(error){
      throw error;
    }


    /*
      Image delete optional.
    */

    if(imageUrl){

      const marker =
        "/storage/v1/object/public/mehfil-images/";


      const index =
        String(imageUrl)
          .indexOf(marker);


      if(index !== -1){

        const path =
          decodeURIComponent(
            String(imageUrl)
              .slice(
                index +
                marker.length
              )
          );


        await supabaseClient
          .storage
          .from("mehfil-images")
          .remove([
            path
          ]);

      }

    }


    await loadFeed();


  }catch(error){

    console.error(
      "DELETE ERROR:",
      error
    );


    showNotice(
      "Delete nahi hua: " +
      error.message
    );

  }

}

      data,
      error

      await supabaseClient
        .from("profiles")

          "username",

/* =====================================================
   PRIVACY
===================================================== */

function getPrivacyText(
  privacy
){

  if(
    privacy ===
    "private"
  ){

    return "🔒 Private";

  }


  if(
    privacy ===
    "invite"
  ){

    return "📩 Invite Only";

  }


  return "🌐 Public";

}


/* =====================================================
   DATE
===================================================== */

function formatDate(
  value
){

  if(!value){
    return "";
  }


  const date =
    new Date(value);


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "";

  }


  const now =
    new Date();


  const seconds =
    Math.floor(
      (
        now.getTime() -
        date.getTime()
      ) /
      1000
    );


  if(seconds < 60){

    return "Just now";

  }


  const minutes =
    Math.floor(
      seconds / 60
    );


  if(minutes < 60){

    return (
      minutes +
      " min ago"
    );

  }


  const hours =
    Math.floor(
      minutes / 60
    );


  if(hours < 24){

    return (
      hours +
      " hr ago"
    );

  }


  const days =
    Math.floor(
      hours / 24
    );


  if(days < 7){

    return (
      days +
      " day ago"
    );

  }


  return date.toLocaleString(
    undefined,
    {
      day:"numeric",
      month:"short",
      hour:"numeric",
      minute:"2-digit"
    }
  );

}

  );

/* =====================================================
   SAFE URL
===================================================== */

function safeUrl(
  value
){

  const url =
    String(
      value || ""
    );


  if(
    url.startsWith(
      "https://"
    ) ||
    url.startsWith(
      "http://"
    ) ||
    url.startsWith(
      "data:image/"
    )
  ){

    return url
      .replace(
        /"/g,
        "&quot;"
      );

  }


  return defaultAvatar();

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   ESCAPE JS
===================================================== */

function escapeJs(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  )
  .replace(
    /\r/g,
    "\\r"
  )
  .replace(
    /\n/g,
    "\\n"
  );

}


/* =====================================================
   NOTICE
===================================================== */

function showNotice(
  message
){

  const notice =
    document.getElementById(
      "notice"
    );


  notice.textContent =
    message;


  notice.classList.add(
    "show"
  );


  clearTimeout(
    noticeTimer
  );


  noticeTimer =
    setTimeout(
      () => {

        notice.classList.remove(
          "show"
        );

      },
      3000
    );

}
