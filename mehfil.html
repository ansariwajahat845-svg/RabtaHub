<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mehfil - RabtaHub</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f3fb;
  color:#222;
  padding-bottom:78px
}

button,input,textarea,select{font-family:inherit}
button{cursor:pointer}

.header{
  position:sticky;
  top:0;
  z-index:50;
  color:#fff;
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  box-shadow:0 3px 14px rgba(76,45,130,.22)
}

.header-row{
  width:100%;
  max-width:680px;
  margin:auto;
  min-height:62px;
  padding:9px 12px;
  display:flex;
  align-items:center;
  gap:9px
}

.header-btn{
  width:40px;
  height:40px;
  border:0;
  border-radius:12px;
  background:rgba(255,255,255,.15);
  color:#fff;
  font-size:19px;
  display:flex;
  align-items:center;
  justify-content:center
}

.header-info{
  flex:1;
  min-width:0
}

.header-title{
  font-size:17px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.header-sub{
  margin-top:2px;
  font-size:11px;
  opacity:.85
}

.container{
  width:100%;
  max-width:680px;
  margin:auto;
  padding:10px
}

.card,
.composer-card,
.activity,
.members-screen-card{
  background:#fff;
  border-radius:16px;
  padding:14px;
  margin-bottom:10px;
  box-shadow:0 3px 12px rgba(55,35,100,.06)
}

.notice{
  display:none;
  background:#fff;
  color:#333;
  padding:11px 13px;
  border-radius:12px;
  margin-bottom:10px;
  text-align:center;
  font-size:13px;
  box-shadow:0 3px 12px rgba(0,0,0,.07)
}

.notice.show{display:block}

.section-title{
  font-size:16px;
  font-weight:800;
  margin-bottom:11px
}

input,textarea,select{
  width:100%;
  border:1px solid #ddd;
  border-radius:11px;
  padding:12px;
  margin-bottom:10px;
  background:#fff;
  outline:none;
  font-size:14px
}

textarea{
  min-height:80px;
  resize:vertical
}

input:focus,
textarea:focus,
select:focus{
  border-color:#6c5ce7;
  box-shadow:0 0 0 3px rgba(108,92,231,.08)
}

.primary-btn{
  width:100%;
  border:0;
  border-radius:11px;
  padding:12px;
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  color:#fff;
  font-weight:800;
  font-size:14px
}

.secondary-btn{
  border:0;
  border-radius:9px;
  padding:8px 11px;
  background:#f0eef8;
  color:#555;
  font-weight:700
}

.create-intro{
  background:linear-gradient(135deg,#f0edff,#fff);
  border:1px solid #e6e0ff;
  border-radius:14px;
  padding:13px;
  margin-bottom:12px
}

.create-intro-title{
  font-weight:800;
  color:#5d4bd8
}

.create-intro-text{
  color:#777;
  font-size:12px;
  margin-top:4px;
  line-height:1.4
}

.category-preview{
  display:flex;
  align-items:center;
  gap:9px;
  background:#faf9ff;
  border:1px solid #ebe7ff;
  border-radius:11px;
  padding:9px 10px;
  margin-bottom:10px
}

.category-preview-icon{font-size:25px}

.category-preview-info{
  min-width:0
}

.category-preview-name{
  font-size:13px;
  font-weight:800
}

.category-preview-topic{
  color:#888;
  font-size:11px;
  margin-top:2px
}

.mehfil-list{
  display:flex;
  flex-direction:column;
  gap:9px
}

.mehfil-item{
  background:#fff;
  border-radius:15px;
  padding:14px;
  box-shadow:0 3px 12px rgba(55,35,100,.06);
  cursor:pointer
}

.mehfil-top{
  display:flex;
  align-items:flex-start;
  gap:11px
}

.mehfil-icon{
  width:47px;
  height:47px;
  flex-shrink:0;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f0edff;
  font-size:25px
}

.mehfil-info{
  flex:1;
  min-width:0
}

.mehfil-name{
  font-size:16px;
  font-weight:800;
  word-break:break-word
}

.mehfil-topic{
  margin-top:4px;
  color:#6c5ce7;
  font-size:12px;
  font-weight:700
}

.mehfil-description{
  margin-top:7px;
  color:#777;
  font-size:13px;
  line-height:1.4
}

.mehfil-bottom{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:6px;
  margin-top:10px
}

.mini-badge{
  background:#f4f2fb;
  color:#666;
  padding:5px 8px;
  border-radius:8px;
  font-size:11px;
  font-weight:700
}

.mehfil-hero{
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  color:#fff;
  border-radius:18px;
  padding:18px 15px;
  margin-bottom:10px;
  box-shadow:0 8px 25px rgba(108,92,231,.22)
}

.hero-row{
  display:flex;
  align-items:center;
  gap:12px
}

.hero-icon{
  width:55px;
  height:55px;
  flex-shrink:0;
  border-radius:17px;
  background:rgba(255,255,255,.17);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:29px
}

.hero-info{
  flex:1;
  min-width:0
}

.hero-name{
  font-size:20px;
  font-weight:900;
  word-break:break-word
}

.hero-topic{
  margin-top:4px;
  font-size:12px;
  opacity:.9
}

.hero-stats{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:13px
}

.hero-stat{
  background:rgba(255,255,255,.14);
  padding:6px 9px;
  border-radius:9px;
  font-size:11px;
  font-weight:700
}

.hero-description{
  margin-top:11px;
  font-size:12px;
  line-height:1.45;
  opacity:.92
}

.detail-actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-bottom:10px
}

.detail-actions button{
  border:0;
  border-radius:10px;
  padding:9px 11px;
  background:#fff;
  color:#555;
  font-size:12px;
  font-weight:800;
  box-shadow:0 2px 8px rgba(0,0,0,.06)
}

.detail-actions .leave{
  background:#fff0f0;
  color:#c0392b
}

.composer-row{
  display:flex;
  align-items:flex-end;
  gap:7px
}

.composer-text{
  flex:1;
  margin:0;
  min-height:46px;
  max-height:130px;
  resize:none;
  border-radius:13px
}

.send-btn{
  width:45px;
  height:45px;
  flex-shrink:0;
  border:0;
  border-radius:13px;
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  color:#fff;
  font-size:18px
}

.composer-tools{
  display:flex;
  gap:7px;
  margin-top:8px
}

.photo-label{
  display:inline-flex;
  align-items:center;
  gap:5px;
  background:#f0edff;
  color:#5c4bd5;
  padding:8px 10px;
  border-radius:9px;
  font-size:12px;
  font-weight:800;
  cursor:pointer
}

.photo-input{display:none}

.image-preview{
  display:none;
  position:relative;
  margin:9px 0
}

.image-preview img{
  width:100%;
  max-height:300px;
  object-fit:cover;
  border-radius:12px
}

.remove-photo{
  position:absolute;
  top:8px;
  right:8px;
  width:31px;
  height:31px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.7);
  color:#fff;
  font-size:18px
}

.feed-label{
  display:flex;
  align-items:center;
  gap:7px;
  margin:13px 2px 8px;
  font-size:14px;
  font-weight:900;
  color:#444
}

.feed-label span{color:#6c5ce7}

.activity{
  padding:13px
}

.activity-head{
  display:flex;
  align-items:center;
  gap:9px
}

.avatar{
  width:42px;
  height:42px;
  flex-shrink:0;
  border-radius:50%;
  object-fit:cover;
  background:#eee
}

.activity-user{
  flex:1;
  min-width:0
}

.activity-username{
  font-size:14px;
  font-weight:900;
  word-break:break-word
}

.activity-time{
  display:block;
  margin-top:3px;
  color:#999;
  font-size:11px
}

.activity-message{
  margin:11px 0 9px 51px;
  font-size:14px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word
}

.activity-image{
  margin:8px 0 10px 51px
}

.activity-image img{
  width:100%;
  max-height:390px;
  object-fit:cover;
  border-radius:13px
}

.activity-actions{
  margin-left:51px;
  display:flex;
  gap:7px;
  flex-wrap:wrap
}

.activity-actions button{
  border:0;
  border-radius:9px;
  padding:7px 10px;
  background:#f3f2f7;
  color:#555;
  font-size:12px;
  font-weight:800
}

.activity-actions .reply-btn{
  color:#5b4bd6;
  background:#f0edff
}

.activity-actions .delete{
  color:#c0392b;
  background:#fff0f0
}

.reply-box{
  margin:9px 0 0 51px;
  padding:9px;
  background:#faf9ff;
  border-radius:10px;
  border:1px solid #eee
}

.reply-item{
  padding:8px 0;
  border-bottom:1px solid #eee;
  font-size:12px
}

.reply-item:last-child{border-bottom:0}

.reply-user{
  font-weight:800;
  color:#6c5ce7
}

.reply-text{
  margin-top:3px;
  color:#555;
  white-space:pre-wrap;
  word-break:break-word
}

.members-page,
.settings-page{
  display:none
}

.members-screen-card{
  overflow:hidden;
  padding:0
}

.members-screen-head{
  padding:18px 15px;
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  color:#fff
}

.members-screen-title{
  font-size:20px;
  font-weight:900
}

.members-screen-sub{
  margin-top:5px;
  font-size:12px;
  opacity:.9
}

.members-count{
  padding:12px 15px;
  background:#faf9ff;
  border-bottom:1px solid #eee;
  color:#6c5ce7;
  font-size:13px;
  font-weight:800
}

.members-list{
  padding:5px 14px
}

.member-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #eee
}

.member-row:last-child{
  border-bottom:0
}

.member-info{
  flex:1;
  min-width:0
}

.member-name{
  font-size:14px;
  font-weight:800;
  word-break:break-word
}

.member-username{
  color:#888;
  font-size:11px;
  margin-top:3px
}

.member-role{
  display:inline-block;
  color:#6c5ce7;
  background:#f0edff;
  padding:4px 7px;
  border-radius:7px;
  font-size:10px;
  margin-top:5px;
  font-weight:800
}

.members-back{
  width:100%;
  margin-top:10px;
  border:0;
  border-radius:12px;
  padding:12px;
  background:#fff;
  color:#6c5ce7;
  font-weight:800;
  box-shadow:0 3px 12px rgba(55,35,100,.06)
}

.settings-option{
  width:100%;
  border:0;
  border-bottom:1px solid #eee;
  background:#fff;
