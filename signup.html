```html
<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RabtaHub - Sign Up</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      font-family:Arial,sans-serif;
      background:linear-gradient(135deg,#6c5ce7,#8e44ad);
    }

    .signup-box{
      width:100%;
      max-width:420px;
      background:#fff;
      padding:30px 22px;
      border-radius:20px;
      box-shadow:0 15px 40px rgba(0,0,0,.18);
    }

    .logo{
      text-align:center;
      font-size:32px;
      font-weight:800;
      color:#6c5ce7;
      margin-bottom:5px;
    }

    .tagline{
      text-align:center;
      color:#777;
      margin-bottom:25px;
      font-size:14px;
    }

    h2{
      text-align:center;
      margin:0 0 22px;
      color:#222;
    }

    input{
      width:100%;
      padding:14px;
      margin-bottom:14px;
      border:1px solid #ddd;
      border-radius:12px;
      font-size:15px;
      outline:none;
    }

    input:focus{
      border-color:#6c5ce7;
    }

    .hint{
      margin-top:-8px;
      margin-bottom:14px;
      font-size:12px;
      color:#888;
      line-height:1.4;
    }

    button{
      width:100%;
      border:0;
      padding:14px;
      border-radius:12px;
      background:#6c5ce7;
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    button:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    #message{
      text-align:center;
      margin-top:15px;
      font-size:14px;
      min-height:20px;
      line-height:1.5;
    }

    .login-link{
      text-align:center;
      margin-top:20px;
      color:#666;
      font-size:14px;
    }

    .login-link a{
      color:#6c5ce7;
      font-weight:bold;
      text-decoration:none;
    }

  </style>

</head>

<body>

  <div class="signup-box">

    <div class="logo">
      RabtaHub
    </div>

    <div class="tagline">
      Connect. Share. Belong.
    </div>

    <h2>
      Create Account
    </h2>


    <form id="signupForm">

      <!-- NAME -->

      <input
        type="text"
        id="name"
        placeholder="Full Name"
        maxlength="50"
        autocomplete="name"
        required
      >


      <!-- USERNAME -->

      <input
        type="text"
        id="username"
        placeholder="Username"
        maxlength="20"
        autocomplete="username"
        required
      >

      <div class="hint">
        Username 4–20 characters ka ho.
        Sirf letters, numbers aur _ allowed hain.
      </div>


      <!-- PASSWORD -->

      <input
        type="password"
        id="password"
        placeholder="Password"
        minlength="6"
        maxlength="72"
        autocomplete="new-password"
        required
      >


      <!-- CONFIRM PASSWORD -->

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm Password"
        minlength="6"
        maxlength="72"
        autocomplete="new-password"
        required
      >


      <button
        type="submit"
        id="signupBtn">
        Create Account
      </button>

    </form>


    <div id="message"></div>


    <div class="login-link">

      Already have an account?

      <a href="login.html">
        Login
      </a>

    </div>

  </div>


<script>

/* ========================================
   SUPABASE
======================================== */

const SUPABASE_URL =
  "https://jhcpqjmxiovvqbghpxbf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ========================================
   SIGNUP FORM
======================================== */

document
  .getElementById("signupForm")
  .addEventListener(
    "submit",
    async function(e){

      e.preventDefault();


      const name =
        document
          .getElementById("name")
          .value
          .trim();


      let username =
        document
          .getElementById("username")
          .value
          .trim()
          .toLowerCase();


      const password =
        document
          .getElementById("password")
          .value;


      const confirmPassword =
        document
          .getElementById("confirmPassword")
          .value;


      const button =
        document.getElementById(
          "signupBtn"
        );


      const message =
        document.getElementById(
          "message"
        );


      /* ========================================
         RESET MESSAGE
      ======================================== */

      message.textContent = "";

      message.style.color =
        "#666";


      /* ========================================
         NAME VALIDATION
      ======================================== */

      if(!name){

        message.style.color =
          "#d63031";

        message.textContent =
          "Name enter karein.";

        return;

      }


      if(name.length < 2){

        message.style.color =
          "#d63031";

        message.textContent =
          "Name kam az kam 2 characters ka hona chahiye.";

        return;

      }


      /* ========================================
         USERNAME VALIDATION
      ======================================== */

      if(
        username.length < 4 ||
        username.length > 20
      ){

        message.style.color =
          "#d63031";

        message.textContent =
          "Username 4 se 20 characters ka hona chahiye.";

        return;

      }


      const usernamePattern =
        /^[a-z0-9_]+$/;


      if(
        !usernamePattern.test(username)
      ){

        message.style.color =
          "#d63031";

        message.textContent =
          "Username mein sirf letters, numbers aur _ use karein.";

        return;

      }


      /* ========================================
         PASSWORD VALIDATION
      ======================================== */

      if(password.length < 6){

        message.style.color =
          "#d63031";

        message.textContent =
          "Password kam az kam 6 characters ka hona chahiye.";

        return;

      }


      /* ========================================
         CONFIRM PASSWORD
      ======================================== */

      if(
        password !== confirmPassword
      ){

        message.style.color =
          "#d63031";

        message.textContent =
          "Passwords match nahi kar rahe.";

        return;

      }


      button.disabled = true;

      button.textContent =
        "Checking...";


      try{


        /* ========================================
           CHECK USERNAME
        ======================================== */

        const {
          data: existingProfile,
          error: usernameError
        } =
          await supabaseClient
            .from("profiles")
            .select("id")
            .eq(
              "username",
              username
            )
            .maybeSingle();


        if(usernameError){

          throw new Error(
            "Username check failed: " +
            usernameError.message
          );

        }


        if(existingProfile){

          message.style.color =
            "#d63031";

          message.textContent =
            "Ye username already taken hai.";

          return;

        }


        /* ========================================
           CREATE HIDDEN SYSTEM EMAIL
           
           User ko email nahi dikhayi jayegi.
        ======================================== */

        const systemEmail =
          username +
          "@rbtahub.local";


        button.textContent =
          "Creating account...";


        /* ========================================
           CREATE SUPABASE ACCOUNT
        ======================================== */

        const {
          data,
          error
        } =
          await supabaseClient.auth.signUp({

            email:
              systemEmail,

            password:
              password,

            options: {

              data: {

                name:
                  name,

                username:
                  username

              }

            }

          });


        if(error){

          throw error;

        }


        if(!data.user){

          throw new Error(
            "Account create nahi ho saka."
          );

        }


        /* ========================================
           SUCCESS
        ======================================== */

        message.style.color =
          "#00a86b";

        message.textContent =
          "Account successfully created! Login page open ho rahi hai...";


        document
          .getElementById("signupForm")
          .reset();


        setTimeout(
          function(){

            window.location.href =
              "login.html";

          },
          1500
        );


      }catch(error){

        console.error(
          "SIGNUP ERROR:",
          error
        );


        message.style.color =
          "#d63031";


        let errorMessage =
          error?.message ||
          "Signup failed.";


        /* ========================================
           FRIENDLY ERRORS
        ======================================== */

        if(
          errorMessage
            .toLowerCase()
            .includes("already registered")
        ){

          errorMessage =
            "Ye username already registered hai.";

        }


        if(
          errorMessage
            .toLowerCase()
            .includes("password")
        ){

          errorMessage =
            "Password requirements puri nahi hain.";

        }


        message.textContent =
          errorMessage;


      }finally{

        button.disabled =
          false;

        button.textContent =
          "Create Account";

      }

    }
  );

</script>

</body>
</html>
