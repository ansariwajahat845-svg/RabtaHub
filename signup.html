<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RabtaHub - Sign Up</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      font-family:Arial,sans-serif;
      background:linear-gradient(135deg,#6c5ce7,#8e44ad);
    }

    .signup-box{
      width:100%;
      max-width:420px;
      background:#fff;
      padding:30px 22px;
      border-radius:20px;
      box-shadow:0 15px 40px rgba(0,0,0,.18);
    }

    .logo{
      text-align:center;
      font-size:32px;
      font-weight:800;
      color:#6c5ce7;
      margin-bottom:5px;
    }

    .tagline{
      text-align:center;
      color:#777;
      margin-bottom:25px;
      font-size:14px;
    }

    h2{
      text-align:center;
      margin:0 0 22px;
      color:#222;
    }

    input{
      width:100%;
      padding:14px;
      margin-bottom:14px;
      border:1px solid #ddd;
      border-radius:12px;
      font-size:15px;
      outline:none;
    }

    input:focus{
      border-color:#6c5ce7;
    }

    button{
      width:100%;
      border:0;
      padding:14px;
      border-radius:12px;
      background:#6c5ce7;
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    button:disabled{
      opacity:.6;
    }

    #message{
      text-align:center;
      margin-top:15px;
      font-size:14px;
      min-height:20px;
    }

    .login-link{
      text-align:center;
      margin-top:20px;
      color:#666;
      font-size:14px;
    }

    .login-link a{
      color:#6c5ce7;
      font-weight:bold;
      text-decoration:none;
    }
  </style>
</head>

<body>

  <div class="signup-box">

    <div class="logo">RabtaHub</div>

    <div class="tagline">
      Connect. Share. Belong.
    </div>

    <h2>Create Account</h2>

    <form id="signupForm">

      <input
        type="text"
        id="name"
        placeholder="Full Name"
        required
      >

      <input
        type="text"
        id="username"
        placeholder="Username"
        required
      >

      <input
        type="email"
        id="email"
        placeholder="Email"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        minlength="6"
        required
      >

      <button
        type="submit"
        id="signupBtn">
        Create Account
      </button>

    </form>

    <div id="message"></div>

    <div class="login-link">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

  </div>

<script>

const SUPABASE_URL =
  "https://jhcpqjmxiovvqbghpxbf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


document
  .getElementById("signupForm")
  .addEventListener("submit", async function(e){

    e.preventDefault();

    const name =
      document.getElementById("name").value.trim();

    const username =
      document.getElementById("username").value.trim();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const button =
      document.getElementById("signupBtn");

    const message =
      document.getElementById("message");

    button.disabled = true;
    button.textContent = "Creating account...";

    message.textContent = "";
    message.style.color = "#666";


    try{

      const { data, error } =
        await supabaseClient.auth.signUp({

          email: email,
          password: password,

          options: {
            data: {
              name: name,
              username: username
            }
          }

        });


      if(error){
        throw error;
      }


      if(!data.user){
        throw new Error(
          "Account create nahi ho saka."
        );
      }


      const { error: profileError } =
        await supabaseClient
          .from("profiles")
          .insert({

            id: data.user.id,
            username: username,
            name: name

          });


      if(profileError){

        console.error(
          "PROFILE ERROR:",
          profileError
        );

        message.style.color = "#d63031";

        message.textContent =
          "Account bana hai, lekin profile save nahi hui: " +
          profileError.message;

        return;
      }


      message.style.color = "#00a86b";

      message.textContent =
        "Account successfully created!";


      document
        .getElementById("signupForm")
        .reset();


      setTimeout(function(){

        window.location.href =
          "login.html";

      }, 1500);


    }catch(error){

      console.error(
        "SIGNUP ERROR:",
        error
      );

      message.style.color = "#d63031";

      message.textContent =
        error.message ||
        "Signup failed.";

    }finally{

      button.disabled = false;
      button.textContent = "Create Account";

    }

  });

</script>

</body>
</html>
