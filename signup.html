<html lang="en">
<head>

  <meta charset="UTF-8">

  <title>RabtaHub - Sign Up</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      font-family:Arial,sans-serif;
      background:linear-gradient(135deg,#6c5ce7,#8e44ad);
    }

    .signup-box{
      width:100%;
      max-width:420px;
      background:#fff;
      padding:30px 22px;
      border-radius:20px;
      box-shadow:0 15px 40px rgba(0,0,0,.18);
    }

    .logo{
      text-align:center;
      font-size:32px;
      font-weight:800;
      color:#6c5ce7;
      margin-bottom:5px;
    }

    .tagline{
      text-align:center;
      color:#777;
      margin-bottom:25px;
      font-size:14px;
    }

    h2{
      text-align:center;
      margin:0 0 22px;
      color:#222;
    }

    input{
      width:100%;
      padding:14px;
      margin-bottom:14px;
      border:1px solid #ddd;
      border-radius:12px;
      font-size:15px;
      outline:none;
    }

    input:focus{
      border-color:#6c5ce7;
    }

    .hint{
      margin-top:-8px;
      margin-bottom:14px;
      font-size:12px;
      color:#888;
      line-height:1.4;
    }

    /* =========================
       PASSWORD WRAP
    ========================= */

    .password-wrap{
      position:relative;
      width:100%;
    }

    .password-wrap input{
      padding-right:52px;
    }

    .show-password{
      position:absolute;
      right:5px;
      top:0;
      width:45px;
      height:45px;
      padding:0;
      margin:0;
      border:0;
      background:transparent;
      color:#666;
      font-size:19px;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
    }

    .show-password:hover{
      background:transparent;
    }

    button{
      width:100%;
      border:0;
      padding:14px;
      border-radius:12px;
      background:#6c5ce7;
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    button:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    #message{
      text-align:center;
      margin-top:15px;
      font-size:14px;
      min-height:20px;
      line-height:1.5;
    }

    .login-link{
      text-align:center;
      margin-top:20px;
      color:#666;
      font-size:14px;
    }

    .login-link a{
      color:#6c5ce7;
      font-weight:bold;
      text-decoration:none;
    }

  </style>

</head>

<body>

  <div class="signup-box">

    <div class="logo">
      RabtaHub
    </div>

    <div class="tagline">
      Connect. Share. Belong.
    </div>

    <h2>
      Create Account
    </h2>


    <form id="signupForm">


      <!-- NAME -->

      <input
        type="text"
        id="name"
        placeholder="Full Name"
        maxlength="50"
        autocomplete="name"
        required
      >


      <!-- USERNAME -->

      <input
        type="text"
        id="username"
        placeholder="Username"
        maxlength="20"
        autocomplete="username"
        required
      >

      <div class="hint">
        Username 4–20 characters ka ho.
        Sirf letters, numbers aur _ allowed hain.
      </div>


      <!-- PASSWORD -->

      <div class="password-wrap">

        <input
          type="password"
          id="password"
          placeholder="Password"
          minlength="6"
          maxlength="72"
          autocomplete="new-password"
          required
        >

        <button
          type="button"
          class="show-password"
          onclick="togglePassword(
            'password',
            'passwordIcon'
          )">

          <span id="passwordIcon">
            👁️
          </span>

        </button>

      </div>


      <!-- CONFIRM PASSWORD -->

      <div class="password-wrap">

        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm Password"
          minlength="6"
          maxlength="72"
          autocomplete="new-password"
          required
        >

        <button
          type="button"
          class="show-password"
          onclick="togglePassword(
            'confirmPassword',
            'confirmPasswordIcon'
          )">

          <span id="confirmPasswordIcon">
            👁️
          </span>

        </button>

      </div>


      <!-- CREATE ACCOUNT -->

      <button
        type="submit"
        id="signupBtn">

        Create Account

      </button>

    </form>


    <div id="message"></div>


    <div class="login-link">

      Already have an account?

      <a href="login.html">
        Login
      </a>

    </div>

  </div>

function togglePassword(
  inputId,
  iconId
){

  const input =
    document.getElementById(inputId);

  const icon =
    document.getElementById(iconId);


  if(
    input.type === "password"
  ){

    input.type = "text";

    icon.textContent =
      "🙈";

  }else{

    input.type = "password";

    icon.textContent =
      "👁️";

  }

}
