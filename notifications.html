<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Notifications - ChatZone 💬</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6fb;

  padding-bottom:75px;

.header{

.header-row{

.back-btn{
  border:0;

  border-radius:10px;

.container{

.notification.unread{

<body>

<header class="header">

  <div class="header-row">

    <button

<main class="container">

    class="notice">
  </div>

    class="loading">

  </div>

    <span class="nav-icon">💬</span>
    Private
  </button>

    <span class="nav-icon">👤</span>
    Profile
  </button>

  <button class="nav-btn active" onclick="goNotifications()">
    <span class="nav-icon">🔔</span>
    Notifications
  </button>

  <button class="nav-btn" onclick="goMehfil()">
    <span class="nav-icon">🏠</span>
    Mehfil
  </button>

  <button class="nav-btn" onclick="goMore()">
    <span class="nav-icon">☰</span>
    More
  </button>

</nav>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://szmauhxiyjffjhrcruee.supabase.co";

const SUPABASE_KEY =
"sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:false
    }
  }
);

let currentUser = null;


/* =====================================================
   INIT
===================================================== */

async function init(){

  const {
    data,
    error
  } =
  await supabaseClient.auth.getSession();

  if(
    error ||
    !data ||
    !data.session
  ){

    window.location.href =
      "login.html";

    return;
  }

  currentUser =
    data.session.user;

  await loadNotifications();
}


/* =====================================================
   LOAD NOTIFICATIONS
===================================================== */

async function loadNotifications(){

  const list =
    document.getElementById(
      "notificationsList"
    );

  list.innerHTML = `
    <div class="loading">
      Loading notifications...
    </div>
  `;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("notifications")
    .select("*")
    .eq(
      "user_id",
      currentUser.id
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    console.error(error);

    list.innerHTML = `
      <div class="empty">

        🔔 Notifications load nahi ho sakin.

        <br><br>

        ${escapeHtml(error.message)}

      </div>
    `;

    return;
  }


  if(
    !data ||
    data.length === 0
  ){

    list.innerHTML = `
      <div class="empty">
        🔔 Abhi koi notification nahi hai.
      </div>
    `;

    return;
  }


  const senderIds =
    [
      ...new Set(
        data
          .map(n => n.sender_id)
          .filter(Boolean)
      )
    ];


  let profiles = [];


  if(senderIds.length){

    const result =
      await supabaseClient
        .from("profiles")
        .select(
          "id,username,name,avatar_url"
        )
        .in(
          "id",
          senderIds
        );

    if(!result.error){

      profiles =
        result.data || [];

    }
  }


  const profileMap = {};

  profiles.forEach(
    profile => {

      profileMap[
        profile.id
      ] = profile;

    }
  );


  list.innerHTML =
    data.map(
      notification => {

        return renderNotification(
          notification,
          profileMap[
            notification.sender_id
          ]
        );

      }
    ).join("");


  /* MARK READ */

  const unreadIds =
    data
      .filter(
        n => !n.is_read
      )
      .map(
        n => n.id
      );


  if(unreadIds.length){

    await supabaseClient
      .from("notifications")
      .update({
        is_read:true
      })
      .in(
        "id",
        unreadIds
      )
      .eq(
        "user_id",
        currentUser.id
      );

  }
}


/* =====================================================
   RENDER NOTIFICATION
===================================================== */

function renderNotification(
  notification,
  profile
){

  const avatar =
    profile?.avatar_url ||
    getDefaultAvatar();


  const username =
    profile?.username ||
    profile?.name ||
    "User";


  let message =
    notification.message ||
    "Aap ke liye ek notification hai.";


  let extra = "";


  /* ================================================
     PRIVATE REQUEST
  ================================================ */

  if(
    notification.type ===
    "private_request"
  ){

    message =
      notification.message ||
      `@${username} ne aapko private chat request bheji hai.`;


    extra = `

      <div class="action-box">

        <div class="action-title">
          📩 Private Chat Request
        </div>

        <div class="action-buttons">

          <button
            class="accept-btn"
            data-action="accept-private"
            data-notification-id="${escapeAttr(notification.id)}"
            data-sender-id="${escapeAttr(notification.sender_id || "")}">

            ✅ Accept

          </button>

          <button
            class="decline-btn"
            data-action="decline-private"
            data-notification-id="${escapeAttr(notification.id)}"
            data-sender-id="${escapeAttr(notification.sender_id || "")}">

            ❌ Decline

          </button>

        </div>

      </div>
    `;

  }


  /* ================================================
     PRIVATE MESSAGE
  ================================================ */

  else if(
    notification.type ===
    "private_message"
  ){

    message =
      notification.message ||
      `💬 @${username} ne aapko private message bheja hai.`;


    extra = `

      <div class="action-box">

        <button
          class="open-btn"
          data-action="open-private"
          data-sender-id="${escapeAttr(notification.sender_id || "")}">

          💬 Open Private Chat

        </button>

      </div>
    `;

  }


  /* ================================================
     MEHFIL INVITE
  ================================================ */

  else if(
    notification.type ===
    "mehfil_invite"
  ){

    message =
      notification.message ||
      `🏠 @${username} ne aapko Mehfil mein invite kiya hai.`;


    extra = `

      <div class="action-box">

        <div class="action-title">
          🏠 Mehfil Invitation
        </div>

        <div class="action-buttons">

          <button
            class="accept-btn"
            data-action="accept-mehfil"
            data-notification-id="${escapeAttr(notification.id)}"
            data-mehfil-id="${escapeAttr(notification.mehfil_id || "")}">

            ✅ Accept

          </button>

          <button
            class="decline-btn"
            data-action="decline-mehfil"
            data-notification-id="${escapeAttr(notification.id)}"
            data-mehfil-id="${escapeAttr(notification.mehfil_id || "")}">

            ❌ Decline

          </button>

        </div>

      </div>
    `;

  }


  return `

    <div
      class="notification ${
        notification.is_read
        ? ""
        : "unread"
      }"
      id="notification-${escapeAttr(notification.id)}">

      <button
        class="delete-btn"
        data-action="delete"
        data-notification-id="${escapeAttr(notification.id)}">

        🗑️

      </button>


      <div class="notification-top">

        <img
          class="avatar"
          src="${escapeAttr(avatar)}"
          alt=""
          onerror="this.src=getDefaultAvatar();">


        <div class="notification-body">

          <div class="notification-message">

            ${escapeHtml(message)}

          </div>

          <div class="notification-time">

            ${formatDate(
              notification.created_at
            )}

          </div>

          ${extra}

        </div>

      </div>

    </div>

  `;
}


/* =====================================================
   BUTTON HANDLER
===================================================== */

document.addEventListener(
  "click",
  function(event){

    const button =
      event.target.closest(
        "[data-action]"
      );

    if(!button){
      return;
    }


    const action =
      button.dataset.action;


    if(
      action ===
      "accept-private"
    ){

      acceptPrivateRequest(
        button.dataset.notificationId,
        button.dataset.senderId,
        button
      );

    }


    if(
      action ===
      "decline-private"
    ){

      declinePrivateRequest(
        button.dataset.notificationId,
        button.dataset.senderId,
        button
      );

    }


    if(
      action ===
      "open-private"
    ){

      openPrivateChat(
        button.dataset.senderId
      );

    }


    if(
      action ===
      "accept-mehfil"
    ){

      acceptMehfilInvite(
        button.dataset.notificationId,
        button.dataset.mehfilId,
        button
      );

    }


    if(
      action ===
      "decline-mehfil"
    ){

      declineMehfilInvite(
        button.dataset.notificationId,
        button.dataset.mehfilId,
        button
      );

    }


    if(
      action ===
      "delete"
    ){

      deleteNotification(
        button.dataset.notificationId
      );

    }

  }
);


/* =====================================================
   ACCEPT PRIVATE
===================================================== */

async function acceptPrivateRequest(
  notificationId,
  senderId,
  button
){

  button.disabled = true;
  button.textContent =
    "Accepting...";


  const {
    data:request,
    error:findError
  } =
  await supabaseClient
    .from("private_requests")
    .select("*")
    .eq(
      "sender_id",
      senderId
    )
    .eq(
      "receiver_id",
      currentUser.id
    )
    .eq(
      "status",
      "pending"
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    )
    .limit(1)
    .maybeSingle();


  if(findError || !request){

    button.disabled = false;
    button.textContent =
      "✅ Accept";

    showNotice(
      "❌ Private request nahi mili."
    );

    return;
  }


  const {
    error
  } =
  await supabaseClient
    .from("private_requests")
    .update({
      status:"accepted"
    })
    .eq(
      "id",
      request.id
    )
    .eq(
      "receiver_id",
      currentUser.id
    );


  if(error){

    console.error(error);

    button.disabled = false;
    button.textContent =
      "✅ Accept";

    showNotice(
      "❌ Request accept nahi hui."
    );

    return;
  }


  await deleteNotification(
    notificationId,
    false
  );


  showNotice(
    "✅ Private request accepted!"
  );


  await loadNotifications();
}


/* =====================================================
   DECLINE PRIVATE
===================================================== */

async function declinePrivateRequest(
  notificationId,
  senderId,
  button
){

  button.disabled = true;
  button.textContent =
    "Declining...";


  const {
    data:request,
    error:findError
  } =
  await supabaseClient
    .from("private_requests")
    .select("id")
    .eq(
      "sender_id",
      senderId
    )
    .eq(
      "receiver_id",
      currentUser.id
    )
    .eq(
      "status",
      "pending"
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    )
    .limit(1)
    .maybeSingle();


  if(findError){

    button.disabled = false;
    button.textContent =
      "❌ Decline";

    showNotice(
      "❌ Request check nahi ho saki."
    );

    return;
  }


  if(request){

    const {
      error
    } =
    await supabaseClient
      .from("private_requests")
      .update({
        status:"declined"
      })
      .eq(
        "id",
        request.id
      )
      .eq(
        "receiver_id",
        currentUser.id
      );


    if(error){

      button.disabled = false;
      button.textContent =
        "❌ Decline";

      showNotice(
        "❌ Request decline nahi hui."
      );

      return;
    }
  }


  await deleteNotification(
    notificationId,
    false
  );


  showNotice(
    "Request decline kar di gayi."
  );


  await loadNotifications();
}


/* =====================================================
   OPEN PRIVATE CHAT
===================================================== */

function openPrivateChat(
  senderId
){

  if(!senderId){
    return;
  }


  window.location.href =
    "private-chat.html?user=" +
    encodeURIComponent(senderId);
}


/* =====================================================
   ACCEPT MEHFIL INVITE
===================================================== */

async function acceptMehfilInvite(
  notificationId,
  mehfilId,
  button
){

  if(!mehfilId){

    showNotice(
      "❌ Mehfil ID missing hai."
    );

    return;
  }


  button.disabled = true;
  button.textContent =
    "Joining...";


  const {
    data:invite,
    error:inviteError
  } =
  await supabaseClient
    .from("mehfil_invites")
    .select("*")
    .eq(
      "mehfil_id",
      mehfilId
    )
    .eq(
      "invitee_id",
      currentUser.id
    )
    .eq(
      "status",
      "pending"
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    )
    .limit(1)
    .maybeSingle();


  if(inviteError || !invite){

    button.disabled = false;
    button.textContent =
      "✅ Accept";

    showNotice(
      "❌ Mehfil invite nahi mili."
    );

    return;
  }


  const {
    error:updateError
  } =
  await supabaseClient
    .from("mehfil_invites")
    .update({
      status:"accepted"
    })
    .eq(
      "id",
      invite.id
    );


  if(updateError){

    console.error(
      updateError
    );

    button.disabled = false;
    button.textContent =
      "✅ Accept";

    showNotice(
      "❌ Invite accept nahi hui."
    );

    return;
  }


  /* ADD MEMBER */

  const {
    error:memberError
  } =
  await supabaseClient
    .from("mehfil_members")
    .upsert(
      {
        mehfil_id:mehfilId,
        user_id:currentUser.id
      },
      {
        onConflict:
          "mehfil_id,user_id"
      }
    );


  if(memberError){

    console.error(
      memberError
    );

    showNotice(
      "Invite accept hui, lekin member add nahi ho saka."
    );

  }


  await deleteNotification(
    notificationId,
    false
  );


  showNotice(
    "✅ Mehfil join ho gayi!"
  );


  await loadNotifications();
}


/* =====================================================
   DECLINE MEHFIL
===================================================== */

async function declineMehfilInvite(
  notificationId,
  mehfilId,
  button
){

  button.disabled = true;
  button.textContent =
    "Declining...";


  if(mehfilId){

    const {
      error
    } =
    await supabaseClient
      .from("mehfil_invites")
      .update({
        status:"declined"
      })
      .eq(
        "mehfil_id",
        mehfilId
      )
      .eq(
        "invitee_id",
        currentUser.id
      )
      .eq(
        "status",
        "pending"
      );


    if(error){

      console.error(error);

    }
  }


  await deleteNotification(
    notificationId,
    false
  );


  showNotice(
    "Mehfil invite decline kar di."
  );


  await loadNotifications();
}


/* =====================================================
   DELETE NOTIFICATION
===================================================== */

async function deleteNotification(
  notificationId,
  reload = true
){

  const {
    error
  } =
  await supabaseClient
    .from("notifications")
    .delete()
    .eq(
      "id",
      notificationId
    )
    .eq(
      "user_id",
      currentUser.id
    );


  if(error){

    console.error(
      error
    );

    showNotice(
      "❌ Notification delete nahi hui."
    );

    return;
  }


  const element =
    document.getElementById(
      "notification-" +
      notificationId
    );


  if(element){
    element.remove();
  }


  if(reload){
    
    if(
      !document.querySelector(
        ".notification"
      )
    ){

      document.getElementById(
        "notificationsList"
      ).innerHTML = `
        <div class="empty">
          🔔 Abhi koi notification nahi hai.
        </div>
      `;

    }
  }
}


/* =====================================================
   DEFAULT AVATAR
===================================================== */

function getDefaultAvatar(){

  return "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="100"
        height="100"
        viewBox="0 0 100 100">

        <rect
          width="100"
          height="100"
          rx="50"
          fill="#e8e6ff"/>

        <circle
          cx="50"
          cy="38"
          r="18"
          fill="#6c5ce7"/>

        <path
          d="M20 85c4-20 17-30 30-30s26 10 30 30"
          fill="#6c5ce7"/>

      </svg>

    `);
}


/* =====================================================
   DATE
===================================================== */

function formatDate(date){

  if(!date){
    return "";
  }


  const d =
    new Date(date);

  const now =
    new Date();

  const seconds =
    Math.floor(
      (now - d) / 1000
    );


  if(seconds < 60){
    return "Just now";
  }


  const minutes =
    Math.floor(
      seconds / 60
    );


  if(minutes < 60){
    return minutes + " min ago";
  }


  const hours =
    Math.floor(
      minutes / 60
    );


  if(hours < 24){
    return hours + " hours ago";
  }


  const days =
    Math.floor(
      hours / 24
    );


  if(days < 7){
    return days + " days ago";
  }


  return d.toLocaleDateString();
}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );
}


function escapeAttr(value){

  return escapeHtml(value);
}


/* =====================================================
   NOTICE
===================================================== */

function showNotice(message){

  const notice =
    document.getElementById(
      "notice"
    );


  notice.textContent =
    message;


  notice.style.display =
    "block";


  clearTimeout(
    window.noticeTimer
  );


  window.noticeTimer =
    setTimeout(
      function(){

        notice.style.display =
          "none";

      },
      3000
    );
}


/* =====================================================
   NAVIGATION
