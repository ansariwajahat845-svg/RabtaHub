<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notifications - ChatZone 💬</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
:root{--purple:#7c3aed;--purple2:#6d28d9;--light:#f3e8ff;--bg:#f8f7fc;--text:#251b35;--muted:#786d86}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;padding-bottom:76px}
header{background:#fff;border-bottom:2px solid var(--purple);position:sticky;top:0;z-index:5}
.head{max-width:760px;margin:auto;padding:15px 16px;display:flex;align-items:center;gap:12px}
.logo{width:43px;height:43px;border-radius:14px;background:var(--light);display:grid;place-items:center;font-size:23px}
.heading{flex:1;min-width:0}
h1{font-size:20px;margin:0;color:var(--purple)}
#status{font-size:12px;color:var(--muted);margin-top:4px}
.iconbtn{border:0;background:var(--light);color:var(--purple);border-radius:12px;padding:10px 12px;font-size:17px;cursor:pointer}.bellwrap{position:relative;display:inline-flex}.countbadge{position:absolute;right:-7px;top:-7px;min-width:19px;height:19px;padding:0 5px;border-radius:12px;background:#ef4444;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff}.countbadge.hidden{display:none}
main{max-width:760px;margin:auto;padding:16px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 14px}
.topline h2{font-size:16px;margin:0}
.refresh{border:1px solid #e5d5ff;background:#fff;color:var(--purple);padding:8px 12px;border-radius:20px;font-weight:700}
.note{background:#fff;border:1px solid #eee5f8;border-left:4px solid var(--purple);border-radius:16px;padding:14px;margin-bottom:11px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 3px 12px #24113a08}
.note.request{border-left-color:#a855f7}
.note.message{border-left-color:#7c3aed}
.noteicon{width:43px;height:43px;border-radius:14px;background:var(--light);display:grid;place-items:center;font-size:22px;flex-shrink:0}
.content{flex:1;min-width:0;cursor:pointer}
.name{font-size:14px;font-weight:700;margin:2px 0 5px}
.desc{font-size:13px;line-height:1.45;color:#5f536b;overflow-wrap:anywhere}
.time{font-size:11px;color:#9b90a6;margin-top:7px}
.actions{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.btn{border:0;border-radius:20px;padding:9px 13px;font-size:12px;font-weight:700;cursor:pointer}
.open,.accept{background:var(--purple);color:white}
.decline{background:#f1edf5;color:#594c65}
.empty,.loading,.error{background:#fff;border:1px solid #eee5f8;border-radius:16px;text-align:center;padding:30px 18px;color:var(--muted);font-size:14px;line-height:1.5}
.error{color:#a32245}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e8def3;display:flex;justify-content:center;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
.bottom a{flex:1;max-width:150px;text-align:center;padding:9px 3px 7px;text-decoration:none;color:#786d86;font-size:11px}
.bottom a span{display:block;font-size:19px;margin-bottom:3px}
.bottom a.active{color:var(--purple);font-weight:700}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#2b2038;color:#fff;padding:11px 16px;border-radius:22px;font-size:13px;z-index:10;display:none;max-width:90%;text-align:center}
@media(max-width:420px){main{padding:12px}.note{padding:12px;gap:9px}.noteicon{width:38px;height:38px}}
</style>
</head>
<body>
<header><div class="head">
<div class="logo">🔔</div>
<div class="heading"><h1>Notifications</h1><div id="status">Connecting to ChatZone...</div></div>
<button class="iconbtn" title="Refresh notifications" onclick="loadNotifications()">↻</button>
<button class="iconbtn" title="Back" onclick="goBack()">←</button>
</div></header>
<main>
<div class="topline"><h2>Your notifications</h2><button class="refresh" onclick="loadNotifications()">Refresh</button></div>
<div id="mainContent"><div class="loading">Loading notifications...</div></div>
</main>
<nav class="bottom">
<a href="index.html"><span>🏠</span>Home</a>
<a href="private.html"><span>💬</span>Private</a>
<a href="mehfil.html"><span>👥</span>Mehfil</a>
<a href="profile.html"><span>👤</span>Profile</a>
<a href="notifications.html" class="active"><span class="bellwrap">🔔<b id="notificationCount" class="countbadge hidden">0</b></span>Notifications</a>
</nav>
<div id="toast"></div>
<script>
const SUPABASE_URL="https://jhcpqjmxiovvqbghpxbf.supabase.co";
const SUPABASE_KEY="sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let currentUser=null,busy=false,refreshTimer=null;
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function goBack(){if(history.length>1)history.back();else location.href="index.html"}
function toast(s){const e=document.getElementById("toast");e.textContent=s;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2600)}
function ago(v){if(!v)return"";const d=Date.now()-new Date(v).getTime();if(!Number.isFinite(d)||d<0)return"";if(d<60000)return"Just now";if(d<3600000)return Math.floor(d/60000)+" min ago";if(d<86400000)return Math.floor(d/3600000)+" hr ago";return new Date(v).toLocaleDateString()}
function profileName(p){return p?.name||p?.username||(p?.id?"ChatZone User":"Someone")}
function seenKey(){return "chatzone_seen_notifications_"+(currentUser?.id||"guest")}
function getSeen(){try{return new Set(JSON.parse(localStorage.getItem(seenKey())||"[]"))}catch{return new Set()}}
function markSeen(type,id){if(!id)return;const seen=getSeen();seen.add(type+":"+id);try{localStorage.setItem(seenKey(),JSON.stringify([...seen]))}catch{} }
function updateCount(count){const badge=document.getElementById("notificationCount");if(!badge)return;const n=Math.max(0,Number(count)||0);badge.textContent=n>99?"99+":String(n);badge.classList.toggle("hidden",n===0);}
function openChat(userId,type,id){if(!userId){toast("Chat user is missing");return}if(type&&id)markSeen(type,id);location.href="private-chat.html?user_id="+encodeURIComponent(userId)}
function requestCard(row,p){
const nm=esc(profileName(p)),uid=esc(row.sender_id),rid=esc(row.id);
return `<article class="note request"><div class="noteicon">👤</div><div class="content" onclick="openChat('${uid}','request','${rid}')"><div class="name">Private chat request</div><div class="desc"><b>${nm}</b> sent you a private chat request.</div><div class="time">${esc(ago(row.created_at)||"New request")}</div></div><div class="actions"><button class="btn accept" onclick="acceptRequest('${rid}',event)">Accept</button><button class="btn decline" onclick="declineRequest('${rid}',event)">Decline</button><button class="btn open" onclick="openChat('${uid}','request','${rid}')">Open</button></div></article>`
}
function messageCard(row,p){
const nm=esc(profileName(p)),uid=esc(row.sender_id),mid=esc(row.id);
const body=String(row.content??row.message??"").trim();
const summary=body?esc(body):((row.message_type==="image"||row.media_url)?"📷 Sent an image":"Sent you a message");
return `<article class="note message" role="button" tabindex="0" onclick="openChat('${uid}','message','${mid}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openChat('${uid}','message','${mid}') }"><div class="noteicon">💬</div><div class="content"><div class="name">New private message</div><div class="desc"><b>${nm}</b>: ${summary}</div><div class="time">${esc(ago(row.created_at))}</div><div class="actions"><button class="btn open" onclick="event.stopPropagation();openChat('${uid}','message','${mid}')">Open chat</button></div></div></article>`
}
async function loadNotifications(){
if(busy)return;busy=true;
const box=document.getElementById("mainContent");box.innerHTML='<div class="loading">Loading notifications...</div>';
try{
let {data:s,error:se}=await db.auth.getSession();if(se)throw se;
let session=s?.session;
if(!session){await new Promise(r=>setTimeout(r,350));session=(await db.auth.getSession()).data?.session}
if(!session?.user){currentUser=null;updateCount(0);document.getElementById("status").textContent="Please log in";box.innerHTML='<div class="empty">🔐 Please log in to see private message and request notifications.<br><br><button class="btn open" onclick="location.href=\'login.html\'">Go to Login</button></div>';return}
currentUser=session.user;document.getElementById("status").textContent="Private messages and requests";
const [reqRes,msgRes]=await Promise.all([
db.from("private_requests").select("id,sender_id,receiver_id,status,created_at").eq("receiver_id",currentUser.id).eq("status","pending").order("created_at",{ascending:false}).limit(100),
db.from("private_messages").select("id,sender_id,receiver_id,content,message,message_type,media_url,created_at").eq("receiver_id",currentUser.id).neq("sender_id",currentUser.id).order("created_at",{ascending:false}).limit(100)
]);
if(reqRes.error)throw reqRes.error;
if(msgRes.error)throw msgRes.error;
const requests=reqRes.data||[],messages=msgRes.data||[];
const ids=[...new Set([...requests.map(x=>x.sender_id),...messages.map(x=>x.sender_id)].filter(Boolean))];
let people=[];
if(ids.length){const {data,error}=await db.from("profiles").select("id,username,name,avatar_url").in("id",ids);if(error)throw error;people=data||[]}
const byId=Object.fromEntries(people.map(p=>[p.id,p]));
const seen=getSeen();
const unreadRequests=requests.filter(r=>!seen.has("request:"+r.id));
const unreadMessages=messages.filter(m=>!seen.has("message:"+m.id));
updateCount(unreadRequests.length+unreadMessages.length);
const items=[
...requests.map(r=>({kind:"request",row:r,sort:Date.parse(r.created_at||0)||0})),
...messages.map(r=>({kind:"message",row:r,sort:Date.parse(r.created_at||0)||0}))
].sort((a,b)=>b.sort-a.sort);
if(!items.length){box.innerHTML='<div class="empty">✨ You are all caught up.<br><br>New private messages and private chat requests will appear here.</div>';return}
box.innerHTML=items.map(x=>x.kind==="request"?requestCard(x.row,byId[x.row.sender_id]):messageCard(x.row,byId[x.row.sender_id])).join("");
}catch(e){console.error("ChatZone notification load error:",e);const detail=esc(e?.message||e?.details||e?.hint||String(e)||"Unknown error");box.innerHTML='<div class="error"><b>Notifications could not load.</b><br><br>'+detail+'<br><br><small>Supabase error details upar show ho rahe hain. Is message ko copy karke support ko bhej sakte hain.</small><br><br><button class="btn open" onclick="loadNotifications()">Try again</button></div>';document.getElementById("status").textContent="Load error: "+String(e?.code||"check details")}
finally{busy=false}
}
async function acceptRequest(id,event){
if(event)event.stopPropagation();if(!currentUser)return;
try{markSeen("request",id);const {error}=await db.from("private_requests").update({status:"accepted"}).eq("id",id).eq("receiver_id",currentUser.id);if(error)throw error;toast("Request accepted");await loadNotifications()}
catch(e){console.error(e);toast("Could not accept request. Check Supabase permissions.")}
}
async function declineRequest(id,event){
if(event)event.stopPropagation();if(!currentUser)return;
try{markSeen("request",id);const {error}=await db.from("private_requests").update({status:"declined"}).eq("id",id).eq("receiver_id",currentUser.id);if(error)throw error;toast("Request declined");await loadNotifications()}
catch(e){console.error(e);toast("Could not decline request. Check Supabase permissions.")}
}
loadNotifications();
refreshTimer=setInterval(()=>{if(document.visibilityState==="visible")loadNotifications()},20000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")loadNotifications()});
</script>
</body>
</html>
