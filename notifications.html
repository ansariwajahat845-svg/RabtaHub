<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Notifications - ChatZone ðŸ’¬</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6fb;color:#222;padding-bottom:75px}.header{background:linear-gradient(135deg,#6c5ce7,#8e44ad);color:white;padding:16px;position:sticky;top:0;z-index:10}.header-row{display:flex;align-items:center;justify-content:space-between}.header-title{font-size:21px;font-weight:bold}.back-btn{border:0;background:rgba(255,255,255,.16);color:white;border-radius:10px;padding:9px 13px;font-size:17px}.container{width:100%;max-width:650px;margin:auto;padding:14px}.notice{display:none;background:white;border-radius:12px;padding:11px;margin-bottom:12px;text-align:center;box-shadow:0 2px 8px #0001;font-weight:bold}.loading,.empty{background:white;border-radius:14px;padding:25px 15px;text-align:center;color:#777}.notification{background:white;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px #0001;position:relative;cursor:pointer}.notification.unread{border-left:4px solid #6c5ce7}.notification:focus{outline:2px solid #6c5ce7}.notification-top{display:flex;gap:11px;align-items:flex-start}.avatar{width:46px;height:46px;min-width:46px;border-radius:50%;object-fit:cover;background:#eee}.notification-body{flex:1;min-width:0;padding-right:22px}.notification-message{font-size:15px;line-height:1.45;word-break:break-word}.notification-time{margin-top:5px;color:#999;font-size:12px}.delete-btn{position:absolute;right:9px;top:8px;border:0;background:none;color:#999;font-size:16px;cursor:pointer;z-index:2}.action-box{margin-top:11px;background:#f7f5ff;border-radius:11px;padding:10px;cursor:default}.action-title{color:#6c5ce7;font-weight:bold;margin-bottom:9px;font-size:14px}.action-buttons{display:flex;gap:8px}.accept-btn,.decline-btn,.open-btn{border:0;border-radius:9px;padding:9px 11px;font-weight:bold;cursor:pointer}.accept-btn{background:#6c5ce7;color:white;flex:1}.decline-btn{background:#eee;color:#444;flex:1}.open-btn{width:100%;background:#6c5ce7;color:white}.accept-btn:disabled,.decline-btn:disabled{opacity:.6}.tap-hint{font-size:12px;color:#6c5ce7;margin-top:8px}.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:68px;background:white;border-top:1px solid #ddd;display:flex;justify-content:space-around;align-items:center;z-index:20;overflow-x:auto}.nav-btn{border:0;background:none;color:#666;font-size:11px;text-align:center;cursor:pointer;min-width:55px}.nav-icon{display:block;font-size:20px;margin-bottom:3px}.nav-btn.active{color:#6c5ce7;font-weight:bold}
</style></head><body>
<header class="header"><div class="header-row"><button class="back-btn" onclick="goHome()">â†</button><div class="header-title">ðŸ”” Notifications</div><div style="width:45px"></div></div></header>
<main class="container"><div id="notice" class="notice"></div><div id="notificationsList" class="loading">Loading notifications...</div></main>
<nav class="bottom-nav"><button class="nav-btn" onclick="goHome()"><span class="nav-icon">ðŸ </span>Home</button><button class="nav-btn" onclick="goPrivate()"><span class="nav-icon">ðŸ’¬</span>Private</button><button class="nav-btn" onclick="goProfile()"><span class="nav-icon">ðŸ‘¤</span>Profile</button><button class="nav-btn active" onclick="goNotifications()"><span class="nav-icon">ðŸ””</span>Notifications</button><button class="nav-btn" onclick="goMehfil()"><span class="nav-icon">ðŸ </span>Mehfil</button><button class="nav-btn" onclick="goMore()"><span class="nav-icon">â˜°</span>More</button></nav>
<script>
const SUPABASE_URL="https://jhcpqjmxiovvqbghpxbf.supabase.co";
const SUPABASE_KEY="sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
let currentUser=null;
async function init(){const {data,error}=await supabaseClient.auth.getSession();if(error){showLoginError(error.message);return}if(!data?.session){location.href="login.html";return}currentUser=data.session.user;await loadNotifications()}
async function loadNotifications(){const list=document.getElementById('notificationsList');list.innerHTML='<div class="loading">Loading notifications...</div>';
let normal=[];const nr=await supabaseClient.from('notifications').select('*').eq('user_id',currentUser.id).order('created_at',{ascending:false});if(nr.error){console.error(nr.error);showNotice('Notifications load karne mein masla hai.');}else normal=nr.data||[];
let requests=[];const rr=await supabaseClient.from('private_requests').select('*').eq('receiver_id',currentUser.id).eq('status','pending').order('created_at',{ascending:false});if(rr.error)console.warn('Private requests:',rr.error.message);else requests=rr.data||[];
const ids=[...new Set([...normal.map(n=>n.sender_id),...requests.map(r=>r.sender_id)].filter(Boolean))];let profiles=[];if(ids.length){const pr=await supabaseClient.from('profiles').select('id,username,name,avatar_url').in('id',ids);if(!pr.error)profiles=pr.data||[];}const profileMap={};profiles.forEach(p=>profileMap[p.id]=p);
const requestNotices=requests.map(r=>({id:'private_request_'+r.id,request_id:r.id,sender_id:r.sender_id,user_id:currentUser.id,type:'private_request',message:'',created_at:r.created_at,is_read:false,is_private_request:true}));const combined=[...normal,...requestNotices].sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));if(!combined.length){list.innerHTML='<div class="empty">ðŸ”” Abhi koi notification nahi hai.</div>';return}
list.innerHTML=combined.map(n=>renderNotification(n,profileMap[n.sender_id])).join('');const unread=normal.filter(n=>!n.is_read).map(n=>n.id);if(unread.length){const r=await supabaseClient.from('notifications').update({is_read:true}).in('id',unread).eq('user_id',currentUser.id);if(r.error)console.warn('Mark read:',r.error.message)} }
function renderNotification(n,p){const avatar=p?.avatar_url||getDefaultAvatar(),username=p?.username||p?.name||'User';let message=n.message||'Aap ke liye ek notification hai.',extra='';if(n.type==='private_request'){message=`@${username} ne aapko private chat request bheji hai.`;extra=`<div class="action-box"><div class="action-title">ðŸ“© Private Chat Request</div><div class="action-buttons"><button class="accept-btn" data-action="accept-private" data-request-id="${ea(n.request_id||'')}" data-notification-id="${ea(n.id)}" data-sender-id="${ea(n.sender_id||'')}">âœ… Accept</button><button class="decline-btn" data-action="decline-private" data-request-id="${ea(n.request_id||'')}" data-notification-id="${ea(n.id)}" data-sender-id="${ea(n.sender_id||'')}">âŒ Decline</button></div></div>`}else if(n.type==='private_message'){message=n.message||`ðŸ’¬ @${username} ne aapko private message bheja hai.`;extra=`<div class="action-box"><button class="open-btn" data-action="open-private" data-sender-id="${ea(n.sender_id||'')}">ðŸ’¬ Open Private Chat</button></div>`}else if(n.type==='mehfil_invite'){message=n.message||`ðŸ  @${username} ne aapko Mehfil mein invite kiya hai.`;extra=`<div class="action-box"><div class="action-title">ðŸ  Mehfil Invitation</div><div class="action-buttons"><button class="accept-btn" data-action="accept-mehfil" data-notification-id="${ea(n.id)}" data-mehfil-id="${ea(n.mehfil_id||'')}">âœ… Accept</button><button class="decline-btn" data-action="decline-mehfil" data-notification-id="${ea(n.id)}" data-mehfil-id="${ea(n.mehfil_id||'')}">âŒ Decline</button></div></div>`}
const hasTarget=!!(n.post_id||n.target_post_id);const hint=hasTarget?'<div class="tap-hint">ðŸ‘† Post/comment par jane ke liye tap karein</div>':'';return `<div class="notification ${n.is_read?'':'unread'}" tabindex="0" role="button" data-action="open-target" data-notification-id="${ea(n.id)}" data-post-id="${ea(n.post_id||n.target_post_id||'')}" data-comment-id="${ea(n.comment_id||n.target_comment_id||'')}" data-type="${ea(n.type||'')}"><button class="delete-btn" data-action="delete" data-notification-id="${ea(n.id)}" aria-label="Delete notification">ðŸ—‘ï¸</button><div class="notification-top"><img class="avatar" src="${ea(avatar)}" alt="" onerror="this.src=getDefaultAvatar()"><div class="notification-body"><div class="notification-message">${eh(message)}</div><div class="notification-time">${formatDate(n.created_at)}</div>${extra}${hint}</div></div></div>`}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;if(action==='open-target'){if(e.target.closest('.action-box')||e.target.closest('.delete-btn'))return;await openNotificationTarget(b);return}if(action==='delete'){e.stopPropagation();await deleteNotification(b.dataset.notificationId);return}if(action==='open-private'){e.stopPropagation();if(b.dataset.senderId)location.href='private-chat.html?user='+encodeURIComponent(b.dataset.senderId);return}if(action==='accept-private'){e.stopPropagation();await handlePrivateRequest(b,true);return}if(action==='decline-private'){e.stopPropagation();await handlePrivateRequest(b,false);return}if(action==='accept-mehfil'){e.stopPropagation();await handleMehfil(b,true);return}if(action==='decline-mehfil'){e.stopPropagation();await handleMehfil(b,false);return}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.notification')){e.preventDefault();openNotificationTarget(e.target)}});
async function openNotificationTarget(card){const postId=card.dataset.postId,commentId=card.dataset.commentId;const id=card.dataset.notificationId;if(id&&!String(id).startsWith('private_request_'))await supabaseClient.from('notifications').update({is_read:true}).eq('id',id).eq('user_id',currentUser.id);if(postId){let url='index.html?openPost='+encodeURIComponent(postId);if(commentId)url+='&openComment='+encodeURIComponent(commentId);url+='#post-'+encodeURIComponent(postId);location.href=url;return}const type=card.dataset.type||'';if(type==='private_message'){const sender=card.querySelector('[data-sender-id]')?.dataset.senderId;if(sender)location.href='private-chat.html?user='+encodeURIComponent(sender);return}showNotice('Is notification mein post ID nahi hai. Purani notification ke liye target link available nahi; naye notifications ke liye Home Feed ka updated code lagayein.')}
async function handlePrivateRequest(button,accept){button.disabled=true;button.textContent=accept?'Accepting...':'Declining...';let q=supabaseClient.from('private_requests').update({status:accept?'accepted':'declined'}).eq('receiver_id',currentUser.id).eq('status','pending');if(button.dataset.requestId)q=q.eq('id',button.dataset.requestId);else q=q.eq('sender_id',button.dataset.senderId);const {data,error}=await q.select('id');if(error||!data?.length){button.disabled=false;button.textContent=accept?'âœ… Accept':'âŒ Decline';showNotice('âŒ Request update nahi hui.');return}if(button.dataset.notificationId&&!button.dataset.notificationId.startsWith('private_request_'))await deleteNotification(button.dataset.notificationId,false);showNotice(accept?'âœ… Private request accepted!':'Request decline kar di gayi.');await loadNotifications()}
async function handleMehfil(button,accept){const mehfilId=button.dataset.mehfilId;if(!mehfilId){showNotice('âŒ Mehfil ID missing hai.');return}button.disabled=true;button.textContent=accept?'Joining...':'Declining...';const inv=await supabaseClient.from('mehfil_invites').select('id').eq('mehfil_id',mehfilId).eq('invitee_id',currentUser.id).eq('status','pending').order('created_at',{ascending:false}).limit(1).maybeSingle();if(inv.error||!inv.data){button.disabled=false;button.textContent=accept?'âœ… Accept':'âŒ Decline';showNotice('âŒ Mehfil invite nahi mili.');return}const upd=await supabaseClient.from('mehfil_invites').update({status:accept?'accepted':'declined'}).eq('id',inv.data.id);if(upd.error){button.disabled=false;showNotice('âŒ Invite update nahi hui.');return}if(accept){const m=await supabaseClient.from('mehfil_members').upsert({mehfil_id:mehfilId,user_id:currentUser.id},{onConflict:'mehfil_id,user_id'});if(m.error)console.warn(m.error)}await deleteNotification(button.dataset.notificationId,false);showNotice(accept?'âœ… Mehfil join ho gayi!':'Mehfil invite decline kar di.');await loadNotifications()}
async function deleteNotification(id,reload=true){if(!id||String(id).startsWith('private_request_'))return;const {error}=await supabaseClient.from('notifications').delete().eq('id',id).eq('user_id',currentUser.id);if(error){showNotice('âŒ Notification delete nahi hui.');console.error(error);return}if(reload)await loadNotifications()}
function getDefaultAvatar(){return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" rx="50" fill="#e8e6ff"/><circle cx="50" cy="38" r="18" fill="#6c5ce7"/><path d="M20 85c4-20 17-30 30-30s26 10 30 30" fill="#6c5ce7"/></svg>')}
function formatDate(value){if(!value)return '';const d=new Date(value),s=Math.floor((Date.now()-d.getTime())/1000);if(s<60)return 'Just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' hours ago';if(s<604800)return Math.floor(s/86400)+' days ago';return d.toLocaleDateString()}
function eh(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}function ea(v){return eh(v)}function showNotice(m){const n=document.getElementById('notice');n.textContent=m;n.style.display='block';clearTimeout(window.noticeTimer);window.noticeTimer=setTimeout(()=>n.style.display='none',3500)}function showLoginError(m){document.getElementById('notificationsList').innerHTML='<div class="empty">âŒ Session problem<br><br>'+eh(m)+'<br><br><button onclick="location.href=\'login.html\'">Login</button></div>'}
function goHome(){location.href='index.html'}function goPrivate(){location.href='private.html'}function goProfile(){location.href='profile.html'}function goNotifications(){location.href='notifications.html'}function goMehfil(){location.href='mehfil.html'}function goMore(){location.href='more.html'}
supabaseClient.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT')location.href='login.html'});init();
</script></body></html>
