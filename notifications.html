<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#8b5cf6">
<title>Notifications - ChatZone 💬</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
:root{--purple:#7c3aed;--purple2:#6d28d9;--light:#f3e8ff;--bg:#f8f7fc;--surface:#fff;--text:#251b35;--muted:#786d86;--border:#eee5f8}
html[data-theme="dark"]{color-scheme:dark;--purple:#a78bfa;--purple2:#8b5cf6;--light:#302344;--bg:#171222;--surface:#211a30;--text:#f5efff;--muted:#b5a7cb;--border:#403054}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;padding-bottom:78px}
header{background:var(--surface);border-bottom:2px solid var(--purple);position:sticky;top:0;z-index:5}
.head{max-width:760px;margin:auto;padding:15px 16px;display:flex;align-items:center;gap:12px}
.logo{width:43px;height:43px;border-radius:14px;background:var(--light);display:grid;place-items:center;font-size:23px;flex-shrink:0}
.heading{flex:1;min-width:0}h1{font-size:20px;margin:0;color:var(--purple)}#status{font-size:12px;color:var(--muted);margin-top:4px}
.iconbtn{border:0;background:var(--light);color:var(--purple);border-radius:12px;padding:10px 12px;font-size:17px;cursor:pointer}
main{max-width:760px;margin:auto;padding:16px}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 14px}.topline h2{font-size:16px;margin:0}
.refresh,.action{border:1px solid var(--border);background:var(--surface);color:var(--purple);padding:9px 12px;border-radius:20px;font-weight:700;cursor:pointer}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar button{flex:1;min-width:120px}
.note{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--purple);border-radius:16px;padding:14px;margin-bottom:11px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 3px 12px #24113a08}
.note.unread{box-shadow:0 0 0 1px #8b5cf633}.note.request{border-left-color:#a855f7}.note.message{border-left-color:#7c3aed}.note.database{border-left-color:#0d9488}
.noteicon{width:43px;height:43px;border-radius:14px;background:var(--light);display:grid;place-items:center;font-size:22px;flex-shrink:0}.content{flex:1;min-width:0}.clickable{cursor:pointer}.name{font-size:14px;font-weight:700;margin:2px 0 5px}.desc{font-size:13px;line-height:1.45;color:var(--muted);overflow-wrap:anywhere}.time{font-size:11px;color:var(--muted);margin-top:7px}.actions{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.btn{border:0;border-radius:20px;padding:9px 13px;font-size:12px;font-weight:700;cursor:pointer}.open,.accept{background:var(--purple);color:white}.decline{background:var(--light);color:var(--text)}
.empty,.loading,.error{background:var(--surface);border:1px solid var(--border);border-radius:16px;text-align:center;padding:30px 18px;color:var(--muted);font-size:14px;line-height:1.5}.error{color:#e11d48}
.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:center;z-index:6;padding-bottom:env(safe-area-inset-bottom)}.bottom a{flex:1;max-width:150px;text-align:center;padding:9px 3px 7px;text-decoration:none;color:var(--muted);font-size:11px}.bottom a span{display:block;font-size:19px;margin-bottom:3px}.bottom a.active{color:var(--purple);font-weight:700}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#2b2038;color:#fff;padding:11px 16px;border-radius:22px;font-size:13px;z-index:10;display:none;max-width:90%;text-align:center}
@media(max-width:420px){main{padding:12px}.note{padding:12px;gap:9px}.noteicon{width:38px;height:38px}.head{padding:12px}}
</style>
</head>
<body>
<header><div class="head"><div class="logo">🔔</div><div class="heading"><h1>Notifications</h1><div id="status">Connecting to ChatZone...</div></div><button class="iconbtn" title="Refresh notifications" onclick="loadNotifications()">↻</button><button class="iconbtn" title="Back" onclick="goBack()">←</button></div></header>
<main><div class="topline"><h2>Your notifications</h2><button class="refresh" onclick="loadNotifications()">Refresh</button></div><div class="toolbar"><button class="action" onclick="markAllRead()">✓ Mark all as read</button></div><div id="mainContent"><div class="loading">Loading notifications...</div></div></main>
<nav class="bottom"><a href="index.html"><span>🏠</span>Home</a><a href="private.html"><span>💬</span>Private</a><a href="mehfil.html"><span>👥</span>Mehfil</a><a href="profile.html"><span>👤</span>Profile</a><a href="notifications.html" class="active"><span>🔔</span>Notifications</a></nav>
<div id="toast"></div>
<script>
"use strict";
const SUPABASE_URL="https://jhcpqjmxiovvqbghpxbf.supabase.co";
const SUPABASE_KEY="sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let currentUser=null,busy=false,channel=null,refreshTimer=null,dbRows=[],requestRows=[],messageRows=[],peopleById={};
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function goBack(){if(history.length>1)history.back();else location.href="index.html"}
function toast(s){const e=document.getElementById("toast");e.textContent=s;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2600)}
function ago(v){if(!v)return"";const d=Date.now()-new Date(v).getTime();if(!Number.isFinite(d)||d<0)return"";if(d<60000)return"Just now";if(d<3600000)return Math.floor(d/60000)+" min ago";if(d<86400000)return Math.floor(d/3600000)+" hr ago";return new Date(v).toLocaleDateString()}
function profileName(p){return p?.name||p?.username||(p?.id?"ChatZone User":"Someone")}
function seenKey(){return"chatzone_seen_notifications_"+(currentUser?.id||"guest")}
function getSeen(){try{return new Set(JSON.parse(localStorage.getItem(seenKey())||"[]"))}catch{return new Set()}}
function markSeen(type,id){if(!id)return;const s=getSeen();s.add(type+":"+id);try{localStorage.setItem(seenKey(),JSON.stringify([...s]))}catch{}}
function updateCount(){const seen=getSeen(),local=requestRows.filter(r=>!seen.has("request:"+r.id)).length+messageRows.filter(m=>!seen.has("message:"+m.id)).length,dbUnread=dbRows.filter(n=>!n.is_read).length,total=local+dbUnread;document.getElementById("status").textContent=total?total+" unread notification"+(total===1?"":"s"):"You're all caught up"}
function openChat(uid,type,id){if(!uid){toast("Chat user is missing");return}if(type&&id)markSeen(type,id);location.href="private-chat.html?user_id="+encodeURIComponent(uid)}
function requestCard(row){const nm=esc(profileName(peopleById[row.sender_id])),seen=getSeen().has("request:"+row.id),uid=String(row.sender_id||""),rid=String(row.id);return `<article class="note request ${seen?"":"unread"}"><div class="noteicon">👤</div><div class="content"><div class="name">Private chat request</div><div class="desc"><b>${nm}</b> sent you a private chat request.</div><div class="time">${esc(ago(row.created_at)||"New request")}</div><div class="actions"><button class="btn accept" data-accept="${esc(rid)}">Accept</button><button class="btn decline" data-decline="${esc(rid)}">Decline</button><button class="btn open" data-open="${esc(uid)}" data-request="${esc(rid)}">Open</button></div></div></article>`}
function messageCard(row){const nm=esc(profileName(peopleById[row.sender_id])),uid=String(row.sender_id||""),mid=String(row.id),seen=getSeen().has("message:"+row.id),body=String(row.content??row.message??"").trim(),summary=body?esc(body):((row.message_type==="image"||row.media_url)?"📷 Sent an image":"Sent you a message");return `<article class="note message ${seen?"":"unread"}"><div class="noteicon">💬</div><div class="content"><div class="name">New private message</div><div class="desc"><b>${nm}</b>: ${summary}</div><div class="time">${esc(ago(row.created_at))}</div><div class="actions"><button class="btn open" data-open="${esc(uid)}" data-type="message" data-id="${esc(mid)}">Open chat</button></div></div></article>`}
function databaseCard(n){const unread=!n.is_read,title=esc(notificationTitle(n.type)),body=esc(n.message||""),id=esc(String(n.id));return `<article class="note database ${unread?"unread":""}"><div class="noteicon">${notificationIcon(n.type)}</div><div class="content"><div class="name">${title}</div><div class="desc">${body}</div><div class="time">${esc(ago(n.created_at)||"")}${n.type?" · "+esc(n.type):""}</div><div class="actions">${unread?`<button class="btn decline" data-mark-read="${id}">Mark read</button>`:""}</div></div></article>`}
function notificationTitle(t){return({like:"New like",post_like:"New like",comment:"New comment",follow:"New follower",message:"New message",private_message:"New private message",friend_request:"New request"})[String(t||"").toLowerCase()]||"ChatZone notification"}
function notificationIcon(t){t=String(t||"").toLowerCase();if(t.includes("like"))return"❤️";if(t.includes("comment"))return"💬";if(t.includes("follow"))return"👤";if(t.includes("message"))return"✉️";if(t.includes("request"))return"🤝";return"🔔"}
async function loadNotifications(){
 if(busy||!currentUser)return;busy=true;const box=document.getElementById("mainContent");
 if(!dbRows.length&&!requestRows.length&&!messageRows.length)box.innerHTML='<div class="loading">Loading notifications...</div>';
 try{
  const [nRes,rRes,mRes]=await Promise.all([
   db.from("notifications").select("id,user_id,sender_id,type,post_id,message,is_read,created_at,mehfil_id,comment_id,read_at").eq("user_id",currentUser.id).order("created_at",{ascending:false}).limit(100),
   db.from("private_requests").select("id,sender_id,receiver_id,status,created_at").eq("receiver_id",currentUser.id).eq("status","pending").order("created_at",{ascending:false}).limit(100),
   db.from("private_messages").select("id,sender_id,receiver_id,content,message_type,media_url,created_at").eq("receiver_id",currentUser.id).neq("sender_id",currentUser.id).order("created_at",{ascending:false}).limit(100)
  ]);
  if(nRes.error)throw nRes.error;if(rRes.error)throw rRes.error;if(mRes.error)throw mRes.error;
  dbRows=nRes.data||[];requestRows=rRes.data||[];messageRows=mRes.data||[];
  const ids=[...new Set([...requestRows.map(x=>x.sender_id),...messageRows.map(x=>x.sender_id),...dbRows.map(x=>x.sender_id)].filter(Boolean))];peopleById={};
  if(ids.length){const {data,error}=await db.from("profiles").select("id,username,name,avatar_url").in("id",ids);if(error)throw error;(data||[]).forEach(p=>peopleById[p.id]=p)}
  updateCount();
  const items=[...dbRows.map(row=>({kind:"db",row,sort:Date.parse(row.created_at||"")||0})),...requestRows.map(row=>({kind:"request",row,sort:Date.parse(row.created_at||"")||0})),...messageRows.map(row=>({kind:"message",row,sort:Date.parse(row.created_at||"")||0}))].sort((a,b)=>b.sort-a.sort);
  if(!items.length){box.innerHTML='<div class="empty">✨ You are all caught up.<br><br>Likes, comments, follows, private messages and chat requests will appear here when supported by your database setup.</div>';return}
  box.innerHTML=items.map(x=>x.kind==="db"?databaseCard(x.row):x.kind==="request"?requestCard(x.row):messageCard(x.row)).join("");
  box.querySelectorAll("[data-accept]").forEach(b=>b.addEventListener("click",()=>acceptRequest(b.dataset.accept,b)));
  box.querySelectorAll("[data-decline]").forEach(b=>b.addEventListener("click",()=>declineRequest(b.dataset.decline,b)));
  box.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click",()=>openChat(b.dataset.open,b.dataset.type||"request",b.dataset.id||b.dataset.request)));
  box.querySelectorAll("[data-mark-read]").forEach(b=>b.addEventListener("click",()=>markRead(b.dataset.markRead)));
 }catch(e){console.error("ChatZone notification load error:",e);box.innerHTML='<div class="error"><b>Notifications could not load.</b><br><br>'+esc(e?.message||e?.details||String(e)||"Unknown error")+'<br><br><button class="btn open" onclick="loadNotifications()">Try again</button></div>';document.getElementById("status").textContent="Load error"}
 finally{busy=false}
}
async function markRead(id){if(!currentUser)return;const {error}=await db.from("notifications").update({is_read:true,read_at:new Date().toISOString()}).eq("id",id).eq("user_id",currentUser.id);if(error){toast("Could not mark read: "+error.message);return}await loadNotifications()}
async function markAllRead(){if(!currentUser)return;try{const {error}=await db.from("notifications").update({is_read:true,read_at:new Date().toISOString()}).eq("user_id",currentUser.id).eq("is_read",false);if(error)throw error;const seen=getSeen();requestRows.forEach(r=>seen.add("request:"+r.id));messageRows.forEach(m=>seen.add("message:"+m.id));try{localStorage.setItem(seenKey(),JSON.stringify([...seen]))}catch{}toast("All notifications marked as read");await loadNotifications()}catch(e){toast("Could not mark all read: "+e.message)}}
async function acceptRequest(id,button){
 if(!currentUser)return;if(button)button.disabled=true;
 try{
  const {data,error}=await db.from("private_requests").update({status:"accepted"}).eq("id",id).eq("receiver_id",currentUser.id).eq("status","pending").select("id,sender_id,receiver_id,status");
  if(error)throw error;
  if(!data||!data.length)throw new Error("Request not found, already processed, or update permission denied.");
  markSeen("request",id);toast("Request accepted! Both users are now connected.");await loadNotifications();
 }catch(e){console.error("Accept request failed:",e);toast("Accept failed: "+(e.message||"Check Supabase UPDATE policy."));if(button)button.disabled=false}
}
async function declineRequest(id,button){if(!currentUser)return;if(button)button.disabled=true;try{const {data,error}=await db.from("private_requests").update({status:"declined"}).eq("id",id).eq("receiver_id",currentUser.id).eq("status","pending").select("id");if(error)throw error;if(!data||!data.length)throw new Error("Request not found or already processed.");markSeen("request",id);toast("Request declined");await loadNotifications()}catch(e){console.error(e);toast("Decline failed: "+e.message);if(button)button.disabled=false}}
async function init(){
 try{
  try{if(localStorage.getItem("chatzone-theme")==="dark")document.documentElement.dataset.theme="dark"}catch{}
  const {data,error}=await db.auth.getSession();if(error)throw error;currentUser=data.session?.user||null;
  if(!currentUser){document.getElementById("status").textContent="Please log in";document.getElementById("mainContent").innerHTML='<div class="empty">🔐 Please log in to see notifications.<br><br><button class="btn open" onclick="location.href=\'login.html\'">Go to Login</button></div>';return}
  document.getElementById("status").textContent="Loading your notifications...";await loadNotifications();
  channel=db.channel("chatzone-all-notifications-"+currentUser.id)
   .on("postgres_changes",{event:"*",schema:"public",table:"notifications",filter:"user_id=eq."+currentUser.id},()=>loadNotifications())
   .on("postgres_changes",{event:"*",schema:"public",table:"private_messages",filter:"receiver_id=eq."+currentUser.id},()=>loadNotifications())
   .on("postgres_changes",{event:"*",schema:"public",table:"private_requests",filter:"receiver_id=eq."+currentUser.id},()=>loadNotifications())
   .subscribe();
 }catch(e){console.error(e);document.getElementById("mainContent").innerHTML='<div class="error">Could not connect: '+esc(e.message||e)+'</div>'}
}
refreshTimer=setInterval(()=>{if(document.visibilityState==="visible")loadNotifications()},15000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")loadNotifications()});
window.addEventListener("beforeunload",()=>{if(refreshTimer)clearInterval(refreshTimer);if(channel)db.removeChannel(channel)});
init();
</script>
</body>
</html>
