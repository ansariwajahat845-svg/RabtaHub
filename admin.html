
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChatZone Admin 👑</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3efff;font-family:Arial,sans-serif;color:#222}
header{background:linear-gradient(135deg,#6c5ce7,#8e44ad);color:#fff;text-align:center;padding:22px 12px}
header h1{margin:0 0 7px;font-size:24px}
header p{margin:0;font-size:13px}
main{max-width:760px;margin:18px auto;padding:0 12px 30px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:15px;box-shadow:0 4px 14px #33226612}
h2{color:#5935a6;font-size:19px;margin:0 0 13px}
p{line-height:1.5}
label{display:block;font-weight:bold;font-size:13px;margin:10px 0 5px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;font-size:14px;background:white}
textarea{min-height:65px;resize:vertical}
button{border:0;border-radius:9px;padding:11px 13px;color:white;font-weight:bold;font-size:13px;cursor:pointer}
button:disabled{opacity:.5}
.purple{background:#6c5ce7}.red{background:#d63031}.green{background:#218c54}.gray{background:#777}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.status{background:#f5f2ff;padding:11px;border-radius:9px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.muted{font-size:12px;color:#777;line-height:1.6;overflow-wrap:anywhere}
.item{border:1px solid #e8e2f5;border-radius:10px;padding:12px;margin-top:10px;overflow-wrap:anywhere}
.item strong{font-size:15px}
.hidden{display:none!important}
.tag{display:inline-block;background:#eee7ff;color:#5935a6;padding:4px 8px;border-radius:20px;font-size:11px;margin-top:5px}
footer{text-align:center;color:#777;font-size:12px;padding:15px}
</style>
</head>
<body>
<header>
  <h1>👑 ChatZone Admin</h1>
  <p>Creator Dashboard • Member Management • Ban System</p>
</header>

<main>
  <section class="card">
    <h2>🔐 Admin Verification</h2>
    <div id="authStatus" class="status">Checking account...</div>
    <div class="actions">
      <button class="purple" id="refreshAccess">🔄 Verify Again</button>
      <button class="red" id="logoutBtn">Logout</button>
    </div>
  </section>

  <div id="dashboard" class="hidden">
    <section class="card">
      <h2>🔎 Search Members</h2>
      <p class="muted">Username ya display name se search karein.</p>
      <form id="searchForm">
        <input id="searchInput" placeholder="Username ya name..." required minlength="2">
        <div class="actions">
          <button class="purple" type="submit">Search</button>
        </div>
      </form>
      <p id="searchStatus" class="muted"></p>
      <div id="searchResults"></div>
    </section>

    <section class="card">
      <h2>🚫 Active Bans</h2>
      <p class="muted">Active temporary aur permanent ban records.</p>
      <button class="purple" id="refreshBans">🔄 Refresh Bans</button>
      <p id="banStatus" class="muted"></p>
      <div id="banList"></div>
    </section>

    <section class="card">
      <h2>🛡️ Admin Management</h2>
      <p class="muted" id="adminHelp">Admin roles ki list.</p>
      <button class="purple" id="refreshAdmins">🔄 Refresh Admins</button>
      <p id="adminStatus" class="muted"></p>
      <div id="adminList"></div>
    </section>
  </div>
</main>

<footer>ChatZone 💬</footer>

<script>
"use strict";

const SUPABASE_URL = "https://jhcpqjmxiovvqbghpxbf.supabase.co";
const SUPABASE_KEY = "sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";
const CREATOR_ID = "db4d3669-e3ec-42ec-a716-791f43cebd8d";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true
  }
});

let currentUser = null;
let currentRole = null;
let accessGranted = false;
let checkingAccess = false;

const el = id => document.getElementById(id);

function safe(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[c]);
}

function status(id, message) {
  el(id).textContent = message;
}

function dateText(value) {
  if (!value) return "Permanent";
  const d = new Date(value);
  return Number.isNaN(d.getTime()) ? String(value) : d.toLocaleString();
}

function remainingText(value) {
  if (!value) return "Permanent ban";
  const ms = new Date(value).getTime() - Date.now();
  if (!Number.isFinite(ms)) return "Expiry unavailable";
  if (ms <= 0) return "Expired";
  const hours = Math.ceil(ms / 3600000);
  return hours < 24
    ? hours + " hour(s) remaining"
    : Math.ceil(hours / 24) + " day(s) remaining";
}

/* Creator ya registered admin ki verification */
async function verifyAccess() {
  if (checkingAccess) return accessGranted;
  checkingAccess = true;
  accessGranted = false;
  currentRole = null;
  el("dashboard").classList.add("hidden");
  status("authStatus", "Checking login and admin role...");

  try {
    const { data, error } = await db.auth.getSession();
    if (error) throw error;

    const user = data.session?.user;
    if (!user) {
      currentUser = null;
      status("authStatus", "Login required. Pehle ChatZone mein login karein.");
      return false;
    }

    currentUser = user;

    if (user.id === CREATOR_ID) {
      const { data: roles, error: roleError } = await db
        .from("user_roles")
        .select("role")
        .eq("user_id", user.id);

      if (roleError) throw roleError;

      if (!(roles || []).some(
        r => String(r.role || "").toLowerCase() === "creator"
      )) {
        status("authStatus", "Creator role user_roles mein verify nahi hua.");
        return false;
      }

      currentRole = "creator";
    } else {
      const { data: admin, error: adminError } = await db
        .from("chatzone_admins")
        .select("role")
        .eq("user_id", user.id)
        .maybeSingle();

      if (adminError) throw adminError;

      const role = String(admin?.role || "").toLowerCase();
      if (!["senior_admin", "admin"].includes(role)) {
        status(
          "authStatus",
          "⛔ Access denied. Yeh Creator ya registered Admin account nahi hai."
        );
        return false;
      }

      currentRole = role;
    }

    accessGranted = true;

    const roleLabel = currentRole === "creator"
      ? "👑 Creator"
      : currentRole === "senior_admin"
        ? "🛡️ Senior Admin"
        : "🔰 Admin";

    status(
      "authStatus",
      "✅ Access verified: " + roleLabel + "\nUser ID: " + user.id
    );

    el("dashboard").classList.remove("hidden");

    el("adminHelp").textContent = currentRole === "creator"
      ? "Aap Admin aur Senior Admin assign/remove kar sakte hain."
      : "Admin list dekh sakte hain. Role assign/remove sirf Creator kar sakta hai.";

    await Promise.allSettled([loadBans(), loadAdmins()]);
    return true;
  } catch (error) {
    status("authStatus", "Verification error: " + (error.message || error));
    return false;
  } finally {
    checkingAccess = false;
  }
}

/* Har sensitive operation se pehle current access dobara check karein */
async function ensureAuthorized() {
  const { data, error } = await db.auth.getSession();
  if (error) throw error;

  const user = data.session?.user;
  if (!user || !currentUser || user.id !== currentUser.id) {
    accessGranted = false;
    throw new Error("Session expired. Please login again.");
  }

  if (user.id === CREATOR_ID) {
    if (currentRole !== "creator" || !accessGranted) {
      throw new Error("Please verify Creator access again.");
    }
    return;
  }

  const { data: admin, error: adminError } = await db
    .from("chatzone_admins")
    .select("role")
    .eq("user_id", user.id)
    .maybeSingle();

  if (adminError) throw adminError;

  const role = String(admin?.role || "").toLowerCase();
  if (!["senior_admin", "admin"].includes(role)) {
    accessGranted = false;
    throw new Error("Admin permission nahi mili. Verify Again karein.");
  }

  currentRole = role;
  accessGranted = true;
}

async function ensureCreator() {
  await ensureAuthorized();
  if (currentUser?.id !== CREATOR_ID || currentRole !== "creator") {
    throw new Error("Yeh action sirf Creator kar sakta hai.");
  }
}

el("refreshAccess").addEventListener("click", verifyAccess);

el("logoutBtn").addEventListener("click", async () => {
  accessGranted = false;
  try {
    const { error } = await db.auth.signOut();
    if (error) throw error;
  } catch (error) {
    alert("Logout error: " + (error.message || error));
  }
  location.href = "login.html";
});

/* Member search */
el("searchForm").addEventListener("submit", async event => {
  event.preventDefault();
  try {
    await ensureAuthorized();
    await searchMembers();
  } catch (error) {
    status("searchStatus", error.message || String(error));
  }
});

async function searchMembers() {
  const term = el("searchInput").value.trim();
  if (term.length < 2) {
    status("searchStatus", "Kam az kam 2 characters likhein.");
    return;
  }

  status("searchStatus", "Searching...");
  el("searchResults").replaceChildren();

  try {
    await ensureAuthorized();

    const { data, error } = await db
      .from("profiles")
      .select("id,username,name")
      .or("username.ilike.%"+term+"%,name.ilike.%"+term+"%")
      .limit(20);

    if (error) throw error;

    if (!data?.length) {
      status("searchStatus", "Member nahi mila ya Profiles SELECT permission nahi hai.");
      return;
    }

    status("searchStatus", data.length + " member(s) found.");

    data.forEach(member => {
      const isCreator = member.id === CREATOR_ID;
      const item = document.createElement("div");
      item.className = "item";

      item.innerHTML = `
        <strong>${safe(member.name || member.username || "Member")}</strong>
        <div class="muted">@${safe(member.username || "unknown")}</div>
        <div class="muted">ID: ${safe(member.id)}</div>
        ${isCreator ? '<span class="tag">👑 Creator</span>' : ""}
        <div class="actions">
          <button class="red" data-open-ban ${isCreator ? "disabled" : ""}>🚫 Ban Member</button>
          ${currentRole === "creator" && !isCreator
            ? '<button class="green" data-assign-admin>🛡️ Assign Admin</button>'
            : ""}
        </div>
        <div class="ban-form hidden">
          <label>Ban Duration</label>
          <select data-duration>
            <option value="3600000">1 Hour</option>
            <option value="86400000">24 Hours</option>
            <option value="604800000">7 Days</option>
            <option value="2592000000">30 Days</option>
            <option value="permanent">Permanent</option>
          </select>
          <label>Ban Reason</label>
          <textarea data-reason maxlength="500" placeholder="Ban ki wajah likhein..."></textarea>
          <div class="actions">
            <button class="red" data-confirm-ban>Confirm Ban</button>
            <button class="gray" data-cancel-ban>Cancel</button>
          </div>
        </div>
        ${currentRole === "creator" && !isCreator ? `
          <div class="admin-form hidden">
            <label>Admin Role</label>
            <select data-admin-role>
              <option value="admin">Admin</option>
              <option value="senior_admin">Senior Admin</option>
            </select>
            <div class="actions">
              <button class="green" data-confirm-admin>Confirm Role</button>
              <button class="gray" data-cancel-admin>Cancel</button>
            </div>
          </div>` : ""}
      `;

      item.querySelector("[data-open-ban]").addEventListener("click", () => {
        item.querySelector(".ban-form").classList.remove("hidden");
      });

      item.querySelector("[data-cancel-ban]").addEventListener("click", () => {
        item.querySelector(".ban-form").classList.add("hidden");
      });

      const assignBtn = item.querySelector("[data-assign-admin]");
      if (assignBtn) {
        assignBtn.addEventListener("click", () => {
          item.querySelector(".admin-form").classList.remove("hidden");
        });

        item.querySelector("[data-cancel-admin]").addEventListener("click", () => {
          item.querySelector(".admin-form").classList.add("hidden");
        });

        item.querySelector("[data-confirm-admin]").addEventListener("click", async event => {
          const role = item.querySelector("[data-admin-role]").value;
          if (!confirm("Is member ko " + role + " assign karna hai?")) return;

          const button = event.currentTarget;
          button.disabled = true;

          try {
            await ensureCreator();
            const { error } = await db.rpc("assign_chatzone_admin", {
              target_user_id: member.id,
              target_role: role
            });
            if (error) throw error;

            alert("Admin role assign ho gaya.");
            item.querySelector(".admin-form").classList.add("hidden");
            await loadAdmins();
          } catch (error) {
            alert("Admin assign error: " + (error.message || error));
          } finally {
            button.disabled = false;
          }
        });
      }

      item.querySelector("[data-confirm-ban]").addEventListener("click", async event => {
        const reason = item.querySelector("[data-reason]").value.trim();
        const duration = item.querySelector("[data-duration]").value;

        if (!reason) {
          alert("Ban reason likhna zaroori hai.");
          return;
        }
        if (!confirm("Kya aap is account ko ban karna chahte hain?")) return;

        const button = event.currentTarget;
        button.disabled = true;

        try {
          await ensureAuthorized();

          const banUntil = duration === "permanent"
            ? null
            : new Date(Date.now() + Number(duration)).toISOString();

          const { error } = await db.rpc("chatzone_ban_user", {
            target_user_id: member.id,
            ban_reason: reason,
            ban_until: banUntil
          });
          if (error) throw error;

          alert("Ban record save ho gaya.");
          item.querySelector(".ban-form").classList.add("hidden");
          await loadBans();
        } catch (error) {
          alert("Ban error: " + (error.message || error));
        } finally {
          button.disabled = false;
        }
      });

      el("searchResults").appendChild(item);
    });
  } catch (error) {
    status("searchStatus", "Search error: " + (error.message || error));
  }
}

/* Active bans */
el("refreshBans").addEventListener("click", loadBans);

async function loadBans() {
  if (!accessGranted) return;
  status("banStatus", "Loading bans...");
  el("banList").replaceChildren();

  try {
    await ensureAuthorized();

    const { data, error } = await db.rpc("chatzone_list_active_bans");
    if (error) throw error;

    const bans = data || [];
    if (!bans.length) {
      status("banStatus", "Koi active ban nahi mila.");
      return;
    }

    status("banStatus", bans.length + " active ban(s).");

    bans.forEach(ban => {
      const item = document.createElement("div");
      item.className = "item";
      item.innerHTML = `
        <strong>@${safe(ban.username || "unknown")}</strong>
        <div class="muted">${safe(ban.name || "")}</div>
        <div class="muted">User ID: ${safe(ban.user_id)}</div>
        <div class="muted">Reason: ${safe(ban.reason || "Not specified")}</div>
        <div class="muted">Banned: ${safe(dateText(ban.banned_at))}</div>
        <div class="muted">Expires: ${safe(dateText(ban.expires_at))}</div>
        <span class="tag">${safe(remainingText(ban.expires_at))}</span>
        <div class="actions"><button class="green" data-unban>✅ Unban</button></div>
      `;

      item.querySelector("[data-unban]").addEventListener("click", async event => {
        if (!confirm("Is account ka ban remove karna hai?")) return;

        const button = event.currentTarget;
        button.disabled = true;

        try {
          await ensureAuthorized();

          const { error } = await db.rpc("chatzone_unban_user", {
            target_user_id: ban.user_id
          });
          if (error) throw error;

          alert("Unban successful.");
          await loadBans();
        } catch (error) {
          alert("Unban error: " + (error.message || error));
        } finally {
          button.disabled = false;
        }
      });

      el("banList").appendChild(item);
    });
  } catch (error) {
    status("banStatus", "Ban list error: " + (error.message || error));
  }
}

/* Admin list: role removal Creator-only */
el("refreshAdmins").addEventListener("click", loadAdmins);

async function loadAdmins() {
  if (!accessGranted) return;
  status("adminStatus", "Loading admins...");
  el("adminList").replaceChildren();

  try {
    await ensureAuthorized();

    const { data, error } = await db
      .from("chatzone_admins")
      .select("user_id,role,assigned_by,created_at")
      .order("created_at", { ascending: false });

    if (error) throw error;

    const admins = data || [];
    if (!admins.length) {
      status("adminStatus", "Koi admin assigned nahi hai.");
      return;
    }

    status("adminStatus", admins.length + " admin(s).");

    for (const admin of admins) {
      const { data: profile, error: profileError } = await db
        .from("profiles")
        .select("username,name")
        .eq("id", admin.user_id)
        .maybeSingle();

      if (profileError) console.warn(profileError.message);

      const item = document.createElement("div");
      item.className = "item";
      item.innerHTML = `
        <strong>${safe(profile?.name || profile?.username || "ChatZone Member")}</strong>
        <div class="muted">@${safe(profile?.username || "unknown")}</div>
        <div class="muted">Role: ${safe(admin.role)}</div>
        <div class="muted">ID: ${safe(admin.user_id)}</div>
        <div class="muted">Assigned: ${safe(dateText(admin.created_at))}</div>
        ${currentRole === "creator"
          ? '<div class="actions"><button class="red" data-remove-admin>Remove Admin</button></div>'
          : '<span class="tag">View only</span>'}
      `;

      const removeBtn = item.querySelector("[data-remove-admin]");
      if (removeBtn) {
        removeBtn.addEventListener("click", async event => {
          if (!confirm("Is admin ka role remove karna hai?")) return;

          const button = event.currentTarget;
          button.disabled = true;

          try {
            await ensureCreator();

            const { error } = await db.rpc("remove_chatzone_admin", {
              target_user_id: admin.user_id
            });
            if (error) throw error;

            alert("Admin role remove ho gaya.");
            await loadAdmins();
          } catch (error) {
            alert("Remove error: " + (error.message || error));
          } finally {
            button.disabled = false;
          }
        });
      }

      el("adminList").appendChild(item);
    }
  } catch (error) {
    status("adminStatus", "Admin list error: " + (error.message || error));
  }
}

db.auth.onAuthStateChange((event) => {
  if (event === "SIGNED_OUT") {
    accessGranted = false;
    currentUser = null;
    currentRole = null;
    el("dashboard").classList.add("hidden");
    status("authStatus", "Signed out. Please login again.");
  } else if (event === "SIGNED_IN") {
    setTimeout(() => verifyAccess(), 0);
  }
});

verifyAccess();
</script>
</body>
</html>
