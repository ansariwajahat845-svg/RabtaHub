<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Profile - ChatZone 💬</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
}

body{
  padding-bottom:78px;
}

.app{
  width:100%;
  max-width:680px;
  margin:auto;
  min-height:100vh;
}

/* HEADER */
.header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(108,92,231,.98);
  color:white;
  padding:15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 2px 10px rgba(0,0,0,.18);
}

.header-title{
  font-size:20px;
  font-weight:bold;
}

.back-btn{
  border:0;
  background:rgba(255,255,255,.18);
  color:white;
  border-radius:10px;
  padding:9px 12px;
}

/* PROFILE CARD */
.profile-card{
  margin:15px;
  background:white;
  border-radius:20px;
  padding:20px;
  box-shadow:0 5px 18px rgba(0,0,0,.18);
}

.profile-top{
  text-align:center;
}

/* LARGE DP */
.avatar-wrap{
  position:relative;
  width:220px;
  height:260px;
  margin:0 auto 15px;
}

.avatar{
  width:220px;
  height:260px;
  border-radius:20px;
  object-fit:cover;
  border:4px solid #6c5ce7;
  background:#eee;
  display:block;
}

.online-dot{
  position:absolute;
  right:4px;
  bottom:7px;
  width:21px;
  height:21px;
  border-radius:50%;
  background:#20c997;
  border:3px solid white;
}

.name{
  font-size:23px;
  font-weight:bold;
}

.username{
  color:#777;
  margin-top:4px;
}

.bio{
  margin:12px auto 0;
  color:#555;
  line-height:1.5;
  white-space:pre-wrap;
}

.badge{
  display:inline-block;
  margin-top:10px;
  padding:7px 13px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
}

.public-badge{
  background:#e8f8ef;
  color:#16834b;
}

.private-badge{
  background:#f0ecff;
  color:#6046c7;
}

/* ACTIONS */
.actions{
  display:flex;
  gap:8px;
  margin-top:18px;
}

.action-btn{
  flex:1;
  border:0;
  border-radius:12px;
  padding:12px 7px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

.edit-btn{
  background:#6c5ce7;
  color:white;
}

.follow-btn{
  background:#6c5ce7;
  color:white;
}

.chat-btn{
  background:#eeeaff;
  color:#5b43c7;
}

/* STATS */
.stats{
  display:flex;
  justify-content:space-around;
  margin-top:20px;
  padding-top:18px;
  border-top:1px solid #eee;
}

.stat{
  text-align:center;
}

.stat-number{
  font-size:19px;
  font-weight:bold;
}

.stat-label{
  color:#777;
  font-size:12px;
  margin-top:3px;
}

/* INFO */
.info-card{
  margin-top:15px;
  background:#fafafa;
  border-radius:15px;
  padding:15px;
}

.info-row{
  display:flex;
  gap:10px;
  padding:9px 0;
  border-bottom:1px solid #eee;
}

.info-row:last-child{
  border-bottom:0;
}

.info-icon{
  width:25px;
}

.info-label{
  color:#777;
  font-size:12px;
}

.info-value{
  font-size:14px;
  margin-top:2px;
}

/* EDIT */
.edit-panel{
  display:none;
  margin-top:15px;
  background:#fafafa;
  border-radius:15px;
  padding:15px;
}

.edit-dp{
  text-align:center;
  margin-bottom:15px;
}

.edit-preview{
  width:150px;
  height:180px;
  border-radius:18px;
  object-fit:cover;
  border:3px solid #6c5ce7;
  background:#eee;
}

.file-input{
  display:block;
  width:100%;
  margin-top:10px;
  padding:10px;
  border:1px solid #ddd;
  border-radius:10px;
  background:white;
}

.input{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:14px;
  outline:none;
  background:white;
}

textarea.input{
  min-height:90px;
  resize:vertical;
}

.save-btn{
  width:100%;
  padding:12px;
  border:0;
  border-radius:11px;
  background:#6c5ce7;
  color:white;
  font-weight:bold;
}

.cancel-btn{
  width:100%;
  padding:11px;
  margin-top:8px;
  border:0;
  border-radius:11px;
  background:#eee;
}

/* PRIVATE */
.private-box{
  margin:15px;
  background:white;
  border-radius:18px;
  padding:30px 20px;
  text-align:center;
  box-shadow:0 5px 18px rgba(0,0,0,.16);
}

.private-icon{
  font-size:48px;
}

.private-title{
  font-size:20px;
  font-weight:bold;
  margin-top:10px;
}

.private-text{
  color:#777;
  margin-top:8px;
}

/* POSTS */
.section-title{
  margin:18px 15px 10px;
  color:white;
  font-size:18px;
  font-weight:bold;
}

.post-card{
  margin:10px 15px;
  background:white;
  border-radius:16px;
  padding:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.post-date{
  color:#888;
  font-size:12px;
  margin-top:8px;
}

.post-image{
  width:100%;
  max-height:400px;
  object-fit:cover;
  border-radius:12px;
  margin-top:10px;
}

/* LOADING */
.loading{
  color:white;
  text-align:center;
  padding:40px 15px;
}

.error{
  margin:15px;
  background:white;
  color:#d63031;
  padding:15px;
  border-radius:12px;
}

/* NAV */
.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:50;
  height:68px;
  background:white;
  display:flex;
  justify-content:center;
  box-shadow:0 -3px 15px rgba(0,0,0,.18);
}

.nav-inner{
  width:100%;
  max-width:680px;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-item{
  flex:1;
  text-align:center;
  color:#777;
  font-size:11px;
  padding:8px 2px;
  cursor:pointer;
}

.nav-item .icon{
  display:block;
  font-size:21px;
  margin-bottom:3px;
}

.nav-item.active{
  color:#6c5ce7;
  font-weight:bold;
}

/* MOBILE */
@media(max-width:400px){

  .avatar-wrap{
    width:200px;
    height:240px;
  }

  .avatar{
    width:200px;
    height:240px;
  }

}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="header-title">👤 Profile</div>
    <button class="back-btn" onclick="goBack()">← Back</button>
  </div>

  <div id="loading" class="loading">
    Profile load ho rahi hai...
  </div>

  <div id="errorBox" class="error" style="display:none;"></div>

  <div id="profileArea" style="display:none;">

    <div class="profile-card">

      <div class="profile-top">

        <div class="avatar-wrap">

          <img
            id="avatar"
            class="avatar"
            src="https://via.placeholder.com/220x260?text=User"
            onerror="this.src='https://via.placeholder.com/220x260?text=User'"
          >

          <div
            id="onlineDot"
            class="online-dot"
            style="display:none;">
          </div>

        </div>

        <div id="name" class="name">
          User
        </div>

        <div id="username" class="username">
          @user
        </div>

        <div id="bio" class="bio"></div>

        <div id="privacyBadge"></div>

        <div class="actions">

          <button
            id="editBtn"
            class="action-btn edit-btn"
            onclick="toggleEdit()">
            ✏️ Edit Profile
          </button>

          <button
            id="followBtn"
            class="action-btn follow-btn"
            style="display:none;"
            onclick="toggleFollow()">
            ➕ Follow
          </button>

          <button
            id="chatBtn"
            class="action-btn chat-btn"
            style="display:none;"
            onclick="openPrivateChat()">
            💬 1-on-1
          </button>

        </div>

      </div>

      <div id="stats" class="stats">

        <div class="stat">
          <div id="postCount" class="stat-number">0</div>
          <div class="stat-label">Posts</div>
        </div>

        <div class="stat">
          <div id="followersCount" class="stat-number">0</div>
          <div class="stat-label">Followers</div>
        </div>

        <div class="stat">
          <div id="followingCount" class="stat-number">0</div>
          <div class="stat-label">Following</div>
        </div>

      </div>

      <div id="infoCard" class="info-card">

        <div class="info-row">
          <div class="info-icon">🏙️</div>
          <div>
            <div class="info-label">City</div>
            <div id="city" class="info-value">
              Not added
            </div>
          </div>
        </div>

        <div class="info-row">
          <div class="info-icon">🎂</div>
          <div>
            <div class="info-label">Date of Birth</div>
            <div id="dob" class="info-value">
              Not added
            </div>
          </div>
        </div>

        <div class="info-row">
          <div class="info-icon">⚧️</div>
          <div>
            <div class="info-label">Gender</div>
            <div id="gender" class="info-value">
              Not added
            </div>
          </div>
        </div>

      </div>

      <!-- EDIT PROFILE -->

      <div id="editPanel" class="edit-panel">

        <div class="edit-dp">

          <img
            id="editPreview"
            class="edit-preview"
            src="https://via.placeholder.com/150x180?text=User"
          >

          <input
            id="avatarFile"
            class="file-input"
            type="file"
            accept="image/*"
            onchange="previewDP(event)"
          >

        </div>

        <input
          id="editName"
          class="input"
          placeholder="Your name"
        >

        <textarea
          id="editBio"
          class="input"
          maxlength="250"
          placeholder="📝 Write your bio..."
        ></textarea>

        <input
          id="editCity"
          class="input"
          placeholder="🏙️ City"
        >

        <label style="display:block;font-size:12px;color:#777;margin-bottom:5px;">
          🎂 Date of Birth
        </label>

        <input
          id="editDob"
          class="input"
          type="date"
        >

        <select id="editGender" class="input">

          <option value="">
            ⚧️ Select gender
          </option>

          <option value="Male">
            Male
          </option>

          <option value="Female">
            Female
          </option>

          <option value="Other">
            Other
          </option>

        </select>

        <select id="editPrivacy" class="input">

          <option value="public">
            🌐 Public
          </option>

          <option value="private">
            🔒 Private
          </option>

        </select>

        <button
          class="save-btn"
          onclick="saveProfile()">
          💾 Save Profile
        </button>

        <button
          class="cancel-btn"
          onclick="toggleEdit()">
          Cancel
        </button>

      </div>

    </div>


    <!-- PRIVATE PROFILE -->

    <div
      id="privateBox"
      class="private-box"
      style="display:none;">

      <div class="private-icon">
        🔒
      </div>

      <div class="private-title">
        Private Profile
      </div>

      <div class="private-text">
        Is profile ko owner ne private rakha hai.
      </div>

    </div>


    <!-- POSTS -->

    <div id="postsSection">

      <div class="section-title">
        📝 Posts
      </div>

      <div id="postsList"></div>

    </div>

  </div>

</div>


<!-- BOTTOM NAV -->

<div class="bottom-nav">

  <div class="nav-inner">

    <div class="nav-item" onclick="goHome()">
      <span class="icon">🏠</span>
      Home
    </div>

    <div class="nav-item" onclick="goPrivate()">
      <span class="icon">💬</span>
      Private
    </div>

    <div class="nav-item" onclick="goMehfil()">
      <span class="icon">👥</span>
      Mehfil
    </div>

    <div class="nav-item active">
      <span class="icon">👤</span>
      Profile
    </div>

    <div class="nav-item" onclick="goMore()">
      <span class="icon">☰</span>
      More
    </div>

  </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://jhcpqjmxiovvqbghpxbf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:false
    }
  }
);


let currentUser=null;
let profileUser=null;
let isOwner=false;
let isPrivate=false;
let isFollowing=false;


/* =========================
   INIT
========================= */

async function init(){

  try{

    const {data,error} =
      await supabaseClient.auth.getSession();

    if(error) throw error;

    currentUser =
      data.session?.user || null;

    if(!currentUser){

      window.location.href="login.html";
      return;

    }

    const params =
      new URLSearchParams(
        window.location.search
      );

    const profileId =
      params.get("user");

    await loadProfile(
      profileId || currentUser.id
    );

  }catch(error){

    showError(
      "Profile load nahi ho saki: " +
      error.message
    );

  }

}


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(userId){

  const {data,error} =
    await supabaseClient
    .from("profiles")
    .select(`
      id,
      username,
      name,
      avatar_url,
      profile_privacy,
      bio,
      city,
      dob,
      gender
    `)
    .eq("id",userId)
    .maybeSingle();

  if(error) throw error;

  if(!data){

    showError("Profile nahi mili.");
    return;

  }

  profileUser=data;

  isOwner =
    currentUser.id===data.id;

  isPrivate =
    String(
      data.profile_privacy || "public"
    ).toLowerCase()==="private";

  renderProfile();


  if(!isOwner){

    document.getElementById("followBtn")
      .style.display="block";

    document.getElementById("chatBtn")
      .style.display="block";

    await loadFollowStatus();

  }


  if(isOwner || !isPrivate){

    await loadStats();
    await loadPosts();

  }else{

    document.getElementById("stats")
      .style.display="none";

    document.getElementById("infoCard")
      .style.display="none";

    document.getElementById("postsSection")
      .style.display="none";

    document.getElementById("privateBox")
      .style.display="block";

  }


  document.getElementById("loading")
    .style.display="none";

  document.getElementById("profileArea")
    .style.display="block";

}


/* =========================
   RENDER PROFILE
========================= */

function renderProfile(){

  document.getElementById("name")
    .textContent =
    profileUser.name ||
    profileUser.username ||
    "User";


  document.getElementById("username")
    .textContent =
    "@" +
    (
      profileUser.username ||
      "user"
    );


  document.getElementById("avatar").src =
    profileUser.avatar_url ||
    "https://via.placeholder.com/220x260?text=User";


  document.getElementById("bio")
    .textContent =
    profileUser.bio || "";


  document.getElementById("city")
    .textContent =
    profileUser.city ||
    "Not added";


  document.getElementById("dob")
    .textContent =
    profileUser.dob ||
    "Not added";


  document.getElementById("gender")
    .textContent =
    profileUser.gender ||
    "Not added";


  if(isPrivate){

    document.getElementById(
      "privacyBadge"
    ).innerHTML=
      `<span class="badge private-badge">
        🔒 Private
      </span>`;

  }else{

    document.getElementById(
      "privacyBadge"
    ).innerHTML=
      `<span class="badge public-badge">
        🌐 Public
      </span>`;

  }


  if(isOwner){

    document.getElementById("editBtn")
      .style.display="block";

    document.getElementById("followBtn")
      .style.display="none";

    document.getElementById("chatBtn")
      .style.display="none";

  }else{

    document.getElementById("editBtn")
      .style.display="none";

    document.getElementById("followBtn")
      .style.display="block";

    document.getElementById("chatBtn")
      .style.display="block";

  }

}


/* =========================
   EDIT
========================= */

function toggleEdit(){

  const panel =
    document.getElementById("editPanel");


  if(panel.style.display==="block"){

    panel.style.display="none";
    return;

  }


  document.getElementById("editName").value =
    profileUser.name || "";


  document.getElementById("editBio").value =
    profileUser.bio || "";


  document.getElementById("editCity").value =
    profileUser.city || "";


  document.getElementById("editDob").value =
    profileUser.dob || "";


  document.getElementById("editGender").value =
    profileUser.gender || "";


  document.getElementById("editPrivacy").value =
    isPrivate ?
    "private" :
    "public";


  document.getElementById("editPreview").src =
    profileUser.avatar_url ||
    "https://via.placeholder.com/150x180?text=User";


  panel.style.display="block";

}


/* =========================
   DP PREVIEW
========================= */

function previewDP(event){

  const file =
    event.target.files[0];

  if(!file) return;


  if(!file.type.startsWith("image/")){

    alert(
      "Sirf image select karein."
    );

    event.target.value="";
    return;

  }


  const reader =
    new FileReader();


  reader.onload=function(e){

    document.getElementById(
      "editPreview"
    ).src=e.target.result;

  };


  reader.readAsDataURL(file);

}


/* =========================
   SAVE PROFILE
========================= */

async function saveProfile(){

  try{

    const saveBtn =
      document.querySelector(
        ".save-btn"
      );

    saveBtn.disabled=true;
    saveBtn.textContent="Saving...";


    let avatarUrl =
      profileUser.avatar_url ||
      null;


    const fileInput =
      document.getElementById(
        "avatarFile"
      );

    const file =
      fileInput.files[0];


    if(file){

      const extension =
        file.name
        .split(".")
        .pop()
        .toLowerCase();


      const fileName =
        currentUser.id +
        "_" +
        Date.now() +
        "." +
        extension;


      const upload =
        await supabaseClient
        .storage
        .from("avatars")
        .upload(
          fileName,
          file,
          {
            upsert:true,
            contentType:file.type
          }
        );


      if(upload.error){

        throw new Error(
          "DP upload nahi hui: " +
          upload.error.message
        );

      }


      const publicData =
        supabaseClient
        .storage
        .from("avatars")
        .getPublicUrl(
          fileName
        );


      avatarUrl =
        publicData.data.publicUrl;

    }


    const name =
      document.getElementById(
        "editName"
      ).value.trim();


    const bio =
      document.getElementById(
        "editBio"
      ).value.trim();


    const city =
      document.getElementById(
        "editCity"
      ).value.trim();


    const dob =
      document.getElementById(
        "editDob"
      ).value;


    const gender =
      document.getElementById(
        "editGender"
      ).value;


    const privacy =
      document.getElementById(
        "editPrivacy"
      ).value;


    const {data,error} =
      await supabaseClient
      .from("profiles")
      .update({
        name:name || null,
        bio:bio || null,
        city:city || null,
        dob:dob || null,
        gender:gender || null,
        profile_privacy:privacy,
        avatar_url:avatarUrl
      })
      .eq(
        "id",
        currentUser.id
      )
      .select()
      .maybeSingle();


    if(error) throw error;


    profileUser =
      data || {
        ...profileUser,
        name:name || null,
        bio:bio || null,
        city:city || null,
        dob:dob || null,
        gender:gender || null,
        profile_privacy:privacy,
        avatar_url:avatarUrl
      };


    isPrivate =
      privacy==="private";


    renderProfile();


    document.getElementById(
      "editPanel"
    ).style.display="none";


    document.getElementById("stats")
      .style.display="flex";

    document.getElementById("infoCard")
      .style.display="block";

    document.getElementById("postsSection")
      .style.display="block";

    document.getElementById("privateBox")
      .style.display="none";


    await loadStats();
    await loadPosts();


    alert(
      "✅ Profile updated successfully!"
    );


  }catch(error){

    alert(
      "Profile save nahi hui:\n" +
      error.message
    );


  }finally{

    const saveBtn =
      document.querySelector(
        ".save-btn"
      );

    saveBtn.disabled=false;

    saveBtn.textContent=
      "💾 Save Profile";

  }

}


/* =========================
   FOLLOW
========================= */

async function loadFollowStatus(){

  const {data,error} =
    await supabaseClient
    .from("user_follows")
    .select("id")
    .eq(
      "follower_id",
      currentUser.id
    )
    .eq(
      "following_id",
      profileUser.id
    )
    .maybeSingle();


  if(!error){

    isFollowing=!!data;

    updateFollowButton();

  }

}


function updateFollowButton(){

  const btn =
    document.getElementById(
      "followBtn"
    );


  btn.textContent =
    isFollowing ?
    "✓ Following" :
    "➕ Follow";

}


async function toggleFollow(){

  if(!profileUser || isOwner)
    return;


  if(isFollowing){

    const {error} =
      await supabaseClient
      .from("user_follows")
      .delete()
      .eq(
        "follower_id",
        currentUser.id
      )
      .eq(
        "following_id",
        profileUser.id
      );


    if(error){

      alert(
        "Unfollow nahi ho saka:\n" +
        error.message
      );

      return;

    }


    isFollowing=false;


  }else{

    const {error} =
      await supabaseClient
      .from("user_follows")
      .insert({
        follower_id:
          currentUser.id,
        following_id:
          profileUser.id
      });


    if(error){

      alert(
        "Follow nahi ho saka:\n" +
        error.message
      );

      return;

    }


    isFollowing=true;

  }


  updateFollowButton();

  await loadStats();

}


/* =========================
   STATS
========================= */

async function loadStats(){

  const posts =
    await supabaseClient
    .from("posts")
    .select(
      "id",
      {
        count:"exact",
        head:true
      }
    )
    .eq(
      "user_id",
      profileUser.id
    );


  if(!posts.error){

    document.getElementById(
      "postCount"
    ).textContent =
      posts.count || 0;

  }


  const followers =
    await supabaseClient
    .from("user_follows")
    .select(
      "id",
      {
        count:"exact",
        head:true
      }
    )
    .eq(
      "following_id",
      profileUser.id
    );


  if(!followers.error){

    document.getElementById(
      "followersCount"
    ).textContent =
      followers.count || 0;

  }


  const following =
    await supabaseClient
    .from("user_follows")
    .select(
      "id",
      {
        count:"exact",
        head:true
      }
    )
    .eq(
      "follower_id",
      profileUser.id
    );


  if(!following.error){

    document.getElementById(
      "followingCount"
    ).textContent =
      following.count || 0;

  }

}


/* =========================
   POSTS
========================= */

async function loadPosts(){

  const {data,error} =
    await supabaseClient
    .from("posts")
    .select(`
      id,
      content,
      created_at,
      image_url
    `)
    .eq(
      "user_id",
      profileUser.id
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    document.getElementById(
      "postsList"
    ).innerHTML=
      `<div class="post-card">
        Posts load nahi ho sakin.
      </div>`;

    return;

  }


  const list =
    document.getElementById(
      "postsList"
    );


  if(!data || data.length===0){

    list.innerHTML=
      `<div class="post-card">
        Abhi koi post nahi hai.
      </div>`;

    return;

  }


  list.innerHTML =
    data.map(post=>{

      let image="";


      if(post.image_url){

        image=
          `<img
            class="post-image"
            src="${escapeHtml(
              post.image_url
            )}"
            onerror="this.style.display='none'"
          >`;

      }


      return `
        <div class="post-card">

          <div>
            ${escapeHtml(
              post.content || ""
            )}
          </div>

          ${image}

          <div class="post-date">
            ${formatDate(
              post.created_at
            )}
          </div>

        </div>
      `;

    }).join("");

}

/* =========================
   HELPERS
========================= */

function formatDate(date){

  if(!date) return "";

  const d=new Date(date);

  const now=new Date();

  const seconds =
    Math.floor(
      (now-d)/1000
    );


  if(seconds<60)
    return "Just now";


  const minutes =
    Math.floor(
      seconds/60
    );


  if(minutes<60)
    return minutes +
      " minute" +
      (
        minutes===1 ?
        "" :
        "s"
      ) +
      " ago";


  const hours =
    Math.floor(
      minutes/60
    );


  if(hours<24)
    return hours +
      " hour" +
      (
        hours===1 ?
        "" :
        "s"
      ) +
      " ago";


  const days =
    Math.floor(
      hours/24
    );


  if(days<7)
    return days +
      " day" +
      (
        days===1 ?
        "" :
        "s"
      ) +
      " ago";


  return d.toLocaleDateString();

}


function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function showError(message){

  document.getElementById(
    "loading"
  ).style.display="none";


  const box =
    document.getElementById(
      "errorBox"
    );


  box.textContent=message;

  box.style.display="block";

}
