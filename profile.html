<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Profile - ChatZone 💬</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  color:#222;
}

body{
  padding-bottom:78px;
}

.app{
  width:100%;
  max-width:680px;
  margin:auto;
  min-height:100vh;
}

/* HEADER */
.header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(108,92,231,.97);
  color:white;
  padding:15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 2px 10px rgba(0,0,0,.18);
}

.header-title{
  font-size:20px;
  font-weight:bold;
}

.header-btn{
  border:0;
  background:rgba(255,255,255,.18);
  color:white;
  border-radius:10px;
  padding:9px 12px;
  font-size:14px;
}

/* PROFILE */
.profile-card{
  margin:15px;
  background:white;
  border-radius:20px;
  padding:20px;
  box-shadow:0 5px 18px rgba(0,0,0,.18);
}

.profile-top{
  text-align:center;
}

.avatar-wrap{
  position:relative;
  width:105px;
  height:105px;
  margin:0 auto 12px;
}

.avatar{
  width:105px;
  height:105px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #6c5ce7;
  background:#eee;
}

.online-dot{
  position:absolute;
  right:5px;
  bottom:7px;
  width:19px;
  height:19px;
  border-radius:50%;
  background:#20c997;
  border:3px solid white;
}

.name{
  font-size:23px;
  font-weight:bold;
}

.username{
  margin-top:4px;
  color:#777;
  font-size:15px;
}

.bio{
  margin:12px auto 0;
  color:#555;
  line-height:1.5;
  max-width:500px;
}

.badge{
  display:inline-block;
  margin-top:10px;
  padding:7px 12px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
}

.public-badge{
  background:#e8f8ef;
  color:#16834b;
}

.private-badge{
  background:#f0ecff;
  color:#6046c7;
}

/* BUTTONS */
.actions{
  display:flex;
  gap:8px;
  margin-top:17px;
}

.action-btn{
  flex:1;
  border:0;
  border-radius:12px;
  padding:12px 8px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

.edit-btn{
  background:#6c5ce7;
  color:white;
}

.follow-btn{
  background:#6c5ce7;
  color:white;
}

.message-btn{
  background:#eeeaff;
  color:#5b43c7;
}

/* STATS */
.stats{
  display:flex;
  justify-content:space-around;
  margin-top:20px;
  padding-top:18px;
  border-top:1px solid #eee;
}

.stat{
  text-align:center;
  cursor:pointer;
}

.stat-number{
  font-size:19px;
  font-weight:bold;
}

.stat-label{
  color:#777;
  font-size:12px;
  margin-top:3px;
}

/* INFO */
.info-card{
  margin-top:15px;
  background:#fafafa;
  border-radius:15px;
  padding:15px;
}

.info-row{
  display:flex;
  gap:10px;
  padding:9px 0;
  border-bottom:1px solid #eee;
}

.info-row:last-child{
  border-bottom:0;
}

.info-icon{
  width:25px;
}

.info-label{
  color:#777;
  font-size:12px;
}

.info-value{
  font-size:14px;
  margin-top:2px;
}

/* POSTS */
.section-title{
  margin:18px 15px 10px;
  color:white;
  font-size:18px;
  font-weight:bold;
}

.post-card{
  margin:10px 15px;
  background:white;
  border-radius:16px;
  padding:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.post-date{
  color:#888;
  font-size:12px;
  margin-top:8px;
}

.post-image{
  width:100%;
  max-height:400px;
  object-fit:cover;
  border-radius:12px;
  margin-top:10px;
}

.private-box{
  margin:15px;
  background:white;
  border-radius:18px;
  padding:30px 20px;
  text-align:center;
  box-shadow:0 5px 18px rgba(0,0,0,.16);
}

.private-icon{
  font-size:48px;
}

.private-title{
  font-size:20px;
  font-weight:bold;
  margin-top:10px;
}

.private-text{
  color:#777;
  margin-top:7px;
}

/* EDIT */
.edit-panel{
  display:none;
  margin-top:15px;
  background:#fafafa;
  border-radius:15px;
  padding:15px;
}

.input{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:14px;
  outline:none;
}

textarea.input{
  min-height:90px;
  resize:vertical;
}

.save-btn{
  width:100%;
  padding:12px;
  border:0;
  border-radius:11px;
  background:#6c5ce7;
  color:white;
  font-weight:bold;
}

.cancel-btn{
  width:100%;
  padding:11px;
  margin-top:8px;
  border:0;
  border-radius:11px;
  background:#eee;
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:50;
  height:68px;
  background:white;
  display:flex;
  justify-content:center;
  box-shadow:0 -3px 15px rgba(0,0,0,.18);
}

.nav-inner{
  width:100%;
  max-width:680px;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-item{
  flex:1;
  text-align:center;
  color:#777;
  font-size:11px;
  padding:8px 2px;
  cursor:pointer;
}

.nav-item .icon{
  display:block;
  font-size:21px;
  margin-bottom:3px;
}

.nav-item.active{
  color:#6c5ce7;
  font-weight:bold;
}

/* LOADING */
.loading{
  text-align:center;
  color:white;
  padding:40px 15px;
}

.error{
  margin:15px;
  background:white;
  color:#d63031;
  padding:15px;
  border-radius:12px;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="header-title">👤 Profile</div>
    <button class="header-btn" onclick="goBack()">← Back</button>
  </div>

  <div id="loading" class="loading">
    Profile load ho rahi hai...
  </div>

  <div id="profileArea" style="display:none;">

    <div class="profile-card">

      <div class="profile-top">

        <div class="avatar-wrap">
          <img id="avatar"
               class="avatar"
               src=""
               onerror="this.src='https://via.placeholder.com/105?text=👤'">

          <div id="onlineDot"
               class="online-dot"
               style="display:none;"></div>
        </div>

        <div id="name" class="name">User</div>
        <div id="username" class="username">@user</div>

        <div id="bio" class="bio"></div>

        <div id="privacyBadge"></div>

        <div class="actions">

          <button id="editBtn"
                  class="action-btn edit-btn"
                  onclick="toggleEdit()">
            ✏️ Edit Profile
          </button>

          <button id="followBtn"
                  class="action-btn follow-btn"
                  style="display:none;"
                  onclick="toggleFollow()">
            + Follow
          </button>

          <button id="messageBtn"
                  class="action-btn message-btn"
                  style="display:none;"
                  onclick="openPrivateChat()">
            💬 Message
          </button>

        </div>

      </div>

      <div id="stats" class="stats">

        <div class="stat">
          <div id="postCount" class="stat-number">0</div>
          <div class="stat-label">Posts</div>
        </div>

        <div class="stat">
          <div id="followersCount" class="stat-number">0</div>
          <div class="stat-label">Followers</div>
        </div>

        <div class="stat">
          <div id="followingCount" class="stat-number">0</div>
          <div class="stat-label">Following</div>
        </div>

      </div>

      <div id="infoCard" class="info-card">

        <div class="info-row">
          <div class="info-icon">🏙️</div>
          <div>
            <div class="info-label">City</div>
            <div id="city" class="info-value">Not added</div>
          </div>
        </div>

        <div class="info-row">
          <div class="info-icon">🎂</div>
          <div>
            <div class="info-label">Date of Birth</div>
            <div id="dob" class="info-value">Not added</div>
          </div>
        </div>

        <div class="info-row">
          <div class="info-icon">⚧️</div>
          <div>
            <div class="info-label">Gender</div>
            <div id="gender" class="info-value">Not added</div>
          </div>
        </div>

      </div>

      <div id="editPanel" class="edit-panel">

        <input id="editName"
               class="input"
               placeholder="Your name">

        <textarea id="editBio"
                  class="input"
                  placeholder="Write your bio..."></textarea>

        <input id="editCity"
               class="input"
               placeholder="City">

        <select id="editGender" class="input">
          <option value="">Select gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>

        <select id="editPrivacy" class="input">
          <option value="public">🌐 Public</option>
          <option value="private">🔒 Private</option>
        </select>

        <button class="save-btn" onclick="saveProfile()">
          💾 Save Profile
        </button>

        <button class="cancel-btn" onclick="toggleEdit()">
          Cancel
        </button>

      </div>

    </div>

    <div id="privateBox"
         class="private-box"
         style="display:none;">

      <div class="private-icon">🔒</div>

      <div class="private-title">
        Private Profile
      </div>

      <div class="private-text">
        Is profile ko owner ne private rakha hai.
      </div>

    </div>

    <div id="postsSection">

      <div class="section-title">
        📝 Posts
      </div>

      <div id="postsList"></div>

    </div>

  </div>

  <div id="errorBox"
       class="error"
       style="display:none;">
  </div>

</div>


<!-- BOTTOM NAV -->

<div class="bottom-nav">

  <div class="nav-inner">

    <div class="nav-item"
         onclick="goHome()">
      <span class="icon">🏠</span>
      Home
    </div>

    <div class="nav-item"
         onclick="goPrivate()">
      <span class="icon">💬</span>
      Private
    </div>

    <div class="nav-item"
         onclick="goMehfil()">
      <span class="icon">👥</span>
      Mehfil
    </div>

    <div class="nav-item active">
      <span class="icon">👤</span>
      Profile
    </div>

    <div class="nav-item"
         onclick="goMore()">
      <span class="icon">☰</span>
      More
    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
"https://jhcpqjmxiovvqbghpxbf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:false
    }
  }
);

let currentUser = null;
let profileUser = null;
let isOwner = false;
let isPrivate = false;
let isFollowing = false;


/* =========================
   START
========================= */

async function init(){

  try{

    const {data,error} =
      await supabaseClient.auth.getSession();

    if(error) throw error;

    currentUser =
      data.session?.user || null;

    if(!currentUser){

      window.location.href="login.html";
      return;
    }

    const params =
      new URLSearchParams(
        window.location.search
      );

    const profileId =
      params.get("user");

    if(profileId){

      await loadProfile(profileId);

    }else{

      await loadProfile(currentUser.id);

    }

  }catch(error){

    showError(
      "Profile load nahi ho saki: " +
      error.message
    );

  }

}


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(userId){

  const {data,error} =
    await supabaseClient
    .from("profiles")
    .select(`
      id,
      username,
      name,
      avatar_url,
      profile_privacy,
      bio,
      city,
      dob,
      gender
    `)
    .eq("id",userId)
    .maybeSingle();

  if(error) throw error;

  if(!data){

    showError("Profile nahi mili.");
    return;
  }

  profileUser = data;

  isOwner =
    currentUser.id === data.id;

  isPrivate =
    String(data.profile_privacy || "public")
      .toLowerCase() === "private";

  renderProfile();

  if(!isOwner){

    await loadFollowStatus();

  }

  /*
    Owner ko private profile ka complete
    content dikhega.

    Doosre user ko private profile par
    sirf basic profile + Private badge.
  */

  if(isOwner || !isPrivate){

    await loadStats();
    await loadPosts();

  }else{

    document.getElementById(
      "stats"
    ).style.display="none";

    document.getElementById(
      "infoCard"
    ).style.display="none";

    document.getElementById(
      "privateBox"
    ).style.display="block";

    document.getElementById(
      "postsSection"
    ).style.display="none";

  }

  document.getElementById(
    "loading"
  ).style.display="none";

  document.getElementById(
    "profileArea"
  ).style.display="block";
}


/* =========================
   RENDER PROFILE
========================= */

function renderProfile(){

  document.getElementById("name")
    .textContent =
    profileUser.name ||
    profileUser.username ||
    "User";

  document.getElementById("username")
    .textContent =
    "@" +
    (profileUser.username || "user");

  document.getElementById("avatar").src =
    profileUser.avatar_url ||
    "https://via.placeholder.com/105?text=👤";

  document.getElementById("bio")
    .textContent =
    profileUser.bio || "";

  document.getElementById("city")
    .textContent =
    profileUser.city || "Not added";

  document.getElementById("dob")
    .textContent =
    profileUser.dob || "Not added";

  document.getElementById("gender")
    .textContent =
    profileUser.gender || "Not added";


  const badge =
    document.getElementById(
      "privacyBadge"
    );

  if(isPrivate){

    badge.innerHTML =
      `<span class="badge private-badge">
        🔒 Private
      </span>`;

  }else{

    badge.innerHTML =
      `<span class="badge public-badge">
        🌐 Public
      </span>`;

  }


  if(isOwner){

    document.getElementById(
      "editBtn"
    ).style.display="block";

    document.getElementById(
      "followBtn"
    ).style.display="none";

    document.getElementById(
      "messageBtn"
    ).style.display="none";

  }else{

    document.getElementById(
      "editBtn"
    ).style.display="none";

    document.getElementById(
      "followBtn"
    ).style.display="block";

    document.getElementById(
      "messageBtn"
    ).style.display="block";

  }

}


/* =========================
   STATS
========================= */

async function loadStats(){

  const postResult =
    await supabaseClient
    .from("posts")
    .select("id",{count:"exact",head:true})
    .eq("user_id",profileUser.id);

  if(!postResult.error){

    document.getElementById(
      "postCount"
    ).textContent =
    postResult.count || 0;

  }


  const followerResult =
    await supabaseClient
    .from("user_follows")
    .select("id",{count:"exact",head:true})
    .eq("following_id",profileUser.id);

  if(!followerResult.error){

    document.getElementById(
      "followersCount"
    ).textContent =
    followerResult.count || 0;

  }


  const followingResult =
    await supabaseClient
    .from("user_follows")
    .select("id",{count:"exact",head:true})
    .eq("follower_id",profileUser.id);

  if(!followingResult.error){

    document.getElementById(
      "followingCount"
    ).textContent =
    followingResult.count || 0;

  }

}


/* =========================
   POSTS
========================= */

async function loadPosts(){

  const {data,error} =
    await supabaseClient
    .from("posts")
    .select(`
      id,
      content,
      created_at,
      image_url
    `)
    .eq("user_id",profileUser.id)
    .order("created_at",{ascending:false});

  if(error){

    document.getElementById(
      "postsList"
    ).innerHTML =
      `<div class="post-card">
        Posts load nahi ho sakin.
      </div>`;

    return;
  }

  const list =
    document.getElementById(
      "postsList"
    );

  if(!data || data.length===0){

    list.innerHTML =
      `<div class="post-card">
        Abhi koi post nahi hai.
      </div>`;

    return;
  }

  list.innerHTML =
    data.map(post=>{

      let image="";

      if(post.image_url){

        image =
        `<img class="post-image"
              src="${escapeHtml(post.image_url)}"
              onerror="this.style.display='none'">`;

      }

      return `
        <div class="post-card">

          <div>
            ${escapeHtml(post.content || "")}
          </div>

          ${image}

          <div class="post-date">
            ${formatDate(post.created_at)}
          </div>

        </div>
      `;

    }).join("");

}


/* =========================
   FOLLOW
========================= */

async function loadFollowStatus(){

  const {data,error} =
    await supabaseClient
    .from("user_follows")
    .select("id")
    .eq("follower_id",currentUser.id)
    .eq("following_id",profileUser.id)
    .maybeSingle();

  if(!error){

    isFollowing = !!data;

    updateFollowButton();

  }

}


function updateFollowButton(){

  const btn =
    document.getElementById(
      "followBtn"
    );

  btn.textContent =
    isFollowing
      ? "✓ Following"
      : "+ Follow";
}


async function toggleFollow(){

  if(!profileUser) return;

  if(isFollowing){

    const {error} =
      await supabaseClient
      .from("user_follows")
      .delete()
      .eq("follower_id",currentUser.id)
      .eq("following_id",profileUser.id);

    if(error){

      alert(error.message);
      return;
    }

    isFollowing=false;

  }else{

    const {error} =
      await supabaseClient
      .from("user_follows")
      .insert({
        follower_id:currentUser.id,
        following_id:profileUser.id
      });

    if(error){

      alert(error.message);
      return;
    }

    isFollowing=true;

  }

  updateFollowButton();
}


/* =========================
   EDIT PROFILE
========================= */

function toggleEdit(){

  const panel =
    document.getElementById(
      "editPanel"
    );

  if(panel.style.display==="block"){

    panel.style.display="none";
    return;
  }

  document.getElementById(
    "editName"
  ).value =
    profileUser.name || "";

  document.getElementById(
    "editBio"
  ).value =
    profileUser.bio || "";

  document.getElementById(
    "editCity"
  ).value =
    profileUser.city || "";

  document.getElementById(
    "editGender"
  ).value =
    profileUser.gender || "";

  document.getElementById(
    "editPrivacy"
  ).value =
    isPrivate
      ? "private"
      : "public";

  panel.style.display="block";

}


async function saveProfile(){

  const name =
    document.getElementById(
      "editName"
    ).value.trim();

  const bio =
    document.getElementById(
      "editBio"
    ).value.trim();

  const city =
    document.getElementById(
      "editCity"
    ).value.trim();

  const gender =
    document.getElementById(
      "editGender"
    ).value;

  const privacy =
    document.getElementById(
      "editPrivacy"
    ).value;


  const {data,error} =
    await supabaseClient
    .from("profiles")
    .update({
      name:name || null,
      bio:bio || null,
      city:city || null,
      gender:gender || null,
      profile_privacy:privacy
    })
    .eq("id",currentUser.id)
    .select()
    .maybeSingle();

  if(error){

    alert(
      "Profile save nahi hui:\n" +
      error.message
    );

    return;
  }

  if(data){

    profileUser=data;

  }else{

    profileUser.name=name;
    profileUser.bio=bio;
    profileUser.city=city;
    profileUser.gender=gender;
    profileUser.profile_privacy=privacy;

  }

  isPrivate =
    privacy === "private";

  renderProfile();

  document.getElementById(
    "editPanel"
  ).style.display="none";

  /*
    Privacy change ke baad page ko
    fresh state mein dobara render karte hain.
  */

  if(isPrivate){

    document.getElementById(
      "stats"
    ).style.display="flex";

    await loadStats();
    await loadPosts();

  }

  alert("✅ Profile updated!");

}


/* =========================
   PRIVATE CHAT
========================= */

function openPrivateChat(){

  if(!profileUser) return;

  window.location.href =
    "private-chat.html?user=" +
    encodeURIComponent(profileUser.id);

}


/* =========================
   NAVIGATION
========================= */

function goHome(){
  window.location.href="index.html";
}

function goPrivate(){
  window.location.href="private.html";
}

function goMehfil(){
  window.location.href="mehfil.html";
}

function goMore(){
  window.location.href="more.html";
}

function goBack(){

  if(document.referrer){

    history.back();

  }else{

    window.location.href="index.html";

  }

}


/* =========================
   HELPERS
========================= */

function formatDate(date){

  if(!date) return "";

  const d =
    new Date(date);

  const now =
    new Date();

  const seconds =
    Math.floor(
      (now-d)/1000
    );

  if(seconds < 60)
    return "Just now";

  const minutes =
    Math.floor(seconds/60);

  if(minutes < 60)
    return minutes +
      " minute" +
      (minutes===1?"":"s") +
      " ago";

  const hours =
    Math.floor(minutes/60);

  if(hours < 24)
    return hours +
      " hour" +
      (hours===1?"":"s") +
      " ago";

  const days =
    Math.floor(hours/24);

  if(days < 7)
    return days +
      " day" +
      (days===1?"":"s") +
      " ago";

  return d.toLocaleDateString();

}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function showError(message){

  document.getElementById(
    "loading"
  ).style.display="none";

  const box =
    document.getElementById(
      "errorBox"
    );

  box.textContent=message;
  box.style.display="block";

}


/* START */

init();

</script>
