<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RabtaHub - Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
}

.login-box{
  width:100%;
  max-width:420px;
  background:#fff;
  padding:30px 22px;
  border-radius:20px;
  box-shadow:0 15px 40px rgba(0,0,0,.18);
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:800;
  color:#6c5ce7;
  margin-bottom:5px;
}

.tagline{
  text-align:center;
  color:#777;
  margin-bottom:25px;
  font-size:14px;
}

h2{
  text-align:center;
  margin:0 0 22px;
  color:#222;
}

input{
  width:100%;
  padding:14px;
  margin-bottom:14px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#6c5ce7;
}

.password-wrap{
  position:relative;
  width:100%;
}

.password-wrap input{
  padding-right:52px;
}

.show-password{
  position:absolute;
  right:5px;
  top:0;
  width:45px;
  height:45px;
  padding:0;
  margin:0;
  border:0;
  background:transparent;
  color:#666;
  font-size:19px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.login-button{
  width:100%;
  border:0;
  padding:14px;
  border-radius:12px;
  background:#6c5ce7;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.login-button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

#message{
  text-align:center;
  margin-top:15px;
  font-size:14px;
  min-height:20px;
  line-height:1.5;
}

.signup-link{
  text-align:center;
  margin-top:20px;
  color:#666;
  font-size:14px;
}

.signup-link a{
  color:#6c5ce7;
  font-weight:bold;
  text-decoration:none;
}

</style>

</head>

<body
