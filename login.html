<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RabtaHub - Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
}

.login-box{
  width:100%;
  max-width:420px;
  background:#fff;
  padding:30px 22px;
  border-radius:20px;
  box-shadow:0 15px 40px rgba(0,0,0,.18);
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:800;
  color:#6c5ce7;
  margin-bottom:5px;
}

.tagline{
  text-align:center;
  color:#777;
  margin-bottom:25px;
  font-size:14px;
}

h2{
  text-align:center;
  margin:0 0 22px;
  color:#222;
}

input{
  width:100%;
  padding:14px;
  margin-bottom:14px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#6c5ce7;
}

.password-wrap{
  position:relative;
  width:100%;
}

.password-wrap input{
  padding-right:52px;
}

.show-password{
  position:absolute;
  right:5px;
  top:0;
  width:45px;
  height:45px;
  padding:0;
  margin:0;
  border:0;
  background:transparent;
  color:#666;
  font-size:19px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.show-password:hover{
  background:transparent;
}

.login-button{
  width:100%;
  border:0;
  padding:14px;
  border-radius:12px;
  background:#6c5ce7;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.login-button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

#message{
  text-align:center;
  margin-top:15px;
  font-size:14px;
  min-height:20px;
  line-height:1.5;
}

.signup-link{
  text-align:center;
  margin-top:20px;
  color:#666;
  font-size:14px;
}

.signup-link a{
  color:#6c5ce7;
  font-weight:bold;
  text-decoration:none;
}

</style>

</head>

<body>

<div class="login-box">

  <div class="logo">
    RabtaHub
  </div>

  <div class="tagline">
    Connect. Share. Belong.
  </div>

  <h2>
    Welcome Back
  </h2>

  <form id="loginForm">

    <input
      type="text"
      id="username"
      placeholder="Username"
      maxlength="20"
      autocomplete="username"
      required
    >

    <div class="password-wrap">

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button
        type="button"
        class="show-password"
        onclick="togglePassword()">

        <span id="passwordIcon">
          👁️
        </span>

      </button>

    </div>

    <button
      type="submit"
      id="loginBtn"
      class="login-button">

      Login

    </button>

  </form>

  <div id="message"></div>

  <div class="signup-link">

    Don't have an account?

    <a href="signup.html">
      Create Account
    </a>

  </div>

</div>

<script>

/* ========================================
   SUPABASE
======================================== */

const SUPABASE_URL =
  "https://szmauhxiyjffjhrcruee.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ========================================
   SHOW / HIDE PASSWORD
======================================== */

function togglePassword(){

  const input =
    document.getElementById("password");

  const icon =
    document.getElementById("passwordIcon");

  if(input.type === "password"){

    input.type = "text";
    icon.textContent = "🙈";

  }else{

    input.type = "password";
    icon.textContent = "👁️";

  }

}


/* ========================================
   LOGIN
======================================== */

document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async function(e){

      e.preventDefault();

      let username =
        document
          .getElementById("username")
          .value
          .trim()
          .toLowerCase();

      const password =
        document
          .getElementById("password")
          .value;

      const button =
        document.getElementById("loginBtn");

      const message =
        document.getElementById("message");

      message.textContent = "";
      message.style.color = "#666";


      /* USERNAME VALIDATION */

      if(
        username.length < 4 ||
        username.length > 20
      ){

        message.style.color = "#d63031";

        message.textContent =
          "Username 4 se 20 characters ka hona chahiye.";

        return;
      }


      if(
        !/^[a-z0-9_]+$/.test(username)
      ){

        message.style.color = "#d63031";

        message.textContent =
          "Username valid nahi hai.";

        return;
      }


      if(!password){

        message.style.color = "#d63031";

        message.textContent =
          "Password enter karein.";

        return;
      }


      button.disabled = true;
      button.textContent = "Logging in...";


      try{

        /* FIND USERNAME */

        const {
          data: profile,
          error: profileError
        } =
          await supabaseClient
            .from("profiles")
            .select("id,username")
            .eq("username", username)
            .maybeSingle();


        if(profileError){

          throw new Error(
            "Username check failed: " +
            profileError.message
          );

        }


        if(!profile){

          throw new Error(
            "Username ya password ghalat hai."
          );

        }


        /* HIDDEN SYSTEM EMAIL */

        const systemEmail =
          username +
          "@rbtahub.local";


        /* LOGIN */

        const {
          data,
          error
        } =
          await supabaseClient.auth.signInWithPassword({

            email: systemEmail,

            password: password

          });


        if(error){

          throw new Error(
            "Username ya password ghalat hai."
          );

        }


        if(!data.session){

          throw new Error(
            "Login session create nahi hui."
          );

        }


        /* SUCCESS */

        message.style.color = "#00a86b";

        message.textContent =
          "Login successful!";


        setTimeout(function(){

          window.location.href = "index.html";

        },700);


      }catch(error){

        console.error(
          "LOGIN ERROR:",
          error
        );

        message.style.color = "#d63031";

        message.textContent =
          error.message ||
          "Login failed.";

      }finally{

        button.disabled = false;
        button.textContent = "Login";

      }

    }
  );

</script>

</body>
</html>
