<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>ChatZone 💬</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  background:#f4f2ff;
  color:#222;
}

body{
  padding-bottom:80px;
}

button{
  font-family:inherit;
}

.app{
  width:100%;
  max-width:680px;
  margin:auto;
  min-height:100vh;
  background:#fff;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:50;
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  color:white;
  padding:12px 10px 10px;
  box-shadow:0 3px 12px rgba(0,0,0,.18);
}

.header-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.logo{
  font-size:21px;
  font-weight:800;
  white-space:nowrap;
}

.header-buttons{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:4px;
  flex:1;
}

.header-buttons button{
  min-width:0;
  width:100%;
  border:0;
  border-radius:10px;
  padding:8px 3px;
  background:rgba(255,255,255,.18);
  color:white;
  font-size:10px;
  font-weight:700;
  cursor:pointer;
  white-space:nowrap;
}

/* ONLINE USERS */

.online-section{
  padding:10px 10px 4px;
}

.online-title{
  font-size:14px;
  font-weight:800;
  margin-bottom:7px;
}

.online-users{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:5px;
  scrollbar-width:none;
}

.online-users::-webkit-scrollbar{
  display:none;
}

.online-user{
  flex:0 0 auto;
  min-width:62px;
  text-align:center;
  cursor:pointer;
}

.online-avatar{
  width:43px;
  height:43px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  margin:auto;
  border:3px solid #22c55e;
}

.online-name{
  font-size:10px;
  margin-top:4px;
  max-width:65px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* MAIN */

.main{
  padding:10px;
}

.welcome{
  background:linear-gradient(135deg,#eee9ff,#f7f1ff);
  border-radius:15px;
  padding:13px;
  margin-bottom:10px;
  font-weight:700;
  color:#5d45a8;
  text-align:center;
}

/* CREATE POST */

.create-box{
  border:1px solid #e3ddf7;
  border-radius:16px;
  padding:12px;
  background:white;
  box-shadow:0 2px 8px rgba(70,40,130,.06);
}

.reply-box{
  display:none;
  background:#f3efff;
  border-left:4px solid #6c5ce7;
  border-radius:10px;
  padding:8px 10px;
  margin-bottom:8px;
  font-size:13px;
}

.reply-box strong{
  color:#6c5ce7;
}

.reply-cancel{
  float:right;
  border:0;
  background:none;
  color:#777;
  cursor:pointer;
  font-size:16px;
}

.post-input{
  width:100%;
  min-height:80px;
  resize:none;
  border:1px solid #ddd;
  border-radius:13px;
  padding:11px;
  outline:none;
  font-size:14px;
}

.post-input:focus{
  border-color:#6c5ce7;
}

.create-actions{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:7px;
  margin-top:8px;
}

.create-actions button{
  width:100%;
  min-width:0;
  border:0;
  border-radius:13px;
  padding:11px 5px;
  min-height:44px;
  cursor:pointer;
  font-weight:700;
  font-size:12px;
}

.send-btn{
  background:#6c5ce7;
  color:white;
}

.upload-btn,
.voice-btn{
  background:#eee;
  color:#333;
}

/* FEED */

.feed-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:15px 2px 8px;
}

.feed-head h3{
  margin:0;
  font-size:17px;
}

.refresh-btn{
  border:0;
  background:#eee;
  border-radius:10px;
  padding:8px 11px;
  cursor:pointer;
  font-weight:700;
}

/* POST */

.post{
  border:1px solid #e4e0ed;
  border-radius:16px;
  padding:12px;
  margin-bottom:10px;
  background:white;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}

.post-user{
  display:flex;
  align-items:center;
  gap:9px;
  cursor:pointer;
}

.post-avatar{
  width:43px;
  height:43px;
  border-radius:50%;
  object-fit:cover;
  background:#eee;
}

.post-user-info{
  min-width:0;
}

.post-name{
  font-weight:800;
  font-size:14px;
}

.post-username{
  font-size:11px;
  color:#777;
}

.post-date{
  font-size:10px;
  color:#999;
  margin-top:2px;
}

.post-content{
  margin-top:10px;
  font-size:14px;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
}

.post-image{
  width:100%;
  max-height:450px;
  object-fit:cover;
  border-radius:13px;
  margin-top:10px;
  cursor:pointer;
}

.voice-post{
  margin-top:10px;
  padding:12px;
  background:#f3efff;
  border-radius:14px;
}

.voice-title{
  font-size:13px;
  font-weight:800;
  color:#6c5ce7;
  margin-bottom:8px;
}

.voice-post audio{
  width:100%;
  display:block;
}

.voice-duration{
  font-size:10px;
  color:#888;
  margin-top:6px;
}

.post-actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  margin-top:10px;
}

.post-actions button{
  border:0;
  border-radius:9px;
  background:#f0eef5;
  padding:8px 9px;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
}

.post-actions button.selected{
  background:#ddd3ff;
  color:#5d45a8;
}

.post-actions button.danger{
  background:#ffe7e7;
  color:#c62828;
}

.secondary-actions{
  margin-top:5px;
}

/* COMMENTS */

.comments{
  display:none;
  margin-top:10px;
  border-top:1px solid #eee;
  padding-top:9px;
}

.comment-row{
  display:flex;
  gap:7px;
  margin-bottom:8px;
}

.comment-avatar{
  width:30px;
  height:30px;
  border-radius:50%;
  object-fit:cover;
}

.comment-body{
  background:#f5f3f8;
  border-radius:11px;
  padding:7px 9px;
  flex:1;
  min-width:0;
}

.comment-name{
  font-size:11px;
  font-weight:800;
}

.comment-text{
  font-size:12px;
  margin-top:2px;
  word-break:break-word;
}

.comment-tools{
  margin-top:5px;
  display:flex;
  gap:6px;
}

.comment-tools button{
  border:0;
  background:none;
  color:#6c5ce7;
  font-size:10px;
  padding:0;
  cursor:pointer;
}

.comment-input-row{
  display:flex;
  gap:5px;
  margin-top:8px;
}

.comment-input{
  flex:1;
  min-width:0;
  border:1px solid #ddd;
  border-radius:10px;
  padding:8px;
  font-size:12px;
  outline:none;
}

.comment-send{
  border:0;
  background:#6c5ce7;
  color:white;
  border-radius:10px;
  padding:8px 11px;
  font-weight:700;
}

/* POPUPS */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.45);
  align-items:center;
  justify-content:center;
  padding:15px;
}

.popup{
  width:100%;
  max-width:430px;
  max-height:85vh;
  overflow:auto;
  background:white;
  border-radius:18px;
  padding:15px;
}

.popup-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.popup-header h3{
  margin:0;
  font-size:17px;
}

.popup-close{
  border:0;
  background:#eee;
  border-radius:50%;
  width:32px;
  height:32px;
  cursor:pointer;
  font-weight:bold;
}

/* IMAGE POPUP */

.image-preview{
  width:100%;
  max-height:350px;
  object-fit:contain;
  border-radius:12px;
  background:#f4f4f4;
  display:none;
  margin-bottom:10px;
}

.image-file{
  width:100%;
  padding:10px;
  border:1px solid #ddd;
  border-radius:10px;
}

.popup-send{
  width:100%;
  border:0;
  background:#6c5ce7;
  color:white;
  border-radius:12px;
  padding:12px;
  margin-top:9px;
  font-weight:800;
  cursor:pointer;
}

/* VOICE */

.voice-status{
  text-align:center;
  font-size:14px;
  font-weight:bold;
  color:#666;
  padding:12px 5px;
}

.voice-timer{
  text-align:center;
  font-size:28px;
  font-weight:bold;
  color:#6c5ce7;
  margin:3px 0 15px;
}

.voice-preview-box{
  display:none;
  margin-bottom:10px;
}

.voice-preview{
  width:100%;
}

.voice-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.voice-control{
  border:0;
  border-radius:13px;
  padding:13px 8px;
  font-weight:bold;
  font-size:13px;
  cursor:pointer;
}

.record-control{
  background:#6c5ce7;
  color:white;
}

.stop-control{
  background:#eee;
  color:#555;
}

.send-voice{
  width:100%;
  border:0;
  background:#22c55e;
  color:white;
  border-radius:13px;
  padding:13px;
  font-weight:bold;
  font-size:14px;
  margin-top:9px;
  cursor:pointer;
}

.cancel-control{
  width:100%;
  border:0;
  background:#eee;
  color:#555;
  border-radius:13px;
  padding:11px;
  margin-top:7px;
  cursor:pointer;
}

/* TRENDING */

.trending-list{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.trending-item{
  padding:10px;
  background:#f5f3fa;
  border-radius:10px;
  font-size:13px;
}

/* LIKES */

.like-user{
  display:flex;
  align-items:center;
  gap:9px;
  padding:8px 0;
  border-bottom:1px solid #eee;
}

.like-user img{
  width:38px;
  height:38px;
  border-radius:50%;
  object-fit:cover;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:100%;
  max-width:680px;
  z-index:80;
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  background:white;
  border-top:1px solid #ddd;
  box-shadow:0 -3px 12px rgba(0,0,0,.08);
}

.bottom-nav button{
  min-width:0;
  border:0;
  background:white;
  padding:10px 2px 9px;
  cursor:pointer;
  color:#666;
  font-weight:700;
  font-size:10px;
}

.bottom-nav button.active{
  color:#6c5ce7;
}

.bottom-icon{
  display:block;
  font-size:20px;
  margin-bottom:2px;
}

/* LOADING */

.loading{
  text-align:center;
  padding:25px 10px;
  color:#777;
  font-size:13px;
}

/* MOBILE */

@media(max-width:500px){
  .logo{
    font-size:18px;
  }

  .header{
    padding:10px 7px;
  }

  .header-top{
    gap:5px;
  }

  .header-buttons{
    gap:3px;
  }

  .header-buttons button{
    font-size:9px;
    padding:8px 2px;
  }

  .main{
    padding:8px;
  }
}

@media(max-width:360px){
  .logo{
    font-size:16px;
  }

  .header-buttons button{
    font-size:8px;
  }

  .create-actions button{
    font-size:11px;
  }

  .bottom-nav button{
    font-size:9px;
  }

  .bottom-icon{
    font-size:18px;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- HEADER -->
<header class="header">
  <div class="header-top">
    <div class="logo">ChatZone 💬</div>

    <div class="header-buttons">
      <button onclick="openTrending()">🔥 Trending</button>
      <button onclick="showShareBox()">＋ Share</button>
      <button onclick="openLikesInfo()">⭐</button>
      <button onclick="location.href='notifications.html'">🔔</button>
    </div>
  </div>
</header>

<!-- ONLINE USERS - HOME ONLY -->
<section class="online-section">
  <div class="online-title">
    🟢 Online Users <span id="onlineCount">(0)</span>
  </div>

  <div id="onlineUsers" class="online-users">
    <div style="font-size:12px;color:#888">Loading...</div>
  </div>
</section>

<main class="main">

  <div class="welcome">
    Welcome to ChatZone 💜
  </div>

  <!-- CREATE POST -->
  <div class="create-box">

    <div id="replyBox" class="reply-box">
      Replying to <strong id="replyUsername"></strong>
      <button class="reply-cancel" onclick="cancelReply()">✕</button>
    </div>

    <textarea
      id="postInput"
      class="post-input"
      placeholder="What's on your mind?"
    ></textarea>

    <div class="create-actions">
      <button class="send-btn" onclick="sendTextPost()">📤 Send Post</button>
      <button class="upload-btn" onclick="showImagePost()">🖼️ Image</button>
      <button class="voice-btn" onclick="openVoiceRecorder()">🎙️ Voice</button>
    </div>

  </div>

  <!-- FEED -->
  <div class="feed-head">
    <h3>🏠 Home Feed</h3>
    <button class="refresh-btn" onclick="loadFeed(true)">↻ Refresh</button>
  </div>

  <div id="feed">
    <div class="loading">Loading feed...</div>
  </div>

</main>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="active" onclick="location.href='index.html'">
    <span class="bottom-icon">🏠</span>
    Home
  </button>

  <button onclick="location.href='private.html'">
    <span class="bottom-icon">💬</span>
    Private
  </button>

  <button onclick="location.href='mehfil.html'">
    <span class="bottom-icon">👥</span>
    Mehfil
  </button>

  <button onclick="location.href='profile.html'">
    <span class="bottom-icon">👤</span>
    Profile
  </button>

  <button onclick="location.href='more.html'">
    <span class="bottom-icon">☰</span>
    More
  </button>
</nav>


<!-- SHARE POPUP -->
<div id="shareOverlay" class="overlay">
  <div class="popup">

    <div class="popup-header">
      <h3>＋ Share</h3>
      <button class="popup-close" onclick="closeShareBox()">✕</button>
    </div>

    <button
      class="popup-send"
      onclick="closeShareBox();document.getElementById('postInput').focus()"
    >
      📝 Text Post
    </button>

    <button
      class="popup-send"
      onclick="closeShareBox();showImagePost()"
    >
      🖼️ Image Post
    </button>

  </div>
</div>


<!-- IMAGE POPUP -->
<div id="imageOverlay" class="overlay">
  <div class="popup">

    <div class="popup-header">
      <h3>🖼️ Image Post</h3>
      <button class="popup-close" onclick="closeImagePost()">✕</button>
    </div>

    <input
      id="imageFile"
      class="image-file"
      type="file"
      accept="image/*"
      onchange="previewImage(this)"
    >

    <img id="imagePreview" class="image-preview">

    <textarea
      id="imageCaption"
      class="post-input"
      style="margin-top:10px"
      placeholder="Write something about this image..."
    ></textarea>

    <button class="popup-send" onclick="sendImagePost()">
      📤 Send Image
    </button>

  </div>
</div>


<!-- VOICE RECORDER -->
<div id="voiceOverlay" class="overlay">
  <div class="popup">

    <div class="popup-header">
      <h3>🎙️ Voice Note</h3>
      <button class="popup-close" onclick="closeVoiceRecorder()">✕</button>
    </div>

    <div id="voiceStatus" class="voice-status">
      Press Record to start
    </div>

    <div id="voiceTimer" class="voice-timer">
      00:00
    </div>

    <div id="voicePreviewBox" class="voice-preview-box">
      <audio id="voicePreview" class="voice-preview" controls></audio>
    </div>

    <div class="voice-buttons">

      <button
        id="recordVoiceBtn"
        class="voice-control record-control"
        onclick="recordVoice()"
      >
        🎙️ Record
      </button>

      <button
        id="stopVoiceBtn"
        class="voice-control stop-control"
        onclick="stopVoice()"
        disabled
      >
        ⏹️ Stop
      </button>

    </div>

    <button
      id="sendVoiceBtn"
      class="send-voice"
      onclick="sendVoiceNote()"
      disabled
      style="opacity:.6"
    >
      📤 Send Voice
    </button>

    <button
      class="cancel-control"
      onclick="closeVoiceRecorder()"
    >
      Cancel
    </button>

  </div>
</div>


<!-- TRENDING POPUP -->
<div id="trendingOverlay" class="overlay">
  <div class="popup">

    <div class="popup-header">
      <h3>🔥 Trending</h3>
      <button class="popup-close" onclick="closeTrending()">✕</button>
    </div>

    <div id="trendingList" class="trending-list">
      <div class="loading">Loading...</div>
    </div>

  </div>
</div>


<!-- LIKES POPUP -->
<div id="likesOverlay" class="overlay">
  <div class="popup">

    <div class="popup-header">
      <h3>⭐ Likes</h3>
      <button class="popup-close" onclick="closeLikesInfo()">✕</button>
    </div>

    <div style="font-size:13px;color:#777">
      Like information appears on individual posts.
    </div>

  </div>
</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://jhcpqjmxiovvqbghpxbf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true
    }
  }
);


/* =========================
   GLOBALS
========================= */

let currentUser=null;
let currentProfile=null;

let presenceChannel=null;

let replyingToUserId=null;
let replyingToUsername="";

let imageObjectUrl=null;


/* =========================
   ESCAPE
========================= */

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function escapeAttribute(value){
  return escapeHTML(value);
}


/* =========================
   DATE
========================= */

function formatDate(dateValue){

  if(!dateValue)return "";

  const date=new Date(dateValue);
  const now=new Date();

  const seconds=Math.floor((now-date)/1000);

  if(seconds<60)return "Just now";

  const minutes=Math.floor(seconds/60);

  if(minutes<60)
    return minutes+"m ago";

  const hours=Math.floor(minutes/60);

  if(hours<24)
    return hours+"h ago";

  const days=Math.floor(hours/24);

  if(days<7)
    return days+"d ago";

  return date.toLocaleDateString();
}


/* =========================
   VOICE DURATION
========================= */

function formatVoiceDuration(seconds){

  seconds=Number(seconds)||0;

  const minutes=Math.floor(seconds/60);
  const remaining=seconds%60;

  return String(minutes).padStart(2,"0")
    +":"+String(remaining).padStart(2,"0");
}


/* =========================
   INIT
========================= */

async function init(){

  const {
    data:{session},
    error
  }=await supabaseClient.auth.getSession();

  if(error){
    console.error(error);
  }

  if(!session){

    setTimeout(async()=>{

      const {
        data:{session:retrySession}
      }=await supabaseClient.auth.getSession();

      if(!retrySession){
        location.href="login.html";
        return;
      }

      currentUser=retrySession.user;

      await loadProfile();
      startGlobalPresence();
      await loadFeed();

    },700);

    return;
  }

  currentUser=session.user;

  await loadProfile();

  startGlobalPresence();

  await loadFeed();
}


/* =========================
   PROFILE
========================= */

async function loadProfile(){

  if(!currentUser)return;

  const {
    data,
    error
  }=await supabaseClient
    .from("profiles")
    .select("id,avatar_url,username,name,profile_privacy")
    .eq("id",currentUser.id)
    .maybeSingle();

  if(error){
    console.error("Profile error:",error);
    return;
  }

  currentProfile=data;
}


/* =========================
   GLOBAL PRESENCE
========================= */

function startGlobalPresence(){

  if(!currentUser)return;

  if(presenceChannel){
    try{
      presenceChannel.untrack();
    }catch(e){}
  }

  presenceChannel=
    supabaseClient.channel(
      "chatzone-online-users",
      {
        config:{
          presence:{
            key:String(currentUser.id)
          }
        }
      }
    );

  presenceChannel
    .on(
      "presence",
      {
        event:"sync"
      },
      ()=>{
        loadOnlineUsers();
      }
    )
    .subscribe(async status=>{

      if(status==="SUBSCRIBED"){

          online_at:new Date().toISOString()
        });

/* =========================
   ONLINE USERS
========================= */

async function loadOnlineUsers(){

  const container=
    document.getElementById("onlineUsers");

  if(!container)return;

  if(!presenceChannel){
    container.innerHTML=
      `<div style="font-size:12px;color:#888">
        No online users
      </div>`;
    return;
  }

  const state=
    presenceChannel.presenceState();

  const ids=[];

  Object.keys(state).forEach(key=>{

    const entries=state[key]||[];

    entries.forEach(entry=>{

      const id=
        entry.user_id ||
        key;

      if(id && !ids.includes(id)){
        ids.push(id);
      }

    });

  });

  if(!ids.length){

    container.innerHTML=
      `<div style="font-size:12px;color:#888">
        No online users
      </div>`;

    document.getElementById("onlineCount").textContent="(0)";

    return;
  }

  const {
    data:profiles,
    error
  }=await supabaseClient
    .from("profiles")
    .select("id,avatar_url,username,name")
    .in("id",ids);

  if(error){

    console.error("Online profiles:",error);

    container.innerHTML=
      `<div style="font-size:12px;color:#888">
        Online users load nahi ho sake
      </div>`;

    return;
  }

  document.getElementById("onlineCount")
    .textContent="("+profiles.length+")";

  container.innerHTML="";

  profiles.forEach(profile=>{

    const avatar=
      profile.avatar_url ||
      "https://via.placeholder.com/80";

    const name=
      profile.name ||
      profile.username ||
      "User";

    const div=document.createElement("div");

    div.className="online-user";

    div.onclick=()=>{
      location.href=
        "profile.html?id="+
        encodeURIComponent(profile.id);
    };

    div.innerHTML=`

      <img
        class="online-avatar"
        src="${escapeAttribute(avatar)}"
        onerror="this.src='https://via.placeholder.com/80'"
      >

      <div class="online-name">
        ${escapeHTML(name)}
      </div>

    `;

    container.appendChild(div);

  });

}


/* =========================
   LOAD FEED
========================= */

async function loadFeed(showMessage=false){

  const feed=
    document.getElementById("feed");

  if(showMessage){

    feed.innerHTML=
      `<div class="loading">
        Refreshing feed...
      </div>`;
  }

  const {
    data:posts,
    error
  }=await supabaseClient
    .from("posts")
    .select(`
      id,
      user_id,
      username,
      content,
      created_at,
      post_type,
      category,
      image_url,
      voice_url,
      voice_duration
    `)
    .order("created_at",{ascending:false})
    .limit(100);

  if(error){

    console.error("Feed error:",error);

    feed.innerHTML=
      `<div class="loading">
        Feed load nahi ho saki.<br>
        ${escapeHTML(error.message)}
      </div>`;

    return;
  }

  if(!posts || !posts.length){

    feed.innerHTML=
      `<div class="loading">
        Abhi koi post nahi hai.
      </div>`;

    return;
  }

  const userIds=[
    ...new Set(
      posts
        .map(p=>p.user_id)
        .filter(Boolean)
    )
  ];

  let profiles=[];

  if(userIds.length){

    const result=
      await supabaseClient
        .from("profiles")
        .select("id,avatar_url,username,name")
        .in("id",userIds);

    profiles=result.data||[];
  }

  const profileMap={};

  profiles.forEach(profile=>{
    profileMap[profile.id]=profile;
  });

  const blockedUsers=
    await getBlockedUsers();

  const visiblePosts=
    posts.filter(post=>{

      if(!post.user_id)return true;

      if(post.user_id===currentUser.id)
        return true;

      return !blockedUsers.has(post.user_id);

    });

  feed.innerHTML="";

  for(const post of visiblePosts){

    const profile=
      profileMap[post.user_id]||{
        id:post.user_id,
        username:post.username||"User",
        name:post.username||"User",
        avatar_url:"https://via.placeholder.com/80"
      };

    const html=
      await renderPost(post,profile);

    feed.insertAdjacentHTML(
      "beforeend",
      html
    );

  }

}


/* =========================
   BLOCKED USERS
========================= */

async function getBlockedUsers(){

  const blocked=
    new Set();

  if(!currentUser)return blocked;

  const {data,error}=
    await supabaseClient
      .from("user_blocks")
      .select("blocker_id,blocked_id")
      .or(
        `blocker_id.eq.${currentUser.id},blocked_id.eq.${currentUser.id}`
      );

  if(error){
    console.error("Block load:",error);
    return blocked;
  }

  (data||[]).forEach(row=>{

    if(row.blocker_id===currentUser.id)
      blocked.add(row.blocked_id);

    if(row.blocked_id===currentUser.id)
      blocked.add(row.blocker_id);

  });

  return blocked;
}


/* =========================
   RENDER POST
========================= */

async function renderPost(post,profile){

  const isOwn=
    post.user_id===currentUser.id;

  const avatar=
    profile.avatar_url ||
    "https://via.placeholder.com/80";

  const name=
    profile.name ||
    profile.username ||
    "User";

  const username=
    profile.username ||
    post.username ||
    "user";

  let likeCount=0;
  let dislikeCount=0;
  let commentCount=0;
  let myAction=null;
  let isFollowing=false;

  const actionsResult=
    await supabaseClient
      .from("post_actions")
      .select("user_id,action_type")
      .eq("post_id",post.id);

  const actions=
    actionsResult.data||[];

  actions.forEach(action=>{

    if(action.action_type==="like")
      likeCount++;

    if(action.action_type==="dislike")
      dislikeCount++;

    if(
      action.user_id===currentUser.id &&
      (
        action.action_type==="like" ||
        action.action_type==="dislike"
      )
    ){
      myAction=action.action_type;
    }

  });

  const commentsResult=
    await supabaseClient
      .from("comments")
      .select("id")
      .eq("post_id",post.id);

  commentCount=
    commentsResult.data?.length||0;

  if(!isOwn){

    const followResult=
      await supabaseClient
        .from("user_follows")
        .select("follower_id")
        .eq("follower_id",currentUser.id)
        .eq("following_id",post.user_id)
        .maybeSingle();

    isFollowing=!!followResult.data;
  }

  const imageHTML=
    post.image_url
    ?
    `
    <img
      class="post-image"
      src="${escapeAttribute(post.image_url)}"
      onclick="window.open('${escapeAttribute(post.image_url)}','_blank')"
      onerror="this.style.display='none'"
    >
    `
    :
    "";

  const voiceHTML=
    post.voice_url
    ?
    `
    <div class="voice-post">

      <div class="voice-title">
        🎙️ Voice Note
      </div>

      <audio
        controls
        preload="metadata"
        src="${escapeAttribute(post.voice_url)}"
      ></audio>

      ${
        post.voice_duration
        ?
        `
        <div class="voice-duration">
          Duration: ${formatVoiceDuration(post.voice_duration)}
        </div>
        `
        :
        ""
      }

    </div>
    `
    :
    "";

  const postContent=
    post.content
    ?
    `
    <div class="post-content">
      ${escapeHTML(post.content)}
    </div>
    `
    :
    "";

  return `

  <article class="post" id="post-${post.id}">

    <div
      class="post-user"
      onclick="openUserProfile('${escapeAttribute(post.user_id)}')"
    >

      <img
        class="post-avatar"
        src="${escapeAttribute(avatar)}"
        onerror="this.src='https://via.placeholder.com/80'"
      >

      <div class="post-user-info">

        <div class="post-name">
          ${escapeHTML(name)}
        </div>

        <div class="post-username">
          @${escapeHTML(username)}
        </div>

        <div class="post-date">
          ${formatDate(post.created_at)}
        </div>

      </div>

    </div>

    ${postContent}

    ${imageHTML}

    ${voiceHTML}

    <div class="post-actions">

      <button
        class="${myAction==="like"?"selected":""}"
        onclick="togglePostAction(${post.id},'like')"
      >
        👍 Like ${likeCount}
      </button>

      <button
        class="${myAction==="dislike"?"selected":""}"
        onclick="togglePostAction(${post.id},'dislike')"
      >
        👎 Dislike ${dislikeCount}
      </button>

      <button
        onclick="toggleComments(${post.id})"
      >
        💬 Comments ${commentCount}
      </button>

      ${
        isOwn
        ?
        `
        <button
          class="danger"
          onclick="deletePost(${post.id})"
        >
          🗑️ Delete
        </button>
        `
        :
        `
        <button
          onclick="startReply(
            '${escapeAttribute(post.user_id)}',
            '${escapeAttribute(username)}'
          )"
        >
          ↩️ Reply
        </button>
        `
      }

    </div>

    ${
      !isOwn
      ?
      `
      <div class="post-actions secondary-actions">

        <button
          onclick="openPrivate('${escapeAttribute(post.user_id)}')"
        >
          💬 1on1
        </button>

        <button
          onclick="toggleFollow(
            '${escapeAttribute(post.user_id)}',
            this
          )"
        >
          ${isFollowing?"✓ Following":"＋ Follow"}
        </button>

        <button
          onclick="blockUser('${escapeAttribute(post.user_id)}')"
        >
          🚫 Block
        </button>

      </div>
      `
      :
      ""
    }

    <div
      id="comments-${post.id}"
      class="comments"
    >

      <div id="comment-list-${post.id}">
        <div class="loading">
          Loading comments...
        </div>
      </div>

      <div class="comment-input-row">

        <input
          id="comment-input-${post.id}"
          class="comment-input"
          placeholder="Write a comment..."
          onkeydown="
            if(event.key==='Enter'){
              event.preventDefault();
              addComment(${post.id});
            }
          "
        >

        <button
          class="comment-send"
          onclick="addComment(${post.id})"
        >
          Send
        </button>

      </div>

    </div>

  </article>

  `;
}

/* =========================
   POST ACTION
========================= */

async function togglePostAction(postId,actionType){

  if(!currentUser)return;

  const {data:existing,error:findError}=
    await supabaseClient
      .from("post_actions")
      .select("id,action_type")
      .eq("post_id",postId)
      .eq("user_id",currentUser.id)
      .maybeSingle();

  if(findError){

    console.error(findError);
    alert(findError.message);
    return;
  }

  if(existing){

    if(existing.action_type===actionType){

      await supabaseClient
        .from("post_actions")
        .delete()
        .eq("id",existing.id);

    }else{

      await supabaseClient
        .from("post_actions")
        .update({
          action_type:actionType
        })
        .eq("id",existing.id);

    }

  }else{

    await supabaseClient
      .from("post_actions")
      .insert({
        post_id:postId,
        user_id:currentUser.id,
        action_type:actionType
      });

  }

  await loadFeed();
}

async function toggleComments(postId){

      "comments-"+postId

  if(box.style.display==="block"){

    box.style.display="none";
    return;

  }

  box.style.display="block";

  await loadComments(postId);
}


async function loadComments(postId){

  const list=
    document.getElementById(
      "comment-list-"+postId
    );

  if(!list)return;

  const {
    data:comments,
    error
  }=await supabaseClient
    .from("comments")
    .select("*")
    .eq("post_id",postId)
    .order("created_at",{ascending:true});

  if(error){

    list.innerHTML=
      `<div style="font-size:12px;color:#c00">
        ${escapeHTML(error.message)}
      </div>`;

    return;
  }

  if(!comments?.length){

    list.innerHTML=
      `<div style="font-size:12px;color:#888">
        No comments yet.
      </div>`;

    return;
  }

  const ids=[
    ...new Set(
      comments
        .map(c=>c.user_id)
        .filter(Boolean)
    )
  ];

  let profiles=[];

  if(ids.length){

    const result=
      await supabaseClient
        .from("profiles")
        .select("id,avatar_url,username,name")
        .in("id",ids);

    profiles=result.data||[];
  }

  const map={};

  profiles.forEach(p=>{
    map[p.id]=p;
  });

  list.innerHTML="";

  comments.forEach(comment=>{

    const profile=
      map[comment.user_id]||{
        username:comment.username||"user",
        name:comment.username||"User",
        avatar_url:"https://via.placeholder.com/80"
      };

    const own=
      comment.user_id===currentUser.id;

    const row=document.createElement("div");

    row.className="comment-row";

    row.innerHTML=`

      <img
        class="comment-avatar"
        src="${escapeAttribute(
          profile.avatar_url ||
          "https://via.placeholder.com/80"
        )}"
      >

      <div class="comment-body">

        <div class="comment-name">
          ${escapeHTML(
            profile.name ||
            profile.username ||
            comment.username ||
            "User"
          )}
          <span style="font-weight:normal;color:#888">
            @${escapeHTML(
              profile.username ||
              comment.username ||
              "user"
            )}
          </span>
        </div>

        <div class="comment-text">
          ${escapeHTML(
            comment.comment ||
            ""
          )}
        </div>

        <div class="comment-tools">

          ${
            !own
            ?
            `
            <button
              onclick="startReply(
                '${escapeAttribute(comment.user_id)}',
                '${escapeAttribute(
                  profile.username ||
                  comment.username ||
                  "user"
                )}'
              )"
            >
              Reply
            </button>
            `
            :
            ""
          }

          ${
            own
            ?
            `
            <button
              onclick="deleteComment(
                ${comment.id},
                ${postId}
              )"
            >
              Delete
            </button>
            `
            :
            ""
          }

        </div>

      </div>

    `;

    list.appendChild(row);

  });

}


async function addComment(postId){

  const input=
    document.getElementById(
      "comment-input-"+postId
    );

  if(!input)return;

  const text=
    input.value.trim();

  if(!text)return;

  const {error}=
    await supabaseClient
      .from("comments")
      .insert({
        post_id:postId,
        user_id:currentUser.id,
        username:
          currentProfile?.username||
          currentUser.email||
          "user",
        comment:text
      });

  if(error){

    alert(error.message);
    return;
  }

  input.value="";

  await loadComments(postId);
  await loadFeed();

}


async function deleteComment(commentId,postId){

  if(!confirm("Delete this comment?"))
    return;

  const {error}=
    await supabaseClient
      .from("comments")
      .delete()
      .eq("id",commentId)
      .eq("user_id",currentUser.id);

  if(error){

    alert(error.message);
    return;
  }

  await loadComments(postId);
  await loadFeed();
}

    document.getElementById("imagePreview");

  if(!input.files?.length)
    return;

  const file=input.files[0];

  if(imageObjectUrl){

  imageObjectUrl=
    URL.createObjectURL(file);

  preview.src=imageObjectUrl;
  preview.style.display="block";

async function sendImagePost(){

  const fileInput=
    document.getElementById("imageFile");

  const captionInput=
    document.getElementById("imageCaption");

  if(!fileInput.files?.length){

    alert("Pehle image select karein.");
    return;
  }

  const file=
    fileInput.files[0];

  const extension=
    file.name.split(".").pop()||
    "jpg";

  const fileName=
    currentUser.id+
    "_"+
    Date.now()+
    "."+
    extension;

  const filePath=
    "posts/"+fileName;

  const {error:uploadError}=
    await supabaseClient
      .storage
      .from("post-images")
      .upload(
        filePath,
        file,
        {
          cacheControl:"3600",
          upsert:false,
          contentType:file.type
        }
      );

  if(uploadError){

    alert(
      "Image upload nahi hui:\n\n"+
      uploadError.message
    );

    return;
  }

  const {data:publicData}=
    supabaseClient
      .storage
      .from("post-images")
      .getPublicUrl(filePath);

  const imageUrl=
    publicData?.publicUrl||"";

  if(!imageUrl){

    alert("Image URL nahi mili.");
    return;
  }

  const caption=
    captionInput.value.trim();

  const {error:postError}=
    await supabaseClient
      .from("posts")
      .insert({

        user_id:currentUser.id,

        username:
          currentProfile?.username||
          "user",

        content:caption,

        post_type:"image",

        image_url:imageUrl

      });

  if(postError){

    alert(postError.message);
    return;
  }

  closeImagePost();

  await loadFeed(true);
}

async function recordVoice(){

  if(!currentUser){

    alert("Please login first.");
    return;
  }

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    alert(
      "Is browser mein voice recording supported nahi hai."
    );

    return;
  }

  try{

    voiceDiscarded=false;

    voiceStream=
      await navigator.mediaDevices
        .getUserMedia({
          audio:true
        });

    voiceChunks=[];

    const mimeCandidates=[
      "audio/webm;codecs=opus",
      "audio/webm",
      "audio/mp4",
      "audio/ogg;codecs=opus"
    ];

    voiceMimeType="";

    for(
      const type of mimeCandidates
    ){

      if(
        window.MediaRecorder &&
        MediaRecorder.isTypeSupported(type)
      ){

        voiceMimeType=type;
        break;

      }

    }

    voiceRecorder=
      voiceMimeType
      ?
      new MediaRecorder(
        voiceStream,
        {
          mimeType:voiceMimeType
        }
      )
      :
      new MediaRecorder(
        voiceStream
      );

    const recorder=voiceRecorder;

    recorder.ondataavailable=
      function(event){

        if(
          event.data &&
          event.data.size>0
        ){

          voiceChunks.push(
            event.data
          );

        }

      };

    recorder.onstop=
      function(){

        stopVoiceStream();
        clearVoiceTimer();

        if(voiceDiscarded)
          return;

        voiceBlob=
          new Blob(
            voiceChunks,
            {
              type:
                voiceMimeType||
                "audio/webm"
            }
          );

        if(!voiceBlob.size)
          return;

        const preview=
          document.getElementById(
            "voicePreview"
          );

        const previewBox=
          document.getElementById(
            "voicePreviewBox"
          );

        if(preview){

          if(preview.src)
            URL.revokeObjectURL(
              preview.src
            );

          preview.src=
            URL.createObjectURL(
              voiceBlob
            );

        }

        if(previewBox)
          previewBox.style.display="block";

        const status=
          document.getElementById(
            "voiceStatus"
          );

        if(status)
          status.textContent=
            "Voice note ready ✓";

        const recordBtn=
          document.getElementById(
            "recordVoiceBtn"
          );

        if(recordBtn){

          recordBtn.disabled=false;
          recordBtn.textContent=
            "🎙️ Record Again";
          recordBtn.style.background=
            "#6c5ce7";

        }

        const sendBtn=
          document.getElementById(
            "sendVoiceBtn"
          );

        if(sendBtn){

          sendBtn.disabled=false;
          sendBtn.style.opacity="1";

        }

      };

    recorder.start();

    voiceStartTime=
      Date.now();

    voiceDuration=0;

    startVoiceTimer();

    const status=
      document.getElementById(
        "voiceStatus"
      );

    if(status)
      status.textContent=
        "🔴 Recording...";

    const recordBtn=
      document.getElementById(
        "recordVoiceBtn"
      );

    if(recordBtn){

      recordBtn.disabled=true;
      recordBtn.textContent=
        "🔴 Recording...";
      recordBtn.style.background=
        "#e53935";

    }

    const stopBtn=
      document.getElementById(
        "stopVoiceBtn"
      );

    if(stopBtn)
      stopBtn.disabled=false;

  }catch(error){

    console.error(
      "Voice recording error:",
      error
    );

    stopVoiceStream();

    alert(
      "Microphone access nahi mil saka.\n\n"+
      (
        error.message||
        "Please microphone permission allow karein."
      )
    );

  }

}


function stopVoice(){

  if(
    voiceRecorder &&
    voiceRecorder.state==="recording"
  ){

    voiceRecorder.stop();

  }

  clearVoiceTimer();

  const stopBtn=
    document.getElementById(
      "stopVoiceBtn"
    );

  if(stopBtn)
    stopBtn.disabled=true;

}


function startVoiceTimer(){

  clearVoiceTimer();

  voiceTimerInterval=
    setInterval(
      function(){

        if(!voiceStartTime)
          return;

        const seconds=
          Math.floor(
            (
              Date.now()-
              voiceStartTime
            )/1000
          );

        voiceDuration=seconds;

        const minutes=
          Math.floor(
            seconds/60
          );

        const remaining=
          seconds%60;

        const timer=
          document.getElementById(
            "voiceTimer"
          );

        if(timer){

          timer.textContent=
            String(minutes).padStart(2,"0")+
            ":"+
            String(remaining).padStart(2,"0");

        }

      },
      250
    );

}


function clearVoiceTimer(){

  if(voiceTimerInterval){

    clearInterval(
      voiceTimerInterval
    );

    voiceTimerInterval=null;

  }

}


function stopVoiceStream(){

  if(voiceStream){

    voiceStream
      .getTracks()
      .forEach(
        track=>{
          try{
            track.stop();
          }catch(e){}
        }
      );

    voiceStream=null;

  }

}


async function sendVoiceNote(){

  if(!currentUser){

    alert("Please login first.");
    return;
  }

  if(!voiceBlob){

    alert(
      "Pehle voice note record karein."
    );

    return;
  }

  if(!voiceDuration)
    voiceDuration=1;

  const sendBtn=
    document.getElementById(
      "sendVoiceBtn"
    );

  if(sendBtn){

    sendBtn.disabled=true;
    sendBtn.textContent=
      "⏳ Sending...";

  }

  try{

    let extension="webm";

    if(
      voiceMimeType.includes("mp4")
    ){

      extension="m4a";

    }else if(
      voiceMimeType.includes("ogg")
    ){

      extension="ogg";

    }

    const fileName=
      currentUser.id+
      "_"+
      Date.now()+
      "."+
      extension;

    const filePath=
      "voices/"+fileName;

    const {
      error:uploadError
    }=
      await supabaseClient
        .storage
        .from("voice-posts")
        .upload(
          filePath,
          voiceBlob,
          {
            cacheControl:"3600",
            upsert:false,
            contentType:
              voiceMimeType||
              "audio/webm"
          }
        );

    if(uploadError)
      throw new Error(
        "Voice upload nahi hui.\n\n"+
        uploadError.message
      );

    const {
      data:publicData
    }=
      supabaseClient
        .storage
        .from("voice-posts")
        .getPublicUrl(filePath);

    const voiceUrl=
      publicData?.publicUrl||"";

    if(!voiceUrl)
      throw new Error(
        "Voice URL nahi mili."
      );

    const {
      error:postError
    }=
      await supabaseClient
        .from("posts")
        .insert({

          user_id:
            currentUser.id,

          username:
            currentProfile?.username||
            "user",

          content:"",

          post_type:"voice",

          voice_url:voiceUrl,

          voice_duration:
            voiceDuration

        });

    if(postError)
      throw postError;

    closeVoiceRecorder();

    await loadFeed(true);

  }catch(error){

    console.error(
      "Send voice error:",
      error
    );

    alert(
      "Voice note send nahi hui:\n\n"+
      error.message
    );

    if(sendBtn){

      sendBtn.disabled=false;
      sendBtn.textContent=
        "📤 Send Voice";

    }

  }

}

async function deletePost(postId){

  if(
    !confirm(
      "Apni post delete karna chahte hain?"
    )
  )
    return;

  const {error}=
    await supabaseClient
      .from("posts")
      .delete()
      .eq("id",postId)
      .eq("user_id",currentUser.id);

  if(error){

    alert(error.message);
    return;
  }

  await loadFeed(true);
}


/* =========================
   FOLLOW
========================= */

async function toggleFollow(userId,button){

  if(!userId || userId===currentUser.id)
    return;

  const {
    data:existing
  }=
    await supabaseClient
      .from("user_follows")
      .select("follower_id")
      .eq("follower_id",currentUser.id)
      .eq("following_id",userId)
      .maybeSingle();

  if(existing){

    const {error}=
      await supabaseClient
        .from("user_follows")
        .delete()
        .eq("follower_id",currentUser.id)
        .eq("following_id",userId);

    if(error){

      alert(error.message);
      return;
    }

    if(button)
      button.textContent="＋ Follow";

  }else{

    const {error}=
      await supabaseClient
        .from("user_follows")
        .insert({

          follower_id:
            currentUser.id,

          following_id:
            userId

        });

    if(error){

      alert(error.message);
      return;
    }

    if(button)
      button.textContent="✓ Following";

  }

}

========================= */

async function blockUser(userId){

  if(!userId)return;

  if(
    !confirm(
      "Is user ko block karna hai?"
    )
  )
    return;

  const {error}=
    await supabaseClient
      .from("user_blocks")
      .insert({

        blocker_id:
          currentUser.id,

        blocked_id:
          userId

      });

  if(error){

    if(
      !String(error.message)
        .toLowerCase()
        .includes("duplicate")
    ){

      alert(error.message);
      return;

    }

  }

  await loadFeed(true);
}

/* =========================
   TRENDING
========================= */

async function openTrending(){

  const overlay=
    document.getElementById(
      "trendingOverlay"
    );

  overlay.style.display="flex";

  const list=
    document.getElementById(
      "trendingList"
    );

  list.innerHTML=
    `<div class="loading">
      Loading...
    </div>`;

  const {
    data,
    error
  }=
    await supabaseClient
      .from("posts")
      .select("content,created_at")
      .not("content","is",null)
      .order("created_at",{ascending:false})
      .limit(10);

  if(error){

    list.innerHTML=
      `<div style="color:#c00;font-size:12px">
        ${escapeHTML(error.message)}
      </div>`;

    return;
  }

  if(!data?.length){

    list.innerHTML=
      `<div style="font-size:12px;color:#888">
        No trending posts yet.
      </div>`;

    return;
  }

  list.innerHTML="";

  data.forEach(post=>{

    if(!post.content)return;

    const div=
      document.createElement("div");

    div.className=
      "trending-item";

    div.textContent=
      post.content;

    list.appendChild(div);

  });

}


function closeTrending(){

  document.getElementById(
    "trendingOverlay"
  ).style.display="none";

}
