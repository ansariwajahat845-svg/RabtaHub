<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://jhcpqjmxiovvqbghpxbf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentUser = null;
let currentProfile = null;


/* =========================
   INIT
========================= */

async function init(){

  try{

    const {
      data,
      error
    } =
    await supabaseClient.auth.getSession();


    if(
      error ||
      !data.session
    ){

      window.location.href =
        "login.html";

      return;

    }


    currentUser =
      data.session.user;


    await loadProfile();

    await loadFeed();


  }catch(error){

    console.error(
      "INIT ERROR:",
      error
    );

  }

}


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(){

  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .from("profiles")
      .select(
        "id,username,name,avatar_url"
      )
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();


    if(error){

      console.error(
        "PROFILE ERROR:",
        error
      );

    }


    currentProfile =
      data || {

        id:
          currentUser.id,

        username:
          currentUser.user_metadata?.username ||
          currentUser.email?.split("@")[0] ||
          "User",

        name:
          currentUser.user_metadata?.name ||
          "",

        avatar_url:
          currentUser.user_metadata?.avatar_url ||
          ""

      };


    const username =
      currentProfile.username ||
      currentProfile.name ||
      currentUser.email?.split("@")[0] ||
      "User";


    const headerUser =
      document.getElementById(
        "headerUser"
      );


    if(headerUser){

      headerUser.textContent =
        "@" + username;

    }


  }catch(error){

    console.error(
      "LOAD PROFILE ERROR:",
      error
    );

  }

}


/* =========================
   SHARE MENU
========================= */

function toggleShareMenu(){

  const menu =
    document.getElementById(
      "shareMenu"
    );


  if(
    menu.style.display === "flex"
  ){

    menu.style.display =
      "none";

  }else{

    menu.style.display =
      "flex";

  }

}


/* =========================
   OPEN COMPOSER
========================= */

function openComposer(type){

  document
    .getElementById("shareMenu")
    .style.display =
    "none";


  document
    .getElementById("textComposer")
    .style.display =
    "none";


  document
    .getElementById("imageComposer")
    .style.display =
    "none";


  if(type === "text"){

    document
      .getElementById("textComposer")
      .style.display =
      "block";

  }


  if(type === "image"){

    document
      .getElementById("imageComposer")
      .style.display =
      "block";

  }

}


/* =========================
   CLOSE COMPOSER
========================= */

function closeComposer(){

  document
    .getElementById("textComposer")
    .style.display =
    "none";


  document
    .getElementById("imageComposer")
    .style.display =
    "none";


  document
    .getElementById("shareMenu")
    .style.display =
    "none";

}


/* =========================
   CREATE MESSAGE
========================= */

async function sendHomeMessage(){

  if(!currentUser){

    showNotice(
      "User session nahi mili."
    );

    return;

  }


  const input =
    document.getElementById(
      "homeMessage"
    );


  const message =
    input.value.trim();


  if(!message){

    showNotice(
      "Message likho."
    );

    return;

  }


  const {
    data,
    error
  } =
  await supabaseClient
    .from("posts")
    .insert({

      user_id:
        currentUser.id,

      content:
        message,

      post_type:
        "message",

      category:
        "General"

    })
    .select(`
      id,
      user_id,
      content,
      created_at,
      post_type,
      category,
      image_url
    `)
    .single();


  if(error){

    console.error(
      "MESSAGE ERROR:",
      error
    );

    showNotice(
      "Message send nahi hua: " +
      error.message
    );

    return;

  }


  input.value = "";


  await addPostToTop(
    data
  );


  showNotice(
    "Message sent! ❤️"
  );

}


/* =========================
   TEXT POST
========================= */

async function publishTextPost(){

  if(!currentUser){
    return;
  }


  const category =
    document
      .getElementById(
        "textCategory"
      )
      .value;


  const content =
    document
      .getElementById(
        "textContent"
      )
      .value
      .trim();


  if(!category){

    showNotice(
      "Pehle category select karo."
    );

    return;

  }


  if(!content){

    showNotice(
      "Post likho."
    );

    return;

  }


  const {
    data,
    error
  } =
  await supabaseClient
    .from("posts")
    .insert({

      user_id:
        currentUser.id,

      content:
        content,

      post_type:
        "text",

      category:
        category

    })
    .select(`
      id,
      user_id,
      content,
      created_at,
      post_type,
      category,
      image_url
    `)
    .single();


  if(error){

    console.error(
      "TEXT POST ERROR:",
      error
    );

    showNotice(
      "Post nahi hua: " +
      error.message
    );

    return;

  }


  document
    .getElementById(
      "textContent"
    )
    .value = "";


  document
    .getElementById(
      "textCategory"
    )
    .value = "";


  closeComposer();


  await addPostToTop(
    data
  );


  showNotice(
    "Post published! ❤️"
  );

}


/* =========================
   IMAGE PREVIEW
========================= */

function previewImage(input){

  const preview =
    document.getElementById(
      "imagePreview"
    );


  const file =
    input.files[0];


  if(!file){

    preview.style.display =
      "none";

    preview.removeAttribute(
      "src"
    );

    return;

  }


  preview.src =
    URL.createObjectURL(file);


  preview.style.display =
    "block";

}

   IMAGE POST
========================= */

async function publishImagePost(){

  if(!currentUser){
    return;
  }


  const category =
    document
      .getElementById(
        "imageCategory"
      )
      .value;


  const file =
    document
      .getElementById(
        "imageFile"
      )
      .files[0];


  const caption =
    document
      .getElementById(
        "imageCaption"
      )
      .value
      .trim();


  if(!category){

    showNotice(
      "Pehle category select karo."
    );

    return;

  }


  if(!file){

    showNotice(
      "Image select karo."
    );

    return;

  }


  if(
    !file.type.startsWith("image/")
  ){

    showNotice(
      "Sirf image file select karo."
    );

    return;

  }


  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase()
      .replace(
        /[^a-z0-9]/g,
        ""
      ) ||
      "jpg";


  const fileName =
    currentUser.id +
    "/" +
    Date.now() +
    "." +
    extension;


  showNotice(
    "Image uploading..."
  );


  const {
    error: uploadError
  } =
  await supabaseClient
    .storage
    .from("post-images")
    .upload(
      fileName,
      file
    );


  if(uploadError){

    console.error(
      "IMAGE UPLOAD ERROR:",
      uploadError
    );

    showNotice(
      "Image upload nahi hui: " +
      uploadError.message
    );

    return;

  }


  const {
    data: publicData
  } =
  supabaseClient
    .storage
    .from("post-images")
    .getPublicUrl(
      fileName
    );


  const imageUrl =
    publicData.publicUrl;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("posts")
    .insert({

      user_id:
        currentUser.id,

      content:
        caption,

      post_type:
        "image",

      category:
        category,

      image_url:
        imageUrl

    })
    .select(`
      id,
      user_id,
      content,
      created_at,
      post_type,
      category,
      image_url
    `)
    .single();


  if(error){

    console.error(
      "IMAGE POST ERROR:",
      error
    );

    showNotice(
      "Image post save nahi hui: " +
      error.message
    );

    return;

  }


  document
    .getElementById(
      "imageFile"
    )
    .value = "";


  document
    .getElementById(
      "imageCaption"
    )
    .value = "";


  document
    .getElementById(
      "imageCategory"
    )
    .value = "";


  const preview =
    document.getElementById(
      "imagePreview"
    );


  preview.style.display =
    "none";


  preview.removeAttribute(
    "src"
  );


  closeComposer();


  await addPostToTop(
    data
  );


  showNotice(
    "Image post published! ❤️"
  );

}

   ADD NEW POST TO TOP
========================= */

async function addPostToTop(post){

  const feed =
    document.getElementById(
      "feed"
    );


  if(!feed){
    return;
  }


  const empty =
    feed.querySelector(
      ".empty"
    );


  if(empty){

    feed.innerHTML = "";

  }


  let profile =
    currentProfile;


  if(
    !profile ||
    profile.id !== post.user_id
  ){

    const {
      data
    } =
    await supabaseClient
      .from("profiles")
      .select(
        "id,username,name,avatar_url"
      )
      .eq(
        "id",
        post.user_id
      )
      .maybeSingle();


    profile =
      data || {

        id:
          post.user_id,

        username:
          currentUser?.user_metadata?.username ||
          currentUser?.email?.split("@")[0] ||
          "User",

        name:
          currentUser?.user_metadata?.name ||
          "",

        avatar_url:
          ""

      };

  }


  const element =
    await renderPost(
      post,
      profile,
      false
    );


  if(!element){
    return;
  }


  feed.insertBefore(
    element,
    feed.firstElementChild
  );

}


/* =========================
   LOAD FEED
========================= */

async function loadFeed(){

  const feed =
    document.getElementById(
      "feed"
    );


  if(!feed){
    return;
  }


  feed.innerHTML =
    '<div class="loading">Loading feed...</div>';


  try{

    const {
      data:{
        user
      }
    } =
    await supabaseClient.auth.getUser();


    if(!user){

      window.location.href =
        "login.html";

      return;

    }


    currentUser =
      user;


    const {
      data: posts,
      error
    } =
    await supabaseClient
      .from("posts")
      .select(`
        id,
        user_id,
        content,
        created_at,
        post_type,
        category,
        image_url
      `)
      .order(
        "created_at",
        {
          ascending:false
        }
      )
      .order(
        "id",
        {
          ascending:false
        }
      );


    if(error){

      console.error(
        "FEED ERROR:",
        error
      );

      feed.innerHTML =
        `<div class="empty">
          Feed load nahi hua.<br><br>
          ${escapeHtml(
            error.message
          )}
        </div>`;

      return;

    }


    if(
      !posts ||
      posts.length === 0
    ){

      feed.innerHTML =
        `<div class="empty">
          Abhi koi post nahi hai.<br>
          Sabse pehli post aap karo! ❤️
        </div>`;

      return;

    }


    const userIds =
      [
        ...new Set(
          posts
            .map(
              post =>
                post.user_id
            )
            .filter(Boolean)
        )
      ];


    let profiles = [];


    if(userIds.length){

      const profileResult =
        await supabaseClient
          .from("profiles")
          .select(
            "id,username,name,avatar_url"
          )
          .in(
            "id",
            userIds
          );


      if(profileResult.error){

        console.error(
          "PROFILE LIST ERROR:",
          profileResult.error
        );

      }else{

        profiles =
          profileResult.data || [];

      }

    }


    const profileMap = {};


    profiles.forEach(
      profile => {

        profileMap[
          profile.id
        ] = profile;

      }
    );


    feed.innerHTML = "";


    for(
      const post of posts
    ){

      let profile =
        profileMap[
          post.user_id
        ];


      if(
        !profile &&
        post.user_id === currentUser.id
      ){

        profile =
          currentProfile;

      }


      if(!profile){

        profile = {

          id:
            post.user_id,

          username:
            "User",

          name:
            "User",

          avatar_url:
            ""

        };

      }


      const element =
        await renderPost(
          post,
          profile,
          false
        );


      if(element){

        feed.appendChild(
          element
        );

      }

    }


    console.log(
      "FEED LOADED:",
      posts.length
    );


  }catch(error){

    console.error(
      "FEED ERROR:",
      error
    );


    feed.innerHTML =
      `<div class="empty">
        Feed load nahi hua.<br><br>
        ${escapeHtml(
          error?.message ||
          String(error)
        )}
      </div>`;

  }

}


/* =========================
   RENDER POST
========================= */

async function renderPost(
  post,
  profile,
  appendToFeed = false
){

  try{

    const username =
      profile?.username ||
      profile?.name ||
      currentUser?.user_metadata?.username ||
      currentUser?.email?.split("@")[0] ||
      "User";


    const name =
      profile?.name ||
      username;


    const firstLetter =
      (
        name ||
        username ||
        "U"
      )
        .charAt(0)
        .toUpperCase();


    const ownPost =
      post.user_id ===
      currentUser.id;


    /* =========================
       COUNTS
    ========================= */

    const [
      likeResult,
      dislikeResult,
      commentResult
    ] =
    await Promise.all([

      supabaseClient
        .from("likes")
        .select(
          "id",
          {
            count:"exact",
            head:true
          }
        )
        .eq(
          "post_id",
          post.id
        ),

      supabaseClient
        .from("dislikes")
        .select(
          "id",
          {
            count:"exact",
            head:true
          }
        )
        .eq(
          "post_id",
          post.id
        ),

      supabaseClient
        .from("comments")
        .select(
          "id",
          {
            count:"exact",
            head:true
          }
        )
        .eq(
          "post_id",
          post.id
        )

    ]);


    const likeCount =
      likeResult.count || 0;


    const dislikeCount =
      dislikeResult.count || 0;


    const commentCount =
      commentResult.count || 0;


    const div =
      document.createElement(
        "article"
      );


    div.className =
      "post";


    div.dataset.postId =
      post.id;


    /* =========================
       AVATAR
    ========================= */

    let avatarHtml = "";


    if(
      profile?.avatar_url &&
      String(
        profile.avatar_url
      ).trim()
    ){

      avatarHtml =
        `<img
          src="${escapeAttribute(
            profile.avatar_url
          )}"
          alt="Avatar"
          onerror="this.style.display='none';this.parentElement.textContent='${escapeAttribute(firstLetter)}';">`;

    }else{

      avatarHtml =
        escapeHtml(
          firstLetter
        );

    }


    /* =========================
       IMAGE
    ========================= */

    let media = "";


    if(
      post.post_type === "image" &&
      post.image_url
    ){

      media =
        `<img
          class="post-image"
          src="${escapeAttribute(
            post.image_url
          )}"
          alt="Post image">`;

    }


    /* =========================
       MESSAGE LABEL
    ========================= */

    const messageLabel =
      post.post_type === "message"
        ?
        `<div class="message-label">
          💬 Home Message
        </div>`
        :
        "";


    /* =========================
       CATEGORY
    ========================= */

    const categoryHtml =
      post.post_type !== "message"
        ?
        `<div class="category">
          ${escapeHtml(
            post.category ||
            "General"
          )}
        </div>`
        :
        "";


    /* =========================
       CONTENT
    ========================= */

    const contentHtml =
      post.content
        ?
        `<div class="post-content">
          ${escapeHtml(
            post.content
          )}
        </div>`
        :
        "";


    /* =========================
       CARD HTML
    ========================= */

    div.innerHTML = `

      <div class="post-header">

        <div class="avatar">
          ${avatarHtml}
        </div>


        <div class="user-info">

          <div class="username">
            ${escapeHtml(
              username
            )}
          </div>

          <div class="date">
            ${formatDate(
              post.created_at
            )}
          </div>

        </div>

      </div>


      ${messageLabel}


      ${categoryHtml}


      ${contentHtml}


      ${media}


      <div class="actions">

        <button
          class="action-btn"
          onclick="toggleLike(${post.id})">

          ❤️ Like
          <span id="like-${post.id}">
            ${likeCount}
          </span>

        </button>


        <button
          class="action-btn"
          onclick="toggleDislike(${post.id})">

          👎 Dislike
          <span id="dislike-${post.id}">
            ${dislikeCount}
          </span>

        </button>


        <button
          class="action-btn"
          onclick="openComments(${post.id})">

          💬 Comments
          <span id="comment-${post.id}">
            ${commentCount}
          </span>

        </button>


        ${
          ownPost
          ?
          `<button
            class="action-btn delete-btn"
            onclick="deletePost(${post.id})">

            🗑️ Delete

          </button>`
          :
          ""
        }

      </div>


      <!-- COMMENTS -->

      <div
        class="comments-box"
        id="comments-box-${post.id}">

        <div
          class="comments-list"
          id="comments-list-${post.id}">

          <div class="comment-empty">
            Comments open karne ke liye button dabao.
          </div>

        </div>


        <div class="comment-row">

          <textarea
            id="comment-input-${post.id}"
            class="comment-input"
            maxlength="500"
            placeholder="Write a comment..."></textarea>

          <button
            class="comment-send"
            onclick="addComment(${post.id})">

            ➤

          </button>

        </div>

      </div>

    `;


    if(appendToFeed){

      const feed =
        document.getElementById(
          "feed"
        );

      if(feed){

        feed.appendChild(
          div
        );

      }

    }


    return div;


  }catch(error){

    console.error(
      "RENDER POST ERROR:",
      error
    );

    return null;

  }

}

async function toggleLike(postId){

  if(!currentUser){
    return;
  }


  const {
    data: existing,
    error: findError
  } =
  await supabaseClient
    .from("likes")
    .select("id")
    .eq(
      "post_id",
      postId
    )
    .eq(
      "user_id",
      currentUser.id
    )
    .maybeSingle();


  if(findError){

    console.error(
      "LIKE FIND ERROR:",
      findError
    );

    showNotice(
      "Like check nahi ho saka."
    );

    return;

  }


  if(existing){

    const {
      error
    } =
    await supabaseClient
      .from("likes")
      .delete()
      .eq(
        "id",
        existing.id
      );


    if(error){

      showNotice(
        "Like remove nahi hua: " +
        error.message
      );

      return;

    }

  }else{

    const {
      error: dislikeError
    } =
    await supabaseClient
      .from("dislikes")
      .delete()
      .eq(
        "post_id",
        postId
      )
      .eq(
        "user_id",
        currentUser.id
      );


    if(dislikeError){

      showNotice(
        "Dislike remove nahi hua: " +
        dislikeError.message
      );

      return;

    }


    const {
      error: likeError
    } =
    await supabaseClient
      .from("likes")
      .insert({

        post_id:
          postId,

        user_id:
          currentUser.id

      });


    if(likeError){

      showNotice(
        "Like nahi hua: " +
        likeError.message
      );

      return;

    }

  }


  await loadFeed();

}

/* =========================
   LOAD COMMENTS
========================= */

async function loadComments(postId){

  const list =
    document.getElementById(
      "comments-list-" + postId
    );


  if(!list){
    return;
  }


  list.innerHTML =
    `<div class="comment-empty">
      Loading comments...
    </div>`;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("comments")
    .select(`
      id,
      post_id,
      user_id,
      comment,
      created_at
    `)
    .eq(
      "post_id",
      postId
    )
    .order(
      "created_at",
      {
        ascending:true
      }
    )
    .order(
      "id",
      {
        ascending:true
      }
    );


  if(error){

    console.error(
      "COMMENTS LOAD ERROR:",
      error
    );


    list.innerHTML =
      `<div class="comment-empty">
        Comments load nahi ho sake.
      </div>`;

    return;

  }


  const comments =
    data || [];


  /* =========================
     UPDATE COMMENT COUNT
  ========================= */

  const countElement =
    document.getElementById(
      "comment-" + postId
    );


  if(countElement){

    countElement.textContent =
      comments.length;

  }


  if(comments.length === 0){

    list.innerHTML =
      `<div class="comment-empty">
        Abhi koi comment nahi hai.
      </div>`;

    return;

  }


  /* =========================
     GET USER IDS
  ========================= */

  const userIds =
    [
      ...new Set(
        comments
          .map(
            item =>
              item.user_id
          )
          .filter(Boolean)
      )
    ];


  let profiles = [];


  if(userIds.length){

    const {
      data: profileData,
      error: profileError
    } =
    await supabaseClient
      .from("profiles")
      .select(
        "id,username,name,avatar_url"
      )
      .in(
        "id",
        userIds
      );


    if(profileError){

      console.error(
        "COMMENT PROFILE ERROR:",
        profileError
      );

    }else{

      profiles =
        profileData || [];

    }

  }


  const profileMap = {};


  profiles.forEach(
    profile => {

      profileMap[
        profile.id
      ] = profile;

    }
  );


  /* =========================
     RENDER COMMENTS
  ========================= */

  list.innerHTML =
    comments
      .map(
        item => {

          const profile =
            profileMap[
              item.user_id
            ];


          const username =
            profile?.username ||
            profile?.name ||
            (
              item.user_id ===
              currentUser?.id
              ?
              currentProfile?.username
              :
              ""
            ) ||
            "User";


          const name =
            profile?.name ||
            username;


          const firstLetter =
            (
              name ||
              username ||
              "U"
            )
              .charAt(0)
              .toUpperCase();


          let avatarHtml =
            "";


          if(
            profile?.avatar_url &&
            String(
              profile.avatar_url
            ).trim()
          ){

            avatarHtml =
              `<img
                src="${escapeAttribute(
                  profile.avatar_url
                )}"
                alt="Avatar"
                onerror="this.style.display='none';this.parentElement.textContent='${escapeAttribute(firstLetter)}';">`;

          }else{

            avatarHtml =
              escapeHtml(
                firstLetter
              );

          }


          const ownComment =
            item.user_id ===
            currentUser?.id;


          return `

            <div
              class="comment-item"
              data-comment-id="${item.id}">

              <div class="comment-avatar">

                ${avatarHtml}

              </div>


              <div class="comment-body">

                <div class="comment-top">

                  <span
                    class="comment-username">

                    ${escapeHtml(
                      username
                    )}

                  </span>


                  <span
                    class="comment-time">

                    ${formatDate(
                      item.created_at
                    )}

                  </span>

                </div>


                <div
                  class="comment-text">

                  ${escapeHtml(
                    item.comment
                  )}

                </div>


                ${
                  ownComment
                  ?
                  `<button
                    class="comment-delete"
                    onclick="deleteComment(${item.id},${postId})">

                    🗑️ Delete

                  </button>`
                  :
                  ""
                }

              </div>

            </div>

          `;

        }
      )
      .join("");

}


/* =========================
   ADD COMMENT
========================= */

async function addComment(postId){

  if(!currentUser){

    showNotice(
      "Login required."
    );

    return;

  }


  const input =
    document.getElementById(
      "comment-input-" + postId
    );


  if(!input){
    return;
  }


  const comment =
    input.value.trim();


  if(!comment){

    showNotice(
      "Comment likho."
    );

    return;

  }


  if(comment.length > 500){

    showNotice(
      "Comment bohat lamba hai."
    );

    return;

  }


  const {
    data,
    error
  } =
  await supabaseClient
    .from("comments")
    .insert({

      post_id:
        postId,

      user_id:
        currentUser.id,

      comment:
        comment

    })
    .select(`
      id,
      post_id,
      user_id,
      comment,
      created_at
    `)
    .single();


  if(error){

    console.error(
      "COMMENT ADD ERROR:",
      error
    );


    showNotice(
      "Comment add nahi hua: " +
      error.message
    );

    return;

  }


  input.value = "";


  await loadComments(
    postId
  );


  showNotice(
    "Comment added! ❤️"
  );

}

    .eq(
      "id",
      postId
    )
    .eq(
      "user_id",
      currentUser.id
    );


  if(error){

    console.error(
      "DELETE ERROR:",
      error
    );

    showNotice(
      "Post delete nahi hua: " +
      error.message
    );

    return;

  }


  const card =
    document.querySelector(
      `.post[data-post-id="${postId}"]`
    );


  if(card){

    card.remove();

  }


  const feed =
    document.getElementById(
      "feed"
    );


  if(
    feed &&
    !feed.querySelector(".post")
  ){

    feed.innerHTML =
      `<div class="empty">
        Abhi koi post nahi hai.<br>
        Sabse pehli post aap karo! ❤️
      </div>`;

  }


  showNotice(
    "Post deleted."
  );

}


/* =========================
   DATE
========================= */

function formatDate(date){

  const now =
    new Date();


  const created =
    new Date(date);


  const seconds =
    Math.floor(
      (now - created) /
      1000
    );


  if(seconds < 60){

    return "Just now";

  }


  const minutes =
    Math.floor(
      seconds / 60
    );


  if(minutes < 60){

    return minutes + "m ago";

  }


  const hours =
    Math.floor(
      minutes / 60
    );


  if(hours < 24){

    return hours + "h ago";

  }


  const days =
    Math.floor(
      hours / 24
    );


  if(days < 7){

    return days + "d ago";

  }


  return created.toLocaleDateString();

}


/* =========================
   NOTICE
========================= */

function showNotice(message){

  const notice =
    document.getElementById(
      "notice"
    );


  if(!notice){
    return;
  }


  notice.textContent =
    message;


  notice.style.display =
    "block";


  clearTimeout(
    window.noticeTimer
  );


  window.noticeTimer =
    setTimeout(
      function(){

        notice.style.display =
          "none";

      },
      2500
    );

}


/* =========================

========================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
