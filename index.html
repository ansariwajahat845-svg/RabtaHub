<script>
// FAST VERSION - Optimized
const SUPABASE_URL="https://jhcpqjmxiovvqbghpxbf.supabase.co";
const SUPABASE_KEY="sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null,profileMap={},followMap={},roleMap={},pointsMap={},currentPosts=[],onlineChannel=null,pageSize=15,currentPage=0,isLoading=false,hasMore=true;
let activeCommentReply={postId:null,commentId:null,username:null};
let voiceRecorder=null,voiceStream=null,voiceChunks=[],voiceBlob=null,voiceTimerInterval=null,voiceSeconds=0,voiceMimeType="audio/webm",voiceSession=0;

async function init(){
 try{
  const {data}=await supabaseClient.auth.getSession();
  currentUser=data.session?.user||null;
  if(!currentUser){window.location.href="login.html";return;}
  loadOnlineUsers();
  await loadFeed(false);
  await loadPointsBoard();
  // infinite scroll
  window.addEventListener('scroll', ()=>{ if(window.innerHeight+window.scrollY >= document.body.offsetHeight-800 && hasMore && !isLoading){ loadMore(); } });
 }catch(e){document.getElementById("feed").innerHTML=`<div class="empty">Could not load feed.<br><small>${e.message}</small></div>`;}
}

async function loadPointsBoard(){
 const board=document.getElementById("pointsLeaderboard"); if(!board)return;
 try{
  const {data:rows}=await supabaseClient.from("member_points").select("user_id,points").order("points",{ascending:false}).limit(10);
  const list=Array.isArray(rows)?rows:[];
  const mine=list.find(x=>x.user_id===currentUser?.id);
  if(mine) document.getElementById("myPoints").textContent=Number(mine.points||0).toLocaleString();
  else{ const {data:own}=await supabaseClient.from("member_points").select("points").eq("user_id",currentUser.id).maybeSingle(); document.getElementById("myPoints").textContent=Number(own?.points||0).toLocaleString(); }
  if(!list.length){board.innerHTML='<div class="points-note">Points ranking will appear soon.</div>';return;}
  const ids=list.map(x=>x.user_id); const {data:profiles}=await supabaseClient.from("profiles").select("id,username,name").in("id",ids);
  const names={};(profiles||[]).forEach(p=>names[p.id]=p.username||p.name||"Member");
  board.innerHTML=list.map((x,i)=>`<div class="points-row"><span style="width:22px;color:#7c3aed;font-weight:bold">${i+1}.</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(names[x.user_id]||"Member")}${x.user_id===currentUser?.id?' (You)':''}</span><span style="color:#7044bd;font-weight:bold">${Number(x.points||0).toLocaleString()} pts</span></div>`).join("");
 }catch(e){document.getElementById("myPoints").textContent="—"; board.innerHTML='<div class="points-note">Points setup required.</div>';}
}

async function loadOnlineUsers(){
 if(!currentUser)return;
 try{
  if(onlineChannel) await supabaseClient.removeChannel(onlineChannel);
  onlineChannel=supabaseClient.channel("chatzone-online-users",{config:{presence:{key:String(currentUser.id)}}});
  onlineChannel.on("presence",{event:"sync"},()=>renderOnlineUsers()).on("presence",{event:"join"},()=>renderOnlineUsers()).on("presence",{event:"leave"},()=>renderOnlineUsers());
  onlineChannel.subscribe(async status=>{ if(status==="SUBSCRIBED"){ await onlineChannel.track({user_id:String(currentUser.id),online_at:new Date().toISOString()}); renderOnlineUsers(); } });
 }catch(e){console.error(e);}
}
async function renderOnlineUsers(){
 if(!onlineChannel||!currentUser)return;
 try{
  const state=onlineChannel.presenceState(); const ids=[]; Object.keys(state).forEach(key=>{ (state[key]||[]).forEach(entry=>{ const id=entry.user_id||key; if(id&&!ids.includes(id)) ids.push(id); }); });
  if(!ids.includes(currentUser.id)) ids.push(currentUser.id);
  document.getElementById("onlineCount").textContent=ids.length;
  const container=document.getElementById("onlineUsers"); if(!container)return;
  let profiles={}; if(ids.length){ const {data}=await supabaseClient.from("profiles").select("id,username,name,avatar_url").in("id",ids); if(data) data.forEach(p=>profiles[p.id]=p); }
  container.innerHTML=ids.map(id=>{ const profile=profiles[id]||{}; let username=profile.username||profile.name|| (id===currentUser.id ? (currentUser.user_metadata?.username||currentUser.email?.split("@")[0]||"User") : "User"); const avatar=profile.avatar_url||""; const avatarHTML=avatar?`<img class="online-user-avatar" src="${escapeAttribute(avatar)}" loading="lazy">`:`<div class="online-user-avatar" style="display:flex;align-items:center;justify-content:center">👤</div>`; return `<div class="online-user" onclick="openOnlineProfile('${escapeJs(id)}')">${avatarHTML}<span class="online-dot"></span><span class="online-user-name">${escapeHtml(username)}</span></div>`; }).join("");
 }catch(e){console.error(e);}
}
function openOnlineProfile(userId){ if(!userId)return; window.location.href="profile.html?user="+encodeURIComponent(userId); }

// ---- OPTIMIZED FEED ----

// ---- ULTRA RESILIENT FAST FEED - FIXED LOADING ISSUE ----
async function loadFeed(preserveScroll=false, append=false){
 if(isLoading) return; isLoading=true;
 const feed=document.getElementById("feed");
 try{
  if(!append){ currentPage=0; hasMore=true; feed.innerHTML='<div class="loading skeleton" style="height:120px;border-radius:14px;margin:12px"></div><div class="loading skeleton" style="height:120px;border-radius:14px;margin:12px"></div>'; }
  const from=currentPage*pageSize; const to=from+pageSize-1;
  let postsData=null;
  try{
    const res = await supabaseClient.from("posts").select("id,user_id,content,created_at,post_type,category,image_url,voice_url,voice_duration").order("created_at",{ascending:false}).range(from,to);
    if(res.error) throw res.error;
    postsData=res.data;
  }catch(e1){
    const res2 = await supabaseClient.from("posts").select("id,user_id,content,created_at,post_type,category,image_url").order("created_at",{ascending:false}).range(from,to);
    if(res2.error) throw res2.error;
    postsData=res2.data;
  }
  const safePosts=Array.isArray(postsData)?postsData:[];
  if(safePosts.length<pageSize) hasMore=false; 
  if(hasMore) document.getElementById("loadMoreBtn").style.display="block"; else document.getElementById("loadMoreBtn").style.display="none";
  if(safePosts.length===0 && !append){ feed.innerHTML='<div class="empty">There are no posts yet.</div>'; isLoading=false; return; }
  const postIds=safePosts.map(p=>p.id); 
  const userIds=[...new Set(safePosts.map(p=>p.user_id).filter(Boolean))];
  let profilesData=[], followsData=[], actionsData=[], commentsData=[], pointsData=[], rolesData=[], adminData=[];
  try{ if(userIds.length){ const r=await supabaseClient.from("profiles").select("id,username,name,avatar_url").in("id",userIds); profilesData=r.data||[]; } }catch(e){}
  try{ if(currentUser&&userIds.length){ const r=await supabaseClient.from("user_follows").select("following_id").eq("follower_id",currentUser.id).in("following_id",userIds); followsData=r.data||[]; } }catch(e){}
  try{ if(postIds.length){ const r=await supabaseClient.from("post_actions").select("post_id,action_type").in("post_id",postIds); actionsData=r.data||[]; } }catch(e){}
  try{ if(postIds.length){ const r=await supabaseClient.from("comments").select("post_id").in("post_id",postIds); commentsData=r.data||[]; } }catch(e){}
  try{ if(userIds.length){ const r=await supabaseClient.from("member_points").select("user_id,points").in("user_id",userIds); pointsData=r.data||[]; } }catch(e){}
  try{ const r=await supabaseClient.from("user_roles").select("*").limit(100); rolesData=r.data||[]; }catch(e){}
  try{ const r=await supabaseClient.from("chatzone_admins").select("user_id,role").limit(100); adminData=r.data||[]; }catch(e){}
  if(!append){ profileMap={}; followMap={}; pointsMap={}; roleMap={}; }
  profilesData.forEach(p=>profileMap[p.id]=p);
  followsData.forEach(r=>followMap[r.following_id]=true);
  pointsData.forEach(r=>pointsMap[r.user_id]=Number(r.points||0));
  rolesData.forEach(row=>{ const uid=row.user_id||row.profile_id||row.id; const raw=row.role||row.role_name||""; if(uid&&raw) roleMap[String(uid)]=String(raw).toLowerCase().trim().replace(/-/g,"_").replace(/\s+/g,"_"); });
  adminData.forEach(row=>{ if(row.user_id&&row.role) roleMap[String(row.user_id)]=String(row.role).toLowerCase().replace(/-/g,"_").replace(/\s+/g,"_"); });
  const actionCounts={}; actionsData.forEach(a=>{ if(!actionCounts[a.post_id]) actionCounts[a.post_id]={like:0,dislike:0}; if(a.action_type==="like") actionCounts[a.post_id].like++; if(a.action_type==="dislike") actionCounts[a.post_id].dislike++; });
  const commentCounts={}; commentsData.forEach(c=>{ commentCounts[c.post_id]=(commentCounts[c.post_id]||0)+1; });
  if(!append) currentPosts=safePosts; else currentPosts=currentPosts.concat(safePosts);
  let html=""; safePosts.forEach(post=>{ html+=renderPost(post, actionCounts[post.id]||{like:0,dislike:0}, commentCounts[post.id]||0); });
  if(!append) feed.innerHTML=html; else feed.insertAdjacentHTML('beforeend', html);
  try{ updateTrending(currentPosts, profileMap); }catch(e){}
  currentPage++;
  if(!hasMore) document.getElementById("loadMoreBtn").style.display="none";
 }catch(e){ 
   console.error("Feed fatal:", e); 
   if(!append) feed.innerHTML=`<div class="empty">Feed error:<br><small style="color:red">${escapeHtml(e.message||"Unknown")}</small><br><br><button onclick="loadFeed(false,false)" style="border:0;background:#6c5ce7;color:white;padding:10px 18px;border-radius:12px;font-weight:bold">Retry</button></div>`; 
 }
 isLoading=false;
}

function getRoleBadge(userId){
  const id=String(userId||"");
  if(id==="db4d3669-e3ec-42ec-a716-791f43cebd8d") return '<span class="role-badge website-creator-badge">👑 Website Creator</span>';
  if(id==="21e46d48-cd2c-4824-992e-5beb7f797c5b") return '<span class="role-badge senior-admin-badge">🛡️ Senior Admin</span>';
  const role=String(roleMap[id]||"").toLowerCase().replace(/[-\s]+/g,"_");
  if(["creator","website_creator","owner","super_admin","superadmin"].includes(role)) return '<span class="role-badge website-creator-badge">👑 Website Creator</span>';
  if(["senior_admin","senioradmin","head_admin","supervisor"].includes(role)) return '<span class="role-badge senior-admin-badge">🛡️ Senior Admin</span>';

}

 const profile=profileMap[post.user_id]||{}; let username=profile.username||""; let name=profile.name||"";

 if(!username) username="User";
 const avatar=profile.avatar_url||""; const isOwn=currentUser&&post.user_id===currentUser.id; const isFollowing=!!followMap[post.user_id];

}')">🚫 Block</button></div>`:""}<div class="comments" id="comments-${Number(post.id)}"><div id="comments-list-${Number(post.id)}">Loading...</div><div id="comment-reply-box-${Number(post.id)}" class="comment-reply-box" style="display:none"><span id="comment-reply-text-${Number(post.id)}"></span><button onclick="cancelCommentReply(${Number(post.id)})">✕</button><div style="clear:both"></div></div><div class="comment-input-row"><input id="comment-input-${Number(post.id)}" type="text" placeholder="Write a comment..." onkeydown="if(event.key==='Enter'){addComment(${Number(post.id)})}"><button onclick="addComment(${Number(post.id)})">📤 Send</button></div></div></div>`;
}

async function loadComments(postId){ const list=document.getElementById("comments-list-"+postId); if(!list)return; list.innerHTML="Loading..."; try{ const {data:comments}=await supabaseClient.from("comments").select("id,post_id,user_id,comment,created_at,parent_id").eq("post_id",postId).order("created_at",{ascending:true}); if(!comments||!comments.length){list.innerHTML='<div style="color:#888;text-align:center">No comments yet.</div>';return;} const userIds=[...new Set(comments.map(c=>c.user_id))]; let profiles={}; if(userIds.length){ const {data}=await supabaseClient.from("profiles").select("id,username,name,avatar_url").in("id",userIds); (data||[]).forEach(p=>profiles[p.id]=p); } const childrenMap={}; comments.forEach(c=>{ const pid=c.parent_id||0; if(!childrenMap[pid]) childrenMap[pid]=[]; childrenMap[pid].push(c); }); function renderComment(comment,level=0){ const prof=profiles[comment.user_id]||{}; let username=prof.username||"User"; let displayName=prof.name||""; const isOwn=currentUser&&comment.user_id===currentUser.id; const children=childrenMap[comment.id]||[]; return `<div class="comment-item ${level>0?"nested-comment":""}"><div style="display:flex;gap:8px"><div style="width:32px;height:32px;border-radius:50%;background:#ddd;display:flex;align-items:center;justify-content:center">👤</div><div><div class="comment-user">${escapeHtml(displayName||username)}</div><div class="comment-date">${formatDate(comment.created_at)}</div></div></div><div style="margin-top:7px;white-space:pre-wrap">${escapeHtml(comment.comment||"")}</div><div><button class="comment-reply" style="border:0;background:#eee;color:#6c5ce7;border-radius:14px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer" onclick="replyToComment(${Number(postId)},${Number(comment.id)},'${escapeJs(username)}')">↩️ Reply</button>${isOwn?`<button style="border:0;background:none;color:#d00;font-size:11px;cursor:pointer" onclick="deleteComment(${Number(comment.id)},${Number(postId)})">🗑️ Delete</button>`:""}</div>${children.length?children.map(ch=>renderComment(ch,level+1)).join(""):""}</div>`; } const top=childrenMap[0]||[]; list.innerHTML=top.map(c=>renderComment(c,0)).join(""); }catch(e){list.innerHTML="Could not load comments.";} }

function startVoice(){ document.getElementById("voicePopup").style.display="flex"; resetVoiceRecorder(); }
function resetVoiceRecorder(){ voiceSession++; if(voiceStream){try{voiceStream.getTracks().forEach(t=>t.stop());}catch(e){}} if(voiceTimerInterval) clearInterval(voiceTimerInterval); voiceRecorder=null;voiceStream=null;voiceChunks=[];voiceBlob=null;voiceSeconds=0; const t=document.getElementById("voiceTimer"); const s=document.getElementById("voiceStatus"); const rb=document.getElementById("voiceRecordBtn"); const pb=document.getElementById("voicePauseBtn"); const stb=document.getElementById("voiceStopBtn"); const ab=document.getElementById("voiceAgainBtn"); const sb=document.getElementById("voiceSendBtn"); const pbox=document.getElementById("voicePreviewBox"); const pv=document.getElementById("voicePreview"); if(t) t.textContent="00:00"; if(s) s.textContent="Ready to record"; if(rb){rb.disabled=false;rb.textContent="🔴 Record";} if(pb){pb.disabled=true;pb.textContent="⏸️ Pause";} if(stb) stb.disabled=true; if(ab) ab.disabled=true; if(sb) sb.disabled=true; if(pbox) pbox.style.display="none"; if(pv){try{if(pv.src&&pv.src.startsWith("blob:")) URL.revokeObjectURL(pv.src);}catch(e){} pv.removeAttribute("src"); pv.load();} }
function getSupportedAudioType(){ const types=["audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus","audio/ogg"]; for(const type of types){ if(window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(type)) return type; } return ""; }
async function recordVoice(){ if(voiceRecorder&&(voiceRecorder.state==="recording"||voiceRecorder.state==="paused")) return; const session=++voiceSession; try{ if(!navigator.mediaDevices?.getUserMedia) return alert("Not supported"); if(typeof MediaRecorder==="undefined") return alert("Not supported"); voiceChunks=[];voiceBlob=null;voiceSeconds=0; voiceStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}); if(session!==voiceSession){voiceStream.getTracks().forEach(t=>t.stop());return;} voiceMimeType=getSupportedAudioType(); const options=voiceMimeType?{mimeType:voiceMimeType}:{}; const recorder=new MediaRecorder(voiceStream,options); voiceRecorder=recorder; if(recorder.mimeType) voiceMimeType=recorder.mimeType; recorder.ondataavailable=e=>{ if(e.data&&e.data.size>0) voiceChunks.push(e.data); }; recorder.onstop=()=>{ if(session!==voiceSession) return; if(voiceStream){voiceStream.getTracks().forEach(t=>t.stop());voiceStream=null;} const finalType=voiceMimeType||recorder.mimeType||"audio/webm"; voiceBlob=new Blob(voiceChunks,{type:finalType}); if(!voiceBlob||voiceBlob.size===0){ document.getElementById("voiceStatus").textContent="Failed"; return; } const url=URL.createObjectURL(voiceBlob); const pv=document.getElementById("voicePreview"); const pbox=document.getElementById("voicePreviewBox"); if(pv){pv.src=url;pv.load();} if(pbox) pbox.style.display="block"; document.getElementById("voiceStatus").textContent="✅ Ready - preview before sending"; document.getElementById("voiceRecordBtn").disabled=false; document.getElementById("voicePauseBtn").disabled=true; document.getElementById("voiceStopBtn").disabled=true; document.getElementById("voiceAgainBtn").disabled=false; document.getElementById("voiceSendBtn").disabled=false; }; recorder.start(250); document.getElementById("voiceStatus").textContent="🔴 Recording..."; document.getElementById("voiceRecordBtn").disabled=true; document.getElementById("voicePauseBtn").disabled=false; document.getElementById("voiceStopBtn").disabled=false; voiceTimerInterval=setInterval(()=>{ if(voiceRecorder&&voiceRecorder.state==="recording") voiceSeconds++; const m=String(Math.floor(voiceSeconds/60)).padStart(2,"0"); const s=String(voiceSeconds%60).padStart(2,"0"); document.getElementById("voiceTimer").textContent=m+":"+s; if(voiceSeconds>=300) stopVoice(); },1000); }catch(e){ if(voiceStream){try{voiceStream.getTracks().forEach(t=>t.stop());}catch(_){} voiceStream=null;} voiceRecorder=null; alert("Mic error: "+(e.message||"Permission denied")); } }
function pauseResumeVoice(){ if(!voiceRecorder) return; if(voiceRecorder.state==="recording"){ voiceRecorder.pause(); document.getElementById("voicePauseBtn").textContent="▶️ Resume"; document.getElementById("voiceStatus").textContent="⏸️ Paused"; } else if(voiceRecorder.state==="paused"){ voiceRecorder.resume(); document.getElementById("voicePauseBtn").textContent="⏸️ Pause"; document.getElementById("voiceStatus").textContent="🔴 Recording..."; } }
function stopVoice(){ if(voiceRecorder&&(voiceRecorder.state==="recording"||voiceRecorder.state==="paused")){ clearInterval(voiceTimerInterval); document.getElementById("voiceStatus").textContent="Processing..."; try{voiceRecorder.stop();}catch(e){} } }

async function sendVoice(){ if(!currentUser)return alert("Login first"); if(!voiceBlob||voiceBlob.size===0)return alert("Record first"); try{ document.getElementById("voiceSendBtn").disabled=true; document.getElementById("voiceStatus").textContent="📤 Uploading..."; let ext="webm"; if(voiceBlob.type.includes("ogg")) ext="ogg"; else if(voiceBlob.type.includes("mp4")) ext="mp4"; const fileName=Date.now()+"_"+Math.random().toString(36).substring(2,10)+"."+ext; const filePath=currentUser.id+"/"+fileName; const {error:upErr}=await supabaseClient.storage.from("voice-posts").upload(filePath,voiceBlob,{contentType:voiceBlob.type||"audio/webm",cacheControl:"3600",upsert:false}); if(upErr) throw upErr; const {data}=supabaseClient.storage.from("voice-posts").getPublicUrl(filePath); const voiceUrl=data?.publicUrl||""; if(!voiceUrl) throw new Error("URL not found"); document.getElementById("voiceStatus").textContent="💾 Saving..."; const {error:postErr}=await supabaseClient.from("posts").insert({user_id:currentUser.id,content:"",post_type:"voice",voice_url:voiceUrl,voice_duration:voiceSeconds}); if(postErr) throw postErr; document.getElementById("voiceStatus").textContent="✅ Posted!"; setTimeout(()=>closeVoice(),400); await loadFeed(true); }catch(e){ alert(e.message); document.getElementById("voiceSendBtn").disabled=false; } }

function formatDate(value){ if(!value) return ""; const date=new Date(value); if(isNaN(date.getTime())) return ""; const now=new Date(); const sec=Math.floor((now-date)/1000); if(sec<10) return "Just now"; if(sec<60) return sec+" seconds ago"; const min=Math.floor(sec/60); if(min<60) return min===1?"1 minute ago":min+" minutes ago"; const h=Math.floor(min/60); if(h<24) return h===1?"1 hour ago":h+" hours ago"; const d=Math.floor(h/24); if(d<7) return d===1?"1 day ago":d+" days ago"; return date.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}); }
