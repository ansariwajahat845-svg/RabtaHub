<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ChatZone 💬</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  overflow-x:hidden;
}

body{
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  min-height:100vh;
  color:#222;
}

.app{
  width:100%;
  max-width:680px;
  margin:auto;
  min-height:100vh;
  background:#f5f5f5;
  padding-bottom:78px;
}

/* =========================
   HEADER
========================= */

.header{
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  color:white;
  padding:10px 7px;
  position:sticky;
  top:0;
  z-index:20;
  width:100%;
}

.header-top{
  display:flex;
  align-items:center;
  width:100%;
  gap:4px;
  flex-wrap:nowrap;
  overflow:hidden;
}

.logo{
  flex:0 0 auto;
  min-width:0;
  font-size:20px;
  font-weight:bold;
  white-space:nowrap;
}

.header-buttons{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:3px;
  flex:1 1 auto;
  min-width:0;
  flex-wrap:nowrap;
  overflow:hidden;
}

.header-buttons button{
  flex:1 1 auto;
  min-width:0;
  max-width:120px;
  border:0;
  background:rgba(255,255,255,.18);
  color:white;
  border-radius:18px;
  padding:6px 6px;
  font-size:10px;
  cursor:pointer;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.share-header-btn{
  background:white !important;
  color:#6c5ce7 !important;
  font-weight:bold;
  padding:7px 8px !important;
  box-shadow:0 2px 7px rgba(0,0,0,.15);
}

.header-buttons button:active{
  transform:scale(.96);
}

/* =========================
   ONLINE USERS
========================= */

.online-section{
  background:white;
  margin:10px 12px 0;
  padding:10px 12px;
  border-radius:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.online-title{
  font-size:13px;
  font-weight:bold;
  color:#555;
  margin-bottom:8px;
}

.online-users{
  display:flex;
  gap:9px;
  overflow-x:auto;
  overflow-y:hidden;
  white-space:nowrap;
  scrollbar-width:none;
  padding-bottom:2px;
}

.online-users::-webkit-scrollbar{
  display:none;
}

.online-user{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:6px;
  background:#f5f5f5;
  border-radius:22px;
  padding:4px 10px 4px 4px;
  cursor:pointer;
}

.online-user-avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
  flex-shrink:0;
}

.online-user-name{
  font-size:12px;
  font-weight:bold;
  max-width:90px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.online-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#22c55e;
  flex-shrink:0;
  box-shadow:0 0 0 2px white;
}

/* =========================
   WELCOME
========================= */

.welcome{
  background:white;
  margin:12px;
  padding:14px;
  border-radius:14px;
  text-align:center;
  font-weight:bold;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

/* =========================
   CREATE BOX
========================= */

.create-box{
  background:white;
  margin:12px;
  padding:12px;
  border-radius:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.reply-box{
  display:none;
  background:#f0edff;
  border-left:4px solid #6c5ce7;
  padding:8px;
  border-radius:8px;
  margin-bottom:8px;
  font-size:13px;
}

textarea{
  width:100%;
  min-height:80px;
  resize:none;
  border:1px solid #ddd;
  border-radius:12px;
  padding:12px;
  font-size:15px;
  outline:none;
}

.create-actions{
  display:flex;
  gap:7px;
  margin-top:8px;
  flex-wrap:wrap;
}

.create-actions button{
  border:0;
  border-radius:20px;
  padding:9px 13px;
  cursor:pointer;
}

.send-btn{
  background:#6c5ce7;
  color:white;
}

.upload-btn,
.voice-btn{
  background:#eee;
}

/* =========================
   FEED
========================= */

.feed-header{
  display:flex;
  align-items:center;
  padding:5px 12px;
}

.feed-header h3{
  margin:8px 0;
}

#feed{
  padding:0 12px;
}

.post{
  background:white;
  border-radius:14px;
  margin:10px 0;
  padding:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.post-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.user-info{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
  flex-shrink:0;
}

.user-name{
  font-weight:bold;
  font-size:15px;
  word-break:break-word;
}

.post-date{
  font-size:11px;
  color:#888;
  margin-top:3px;
}

.post-menu button{
  border:0;
  background:transparent;
  font-size:20px;
  cursor:pointer;
}

.post-content{
  white-space:pre-wrap;
  word-break:break-word;
  margin:12px 0;
  line-height:1.45;
}

.post-category{
  display:inline-block;
  background:#f0edff;
  color:#6c5ce7;
  font-size:11px;
  font-weight:bold;
  padding:5px 9px;
  border-radius:15px;
  margin-top:5px;
}

.post-image{
  width:100%;
  max-height:450px;
  object-fit:cover;
  border-radius:12px;
  margin-top:8px;
}

/* =========================
   POST ACTIONS
========================= */

.post-actions{
  display:flex;
  gap:5px;
  width:100%;
  border-top:1px solid #eee;
  padding-top:8px;
  margin-top:8px;
  flex-wrap:nowrap;
}

.post-actions button{
  flex:1 1 0;
  min-width:0;
  width:25%;
  border:0;
  background:#f3f3f3;
  border-radius:10px;
  padding:8px 3px;
  cursor:pointer;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.delete-post-btn{
  width:100% !important;
  flex:1 1 100% !important;
  background:#ffe5e5 !important;
  color:#d00000;
  font-weight:bold;
}

.delete-post-btn:active{
  transform:scale(.98);
}

/* =========================
   COMMENTS
========================= */

.comments{
  display:none;
  margin-top:10px;
  border-top:1px solid #eee;
  padding-top:10px;
}

.comment-item{
  background:#f5f5f5;
  border-radius:10px;
  padding:8px;
  margin:6px 0;
  font-size:13px;
}

.comment-user{
  font-weight:bold;
}

.comment-date{
  color:#888;
  font-size:10px;
}

.comment-delete{
  border:0;
  background:none;
  color:#d00;
  font-size:11px;
  cursor:pointer;
}

.comment-input-row{
  display:flex;
  gap:6px;
  margin-top:8px;
}

.comment-input-row input{
  flex:1;
  min-width:0;
  border:1px solid #ddd;
  border-radius:20px;
  padding:9px 12px;
  outline:none;
}

.comment-input-row button{
  flex:0 0 auto;
  border:0;
  border-radius:20px;
  background:#6c5ce7;
  color:white;
  padding:8px 14px;
}

/* =========================
   LOADING
========================= */

.empty,
.loading{
  text-align:center;
  padding:25px 10px;
  color:#777;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:680px;
  height:64px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  align-items:center;
  justify-content:space-around;
  padding:4px 2px;
  gap:0;
  overflow:hidden;
  z-index:30;
}

.bottom-nav button{
  border:0;
  background:none;
  flex:1 1 0;
  min-width:0;
  width:20%;
  height:56px;
  color:#555;
  cursor:pointer;
  padding:3px 1px;
  font-size:11px;
  line-height:17px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.bottom-nav button:first-child{
  color:#6c5ce7;
  font-weight:bold;
}

/* =========================
   TRENDING / SHARE
========================= */

.trending-box,
.share-box{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:50;
}

.trending-content,
.share-content{
  width:92%;
  max-width:600px;
  max-height:80vh;
  overflow:auto;
  background:white;
  border-radius:18px;
  margin:10vh auto;
  padding:15px;
}

.trending-header,
.share-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.trending-header button,
.share-header button{
  border:0;
  background:#eee;
  border-radius:20px;
  padding:7px 12px;
}

.trend-item{
  padding:10px;
  border-bottom:1px solid #eee;
}

/* =========================
   SHARE
========================= */

.share-option{
  width:100%;
  border:0;
  background:#f5f3ff;
  margin-top:10px;
  padding:15px;
  border-radius:14px;
  text-align:left;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.share-option:active{
  transform:scale(.98);
}

.share-form{
  display:none;
  margin-top:12px;
}

.category-label{
  font-size:13px;
  font-weight:bold;
  color:#555;
  display:block;
  margin:8px 0 5px;
}

.category-select{
  width:100%;
  border:1px solid #ddd;
  border-radius:10px;
  padding:11px;
  background:white;
  outline:none;
}

.image-preview{
  width:100%;
  max-height:300px;
  object-fit:cover;
  border-radius:12px;
  margin-top:10px;
  display:none;
}

.share-submit{
  width:100%;
  border:0;
  background:#6c5ce7;
  color:white;
  border-radius:12px;
  padding:11px;
  font-weight:bold;
  margin-top:10px;
  cursor:pointer;
}

.cancel-share{
  width:100%;
  border:0;
  background:#eee;
  color:#555;
  border-radius:12px;
  padding:10px;
  margin-top:7px;
  cursor:pointer;
}

.hidden-input{
  display:none;
}

/* =========================
   MOBILE FIX
========================= */

@media(max-width:430px){

  .header{
    padding:9px 5px;
  }

  .header-top{
    gap:3px;
  }

  .logo{
    font-size:15px;
  }

  .header-buttons{
    gap:2px;
  }

  .header-buttons button{
    font-size:8.5px;
    padding:6px 3px;
    border-radius:15px;
  }

  .header-buttons .share-header-btn{
    font-size:8.5px;
    padding:6px 4px !important;
  }

  .post-actions{
    gap:4px;
  }

  .post-actions button{
    font-size:10px;
    padding:8px 2px;
  }

  .bottom-nav{
    height:62px;
    padding:3px 1px;
  }

  .bottom-nav button{
    height:56px;
    font-size:9px;
    line-height:16px;
    padding:2px 0;
  }
}

@media(max-width:360px){

  .logo{
    font-size:14px;
  }

  .header-buttons button{
    font-size:7.5px;
    padding:6px 2px;
  }

  .header-buttons .share-header-btn{
    font-size:7.5px;
    padding:6px 3px !important;
  }

  .bottom-nav button{
    font-size:8px;
  }
}
</style>
</head>

<body>

<div class="app">

<div class="header">

  <div class="header-top">

    <div class="logo">
      ChatZone 💬
    </div>

    <div class="header-buttons">

      <button onclick="showTrending()">
        🔥 Trending
      </button>

      <button
        class="share-header-btn"
        onclick="showShare()"
      >
        + Share
      </button>

      <button onclick="goStars()">⭐</button>

      <button onclick="goNotifications()">🔔</button>

    </div>

  </div>

</div>

<!-- ONLINE USERS -->

<div class="online-section">

  <div class="online-title">
    🟢 <span id="onlineCount">0</span> Users Online
  </div>

  <div id="onlineUsers" class="online-users">

    <div style="color:#888;font-size:12px;padding:5px">
      Online users loading...
    </div>

  </div>

</div>

<div class="welcome">
  Welcome to ChatZone 💬 ❤️
</div>

<!-- CREATE BOX -->

<div class="create-box">

  <div id="replyBox" class="reply-box">

    <span id="replyText"></span>

    <button
      onclick="cancelReply()"
      style="float:right;border:0;background:none;color:#d00"
    >
      ✕
    </button>

  </div>

  <textarea
    id="postText"
    placeholder="What's on your mind?"
  ></textarea>

  <div class="create-actions">

    <button
      class="send-btn"
      onclick="createPost()"
    >
      Send Post
    </button>

    <button
      class="upload-btn"
      onclick="showImagePost()"
    >
      🖼️ Image Post
    </button>

    <button
      class="voice-btn"
      onclick="startVoice()"
    >
      🎤 Voice
    </button>

  </div>

  <input
    id="imageInput"
    class="hidden-input"
    type="file"
    accept="image/*"
    onchange="imageSelected()"
  >

  <div
    id="selectedImageText"
    style="font-size:12px;color:#777;margin-top:7px"
  ></div>

</div>

<div class="feed-header">
  <h3>Home Feed</h3>
</div>

<div id="feed">

  <div class="loading">
    Loading feed...
  </div>

</div>

</div>

<!-- SHARE POPUP -->

<div id="shareBox" class="share-box">

  <div class="share-content">

    <div class="share-header">

      <h3>📤 Create Post</h3>

      <button onclick="closeShare()">✕</button>

    </div>

    <button
      class="share-option"
      onclick="showTextPost()"
    >
      📝 Text Post
    </button>

    <button
      class="share-option"
      onclick="showImagePost()"
    >
      🖼️ Image Post
    </button>

    <div
      id="textPostForm"
      class="share-form"
    >

      <textarea
        id="shareText"
        placeholder="What's on your mind?"
      ></textarea>

      <button
        class="share-submit"
        onclick="submitTextPost()"
      >
        📤 Share Text Post
      </button>

    </div>

    <div
      id="imagePostForm"
      class="share-form"
    >

      <label class="category-label">
        Select Category *
      </label>

      <select
        id="imageCategory"
        class="category-select"
      >

        <option value="">
          Select category
        </option>

        <option value="General">
          General
        </option>

        <option value="Funny">
          Funny
        </option>

        <option value="News">
          News
        </option>

        <option value="Islamic">
          Islamic
        </option>

        <option value="Poetry">
          Poetry
        </option>

        <option value="Help">
          Help
        </option>

        <option value="Other">
          Other
        </option>

      </select>

      <label class="category-label">
        Image *
      </label>

      <button
        class="share-option"
        onclick="document.getElementById('shareImageInput').click()"
      >
        🖼️ Select Image
      </button>

      <input
        id="shareImageInput"
        class="hidden-input"
        type="file"
        accept="image/*"
        onchange="shareImageSelected()"
      >

      <img
        id="shareImagePreview"
        class="image-preview"
        alt="Preview"
      >

      <textarea
        id="imageCaption"
        placeholder="Write a caption (optional)..."
        style="margin-top:10px"
      ></textarea>

      <button
        class="share-submit"
        onclick="submitImagePost()"
      >
        🖼️ Share Image Post
      </button>

    </div>

    <button
      class="cancel-share"
      onclick="closeShare()"
    >
      Cancel
    </button>

  </div>

</div>

<!-- TRENDING -->

<div id="trendingBox" class="trending-box">

  <div class="trending-content">

    <div class="trending-header">

      <h3>🔥 Trending</h3>

      <button onclick="closeTrending()">✕</button>

    </div>

    <div id="trendingList">
      Loading...
    </div>

  </div>

</div>

<!-- BOTTOM NAV -->

<div class="bottom-nav">

  <button onclick="goHome()">
    🏠<br>Home
  </button>

  <button onclick="goPrivate()">
    💬<br>Private
  </button>

  <button onclick="goMehfil()">
    👥<br>Mehfil
  </button>

  <button onclick="goProfile()">
    👤<br>Profile
  </button>

  <button onclick="goMore()">
    ☰<br>More
  </button>

</div>

<script>

const SUPABASE_URL =
"https://jhcpqjmxiovvqbghpxbf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser=null;
let profileMap={};
let currentReplyUser=null;
let currentPosts=[];
let onlineChannel=null;


/* INIT */

async function init(){

  try{

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();

    if(error) throw error;

    currentUser =
      data.session?.user || null;

    if(!currentUser){

      window.location.href="login.html";
      return;

    }

    await loadOnlineUsers();
    await loadFeed();

  }catch(error){

    console.error("Init error:",error);

    document.getElementById("feed").innerHTML =
      `<div class="empty">
        Feed load nahi ho saka.
      </div>`;

  }

}


/* ONLINE USERS */

async function loadOnlineUsers(){

  if(!currentUser) return;

  try{

    if(onlineChannel){

      try{
        await supabaseClient.removeChannel(
          onlineChannel
        );
      }catch(e){}

    }

    onlineChannel =
      supabaseClient.channel(
        "chatzone-online-users",
        {
          config:{
            presence:{
              key:currentUser.id
            }
          }
        }
      );

    onlineChannel
      .on(
        "presence",
        {event:"sync"},
        async function(){
          await renderOnlineUsers();
        }
      )
      .on(
        "presence",
        {event:"join"},
        async function(){
          await renderOnlineUsers();
        }
      )
      .on(
        "presence",
        {event:"leave"},
        async function(){
          await renderOnlineUsers();
        }
      );

    onlineChannel.subscribe(
      async function(status){

        if(status==="SUBSCRIBED"){

          await onlineChannel.track({
            user_id:currentUser.id,
            online_at:new Date().toISOString()
          });

          await renderOnlineUsers();

        }

      }
    );

  }catch(error){

    console.error(
      "Online system error:",
      error
    );

  }

}


async function renderOnlineUsers(){

  if(!onlineChannel || !currentUser)
    return;

  const state =
    onlineChannel.presenceState();

  const ids=[];

  Object.keys(state).forEach(
    function(key){

      const entries =
        state[key] || [];

      entries.forEach(
        function(entry){

          const id =
            entry.user_id || key;

          if(
            id &&
            !ids.includes(id)
          ){

            ids.push(id);

          }

        }
      );

    }
  );

  if(!ids.includes(currentUser.id)){
    ids.push(currentUser.id);
  }

  document.getElementById(
    "onlineCount"
  ).textContent=ids.length;

  const container =
    document.getElementById(
      "onlineUsers"
    );

  let profiles={};

  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select(
          "id,username,name,avatar_url"
        )
        .in("id",ids);

    if(!error && data){

      data.forEach(
        function(profile){

          profiles[profile.id]=profile;

        }
      );

    }

  }catch(error){

    console.error(error);

  }

  container.innerHTML =
    ids.map(
      function(id){

        const profile =
          profiles[id] || {};

        let username =
          profile.username ||
          profile.name ||
          "";

        if(
          !username &&
          id===currentUser.id
        ){

          username =
            currentUser
              .user_metadata
              ?.username ||
            currentUser
              .email
              ?.split("@")[0] ||
            "User";

        }

        if(!username)
          username="User";

        const avatar =
          profile.avatar_url || "";

        const avatarHTML =
          avatar
          ?
          `<img
            class="online-user-avatar"
            src="${escapeAttribute(avatar)}"
            onerror="this.style.display='none'"
          >`
          :
          `<div
            class="online-user-avatar"
            style="
              display:flex;
              align-items:center;
              justify-content:center
            "
          >
            👤
          </div>`;

        return `
          <div
            class="online-user"
            onclick="openOnlineProfile('${escapeJs(id)}')"
          >

            ${avatarHTML}

            <span class="online-dot"></span>

            <span class="online-user-name">

/* FEED */

async function loadFeed(){

  const feed =
    document.getElementById("feed");

  feed.innerHTML =
    `<div class="loading">
      Loading feed...
    </div>`;

  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from("posts")
        .select(
          "id,user_id,content,created_at,post_type,category,image_url"
        )
        .order(
          "created_at",
          {ascending:false}
        )
        .order(
          "id",
          {ascending:false}
        );

    if(error) throw error;

    const posts =
      Array.isArray(data)
      ? data
      : [];

    currentPosts=posts;

    if(posts.length===0){

      feed.innerHTML =
        `<div class="empty">
          Abhi koi post nahi hai.
        </div>`;

      return;

    }

    profileMap={};

    const userIds=[
      ...new Set(
        posts
          .map(p=>p.user_id)
          .filter(Boolean)
      )
    ];

    if(userIds.length){

      const {
        data:profiles,
        error:profileError
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "id,username,name,avatar_url"
          )
          .in("id",userIds);

      if(
        !profileError &&
        profiles
      ){

        profiles.forEach(
          function(profile){

            profileMap[profile.id]=
              profile;

          }
        );

      }

    }

    feed.innerHTML="";

    for(const post of posts){

      const html =
        await renderPost(post);

      feed.insertAdjacentHTML(
        "beforeend",
        html
      );

    }

    updateTrending(
      posts,
      profileMap
    );

  }catch(error){

    console.error(
      "Feed error:",
      error
    );

    feed.innerHTML =
      `<div class="empty">
        Feed load nahi ho saki.<br>
        <small>
          ${escapeHtml(
            error.message || ""
          )}
        </small>
      </div>`;

  }

}


/* RENDER POST */

async function renderPost(post){

  const profile =
    profileMap[post.user_id] || {};

  let username =
    profile.username || "";

  let name =
    profile.name || "";

  if(
    !username &&
    currentUser &&
    post.user_id===currentUser.id
  ){

    username =
      currentUser
        .user_metadata
        ?.username ||
      currentUser
        .email
        ?.split("@")[0] ||
      "User";

  }

  if(!username)
    username="User";

  const avatar =
    profile.avatar_url || "";

  let likeCount=0;
  let dislikeCount=0;
  let commentCount=0;

  try{

    const {
      data:actions
    } =
      await supabaseClient
        .from("post_actions")
        .select(
          "action_type,user_id"
        )
        .eq(
          "post_id",
          post.id
        );

    if(actions){

      actions.forEach(
        function(action){

          if(
            action.action_type==="like"
          )
            likeCount++;

          if(
            action.action_type==="dislike"
          )
            dislikeCount++;

        }
      );

    }

  }catch(error){}

  try{

    const {count} =
      await supabaseClient
        .from("comments")
        .select(
          "id",
          {
            count:"exact",
            head:true
          }
        )
        .eq(
          "post_id",
          post.id
        );

    commentCount =
      count || 0;

  }catch(error){}

  const isOwn =
    currentUser &&
    post.user_id===currentUser.id;

  const avatarHTML =
    avatar
    ?
    `<img
      class="avatar"
      src="${escapeAttribute(avatar)}"
      onerror="this.style.display='none'"
    >`
    :
    `<div
      class="avatar"
      style="
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:20px
      "
    >
      👤
    </div>`;

  let imageHTML="";

  if(post.image_url){

    imageHTML =
      `<img
        class="post-image"
        src="${escapeAttribute(
          post.image_url
        )}"
        alt="Post image"
      >`;

  }

  let menuHTML="";

  if(!isOwn){

    menuHTML =
      `<div class="post-menu">

        <button
          onclick="blockUser('${escapeJs(
            post.user_id
          )}')"
        >
          ⋮
        </button>

      </div>`;

  }

  const categoryHTML =
    post.category
    ?
    `<div class="post-category">
      #${escapeHtml(
        post.category
      )}
    </div>`
    :
    "";

  return `
    <div
      class="post"
      id="post-${Number(post.id)}"
    >

      <div class="post-head">

        <div class="user-info">

          ${avatarHTML}

          <div>

            <div class="user-name">

              ${escapeHtml(
                name || username
              )}

              ${
                name && username
                ?
                `<span
                  style="
                    color:#777;
                    font-weight:normal
                  "
                >
                  @${escapeHtml(
                    username
                  )}
                </span>`
                :
                ""
              }

            </div>

            <div class="post-date">
              ${formatDate(
                post.created_at
              )}
            </div>

          </div>

        </div>

        ${menuHTML}

      </div>

      ${categoryHTML}

      ${
        post.content
        ?
        `<div class="post-content">
          ${escapeHtml(
            post.content
          )}
        </div>`
        :
        ""
      }

      ${imageHTML}

      ${
        isOwn
        ?
        `
        <div class="post-actions">

          <button
            class="delete-post-btn"
            onclick="deletePost(
              ${Number(post.id)}
            )"
          >
            🗑️ Delete
          </button>

        </div>
        `
        :
        `
        <div class="post-actions">

          <button
            onclick="setPostAction(
              ${Number(post.id)},
              'like'
            )"
          >
            👍 ${likeCount}
          </button>

          <button
            onclick="setPostAction(
              ${Number(post.id)},
              'dislike'
            )"
          >
            👎 ${dislikeCount}
          </button>

          <button
            onclick="toggleComments(
              ${Number(post.id)}
            )"
          >
            💬 ${commentCount}
          </button>

          <button
            onclick="replyPost(
              '${escapeJs(username)}'
            )"
          >
            ↩️ Reply
          </button>

        </div>
        `
      }

      <div
        class="comments"
        id="comments-${Number(post.id)}"
      >

        <div
          id="comments-list-${Number(post.id)}"
        >
          Loading...
        </div>

        <div class="comment-input-row">

          <input
            id="comment-input-${Number(post.id)}"
            type="text"
            placeholder="Write a comment..."
            onkeydown="
              if(event.key==='Enter'){
                addComment(${Number(post.id)})
              }
            "
          >

          <button
            onclick="addComment(
              ${Number(post.id)}
            )"
          >
            Send
          </button>

        </div>

      </div>

    </div>
  `;

}

/* IMAGE POST */

async function submitImagePost(){

  if(!currentUser){

    alert(
      "Please login first."
    );

    return;

  }

  const category =
    document.getElementById(
      "imageCategory"
    ).value;

  const input =
    document.getElementById(
      "shareImageInput"
    );

  const caption =
    document.getElementById(
      "imageCaption"
    ).value.trim();

  if(!category){

    alert(
      "Image post ke liye category select karna zaroori hai."
    );

    return;

  }

  if(
    !input.files ||
    !input.files.length
  ){

    alert(
      "Pehle image select karein."
    );

    return;

  }

  const file =
    input.files[0];

  try{

    const fileExt =
      file.name
        .split(".")
        .pop();

    const fileName =
      currentUser.id +
      "_" +
      Date.now() +
      "." +
      fileExt;

    const filePath =
      "posts/" +
      fileName;

    const {
      error:uploadError
    } =
      await supabaseClient
        .storage
        .from("post-images")
        .upload(
          filePath,
          file,
          {
            cacheControl:"3600",
            upsert:false
          }
        );

    if(uploadError){

      throw new Error(
        "Image upload nahi hui. Supabase Storage mein 'post-images' bucket check karein.\n\n" +
        uploadError.message
      );

    }

    const {
      data:publicData
    } =
      supabaseClient
        .storage
        .from("post-images")
        .getPublicUrl(
          filePath
        );

    const imageUrl =
      publicData?.publicUrl || "";

    if(!imageUrl){

      throw new Error(
        "Image URL nahi mili."
      );

    }

    const {
      error:postError
    } =
      await supabaseClient
        .from("posts")
        .insert({

          user_id:currentUser.id,
          content:caption,
          post_type:"image",
          category:category,
          image_url:imageUrl

        });

    if(postError){

      throw postError;

    }

    document.getElementById(
      "imageCategory"
    ).value="";

    document.getElementById(
      "shareImageInput"
    ).value="";

    document.getElementById(
      "imageCaption"
    ).value="";

    document.getElementById(
      "shareImagePreview"
    ).style.display="none";

    document.getElementById(
      "shareImagePreview"
    ).src="";

    closeShare();

    await loadFeed();

  }catch(error){

    console.error(
      "Image post error:",
      error
    );

    alert(
      "Image post send nahi hui:\n\n" +
      error.message
    );

  }

}

/* LIKE / DISLIKE */

async function setPostAction(
  postId,
  actionType
){

  if(!currentUser){

    alert(
      "Please login first."
    );

    return;

  }

  try{

    const {
      data:existing
    } =
      await supabaseClient
        .from("post_actions")
        .select(
          "id,action_type"
        )
        .eq(
          "post_id",
          postId
        )
        .eq(
          "user_id",
          currentUser.id
        )
        .maybeSingle();

    if(existing){

      if(
        existing.action_type===
        actionType
      ){

        const {error} =
          await supabaseClient
            .from("post_actions")
            .delete()
            .eq(
              "id",
              existing.id
            );

        if(error) throw error;

      }else{

        const {error} =
          await supabaseClient
            .from("post_actions")
            .update({
              action_type:actionType
            })
            .eq(
              "id",
              existing.id
            );

        if(error) throw error;

      }

    }else{

      const {error} =
        await supabaseClient
          .from("post_actions")
          .insert({

            post_id:postId,
            user_id:currentUser.id,
            action_type:actionType

          });

      if(error) throw error;

    }

    await loadFeed();

  }catch(error){

    alert(
      "Action nahi ho saki:\n" +
      error.message
    );

  }

}

async function loadComments(
  postId
){

  const list =
    document.getElementById(
      "comments-list-"+postId
    );

  if(!list) return;

  list.innerHTML =
    `<div
      style="
        color:#888;
        font-size:12px;
        padding:6px
      "
    >
      Loading comments...
    </div>`;

  try{

    const {
      data:comments,
      error
    } =
      await supabaseClient
        .from("comments")
        .select(
          "id,post_id,user_id,comment,created_at"
        )
        .eq(
          "post_id",
          postId
        )
        .order(
          "created_at",
          {
            ascending:true
          }
        );

    if(error) throw error;

    if(
      !comments ||
      comments.length===0
    ){

      list.innerHTML =
        `<div
          style="
            color:#888;
            font-size:12px;
            padding:8px;
            text-align:center
          "
        >
          No comments yet.
        </div>`;

      return;

    }

    const userIds=[
      ...new Set(
        comments
          .map(c=>c.user_id)
          .filter(Boolean)
      )
    ];

    let commentProfiles={};

    if(userIds.length){

      const {
        data:profiles,
        error:profileError
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "id,username,name,avatar_url"
          )
          .in(
            "id",
            userIds
          );

      if(
        !profileError &&
        profiles
      ){

        profiles.forEach(
          function(profile){

            commentProfiles[
              profile.id
            ]=profile;

          }
        );

      }

    }

    list.innerHTML =
      comments.map(
        function(comment){

          const profile =
            commentProfiles[
              comment.user_id
            ] || {};

          let username =
            profile.username || "";

          let displayName =
            profile.name || "";

          if(
            !username &&
            currentUser &&
            comment.user_id===
            currentUser.id
          ){

            username =
              currentUser
                .user_metadata
                ?.username ||
              currentUser
                .email
                ?.split("@")[0] ||
              "User";

          }

          if(!username)
            username="User";

          const isOwn =
            currentUser &&
            comment.user_id===
            currentUser.id;

          return `
            <div class="comment-item">

              <div
                style="
                  display:flex;
                  align-items:center;
                  gap:8px
                "
              >

                ${
                  profile.avatar_url
                  ?
                  `<img
                    src="${escapeAttribute(
                      profile.avatar_url
                    )}"
                    style="
                      width:32px;
                      height:32px;
                      border-radius:50%;
                      object-fit:cover
                    "
                  >`
                  :
                  `<div
                    style="
                      width:32px;
                      height:32px;
                      border-radius:50%;
                      background:#ddd;
                      display:flex;
                      align-items:center;
                      justify-content:center
                    "
                  >
                    👤
                  </div>`
                }

                <div>

                  <div class="comment-user">

                    ${escapeHtml(
                      displayName ||
                      username
                    )}

                    ${
                      displayName &&
                      username
                      ?
                      `<span
                        style="
                          color:#777;
                          font-weight:normal;
                          font-size:11px
                        "
                      >
                        @${escapeHtml(
                          username
                        )}
                      </span>`
                      :
                      ""
                    }

                  </div>

                  <div class="comment-date">
                    ${formatDate(
                      comment.created_at
                    )}
                  </div>

                </div>

              </div>

              <div
                style="
                  margin-top:7px;
                  white-space:pre-wrap;
                  word-break:break-word
                "
              >
                ${escapeHtml(
                  comment.comment || ""
                )}
              </div>

              ${
                isOwn
                ?
                `<button
                  class="comment-delete"
                  onclick="deleteComment(
                    ${Number(comment.id)},
                    ${Number(postId)}
                  )"
                >
                  Delete
                </button>`
                :
                ""
              }

            </div>
          `;

        }
      ).join("");

  }catch(error){

    list.innerHTML =
      `<div
        style="
          color:#d00;
          font-size:12px;
          padding:8px
        "
      >
        Comments load nahi huay.<br>
        <small>
          ${escapeHtml(
            error.message || ""
          )}
        </small>
      </div>`;

  }

}

/* VOICE */

function startVoice(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert(
      "Voice typing is not supported in this browser."
    );

    return;

  }

  const recognition =
    new SpeechRecognition();

  recognition.lang="ur-PK";
  recognition.interimResults=false;
  recognition.continuous=false;

  recognition.onresult =
    function(event){

      const text =
        event.results[0][0]
          .transcript;

      const textarea =
        document.getElementById(
          "postText"
        );

      textarea.value +=
        (
          textarea.value
          ? "\n"
          : ""
        ) +
        text;

    };

  recognition.start();

}


/* TRENDING */

function updateTrending(
  posts,
  profiles
){

  const list =
    document.getElementById(
      "trendingList"
    );

  if(
    !posts ||
    posts.length===0
  ){

    list.innerHTML =
      `<div class="empty">
        No posts yet.
      </div>`;

    return;

  }

  list.innerHTML =
    posts
      .slice(0,10)
      .map(
        function(post){

          const profile =
            profiles[
              post.user_id
            ] || {};

          const username =
            profile.username ||
            "User";

          return `
            <div class="trend-item">

              <b>
                @${escapeHtml(
                  username
                )}
              </b>

              ${
                post.category
                ?
                `<div
                  style="
                    color:#6c5ce7;
                    font-size:11px;
                    margin-top:3px
                  "
                >
                  #${escapeHtml(
                    post.category
                  )}
                </div>`
                :
                ""
              }

              <div
                style="margin-top:4px"
              >
                ${escapeHtml(
                  post.content || ""
                ).slice(0,160)}
              </div>

              <small
                style="color:#888"
              >
                ${formatDate(
                  post.created_at
                )}
              </small>

            </div>
          `;

        }
      )
      .join("");

}

/* DATE */

function formatDate(value){

  if(!value) return "";

  const date =
    new Date(value);

  if(
    Number.isNaN(
      date.getTime()
    )
  )
    return "";

  const now =
    new Date();

  const seconds =
    Math.floor(
      (
        now.getTime() -
        date.getTime()
      ) / 1000
    );

  if(seconds<10)
    return "Just now";

  if(seconds<60)
    return seconds +
      " seconds ago";

  const minutes =
    Math.floor(
      seconds/60
    );

  if(minutes<60)
    return minutes===1
      ? "1 minute ago"
      : minutes +
        " minutes ago";

  const hours =
    Math.floor(
      minutes/60
    );

  if(hours<24)
    return hours===1
      ? "1 hour ago"
      : hours +
        " hours ago";

  const days =
    Math.floor(
      hours/24
    );

  if(days<7)
    return days===1
      ? "1 day ago"
      : days +
        " days ago";

  return date.toLocaleDateString(
    "en-GB",
    {
      day:"2-digit",
      month:"short",
      year:"numeric"
    }
  );

}


/* SECURITY */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}

function escapeAttribute(value){
  return escapeHtml(value);
}

function escapeJs(value){

  return String(value ?? "")
    .replaceAll(
      "\\",
      "\\\\"
    )
    .replaceAll(
      "'",
      "\\'"
    )
    .replaceAll(
      "\n",
      "\\n"
    )
    .replaceAll(
      "\r",
      "\\r"
    );

}
