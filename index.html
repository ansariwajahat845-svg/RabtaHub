
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>RabtaHub</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  min-height:100vh;
  color:#222;
}

.app{
  width:100%;
  max-width:680px;
  margin:auto;
  min-height:100vh;
  background:#f5f5f8;
  padding-bottom:80px;
}

.header{
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  color:white;
  padding:18px 15px 14px;
  position:sticky;
  top:0;
  z-index:20;
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

.header-actions{
  display:flex;
  gap:8px;
}

.top-btn{
  border:0;
  background:rgba(255,255,255,.18);
  color:white;
  border-radius:12px;
  min-width:44px;
  height:42px;
  font-size:19px;
  cursor:pointer;
}

.trending{
  margin-top:13px;
  background:rgba(255,255,255,.15);
  border-radius:12px;
  padding:10px 12px;
  font-size:14px;
}

.content{
  padding:12px;
}

.welcome{
  background:white;
  border-radius:15px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 2px 8px #00000012;
}

.welcome h2{
  margin:0 0 5px;
  font-size:20px;
}

.create-box{
  background:white;
  padding:14px;
  border-radius:15px;
  margin-bottom:12px;
  box-shadow:0 2px 8px #00000012;
}

textarea{
  width:100%;
  min-height:85px;
  border:1px solid #ddd;
  border-radius:12px;
  padding:12px;
  font-size:15px;
  resize:vertical;
}

.create-actions{
  display:flex;
  gap:8px;
  margin-top:10px;
  flex-wrap:wrap;
}

.action-btn{
  border:0;
  border-radius:10px;
  padding:10px 13px;
  cursor:pointer;
  font-weight:bold;
}

.post-btn{
  background:#6c5ce7;
  color:white;
}

.secondary{
  background:#eee;
}

.section-title{
  font-weight:bold;
  font-size:18px;
  margin:14px 2px 9px;
}

.post{
  background:white;
  border-radius:15px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 2px 8px #00000012;
}

.post-user{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#6c5ce7;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.username{
  font-weight:bold;
}

.date{
  color:#888;
  font-size:12px;
  margin-top:3px;
}

.post-content{
  margin:12px 0;
  white-space:pre-wrap;
  line-height:1.45;
}

.post-actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  border-top:1px solid #eee;
  padding-top:9px;
}

.post-actions button{
  border:0;
  background:#f1f1f4;
  border-radius:9px;
  padding:8px 10px;
  cursor:pointer;
}

.empty{
  background:white;
  border-radius:14px;
  padding:22px;
  text-align:center;
  color:#777;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:680px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  padding:7px 4px;
  z-index:50;
}

.nav-btn{
  border:0;
  background:none;
  color:#666;
  font-size:12px;
  min-width:65px;
  padding:6px 3px;
  cursor:pointer;
}

.nav-btn .icon{
  display:block;
  font-size:21px;
  margin-bottom:2px;
}

.nav-btn.active{
  color:#6c5ce7;
  font-weight:bold;
}

#loading{
  text-align:center;
  padding:20px;
  color:#777;
}
</style>
</head>

<body>

<div class="app">

  <header class="header">

    <div class="header-row">

      <div class="logo">RabtaHub</div>

      <div class="header-actions">
        <button class="top-btn" onclick="openTrending()" title="Trending">🔥</button>
        <button class="top-btn" onclick="openStars()" title="Stars">⭐</button>
        <button class="top-btn" onclick="openNotifications()" title="Notifications">🔔</button>
      </div>

    </div>

    <div class="trending" id="trendingBar">
      🔥 Trending Posts
    </div>

  </header>

  <main class="content">

    <div class="welcome">
      <h2>Welcome to RabtaHub ❤️</h2>
      <div>Connect • Share • Enjoy</div>
    </div>

    <div class="create-box">

      <textarea
        id="postText"
        placeholder="What's on your mind?"
      ></textarea>

      <div class="create-actions">

        <button
          class="action-btn post-btn"
          onclick="createPost()">
          📝 Send Post
        </button>

        <button
          class="action-btn secondary"
          onclick="document.getElementById('imageInput').click()">
          🖼️ Upload Image
        </button>

        <button
          class="action-btn secondary"
          onclick="startVoice()">
          🎤 Voice
        </button>

      </div>

      <input
        type="file"
        id="imageInput"
        accept="image/*"
        hidden
      >

    </div>

    <div class="section-title">
      🏠 Home Feed
    </div>

    <div id="loading">
      Feed load ho rahi hai...
    </div>

    <div id="feed"></div>

  </main>

</div>

<nav class="bottom-nav">

  <button class="nav-btn active" onclick="goHome()">
    <span class="icon">🏠</span>
    Home
  </button>

  <button class="nav-btn" onclick="goPrivate()">
    <span class="icon">💬</span>
    Private
  </button>

  <button class="nav-btn" onclick="goMehfil()">
    <span class="icon">💬</span>
    Mehfil
  </button>

  <button class="nav-btn" onclick="goMore()">
    <span class="icon">☰</span>
    More
  </button>

</nav>

<script>

const SUPABASE_URL =
  "https://szmauhxiyjffjhrcruee.supabase.co";

const SUPABASE_KEY =
  "YOUR_SUPABASE_ANON_KEY";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let currentUser = null;

async function init(){

  const {
    data:{
      session
    }
  } = await supabaseClient.auth.getSession();

  if(!session){
    window.location.href="login.html";
    return;
  }

  currentUser=session.user;

  loadFeed();
}

async function loadFeed(){

  const loading=
    document.getElementById("loading");

  const feed=
    document.getElementById("feed");

  loading.style.display="block";
  feed.innerHTML="";

  const {
    data,
    error
  } = await supabaseClient
    .from("posts")
    .select("*")
    .order("created_at",{ascending:false});

  loading.style.display="none";

  if(error){

    feed.innerHTML=
      `<div class="empty">
        Feed load nahi ho saki.<br>
        ${escapeHtml(error.message)}
      </div>`;

    return;
  }

  if(!data || !data.length){

    feed.innerHTML=
      `<div class="empty">
        Abhi koi post nahi hai.
      </div>`;

    return;
  }

  data.forEach(post=>{
    feed.insertAdjacentHTML(
      "beforeend",
      renderPost(post)
    );
  });
}

function renderPost(post){

  const username=
    post.username ||
    "User";

  const letter=
    username.charAt(0).toUpperCase();

  const own=
    currentUser &&
    post.user_id===currentUser.id;

  return `
    <article class="post">

      <div class="post-user">

        <div class="avatar">
          ${letter}
        </div>

        <div>
          <div class="username">
            ${escapeHtml(username)}
          </div>

          <div class="date">
            ${formatDate(post.created_at)}
          </div>
        </div>

      </div>

      <div class="post-content">
        ${escapeHtml(post.content || "")}
      </div>

      <div class="post-actions">

        <button onclick="likePost(${post.id})">
          ❤️ Like
        </button>

        <button onclick="dislikePost(${post.id})">
          👎 Dislike
        </button>

        <button onclick="openComments(${post.id})">
          💬 Comments
        </button>

        <button onclick="replyPost(${post.id})">
          ↩️ Reply
        </button>

        ${
          own
          ?
          `<button onclick="deletePost(${post.id})">
             🗑️ Delete
           </button>`
          :
          `<button onclick="blockUser('${post.user_id}')">
             🚫 Block
           </button>`
        }

      </div>

    </article>
  `;
}

async function createPost(){

  const input=
    document.getElementById("postText");

  const content=
    input.value.trim();

  if(!content){
    alert("Post likhein.");
    return;
  }

  const {
    data:{
      user
    }
  } =
    await supabaseClient.auth.getUser();

  if(!user){
    window.location.href="login.html";
    return;
  }

  const username=
    user.user_metadata?.username ||
    user.email?.split("@")[0] ||
    "User";

  const {
    error
  } =
    await supabaseClient
      .from("posts")
      .insert({
        user_id:user.id,
        username:username,
        content:content
      });

  if(error){
    alert(error.message);
    return;
  }

  input.value="";
  loadFeed();
}

async function deletePost(id){

  if(!confirm("Apni post delete karni hai?"))
    return;

  const {
    error
  } =
    await supabaseClient
      .from("posts")
      .delete()
      .eq("id",id)
      .eq("user_id",currentUser.id);

  if(error){
    alert(error.message);
    return;
  }

  loadFeed();
}

function likePost(id){
  alert("Like system yahan connect kiya ja sakta hai.");
}

function dislikePost(id){
  alert("Dislike system yahan connect kiya ja sakta hai.");
}

function openComments(id){
  alert("Comments: post #" + id);
}

function replyPost(id){
  alert("Reply: post #" + id);
}

function blockUser(id){

  if(!confirm("Is user ko block karna hai?"))
    return;

  alert("Block option selected.");
}

function startVoice(){
  alert("Voice option ready hai.");
}

function openTrending(){
  alert("Trending Posts");
}

function openStars(){
  alert("⭐ Stars");
}

function openNotifications(){
  window.location.href="notifications.html";
}

```
