<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>ChatZone 💬</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  min-height:100vh;
  color:#222;
}

.app{
  width:100%;
  max-width:680px;
  margin:auto;
  min-height:100vh;
  background:#f5f5f5;
  padding-bottom:75px;
}

.header{
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  color:white;
  padding:14px;
  position:sticky;
  top:0;
  z-index:20;
}

.header-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.header-buttons{
  display:flex;
  gap:6px;
}

.header-buttons button{
  border:0;
  background:rgba(255,255,255,.18);
  color:white;
  border-radius:20px;
  padding:7px 9px;
  cursor:pointer;
}

/* =========================
   ONLINE USERS
========================= */

.online-section{
  background:white;
  margin:10px 12px 0;
  padding:10px 12px;
  border-radius:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.online-title{
  font-size:13px;
  font-weight:bold;
  color:#555;
  margin-bottom:8px;
}

.online-users{
  display:flex;
  gap:9px;
  overflow-x:auto;
  overflow-y:hidden;
  white-space:nowrap;
  scrollbar-width:none;
  padding-bottom:2px;
}

.online-users::-webkit-scrollbar{
  display:none;
}

.online-user{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:6px;
  background:#f5f5f5;
  border-radius:22px;
  padding:4px 10px 4px 4px;
  cursor:pointer;
}

.online-user-avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
  flex-shrink:0;
}

.online-user-name{
  font-size:12px;
  font-weight:bold;
  max-width:90px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.online-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#22c55e;
  flex-shrink:0;
  box-shadow:0 0 0 2px white;
}

.welcome{
  background:white;
  margin:12px;
  padding:14px;
  border-radius:14px;
  text-align:center;
  font-weight:bold;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.create-box{
  background:white;
  margin:12px;
  padding:12px;
  border-radius:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.reply-box{
  display:none;
  background:#f0edff;
  border-left:4px solid #6c5ce7;
  padding:8px;
  border-radius:8px;
  margin-bottom:8px;
  font-size:13px;
}

textarea{
  width:100%;
  min-height:80px;
  resize:none;
  border:1px solid #ddd;
  border-radius:12px;
  padding:12px;
  font-size:15px;
  outline:none;
}

.create-actions{
  display:flex;
  gap:7px;
  margin-top:8px;
  flex-wrap:wrap;
}

.create-actions button{
  border:0;
  border-radius:20px;
  padding:9px 13px;
  cursor:pointer;
}

.send-btn{
  background:#6c5ce7;
  color:white;
}

.upload-btn,
.voice-btn{
  background:#eee;
}

.feed-header{
  display:flex;
  align-items:center;
  padding:5px 12px;
}

.feed-header h3{
  margin:8px 0;
}

#feed{
  padding:0 12px;
}

.post{
  background:white;
  border-radius:14px;
  margin:10px 0;
  padding:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.post-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.user-info{
  display:flex;
  align-items:center;
  gap:9px;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

.user-name{
  font-weight:bold;
  font-size:15px;
}

.post-date{
  font-size:11px;
  color:#888;
  margin-top:3px;
}

.post-menu{
  position:relative;
}

.post-menu button{
  border:0;
  background:transparent;
  font-size:20px;
  cursor:pointer;
}

.post-content{
  white-space:pre-wrap;
  word-break:break-word;
  margin:12px 0;
  line-height:1.45;
}

.post-image{
  width:100%;
  max-height:450px;
  object-fit:cover;
  border-radius:12px;
  margin-top:5px;
}

.post-actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  border-top:1px solid #eee;
  padding-top:8px;
}

.post-actions button{
  flex:1;
  min-width:70px;
  border:0;
  background:#f3f3f3;
  border-radius:10px;
  padding:8px 5px;
  cursor:pointer;
}

.comments{
  display:none;
  margin-top:10px;
  border-top:1px solid #eee;
  padding-top:10px;
}

.comment-item{
  background:#f5f5f5;
  border-radius:10px;
  padding:8px;
  margin:6px 0;
  font-size:13px;
}

.comment-user{
  font-weight:bold;
}

.comment-date{
  color:#888;
  font-size:10px;
}

.comment-delete{
  border:0;
  background:none;
  color:#d00;
  font-size:11px;
  cursor:pointer;
}

.comment-input-row{
  display:flex;
  gap:6px;
  margin-top:8px;
}

.comment-input-row input{
  flex:1;
  border:1px solid #ddd;
  border-radius:20px;
  padding:9px 12px;
  outline:none;
}

.comment-input-row button{
  border:0;
  border-radius:20px;
  background:#6c5ce7;
  color:white;
  padding:8px 14px;
}

.empty,
.loading{
  text-align:center;
  padding:25px 10px;
  color:#777;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:680px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  padding:8px 3px;
  z-index:30;
}

.bottom-nav button{
  border:0;
  background:none;
  font-size:12px;
  color:#555;
  cursor:pointer;
  padding:5px;
}

.bottom-nav button:first-child{
  color:#6c5ce7;
  font-weight:bold;
}

.trending-box{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:50;
}

.trending-content{
  width:92%;
  max-width:600px;
  max-height:80vh;
  overflow:auto;
  background:white;
  border-radius:15px;
  margin:10vh auto;
  padding:15px;
}

.trending-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.trending-header button{
  border:0;
  background:#eee;
  border-radius:20px;
  padding:7px 12px;
}

.trend-item{
  padding:10px;
  border-bottom:1px solid #eee;
}

.hidden-input{
  display:none;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">

    <div class="header-top">

      <div class="logo">
        ChatZone 💬
      </div>

      <div class="header-buttons">

        <button onclick="showTrending()">🔥</button>

        <button onclick="goStars()">⭐</button>

        <button onclick="goNotifications()">🔔</button>

      </div>

    </div>

  </div>


  <!-- ONLINE USERS -->

  <div class="online-section">

    <div class="online-title">
      🟢 <span id="onlineCount">0</span> Users Online
    </div>

    <div
      id="onlineUsers"
      class="online-users"
    >
      <div style="
        color:#888;
        font-size:12px;
        padding:5px;
      ">
        Online users loading...
      </div>
    </div>

  </div>


  <div class="welcome">
    Welcome to ChatZone 💬 ❤️
  </div>


  <div class="create-box">

    <div id="replyBox" class="reply-box">

      <span id="replyText"></span>

      <button
        onclick="cancelReply()"
        style="
          float:right;
          border:0;
          background:none;
          color:#d00;
        "
      >
        ✕

    <textarea
      id="postText"
      placeholder="What's on your mind?"
    ></textarea>


    <div class="create-actions">

      <button
        class="send-btn"
        onclick="createPost()"
      >
        Send Post
      </button>

      <button
        class="upload-btn"
        onclick="
          document
          .getElementById('imageInput')
          .click()
        "
      >
        🖼️ Upload Image
      </button>

      <button
        class="voice-btn"
        onclick="startVoice()"
      >
        🎤 Voice
      </button>

      id="imageInput"
      class="hidden-input"
      type="file"
      accept="image/*"
      onchange="imageSelected()"
    >

</div>


<!-- TRENDING -->

<div id="trendingBox" class="trending-box">

  <div class="trending-content">

    <div class="trending-header">

      <h3>🔥 Trending</h3>

      <button onclick="closeTrending()">
        ✕
      </button>

    </div>

    <div id="trendingList">
      Loading...
    </div>

  </div>

</div>


<!-- BOTTOM NAV -->

<div class="bottom-nav">

  <button onclick="goHome()">
    🏠<br>Home
  </button>

  <button onclick="goPrivate()">
    💬<br>Private
  </button>

  <button onclick="goMehfil()">
    👥<br>Mehfil
  </button>

  <button onclick="goProfile()">
    👤<br>Profile
  </button>

  <button onclick="goMore()">
    ☰<br>More
  </button>

</div>


<script>

const SUPABASE_URL =
"https://jhcpqjmxiovvqbghpxbf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let profileMap = {};
let currentReplyUser = null;
let currentPosts = [];

let onlineChannel = null;


/* =========================
   INIT
========================= */

async function init(){

  try{

    const {
      data,
      error
    } = await supabaseClient.auth.getSession();

    if(error){
      console.error(error);
      return;
    }

    currentUser =
      data.session?.user || null;

    if(!currentUser){

      window.location.href =
        "login.html";

      return;
    }

    await loadOnlineUsers();

    await loadFeed();

  }catch(error){

    console.error(
      "Init error:",
      error
    );

    document.getElementById(
      "feed"
    ).innerHTML =
      `<div class="empty">
        Feed load nahi ho saka.
      </div>`;

  }

}


/* =========================
   ONLINE USERS
========================= */

async function loadOnlineUsers(){

  if(!currentUser){
    return;
  }

  try{

    if(onlineChannel){

      try{
        await supabaseClient
          .removeChannel(
            onlineChannel
          );
      }catch(e){}

    }


    onlineChannel =
      supabaseClient.channel(
        "chatzone-online-users",
        {
          config:{
            presence:{
              key:currentUser.id
            }
          }
        }
      );


    onlineChannel
      .on(
        "presence",
        {
          event:"sync"
        },
        async function(){

          await renderOnlineUsers();

        }
      )
      .on(
        "presence",
        {
          event:"join"
        },
        async function(){

          await renderOnlineUsers();

        }
      )
      .on(
        "presence",
        {
          event:"leave"
        },
        async function(){

          await renderOnlineUsers();

        }
      );


    onlineChannel.subscribe(
      async function(status){

        if(
          status ===
          "SUBSCRIBED"
        ){

          await onlineChannel.track({

            user_id:
              currentUser.id,

            online_at:
              new Date().toISOString()

          });

          await renderOnlineUsers();

        }

      }
    );

  }catch(error){

    console.error(
      "Online system error:",
      error
    );

    document.getElementById(
      "onlineCount"
    ).textContent = "0";

  }

}


async function renderOnlineUsers(){

  if(
    !onlineChannel ||
    !currentUser
  ){
    return;
  }

  const state =
    onlineChannel.presenceState();

  const ids = [];


  Object.keys(state).forEach(
    function(key){

      const entries =
        state[key] || [];

      entries.forEach(
        function(entry){

          const id =
            entry.user_id ||
            key;

          if(
            id &&
            !ids.includes(id)
          ){

            ids.push(id);

          }

        }
      );

    }
  );


  if(
    !ids.includes(
      currentUser.id
    )
  ){

    ids.push(
      currentUser.id
    );

  }


  document.getElementById(
    "onlineCount"
  ).textContent =
    ids.length;


  const container =
    document.getElementById(
      "onlineUsers"
    );


  if(
    ids.length === 0
  ){

    container.innerHTML =
      `<div style="
        color:#888;
        font-size:12px;
        padding:5px;
      ">
        No users online
      </div>`;

    return;

  }


  let profiles = {};


  try{

    const {
      data,
      error
    } = await supabaseClient
      .from("profiles")
      .select(
        "id,username,name,avatar_url"
      )
      .in(
        "id",
        ids
      );

    if(
      !error &&
      data
    ){

      data.forEach(
        function(profile){

          profiles[
            profile.id
          ] = profile;

        }
      );

    }

  }catch(error){

    console.error(
      "Online profiles error:",
      error
    );

  }


  container.innerHTML =
    ids.map(
      function(id){

        const profile =
          profiles[id] || {};

        let username =
          profile.username ||
          profile.name ||
          "";

        if(
          !username &&
          id === currentUser.id
        ){

          username =
            currentUser
              .user_metadata
              ?.username ||
            currentUser.email
              ?.split("@")[0] ||
            "User";

        }

        if(!username){
          username = "User";
        }


        const avatar =
          profile.avatar_url ||
          "";


        const avatarHTML =
          avatar
          ?
          `<img
            class="online-user-avatar"
            src="${escapeAttribute(
              avatar
            )}"
            onerror="
              this.outerHTML=
              '<div class=&quot;online-user-avatar&quot;
              style=&quot;display:flex;align-items:center;
              justify-content:center;&quot;>👤</div>'
            "
          >`
          :
          `<div
            class="online-user-avatar"
            style="
              display:flex;
              align-items:center;
              justify-content:center;
              font-size:18px;
            "
          >
            👤
          </div>`;


        return `
          <div
            class="online-user"
            onclick="
              openOnlineProfile(
                '${escapeJs(id)}'
              )
            "
          >

            ${avatarHTML}

            <span class="online-dot"></span>

            <span class="online-user-name">
              ${escapeHtml(
                username
              )}
            </span>

          </div>
        `;

      }
    ).join("");

}


function openOnlineProfile(userId){

  if(!userId){
    return;
  }

  /*
    Profile page ko user id ke saath
    open karne ki koshish.
  */

  window.location.href =
    "profile.html?user=" +
    encodeURIComponent(
      userId
    );

}


/* =========================
   LOAD FEED
========================= */

async function loadFeed(){

  const feed =
    document.getElementById(
      "feed"
    );

  feed.innerHTML =
    `<div class="loading">
      Loading feed...
    </div>`;

  try{

    const {
      data,
      error
    } = await supabaseClient
      .from("posts")
      .select(
        "id,user_id,content,created_at,post_type,category,image_url"
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      )
      .order(
        "id",
        {
          ascending:false
        }
      );

    if(error){
      throw error;
    }

    let posts =
      Array.isArray(data)
        ? data
        : [];


    posts.sort(
      function(a,b){

        const dateA =
          new Date(
            a.created_at || 0
          ).getTime();

        const dateB =
          new Date(
            b.created_at || 0
          ).getTime();

        if(
          dateB !== dateA
        ){

          return dateB -
            dateA;

        }

        return (
          Number(b.id || 0) -
          Number(a.id || 0)
        );

      }
    );


    currentPosts =
      posts;


    if(
      posts.length === 0
    ){

      feed.innerHTML =
        `<div class="empty">
          Abhi koi post nahi hai.
        </div>`;

      return;

    }


    profileMap = {};


    const userIds = [
      ...new Set(
        posts
          .map(
            function(p){
              return p.user_id;
            }
          )
          .filter(Boolean)
      )
    ];


    if(
      userIds.length
    ){

      const {
        data:profiles,
        error:profileError
      } = await supabaseClient
        .from("profiles")
        .select(
          "id,username,name,avatar_url"
        )
        .in(
          "id",
          userIds
        );


      if(
        !profileError &&
        profiles
      ){

        profiles.forEach(
          function(profile){

            profileMap[
              profile.id
            ] = profile;

          }
        );

      }

    }


    feed.innerHTML = "";


    for(
      const post of posts
    ){

      const html =
        await renderPost(
          post
        );

      feed.insertAdjacentHTML(
        "beforeend",
        html
      );

    }


    updateTrending(
      posts,
      profileMap
    );


  }catch(error){

    console.error(
      "Feed error:",
      error
    );

    feed.innerHTML =
      `<div class="empty">
        Feed load nahi ho saki.<br>
        <small>
          ${escapeHtml(
            error.message || ""
          )}
        </small>
      </div>`;

  }

}


/* =========================
   RENDER POST
========================= */

async function renderPost(post){

  const profile =
    profileMap[
      post.user_id
    ] || {};


  let username =
    profile.username ||
    "";

  let name =
    profile.name ||
    "";


  if(
    !username &&
    currentUser &&
    post.user_id ===
    currentUser.id
  ){

    username =
      currentUser
        .user_metadata
        ?.username ||
      currentUser.email
        ?.split("@")[0] ||
      "User";

  }


  if(!username){
    username = "User";
  }


  const avatar =
    profile.avatar_url ||
    "";


  let likeCount = 0;
  let dislikeCount = 0;
  let commentCount = 0;


  try{

    const {
      data:actions
    } = await supabaseClient
      .from("post_actions")
      .select(
        "action_type,user_id"
      )
      .eq(
        "post_id",
        post.id
      );


    if(actions){

      actions.forEach(
        function(action){

          if(
            action.action_type ===
            "like"
          ){

            likeCount++;

          }

          if(
            action.action_type ===
            "dislike"
          ){

            dislikeCount++;

          }

        }
      );

    }

  }catch(error){

    console.log(
      "Action count error",
      error
    );

  }


  try{

    const {
      count
    } = await supabaseClient
      .from("comments")
      .select(
        "id",
        {
          count:"exact",
          head:true
        }
      )
      .eq(
        "post_id",
        post.id
      );


    commentCount =
      count || 0;

  }catch(error){

    console.log(
      "Comment count error",
      error
    );

  }


  const isOwn =
    currentUser &&
    post.user_id ===
    currentUser.id;


  let avatarHTML;


  if(avatar){

    avatarHTML =
      `<img
        class="avatar"
        src="${escapeAttribute(
          avatar
        )}"
        onerror="
          this.style.display='none'
        "
      >`;

  }else{

    avatarHTML =
      `<div
        class="avatar"
        style="
          display:flex;
          align-items:center;
          justify-content:center;
          font-size:20px;
        "
      >
        👤
      </div>`;

  }


  let imageHTML = "";


  if(post.image_url){

    imageHTML =
      `<img
        class="post-image"
        src="${escapeAttribute(
          post.image_url
        )}"
        alt="Post image"
      >`;

  }


  let menuHTML = "";


  if(isOwn){

    menuHTML =
      `<div class="post-menu">

        <button
          onclick="
            deletePost(
              ${Number(post.id)}
            )
          "
        >
          ⋮
        </button>

      </div>`;

  }else{

    menuHTML =
      `<div class="post-menu">

        <button
          onclick="
            blockUser(
              '${escapeJs(
                post.user_id
              )}'
            )
          "
        >
          ⋮
        </button>

      </div>`;

  }


  return `
    <div
      class="post"
      id="post-${Number(post.id)}"
    >

      <div class="post-head">

        <div class="user-info">

          ${avatarHTML}

          <div>

            <div class="user-name">

              ${escapeHtml(

async function setPostAction(
  postId,
  actionType
){

  if(!currentUser){

    alert(
      "Please login first."
    );

    return;

  }


  try{

    const {
      data:existing
    } = await supabaseClient
      .from("post_actions")
      .select(
        "id,action_type"
      )
      .eq(
        "post_id",
        postId
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .maybeSingle();


    if(existing){

      if(
        existing.action_type ===
        actionType
      ){

        const {
          error
        } = await supabaseClient
          .from("post_actions")
          .delete()
          .eq(
            "id",
            existing.id
          );


        if(error){
          throw error;
        }


      }else{

        const {
          error
        } = await supabaseClient
          .from("post_actions")
          .update({
            action_type:
              actionType
          })
          .eq(
            "id",
            existing.id
          );


        if(error){
          throw error;
        }

      }


    }else{

      const {
        error
      } = await supabaseClient
        .from("post_actions")
        .insert({

          post_id:
            postId,

          user_id:
            currentUser.id,

          action_type:
            actionType

        });


      if(error){
        throw error;
      }

    }


    await loadFeed();


  }catch(error){

    console.error(error);

    alert(
      "Action nahi ho saki:\n" +
      error.message
    );

  }

}

async function loadComments(postId){

  const list =
    document.getElementById(
      "comments-list-" +
      postId
    );


  if(!list){
    return;
  }


  list.innerHTML =
    `<div style="
      color:#888;
      font-size:12px;
      padding:6px;
    ">
      Loading comments...
    </div>`;


  try{

    const {
      data:comments,
      error
    } = await supabaseClient
      .from("comments")
      .select(
        "id,post_id,user_id,comment,created_at"
      )
      .eq(
        "post_id",
        postId
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );


    if(error){
      throw error;
    }


    if(
      !comments ||
      comments.length === 0
    ){

      list.innerHTML =
        `<div style="
          color:#888;
          font-size:12px;
          padding:8px;
          text-align:center;
        ">
          No comments yet.
        </div>`;

      return;

    }


    const userIds = [
      ...new Set(
        comments
          .map(
            function(c){
              return c.user_id;
            }
          )
          .filter(Boolean)
      )
    ];


    let commentProfiles = {};


    if(userIds.length){

      const {
        data:profiles,
        error:profileError
      } = await supabaseClient
        .from("profiles")
        .select(
          "id,username,name,avatar_url"
        )
        .in(
          "id",
          userIds
        );


      if(
        !profileError &&
        profiles
      ){

        profiles.forEach(
          function(profile){

            commentProfiles[
              profile.id
            ] = profile;

          }
        );

      }

    }


    list.innerHTML =
      comments.map(
        function(comment){

          const profile =
            commentProfiles[
              comment.user_id
            ] || {};


          let username =
            profile.username ||
            "";


          let displayName =
            profile.name ||
            "";


          if(
            !username &&
            currentUser &&
            comment.user_id ===
            currentUser.id
          ){

            username =
              currentUser
                .user_metadata
                ?.username ||
              currentUser.email
                ?.split("@")[0] ||
              "User";

          }


          if(!username){
            username = "User";
          }


          const isOwn =
            currentUser &&
            comment.user_id ===
            currentUser.id;


          return `
            <div class="comment-item">

              <div
                style="
                  display:flex;
                  align-items:center;
                  gap:8px;
                "
              >

                ${
                  profile.avatar_url
                  ?
                  `
                  <img
                    src="${escapeAttribute(
                      profile.avatar_url
                    )}"
                    style="
                      width:32px;
                      height:32px;
                      border-radius:50%;
                      object-fit:cover;
                    "
                  >
                  `
                  :
                  `
                  <div
                    style="
                      width:32px;
                      height:32px;
                      border-radius:50%;
                      background:#ddd;
                      display:flex;
                      align-items:center;
                      justify-content:center;
                    "
                  >
                    👤
                  </div>
                  `
                }


                <div>

                  <div class="comment-user">

                    ${escapeHtml(
                      displayName ||
                      username
                    )}

                    ${
                      displayName &&
                      username
                      ?
                      `
                      <span
                        style="
                          color:#777;
                          font-weight:normal;
                          font-size:11px;
                        "
                      >
                        @${escapeHtml(
                          username
                        )}
                      </span>
                      `
                      :
                      ""
                    }

                  </div>


                  <div class="comment-date">
                    ${formatDate(
                      comment.created_at
                    )}
                  </div>

                </div>

              </div>


              <div
                style="
                  margin-top:7px;
                  white-space:pre-wrap;
                  word-break:break-word;
                "
              >
                ${escapeHtml(
                  comment.comment || ""
                )}
              </div>


              ${
                isOwn
                ?
                `
                <button
                  class="comment-delete"
                  onclick="
                    deleteComment(
                      ${Number(comment.id)},
                      ${Number(postId)}
                    )
                  "
                >
                  Delete
                </button>
                `
                :
                ""
              }

            </div>
          `;

        }
      ).join("");


  }catch(error){

    console.error(
      "Comments error:",
      error
    );


    list.innerHTML =
      `<div style="
        color:#d00;
        font-size:12px;
        padding:8px;
      ">
        Comments load nahi huay.<br>
        <small>
          ${escapeHtml(
            error.message || ""
          )}
        </small>
      </div>`;

  }

}

function startVoice(){

    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SpeechRecognition){

    alert(
      "Voice typing is not supported in this browser."
    );

    return;

  }


  const recognition =
    new SpeechRecognition();


  recognition.lang =
    "ur-PK";


  recognition.interimResults =
    false;


  recognition.continuous =
    false;


  recognition.onresult =
    function(event){

      const text =
        event.results[0][0]
          .transcript;


      const textarea =
        document.getElementById(
          "postText"
        );


      textarea.value +=
        (
          textarea.value
            ? "\n"
            : ""
        ) +
        text;

    };


  recognition.onerror =
    function(event){

      console.log(
        "Voice error:",
        event
      );

    };


  recognition.start();

}

/* =========================
   DATE
========================= */

function formatDate(value){

  if(!value){
    return "";
  }


  const date =
    new Date(value);


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "";

  }


  const now =
    new Date();


  const seconds =
    Math.floor(
      (
        now.getTime() -
        date.getTime()
      ) /
      1000
    );


  if(seconds < 10){

    return "Just now";

  }


  if(seconds < 60){

    return seconds +
      " seconds ago";

  }


  const minutes =
    Math.floor(
      seconds / 60
    );


  if(minutes < 60){

    return minutes === 1
      ? "1 minute ago"
      : minutes +
        " minutes ago";

  }


  const hours =
    Math.floor(
      minutes / 60
    );


  if(hours < 24){

    return hours === 1
      ? "1 hour ago"
      : hours +
        " hours ago";

  }


  const days =
    Math.floor(
      hours / 24
    );


  if(days < 7){

    return days === 1
      ? "1 day ago"
      : days +
        " days ago";

  }


  return date.toLocaleDateString(
    "en-GB",
    {
      day:"2-digit",
      month:"short",
      year:"numeric"
    }
  );

}


/* =========================
   SECURITY
========================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}


function escapeAttribute(value){

  return escapeHtml(
    value
  );

}


function escapeJs(value){

  return String(
    value ?? ""
  )
  .replaceAll(
    "\\",
    "\\\\"
  )
  .replaceAll(
    "'",
    "\\'"
  )
  .replaceAll(
    "\n",
    "\\n"
  )
  .replaceAll(
    "\r",
    "\\r"
  );

}
