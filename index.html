<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>ChatZone 💬</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  background:#f4f1ff;
  color:#222;
}

body{
  padding-bottom:75px;
}

.header{
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  color:white;
  padding:18px 15px;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:25px;
}

.header p{
  margin:5px 0 0;
  opacity:.9;
}

.online-section{
  padding:12px;
  background:white;
  border-bottom:1px solid #ddd;
}

.online-title{
  font-weight:bold;
  margin-bottom:9px;
  color:#555;
}

.online-list{
  display:flex;
  gap:12px;
  overflow-x:auto;
}

.online-user{
  min-width:70px;
  text-align:center;
  cursor:pointer;
}

.online-user img{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #2ecc71;
}

.online-user .name{
  font-size:12px;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.container{
  max-width:680px;
  margin:auto;
  padding:12px;
}

.create-box{
  background:white;
  border-radius:15px;
  padding:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  margin-bottom:14px;
}

.create-box textarea{
  width:100%;
  min-height:70px;
  resize:none;
  border:1px solid #ddd;
  border-radius:12px;
  padding:12px;
  font-size:15px;
  outline:none;
}

.create-buttons{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.btn{
  border:0;
  border-radius:10px;
  padding:10px 13px;
  cursor:pointer;
  font-weight:bold;
}

.post-btn{
  background:#6c5ce7;
  color:white;
  flex:1;
}

.image-btn{
  background:#3498db;
  color:white;
}

.voice-btn{
  background:#e74c3c;
  color:white;
}

.refresh-btn{
  background:#eee;
  color:#333;
}

.feed-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:14px 0 10px;
}

.feed-title h2{
  margin:0;
  font-size:20px;
}

.post{
  background:white;
  border-radius:15px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.post-head{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

.post-user{
  font-weight:bold;
}

.post-time{
  color:#888;
  font-size:12px;
  margin-top:2px;
}

.post-content{
  margin-top:12px;
  white-space:pre-wrap;
  word-break:break-word;
}

.post-image{
  width:100%;
  max-height:500px;
  object-fit:contain;
  border-radius:12px;
  margin-top:10px;
  background:#eee;
}

.category-badge{
  display:inline-block;
  margin-top:9px;
  padding:5px 9px;
  border-radius:20px;
  background:#eee8ff;
  color:#6c5ce7;
  font-size:12px;
  font-weight:bold;
}

.voice-player{
  width:100%;
  margin-top:10px;
}

.post-actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:12px;
}

.action-btn{
  border:0;
  border-radius:9px;
  padding:8px 10px;
  background:#f0f0f0;
  cursor:pointer;
  font-size:13px;
}

.action-btn.selected{
  background:#6c5ce7;
  color:white;
}

.delete-btn{
  background:#ffe5e5;
  color:#d63031;
}

.comments{
  margin-top:10px;
}

.comment{
  background:#f6f6f6;
  padding:8px;
  border-radius:9px;
  margin-top:6px;
  font-size:13px;
}

.comment-input{
  display:flex;
  gap:7px;
  margin-top:8px;
}

.comment-input input{
  flex:1;
  border:1px solid #ddd;
  border-radius:9px;
  padding:9px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:1000;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal-box{
  width:100%;
  max-width:450px;
  background:white;
  border-radius:17px;
  padding:18px;
  max-height:90vh;
  overflow:auto;
}

.modal-box h3{
  margin-top:0;
}

.modal-box input,
.modal-box select,
.modal-box textarea{
  width:100%;
  padding:11px;
  border:1px solid #ddd;
  border-radius:10px;
  margin:7px 0;
}

.preview-image{
  width:100%;
  max-height:300px;
  object-fit:contain;
  border-radius:12px;
  margin-top:8px;
  display:none;
}

.modal-buttons{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.modal-buttons button{
  flex:1;
}

.voice-status{
  text-align:center;
  padding:15px;
  font-weight:bold;
}

.timer{
  font-size:28px;
  text-align:center;
  margin:10px;
}

.reply-bar{
  display:none;
  background:#eee8ff;
  padding:9px;
  border-radius:9px;
  margin-top:8px;
  color:#6c5ce7;
  font-weight:bold;
}

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:65px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  z-index:900;
  box-shadow:0 -2px 8px rgba(0,0,0,.08);
}

.bottom-nav button{
  flex:1;
  border:0;
  background:white;
  font-size:12px;
  cursor:pointer;
}

.bottom-nav button.active{
  color:#6c5ce7;
  font-weight:bold;
}

.loading,
.empty{
  text-align:center;
  padding:25px;
  color:#777;
}

.error{
  background:#ffe6e6;
  color:#c0392b;
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
}

.close-x{
  float:right;
  cursor:pointer;
  font-size:22px;
}

.small-note{
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>

<div class="header">
  <h1>ChatZone 💬</h1>
  <p>Connect • Share • Enjoy</p>
</div>

<!-- ONLINE USERS ONLY VISIBLE ON HOME -->
<div class="online-section">
  <div class="online-title">
    🟢 Online Users <span id="onlineCount">0</span>
  </div>
  <div id="onlineList" class="online-list">
    <div class="empty">Loading...</div>
  </div>
</div>

<div class="container">

  <div class="create-box">

    <textarea
      id="postText"
      placeholder="What's on your mind?"
    ></textarea>

    <div id="replyBar" class="reply-bar">
      Replying to <span id="replyingUsername"></span>
      <button
        class="action-btn"
        onclick="cancelReply()"
        style="float:right"
      >Cancel</button>
    </div>

    <div class="create-buttons">

      <button
        class="btn post-btn"
        onclick="sendTextPost()"
      >
        Send Post
      </button>

      <button
        class="btn image-btn"
        onclick="openImageModal()"
      >
        Image
      </button>

      <button
        class="btn voice-btn"
        onclick="openVoiceModal()"
      >
        Voice
      </button>

    </div>
  </div>

  <div class="feed-title">
    <h2>Home Feed</h2>

    <button
      class="btn refresh-btn"
      onclick="loadFeed()"
    >
      🔄 Refresh
    </button>
  </div>

  <div id="message"></div>

  <div id="feed">
    <div class="loading">Loading feed...</div>
  </div>

</div>

<!-- IMAGE MODAL -->
<div id="imageModal" class="modal">

  <div class="modal-box">

    <span
      class="close-x"
      onclick="closeImageModal()"
    >×</span>

    <h3>🖼️ Create Image Post</h3>

    <input
      type="file"
      id="imageFile"
      accept="image/*"
      onchange="previewSelectedImage()"
    >

    <img
      id="imagePreview"
      class="preview-image"
    >

    <!-- CATEGORY SYSTEM RESTORED -->
    <label><b>Category</b></label>

    <select id="imageCategory">

      <option value="General">
        General
      </option>

      <option value="Funny">
        Funny
      </option>

      <option value="Sad">
        Sad
      </option>

      <option value="Love">
        Love
      </option>

      <option value="News">
        News
      </option>

      <option value="Other">
        Other
      </option>

    </select>

    <textarea
      id="imageCaption"
      placeholder="Write a caption..."
      rows="3"
    ></textarea>

    <div class="modal-buttons">

      <button
        class="btn refresh-btn"
        onclick="closeImageModal()"
      >
        Cancel
      </button>

      <button
        class="btn image-btn"
        onclick="sendImagePost()"
      >
        Send Image
      </button>

    </div>

  </div>

</div>

<!-- VOICE MODAL -->
<div id="voiceModal" class="modal">

  <div class="modal-box">

    <span
      class="close-x"
      onclick="closeVoiceModal()"

    <h3>🎙️ Voice Recorder</h3>

    <div
      id="voiceStatus"
      class="voice-status"

      Ready to record

    <div
      id="voiceTimer"

      00:00

    <audio

      <button

        🔴 Record

      <button

        ⏹ Stop

        Send Voice

    </div>

  </div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">

  <button
    class="active"
    onclick="location.href='index.html'"
  >
    🏠<br>Home
  </button>

  <button
    onclick="location.href='private.html'"
  >
    💬<br>Private
  </button>

  <button
    onclick="location.href='mehfil.html'"
  >
    👥<br>Mehfil
  </button>

  <button
    onclick="location.href='profile.html'"
  >
    👤<br>Profile
  </button>

  <button
    onclick="location.href='more.html'"
  >
    ☰<br>More
  </button>

</div>

<script>

const SUPABASE_URL =
  "https://jhcpqjmxiovvqbghpxbf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true
      }
    }
  );

let currentUser = null;

let profilesCache = {};

let replyingToUserId = null;
let replyingToUsername = null;

let selectedImageFile = null;

let mediaRecorder = null;
let recordedChunks = [];
let recordedBlob = null;
let recordingTimer = null;
let recordingSeconds = 0;
let voiceDiscarded = false;


/* =========================
   INIT
========================= */

async function init(){

  const {
    data:{
      session
    }
  } = await supabaseClient.auth.getSession();

  if(!session){

    location.href = "login.html";
    return;
  }

  currentUser = session.user;

  startGlobalPresence();

  await loadFeed();

  await loadOnlineUsers();
}


/* =========================
   GLOBAL PRESENCE
========================= */

async function startGlobalPresence(){

  if(!currentUser) return;

  const channel =
    supabaseClient.channel(
      "chatzone-online-users",
      {
        config:{
          presence:{
            key:String(currentUser.id)
          }
        }
      }
    );

  channel.on(
    "presence",
    {
      event:"sync"
    },
    ()=>{
      loadOnlineUsers();
    }
  );

  channel.on(
    "presence",
    {
      event:"join"
    },
    ()=>{
      loadOnlineUsers();
    }
  );

  channel.on(
    "presence",
    {
      event:"leave"
    },
    ()=>{
      loadOnlineUsers();
    }
  );

  await channel.subscribe(
    async status=>{

      if(status === "SUBSCRIBED"){

        await channel.track({

          user_id:String(currentUser.id),

          online_at:
            new Date().toISOString()

        });

      }

    }
  );

}


/* =========================
   ONLINE USERS
========================= */

async function loadOnlineUsers(){

  try{

    const channel =
      supabaseClient.getChannels()
      .find(
        c =>
          c.topic ===
          "realtime:chatzone-online-users"
      );

    if(!channel){

      document.getElementById(
        "onlineList"
      ).innerHTML =
        '<div class="empty">No users online</div>';

      return;
    }

    const state =
      channel.presenceState();

    const ids = [];

    Object.keys(state).forEach(key=>{

      state[key].forEach(item=>{

        if(item.user_id &&
           !ids.includes(item.user_id)){

          ids.push(item.user_id);

        }

      });

    });

    document.getElementById(
      "onlineCount"
    ).textContent = ids.length;

    if(ids.length === 0){

      document.getElementById(
        "onlineList"
      ).innerHTML =
        '<div class="empty">No users online</div>';

      return;
    }

    const {
      data:profiles,
      error
    } =
      await supabaseClient
      .from("profiles")
      .select(
        "id,username,name,avatar_url"
      )
      .in("id",ids);

    if(error) throw error;

    document.getElementById(
      "onlineList"
    ).innerHTML =
      (profiles || []).map(profile=>{

        const avatar =
          profile.avatar_url ||
          "https://via.placeholder.com/100";

        const name =
          profile.name ||
          profile.username ||
          "User";

        return `
          <div
            class="online-user"
            onclick="openUserProfile('${profile.id}')"
          >

            <img
              src="${escapeHtml(avatar)}"
            >

            <div class="name">
              @${escapeHtml(profile.username || name)}
            </div>

          </div>
        `;

      }).join("");

  }catch(error){

    console.error(
      "Online users error:",
      error
    );

  }

}


/* =========================
   FEED
========================= */

async function loadFeed(){

  const feed =
    document.getElementById("feed");

  const message =
    document.getElementById("message");

  feed.innerHTML =
    '<div class="loading">Loading feed...</div>';

  message.innerHTML = "";

  try{

    const blockedUsers =
      await getBlockedUsers();

    /*
      IMPORTANT:
      posts.username IS NOT selected.
      Username comes from profiles.
    */

    const {
      data:posts,
      error
    } =
      await supabaseClient
      .from("posts")
      .select(`
        id,
        user_id,
        content,
        created_at,
        post_type,
        category,
        image_url,
        voice_url,
        voice_duration
      `)
      .order(
        "created_at",
        {
          ascending:false
        }
      );

    if(error) throw error;

    const visiblePosts =
      (posts || []).filter(
        post =>
          !blockedUsers.has(
            post.user_id
          )
      );

    if(visiblePosts.length === 0){

      feed.innerHTML =
        '<div class="empty">No posts yet.</div>';

      return;
    }

    const userIds =
      [
        ...new Set(
          visiblePosts.map(
            post => post.user_id
          )
        )
      ];

    const {
      data:profiles,
      error:profileError
    } =
      await supabaseClient
      .from("profiles")
      .select(
        "id,username,name,avatar_url"
      )
      .in("id",userIds);

    if(profileError) throw profileError;

    profilesCache = {};

    (profiles || []).forEach(profile=>{

      profilesCache[
        profile.id
      ] = profile;

    });

    /*
      Load actions
    */

    const postIds =
      visiblePosts.map(
        post => post.id
      );

    let actions = [];

    if(postIds.length){

      const {
        data,
        error:actionError
      } =
        await supabaseClient
        .from("post_actions")
        .select(
          "id,post_id,user_id,action_type"
        )
        .in(
          "post_id",
          postIds
        );

      if(!actionError){

        actions = data || [];

      }

    }

    /*
      Load comments
    */

    let comments = [];

    if(postIds.length){

      const {
        data,
        error:commentError
      } =
        await supabaseClient
        .from("comments")
        .select(
          "id,post_id,user_id,username,comment,created_at,parent_id"
        )
        .in(
          "post_id",
          postIds
        )
        .order(
          "created_at",
          {
            ascending:true
          }
        );

      if(!commentError){

        comments = data || [];

      }

    }

    feed.innerHTML =
      visiblePosts.map(
        post =>
          renderPost(
            post,
            actions,
            comments
          )
      ).join("");

  }catch(error){

    console.error(error);

    feed.innerHTML = "";

    message.innerHTML = `
      <div class="error">
        Feed load nahi ho saki.<br>
        ${escapeHtml(
          error.message || "Unknown error"
        )}
      </div>
    `;

  }

}


/* =========================
   RENDER POST
========================= */

function renderPost(
  post,
  actions,
  comments
){

  const profile =
    profilesCache[
      post.user_id
    ] || {};

  /*
    IMPORTANT:
    No post.username.
  */

  const username =
    profile.username ||
    "user";

  const name =
    profile.name ||
    username;

  const avatar =
    profile.avatar_url ||
    "https://via.placeholder.com/100";

  const isOwn =
    post.user_id ===
    currentUser.id;

  const postActions =
    actions.filter(
      action =>
        action.post_id ===
        post.id
    );

  const likes =
    postActions.filter(
      action =>
        action.action_type ===
        "like"
    ).length;

  const dislikes =
    postActions.filter(
      action =>
        action.action_type ===
        "dislike"
    ).length;

  const myAction =
    postActions.find(
      action =>
        action.user_id ===
        currentUser.id
    );

  const postComments =
    comments.filter(
      comment =>
        comment.post_id ===
        post.id
    );

  let contentHtml = "";

  if(post.content){

    contentHtml += `
      <div class="post-content">
        ${escapeHtml(post.content)}
      </div>
    `;

  }

  /*
    IMAGE + CATEGORY
  */

  if(post.image_url){

    if(post.category){

      contentHtml += `
        <div class="category-badge">
          📂 ${escapeHtml(post.category)}
        </div>
      `;

    }

    contentHtml += `
      <img
        class="post-image"
        src="${escapeHtml(post.image_url)}"
        onclick="window.open('${escapeHtml(post.image_url)}','_blank')"
      >
    `;

  }

  /*
    VOICE
  */

  if(post.voice_url){

    contentHtml += `
      <audio
        class="voice-player"
        controls
        src="${escapeHtml(post.voice_url)}"
      ></audio>
    `;

    if(post.voice_duration){

      contentHtml += `
        <div class="small-note">
          🎙️ ${formatDuration(
            post.voice_duration
          )}
        </div>
      `;

    }

  }

  /*
    CATEGORY FOR NON-IMAGE POSTS
    only if somehow present
  */

  if(
    post.category &&
    !post.image_url
  ){

    contentHtml += `
      <div class="category-badge">
        📂 ${escapeHtml(post.category)}
      </div>
    `;

  }

  const buttons = [];

  if(!isOwn){

    buttons.push(`
      <button
        class="action-btn"
        onclick="startReply(
          '${post.user_id}',
          '${escapeJs(username)}'
        )"
      >
        ↩️ Reply
      </button>
    `);

    buttons.push(`
      <button
        class="action-btn"
        onclick="openPrivate('${post.user_id}')"
      >
        💬 1on1
      </button>
    `);

    buttons.push(`
      <button
        class="action-btn"
        onclick="followUser('${post.user_id}')"
      >
        ➕ Follow
      </button>
    `);

    buttons.push(`
      <button
        class="action-btn"
        onclick="blockUser('${post.user_id}')"
      >
        🚫 Block
      </button>
    `);

  }else{

    buttons.push(`
      <button
        class="action-btn delete-btn"
        onclick="deletePost(${post.id})"
      >
        🗑 Delete
      </button>
    `);

  }

  return `
    <div class="post">

      <div
        class="post-head"
        onclick="openUserProfile('${post.user_id}')"
      >

        <img
          class="avatar"
          src="${escapeHtml(avatar)}"
        >

        <div>

          <div class="post-user">
            ${escapeHtml(name)}
          </div>

          <div class="post-time">
            @${escapeHtml(username)}
            •
            ${formatDate(post.created_at)}
          </div>

        </div>

      </div>

      ${contentHtml}

      <div class="post-actions">

        <button
          class="action-btn ${
            myAction &&
            myAction.action_type === "like"
              ? "selected"
              : ""
          }"
          onclick="toggleAction(
            ${post.id},
            'like'
          )"
        >
          👍 ${likes}
        </button>

        <button
          class="action-btn ${
            myAction &&
            myAction.action_type === "dislike"
              ? "selected"
              : ""
          }"
          onclick="toggleAction(
            ${post.id},
            'dislike'
          )"
        >
          👎 ${dislikes}
        </button>

        <button
          class="action-btn"
          onclick="focusComment(${post.id})"
        >
          💬 ${postComments.length}
        </button>

        ${buttons.join("")}

      </div>

      <div
        class="comments"
        id="comments-${post.id}"
      >

        ${
          postComments.map(
            comment => `
              <div class="comment">

                <b>
                  @${escapeHtml(
                    comment.username ||
                    "user"
                  )}
                </b>

                ${escapeHtml(
                  comment.comment
                )}

                ${
                  comment.user_id ===
                  currentUser.id
                    ? `
                      <button
                        class="action-btn delete-btn"
                        onclick="deleteComment(
                          ${comment.id},
                          ${post.id}
                        )"
                      >
                        Delete
                      </button>
                    `
                    : ""
                }

              </div>
            `
          ).join("")
        }

      </div>

      <div class="comment-input">

        <input
          id="comment-input-${post.id}"
          placeholder="Write a comment..."
          onkeydown="
            if(event.key==='Enter'){
              sendComment(${post.id})
            }
          "
        >

        <button
          class="btn post-btn"
          onclick="sendComment(${post.id})"
        >
          Send
        </button>

      </div>

    </div>
  `;
}

/* =========================
   START RECORDING
========================= */

async function startRecording(){

  try{

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      alert(
        "Is browser mein voice recording supported nahi hai."
      );

      return;
    }

    const stream =
      await navigator.mediaDevices
      .getUserMedia({
        audio:true
      });

    recordedChunks = [];

    recordedBlob = null;

    const mimeTypes = [
      "audio/webm;codecs=opus",
      "audio/webm",
      "audio/ogg;codecs=opus"
    ];

    let mimeType = "";

    for(
      const type of mimeTypes
    ){

      if(
        MediaRecorder.isTypeSupported(
          type
        )
      ){

        mimeType = type;
        break;

      }

    }

    mediaRecorder =
      new MediaRecorder(
        stream,
        mimeType
          ? {mimeType}
          : undefined
      );

    mediaRecorder.ondataavailable =
      event => {

        if(
          event.data &&
          event.data.size > 0
        ){

          recordedChunks.push(
            event.data
          );

        }

      };

    mediaRecorder.onstop =
      ()=>{

        stream.getTracks()
          .forEach(
            track =>
              track.stop()
          );

        if(voiceDiscarded){

          recordedChunks = [];
          recordedBlob = null;

          return;
        }

        const type =
          mimeType ||
          "audio/webm";

        recordedBlob =
          new Blob(
            recordedChunks,
            {
              type
            }
          );

        document.getElementById(
          "voiceStatus"
        ).textContent =
          "Recording ready ✅";

        const preview =
          document.getElementById(
            "voicePreview"
          );

        preview.src =
          URL.createObjectURL(
            recordedBlob
          );

        preview.style.display =
          "block";

        document.getElementById(
          "sendVoiceBtn"
        ).disabled =
          false;

      };

    mediaRecorder.start();

    document.getElementById(
      "voiceStatus"
    ).textContent =
      "🔴 Recording...";

    document.getElementById(
      "recordVoiceBtn"
    ).disabled =
      true;

    document.getElementById(
      "stopVoiceBtn"
    ).disabled =
      false;

    document.getElementById(
      "sendVoiceBtn"
    ).disabled =
      true;

    recordingSeconds = 0;

    recordingTimer =
      setInterval(
        ()=>{

          recordingSeconds++;

          document.getElementById(
            "voiceTimer"
          ).textContent =
            formatDuration(
              recordingSeconds
            );

        },
        1000
      );

  }catch(error){

    console.error(error);

    alert(
      "Microphone permission allow karein."
    );

  }

}


/* =========================
   STOP RECORDING
========================= */

function stopRecording(){

  if(
    mediaRecorder &&
    mediaRecorder.state !==
    "inactive"
  ){

    mediaRecorder.stop();

  }

  clearInterval(
    recordingTimer
  );

  document.getElementById(
    "stopVoiceBtn"
  ).disabled =
    true;

  document.getElementById(
    "recordVoiceBtn"
  ).disabled =
    false;

}

/* =========================

========================= */

async function toggleAction(
  postId,
  actionType
){

  try{

    const {
      data:existing,
      error:findError
    } =
      await supabaseClient
      .from("post_actions")
      .select(
        "id,action_type"
      )
      .eq(
        "post_id",
        postId
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .maybeSingle();

    if(findError)
      throw findError;

    if(existing){

      if(
        existing.action_type ===
        actionType
      ){

        const {error} =
          await supabaseClient
          .from("post_actions")
          .delete()
          .eq(
            "id",
            existing.id
          );

        if(error) throw error;

      }else{

        const {error} =
          await supabaseClient
          .from("post_actions")
          .update({
            action_type:
              actionType
          })
          .eq(
            "id",
            existing.id
          );

        if(error) throw error;

      }

    }else{

      const {error} =
        await supabaseClient
        .from("post_actions")
        .insert({

          post_id:
            postId,

          user_id:
            currentUser.id,

          action_type:
            actionType

        });

      if(error) throw error;

    }

    await loadFeed();

  }catch(error){

    alert(
      error.message
    );

  }

}

/* =========================
   DATE
========================= */

function formatDate(
  dateString
){

  const date =
    new Date(dateString);

  const now =
    new Date();

  const diff =
    Math.floor(
      (now - date) / 1000
    );

  if(diff < 60)
    return "Just now";

  if(diff < 3600)
    return Math.floor(
      diff / 60
    ) + "m ago";

  if(diff < 86400)
    return Math.floor(
      diff / 3600
    ) + "h ago";

  if(diff < 604800)
    return Math.floor(
      diff / 86400
    ) + "d ago";

  return date.toLocaleDateString();

}


function formatDuration(
  seconds
){

  seconds =
    Number(seconds) || 0;

  const mins =
    Math.floor(
      seconds / 60
    );

  const secs =
    seconds % 60;

  return (
    String(mins).padStart(2,"0") +
    ":" +
    String(secs).padStart(2,"0")
  );

}


/* =========================
   SECURITY / HTML
========================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function escapeJs(value){

  return String(
    value ?? ""
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  )
  .replace(
    /\n/g,
    "\\n"
  )
  .replace(
    /\r/g,
    "\\r"
  );

}
