<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RabtaHub</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6fb;
  color:#222;
  padding-bottom:75px;
}

.header{
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  color:white;
  padding:14px 15px 12px;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.header-inner{
  max-width:650px;
  margin:auto;
}

.header-main{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:25px;
  font-weight:800;
}

.header-user{
  font-size:13px;
  opacity:.9;
}

.header-options{
  display:flex;
  gap:7px;
  margin-top:12px;
}

.header-option{
  flex:1;
  border:0;
  background:rgba(255,255,255,.16);
  color:white;
  padding:9px 5px;
  border-radius:10px;
  font-size:11px;
  font-weight:bold;
  cursor:pointer;
}

.container{
  width:100%;
  max-width:650px;
  margin:auto;
  padding:15px;
}


/* =========================
   HOME MESSAGE
========================= */

.message-box{
  background:white;
  padding:14px;
  border-radius:16px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
  margin-bottom:12px;
}

.message-row{
  display:flex;
  gap:8px;
  align-items:flex-end;
}

.message-input{
  flex:1;
  min-height:48px;
  max-height:120px;
  resize:none;
  border:1px solid #ddd;
  border-radius:13px;
  padding:13px;
  font-size:14px;
  outline:none;
  margin:0;
}

.message-input:focus{
  border-color:#6c5ce7;
}

.send-message-btn{
  width:48px;
  height:48px;
  border:0;
  border-radius:13px;
  background:#6c5ce7;
  color:white;
  font-size:20px;
  cursor:pointer;
}

.message-bottom{
  display:flex;
  justify-content:flex-end;
  margin-top:8px;
}

.share-btn{
  border:0;
  background:#f0edff;
  color:#6c5ce7;
  padding:9px 15px;
  border-radius:10px;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
}


/* =========================
   SHARE MENU
========================= */

.share-menu{
  display:none;
  gap:10px;
  margin-top:12px;
}

.share-option{
  flex:1;
  padding:13px 8px;
  border:1px solid #ddd;
  background:white;
  border-radius:12px;
  font-size:14px;
  cursor:pointer;
}

.share-option:hover{
  background:#f4f1ff;
}


/* =========================
   COMPOSER
========================= */

.composer{
  display:none;
  background:white;
  padding:16px;
  border-radius:16px;
  margin-top:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.composer h3{
  margin:0 0 15px;
}

select,
textarea,
input[type="file"]{
  width:100%;
}

select{
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  background:white;
  margin-bottom:12px;
}

textarea{
  min-height:110px;
  resize:none;
  padding:13px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:15px;
  outline:none;
  margin-bottom:12px;
}

.preview{
  width:100%;
  max-height:300px;
  object-fit:cover;
  border-radius:12px;
  display:none;
  margin-bottom:12px;
}

.publish-btn{
  width:100%;
  padding:13px;
  border:0;
  border-radius:11px;
  background:#6c5ce7;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.cancel-btn{
  width:100%;
  padding:11px;
  border:0;
  border-radius:11px;
  background:#eee;
  margin-top:8px;
  cursor:pointer;
}


/* =========================
   FEED
========================= */

.feed-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:18px 0 12px;
}

.feed-title h2{
  margin:0;
  font-size:20px;
}

.refresh-btn{
  border:0;
  background:white;
  padding:8px 12px;
  border-radius:10px;
  cursor:pointer;
}


/* =========================
   POST
========================= */

.post{
  background:white;
  border-radius:16px;
  padding:15px;
  margin-bottom:14px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.post-header{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:43px;
  height:43px;
  border-radius:50%;
  background:#6c5ce7;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  overflow:hidden;
  flex-shrink:0;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.user-info{
  flex:1;
  min-width:0;
}

.username{
  font-weight:bold;
  word-break:break-word;
}

.date{
  color:#888;
  font-size:12px;
  margin-top:3px;
}

.message-label{
  display:inline-block;
  margin-top:10px;
  color:#777;
  font-size:11px;
}

.category{
  display:inline-block;
  margin-top:10px;
  padding:5px 9px;
  background:#f0edff;
  color:#6c5ce7;
  border-radius:8px;
  font-size:12px;
  font-weight:bold;
}

.post-content{
  margin-top:12px;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
}

.post-image{
  width:100%;
  max-height:450px;
  object-fit:cover;
  border-radius:13px;
  margin-top:12px;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:14px;
  padding-top:12px;
  border-top:1px solid #eee;
}

.action-btn{
  border:0;
  background:#f4f5f9;
  padding:8px 10px;
  border-radius:9px;
  font-size:13px;
  cursor:pointer;
}

.delete-btn{
  color:#d63031;
  margin-left:auto;
}

.loading,
.empty{
  text-align:center;
  color:#777;
  padding:30px 10px;
}


/* =========================
   NOTICE
========================= */

.notice{
  position:fixed;
  left:50%;
  bottom:85px;
  transform:translateX(-50%);
  background:#222;
  color:white;
  padding:10px 16px;
  border-radius:10px;
  display:none;
  z-index:500;
  font-size:14px;
  max-width:90%;
  text-align:center;
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:68px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:center;
  z-index:200;
}

.nav-inner{
  width:100%;
  max-width:650px;
  display:flex;
}

.nav-btn{
  flex:1;
  border:0;
  background:white;
  color:#777;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:11px;
  cursor:pointer;
}

.nav-icon{
  font-size:20px;
}

.nav-btn.active{
  color:#6c5ce7;
  font-weight:bold;
}

</style>

</head>

<body>


<header class="header">

  <div class="header-inner">

    <div class="header-main">

      <div class="logo">
        RabtaHub
      </div>

      <div
        class="header-user"
        id="headerUser">
        Loading...
      </div>

    </div>


    <div class="header-options">

      <button
        class="header-option"
        onclick="goNotifications()">
        🔔 Notifications
      </button>

      <button
        class="header-option"
        onclick="goStars()">
        ⭐ Stars
      </button>

      <button
        class="header-option"
        onclick="goTrending()">
        🔥 Trending
      </button>

    </div>

  </div>

</header>


<main class="container">


<!-- =========================
     HOME MESSAGE BOX
========================= -->

<section class="message-box">

  <div class="message-row">

    <textarea
      id="homeMessage"
      class="message-input"
      maxlength="2000"
      placeholder="Write a message..."></textarea>

    <button
      class="send-message-btn"
      onclick="sendHomeMessage()">
      ➤
    </button>

  </div>


  <div class="message-bottom">

    <button
      class="share-btn"
      onclick="toggleShareMenu()">
      📤 Share
    </button>

  </div>


  <!-- SHARE OPTIONS -->

  <div
    class="share-menu"
    id="shareMenu">

    <button
      class="share-option"
      onclick="openComposer('text')">
      📝 Text Post
    </button>

    <button
      class="share-option"
      onclick="openComposer('image')">
      🖼️ Image Post
    </button>

  </div>


  <!-- TEXT POST -->

  <div
    class="composer"
    id="textComposer">

    <h3>
      📝 Text Post
    </h3>


    <select id="textCategory">

      <option value="">
        Select Category
      </option>

      <option>General</option>
      <option>Funny</option>
      <option>Love</option>
      <option>Sad</option>
      <option>News</option>
      <option>Music</option>
      <option>Entertainment</option>
      <option>Islamic</option>
      <option>Thoughts</option>
      <option>Photography</option>
      <option>Mehfil</option>

    </select>


    <textarea
      id="textContent"
      maxlength="2000"
      placeholder="Write your post..."></textarea>


    <button
      class="publish-btn"
      onclick="publishTextPost()">
      Publish Post
    </button>


    <button
      class="cancel-btn"
      onclick="closeComposer()">
      Cancel
    </button>

  </div>


  <!-- IMAGE POST -->

  <div
    class="composer"
    id="imageComposer">

    <h3>
      🖼️ Image Post
    </h3>


    <select id="imageCategory">

      <option value="">
        Select Category
      </option>

      <option>General</option>
      <option>Funny</option>
      <option>Love</option>
      <option>Sad</option>
      <option>News</option>
      <option>Music</option>
      <option>Entertainment</option>
      <option>Islamic</option>
      <option>Thoughts</option>
      <option>Photography</option>
      <option>Mehfil</option>

    </select>


    <input
      type="file"
      id="imageFile"
      accept="image/*"
      onchange="previewImage(this)">


    <img
      id="imagePreview"
      class="preview"
      alt="Preview">


    <textarea
      id="imageCaption"
      maxlength="1000"
      placeholder="Caption (optional)..."></textarea>


    <button
      class="publish-btn"
      onclick="publishImagePost()">
      Publish Image
    </button>


    <button
      class="cancel-btn"
      onclick="closeComposer()">
      Cancel
    </button>

  </div>

</section>


<!-- =========================
     FEED
========================= -->

<div class="feed-title">

  <h2>
    Home Feed
  </h2>

  <button
    class="refresh-btn"
    onclick="loadFeed()">
    🔄 Refresh
  </button>

</div>


<section id="feed">

  <div class="loading">
    Loading feed...
  </div>

</section>


</main>


<div
  id="notice"
  class="notice">
</div>


<!-- =========================
     BOTTOM NAV
========================= -->

<nav class="bottom-nav">

  <div class="nav-inner">

    <button
      class="nav-btn active"
      onclick="goHome()">

      <span class="nav-icon">🏠</span>
      <span>Home</span>

    </button>


    <button
      class="nav-btn"
      onclick="goPrivate()">

      <span class="nav-icon">💬</span>
      <span>Private</span>

    </button>


    <button
      class="nav-btn"
      onclick="goProfile()">

      <span class="nav-icon">👤</span>
      <span>Profile</span>

    </button>


    <button
      class="nav-btn"
      onclick="goMehfil()">

      <span class="nav-icon">🏠</span>
      <span>Mehfil</span>

    </button>


    <button
      class="nav-btn"
      onclick="goMore()">

      <span class="nav-icon">☰</span>
      <span>More</span>

    </button>

  </div>

</nav>


<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://jhcpqjmxiovvqbghpxbf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentUser = null;
let currentProfile = null;


/* =========================
   INIT
========================= */

async function init(){

  const {
    data,
    error
  } =
  await supabaseClient.auth.getSession();


  if(error || !data.session){

    window.location.href =
      "login.html";

    return;

  }


  currentUser =
    data.session.user;


  await loadProfile();

  await loadFeed();

}


/* =========================
   PROFILE
========================= */

async function loadProfile(){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("profiles")
    .select(
      "id,username,name,avatar_url"
    )
    .eq(
      "id",
      currentUser.id
    )
    .maybeSingle();


  if(error){

    console.error(
      "PROFILE ERROR:",
      error
    );

    return;

  }


  currentProfile =
    data;


  const username =
    data?.username ||
    currentUser.user_metadata?.username ||
    currentUser.email?.split("@")[0] ||
    "User";


  document
    .getElementById("headerUser")
    .textContent =
    "@" + username;

}


/* =========================
   SHARE MENU
========================= */

function toggleShareMenu(){

  const menu =
    document.getElementById(
      "shareMenu"
    );


  menu.style.display =
    menu.style.display === "flex"
      ? "none"
      : "flex";

}


/* =========================
   OPEN COMPOSER
========================= */

function openComposer(type){

  document
    .getElementById("shareMenu")
    .style.display =
    "none";


  document
    .getElementById("textComposer")
    .style.display =
    "none";


  document
    .getElementById("imageComposer")
    .style.display =
    "none";


  if(type === "text"){

    document
      .getElementById("textComposer")
      .style.display =
      "block";

  }


  if(type === "image"){

    document
      .getElementById("imageComposer")
      .style.display =
      "block";

  }

}


/* =========================
   CLOSE COMPOSER
========================= */

function closeComposer(){

  document
    .getElementById("textComposer")
    .style.display =
    "none";


  document
    .getElementById("imageComposer")
    .style.display =
    "none";


  document
    .getElementById("shareMenu")
    .style.display =
    "none";

}


/* =========================
   HOME MESSAGE
========================= */

async function sendHomeMessage(){

  const input =
    document.getElementById(
      "homeMessage"
    );


  const message =
    input.value.trim();


  if(!message){

    showNotice(
      "Message likho."
    );

    return;

  }


  const {
    error
  } =
  await supabaseClient
    .from("posts")
    .insert({

      user_id:
        currentUser.id,

      content:
        message,

      post_type:
        "message",

      category:
        "General"

    });


  if(error){

    console.error(
      "MESSAGE ERROR:",
      error
    );

    showNotice(
      "Message send nahi hua: " +
      error.message
    );

    return;

  }


  input.value = "";


  showNotice(
    "Message sent! ❤️"
  );


  await loadFeed();

}


/* =========================
   TEXT POST
========================= */

async function publishTextPost(){

  const category =
    document
      .getElementById(
        "textCategory"
      )
      .value;


  const content =
    document
      .getElementById(
        "textContent"
      )
      .value
      .trim();


  if(!category){

    showNotice(
      "Pehle category select karo."
    );

    return;

  }


  if(!content){

    showNotice(
      "Post likho."
    );

    return;

  }


  const {
    error
  } =
  await supabaseClient
    .from("posts")
    .insert({

      user_id:
        currentUser.id,

      content:
        content,

      post_type:
        "text",

      category:
        category

    });


  if(error){

    console.error(
      "TEXT POST ERROR:",
      error
    );

    showNotice(
      "Post nahi hua: " +
      error.message
    );

    return;

  }


  document
    .getElementById(
      "textContent"
    )
    .value = "";


  document
    .getElementById(
      "textCategory"
    )
    .value = "";


  closeComposer();


  showNotice(
    "Post published! ❤️"
  );


  await loadFeed();

}


/* =========================
   IMAGE PREVIEW
========================= */

function previewImage(input){

  const preview =
    document.getElementById(
      "imagePreview"
    );


  const file =
    input.files[0];


  if(!file){

    preview.style.display =
      "none";

    return;

  }


  preview.src =
    URL.createObjectURL(file);


  preview.style.display =
    "block";

}


/* =========================
   IMAGE POST
========================= */

async function publishImagePost(){

  const category =
    document
      .getElementById(
        "imageCategory"
      )
      .value;


  const file =
    document
      .getElementById(
        "imageFile"
      )
      .files[0];


  const caption =
    document
      .getElementById(
        "imageCaption"
      )
      .value
      .trim();


  if(!category){

    showNotice(
      "Pehle category select karo."
    );

    return;

  }


  if(!file){

    showNotice(
      "Image select karo."
    );

    return;

  }


  const extension =
    file.name
      .split(".")
      .pop();


  const fileName =
    currentUser.id +
    "/" +
    Date.now() +
    "." +
    extension;


  showNotice(
    "Image uploading..."
  );


  const {
    error: uploadError
  } =
  await supabaseClient
    .storage
    .from("post-images")
    .upload(
      fileName,
      file
    );


  if(uploadError){

    console.error(
      "IMAGE UPLOAD ERROR:",
      uploadError
    );

    showNotice(
      "Image upload nahi hui: " +
      uploadError.message
    );

    return;

  }


  const {
    data: publicData
  } =
  supabaseClient
    .storage
    .from("post-images")
    .getPublicUrl(
      fileName
    );


  const imageUrl =
    publicData.publicUrl;


  const {
    error
  } =
  await supabaseClient
    .from("posts")
    .insert({

      user_id:
        currentUser.id,

      content:
        caption,

      post_type:
        "image",

      category:
        category,

      image_url:
        imageUrl

    });


  if(error){

    console.error(
      "IMAGE POST ERROR:",
      error
    );

    showNotice(
      "Image post save nahi hui: " +
      error.message
    );

    return;

  }


  document
    .getElementById(
      "imageFile"
    )
    .value = "";


  document
    .getElementById(
      "imageCaption"
    )
    .value = "";


  document
    .getElementById(
      "imageCategory"
    )
    .value = "";


  document
    .getElementById(
      "imagePreview"
    )
    .style.display =
    "none";


  closeComposer();


  showNotice(
    "Image post published! ❤️"
  );


  await loadFeed();

}


/* =========================
   LOAD FEED
========================= */

async function loadFeed(){

  const feed =
    document.getElementById(
      "feed"
    );


  feed.innerHTML =
    '<div class="loading">Loading feed...</div>';


  const {
    data,
    error
  } =
  await supabaseClient
    .from("posts")
    .select(`
      id,
      user_id,
      content,
      created_at,
      post_type,
      category,
      image_url
    `)
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    console.error(
      "FEED ERROR:",
      error
    );


    feed.innerHTML =
      `<div class="empty">
        Feed load nahi hua.<br><br>
        ${escapeHtml(error.message)}
      </div>`;


    return;

  }


  if(!data || data.length === 0){

    feed.innerHTML =
      `<div class="empty">
        Abhi koi post nahi hai.<br>
        Sabse pehli post aap karo! ❤️
      </div>`;


    return;

  }


  const userIds =
    [
      ...new Set(
        data
          .map(
            post =>
              post.user_id
          )
          .filter(Boolean)
      )
    ];


  let profiles = [];


  if(userIds.length){

    const result =
      await supabaseClient
        .from("profiles")
        .select(
          "id,username,name,avatar_url"
        )
        .in(
          "id",
          userIds
        );


    if(result.error){

      console.error(
        "PROFILE LIST ERROR:",
        result.error
      );

    }else{

      profiles =
        result.data || [];

    }

  }


  feed.innerHTML = "";


  for(const post of data){

    const profile =
      profiles.find(
        p =>
          p.id === post.user_id
      );


    renderPost(
      post,
      profile
    );

  }

}


/* =========================
   RENDER POST
========================= */

async function renderPost(
  post,
  profile
){

  const feed =
    document.getElementById(
      "feed"
    );


  const username =
    profile?.username ||
    profile?.name ||
    "User";


  const name =
    profile?.name ||
    username;


  const firstLetter =
    name
      .charAt(0)
      .toUpperCase();


  const ownPost =
    post.user_id ===
    currentUser.id;


  const {
    count: likeCount
  } =
  await supabaseClient
    .from("likes")
    .select(
      "id",
      {
        count:"exact",
        head:true
      }
    )
    .eq(
      "post_id",
      post.id
    );


  const {
    count: dislikeCount
  } =
  await supabaseClient
    .from("dislikes")
    .select(
      "id",
      {
        count:"exact",
        head:true
      }
    )
    .eq(
      "post_id",
      post.id
    );


  const {
    count: commentCount
  } =
  await supabaseClient
    .from("comments")
    .select(
      "id",
      {
        count:"exact",
        head:true
      }
    )
    .eq(
      "post_id",
      post.id
    );


  const div =
    document.createElement(
      "article"
    );


  div.className =
    "post";


  let avatarHtml = "";


  if(profile?.avatar_url){

    avatarHtml =
      `<img
        src="${escapeAttribute(
          profile.avatar_url
        )}"
        alt="Avatar">`;

  }else{

    avatarHtml =
      escapeHtml(
        firstLetter
      );

  }


  let media = "";


  if(
    post.post_type === "image" &&
    post.image_url
  ){

    media =
      `<img
        class="post-image"
        src="${escapeAttribute(
          post.image_url
        )}"
        alt="Post image">`;

  }


  const messageLabel =
    post.post_type === "message"
      ? `<div class="message-label">
           💬 Home Message
         </div>`
      : "";


  div.innerHTML = `

    <div class="post-header">

      <div class="avatar">
        ${avatarHtml}
      </div>


      <div class="user-info">

        <div class="username">
          ${escapeHtml(
            username
          )}
        </div>


        <div class="date">
          ${formatDate(
            post.created_at
          )}
        </div>

      </div>

    </div>


    ${messageLabel}


    ${
      post.post_type !== "message"
      ?
      `<div class="category">
        ${escapeHtml(
          post.category ||
          "General"
        )}
      </div>`
      :
      ""
    }


    ${
      post.content
      ?
      `<div class="post-content">
        ${escapeHtml(
          post.content
        )}
      </div>`
      :
      ""
    }


    ${media}


    <div class="actions">

      <button
        class="action-btn"
        onclick="toggleLike(${post.id})">

        ❤️ Like
        <span id="like-${post.id}">
          ${likeCount || 0}
        </span>

      </button>


      <button
        class="action-btn"
        onclick="toggleDislike(${post.id})">

        👎 Dislike
        <span id="dislike-${post.id}">
          ${dislikeCount || 0}
        </span>

      </button>


      <button
        class="action-btn"
        onclick="openComments(${post.id})">

        💬 Comments
        <span id="comment-${post.id}">
          ${commentCount || 0}
        </span>

      </button>


      ${
        ownPost
        ?
        `<button
          class="action-btn delete-btn"
          onclick="deletePost(${post.id})">

          🗑️ Delete

        </button>`
        :
        ""
      }

    </div>

  `;


  feed.appendChild(div);

}


/* =========================
   LIKE
========================= */

async function toggleLike(postId){

  const {
    data: existing,
    error: findError
  } =
  await supabaseClient
    .from("likes")
    .select("id")
    .eq(
      "post_id",
      postId
    )
    .eq(
      "user_id",
      currentUser.id
    )
    .maybeSingle();


  if(findError){

    console.error(
      "LIKE FIND ERROR:",
      findError
    );

    showNotice(
      "Like check nahi ho saka."
    );

    return;

  }


  if(existing){

    const {
      error
    } =
    await supabaseClient
      .from("likes")
      .delete()
      .eq(
        "id",
        existing.id
      );


    if(error){

      showNotice(
        "Like remove nahi hua: " +
        error.message
      );

      return;

    }

  }else{

    const {
      error: dislikeError
    } =
    await supabaseClient
      .from("dislikes")
      .delete()
      .eq(
        "post_id",
        postId
      )
      .eq(
        "user_id",
        currentUser.id
      );


    if(dislikeError){

      showNotice(
        "Dislike remove nahi hua: " +
        dislikeError.message
      );

      return;

    }


    const {
      error: likeError
    } =
    await supabaseClient
      .from("likes")
      .insert({

        post_id:
          postId,

        user_id:
          currentUser.id

      });


    if(likeError){

      showNotice(
        "Like nahi hua: " +
        likeError.message
      );

      return;

    }

  }


  await loadFeed();

}

/* =========================
   DATE
========================= */

function formatDate(date){

  const now =
    new Date();


  const created =
    new Date(date);


  const seconds =
    Math.floor(
      (now - created) /
      1000
    );


  if(seconds < 60){

    return "Just now";

  }


  const minutes =
    Math.floor(
      seconds / 60
    );


  if(minutes < 60){

    return minutes + "m ago";

  }


  const hours =
    Math.floor(
      minutes / 60
    );


  if(hours < 24){

    return hours + "h ago";

  }


  const days =
    Math.floor(
      hours / 24
    );


  if(days < 7){

    return days + "d ago";

  }


  return created
    .toLocaleDateString();

}


/* =========================
   NOTICE
========================= */

function showNotice(message){

  const notice =
    document.getElementById(
      "notice"
    );


  notice.textContent =
    message;


  notice.style.display =
    "block";


  clearTimeout(
    window.noticeTimer
  );


  window.noticeTimer =
    setTimeout(
      function(){

        notice.style.display =
          "none";

      },
      2500
    );

}


/* =========================
   ESCAPE
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(value){

  return String(value ?? "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    );

}
