<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>ChatZone 💬</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;overflow-x:hidden}
body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#6c5ce7,#8e44ad);
min-height:100vh;
color:#222
}

.app{
width:100%;
max-width:680px;
margin:auto;
min-height:100vh;
background:#f5f5f5;
padding-bottom:82px;
}

/* HEADER */
.header{
background:linear-gradient(135deg,#6c5ce7,#8e44ad);
color:white;
padding:11px 7px;
position:sticky;
top:0;
z-index:20;
width:100%;
}

.header-top{
display:flex;
align-items:center;
width:100%;
gap:7px;
min-width:0;
}

.logo{
flex:0 0 auto;
font-size:20px;
font-weight:bold;
white-space:nowrap;
}

.header-buttons{
display:flex;
align-items:center;
justify-content:flex-end;
gap:5px;
flex:1;
min-width:0;
overflow:hidden;
}

.header-buttons button{
flex:1 1 0;
min-width:0;
height:40px;
border:0;
background:rgba(255,255,255,.20);
color:white;
border-radius:13px;
padding:0 7px;
font-size:12px;
font-weight:700;
cursor:pointer;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.share-header-btn{
background:white!important;
color:#6c5ce7!important;
font-weight:bold;
}

/* ONLINE */
.online-section{
background:white;
margin:10px 12px 0;
padding:10px 12px;
border-radius:14px;
box-shadow:0 2px 8px rgba(0,0,0,.08)
}

.online-title{
font-size:13px;
font-weight:bold;
color:#555;
margin-bottom:8px
}

.online-users{
display:flex;
gap:9px;
overflow-x:auto;
white-space:nowrap;
scrollbar-width:none
}

.online-users::-webkit-scrollbar{display:none}

.online-user{
flex:0 0 auto;
display:flex;
align-items:center;
gap:6px;
background:#f5f5f5;
border-radius:22px;
padding:4px 10px 4px 4px;
cursor:pointer
}

.online-user-avatar{
width:34px;
height:34px;
border-radius:50%;
object-fit:cover;
background:#ddd
}

.online-user-name{
font-size:12px;
font-weight:bold;
max-width:90px;
overflow:hidden;
text-overflow:ellipsis
}

.online-dot{
width:8px;
height:8px;
border-radius:50%;
background:#22c55e;
box-shadow:0 0 0 2px white
}

/* WELCOME */
.welcome{
background:white;
margin:12px;
padding:14px;
border-radius:14px;
text-align:center;
font-weight:bold;
box-shadow:0 2px 8px rgba(0,0,0,.08)
}

/* CREATE */
.create-box{
background:white;
margin:12px;
padding:12px;
border-radius:14px;
box-shadow:0 2px 8px rgba(0,0,0,.08)
}

.reply-box{
display:none;
background:#f0edff;
border-left:4px solid #6c5ce7;
padding:8px;
border-radius:8px;
margin-bottom:8px;
font-size:13px
}

textarea{
width:100%;
min-height:80px;
resize:none;
border:1px solid #ddd;
border-radius:12px;
padding:12px;
font-size:15px;
outline:none
}

.create-actions{
display:flex;
gap:7px;
margin-top:8px;
flex-wrap:wrap
}

.create-actions button{
border:0;
border-radius:13px;
padding:10px 14px;
min-height:42px;
cursor:pointer;
font-weight:700;
font-size:13px;
}

.send-btn{background:#6c5ce7;color:white}
.upload-btn,.voice-btn{background:#eee}

/* FEED */
.feed-header{
display:flex;
align-items:center;
padding:5px 12px
}

.feed-header h3{margin:8px 0}

#feed{
padding:0 12px;
min-height:50px
}

/* POST */
.post{
background:white;
border-radius:14px;
margin:10px 0;
padding:12px;
box-shadow:0 2px 8px rgba(0,0,0,.08)
}

.post-head{
display:flex;
align-items:center;
justify-content:space-between
}

.user-info{
display:flex;
align-items:center;
gap:9px;
min-width:0
}

.avatar{
width:42px;
height:42px;
border-radius:50%;
object-fit:cover;
background:#ddd;
flex-shrink:0
}

.user-name{
font-size:15px;
font-weight:800;
word-break:break-word;
line-height:1.35
}

.post-author-name{
background:linear-gradient(90deg,#6c5ce7,#e84393,#0984e3);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
background-clip:text;
font-weight:800
}

/* PREMIUM CHATZONE ROLE BADGES — added without changing Home layout */
.role-badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:5px 10px;
  margin:5px 0 3px 5px;
  border-radius:7px;
  font-family:Arial,sans-serif;
  font-size:11px;
  font-weight:800;
  letter-spacing:.25px;
  vertical-align:middle;
  box-shadow:0 2px 7px rgba(0,0,0,.12);
  -webkit-text-fill-color:initial;
}
.website-creator-badge{
  color:#624000;
  background:linear-gradient(135deg,#fff4bd,#f5ca55,#ffe9a0);
  border:1px solid #d6a328;
  box-shadow:0 0 9px rgba(235,183,45,.35);
}
.senior-admin-badge{
  color:#174a91;
  background:linear-gradient(135deg,#edf5ff,#bcd8ff);
  border:1px solid #78a8f5;
}
.admin-badge{
  color:#6336a0;
  background:linear-gradient(135deg,#f7efff,#dfc5ff);
  border:1px solid #b99ae8;
}

.post-author-username{
display:inline-block;
margin-left:5px;
padding:3px 8px;
border-radius:12px;
background:linear-gradient(90deg,#f0edff,#ffe8f2);
color:#6c5ce7;
font-size:11px;
font-weight:700;
vertical-align:middle
}

.post-date{
font-size:11px;
color:#888;
margin-top:3px
}

.post-menu button{
border:0;
background:transparent;
font-size:20px;
cursor:pointer
}

.post-category{
display:inline-block;
background:#f0edff;
color:#6c5ce7;
font-size:11px;
font-weight:bold;
padding:5px 9px;
border-radius:15px;
margin-top:8px
}

.post-content{
margin:12px 0;
padding:0;
font-size:15px;
line-height:1.55;
white-space:pre-wrap;
word-break:break-word;
overflow-wrap:anywhere
}

.post-image{
width:100%;
max-height:450px;
object-fit:cover;
border-radius:12px;
margin-top:8px
}

/* VOICE POST */
.post-voice{
width:100%;
margin-top:10px;
background:#f7f5ff;
padding:8px;
border-radius:12px
}

.post-voice audio{
width:100%;
height:42px
}

/* ACTIONS */
.post-actions{
display:flex;
gap:6px;
width:100%;
border-top:1px solid #eee;
padding-top:9px;
margin-top:8px;
flex-wrap:nowrap
}

.post-actions button{
flex:1 1 0;
min-width:0;
height:40px;
border:0;
background:#f3f3f3;
border-radius:11px;
padding:0 4px;
cursor:pointer;
font-size:12px;
font-weight:700;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.post-actions button:active{
transform:scale(.97)
}

.like-btn{background:#fff0f3!important}
.dislike-btn{background:#f3f3f3!important}
.comment-btn{background:#f1f5ff!important}
.reply-btn{background:#f0edff!important}
.delete-post-btn{
background:#ffe5e5!important;
color:#d00000;
font-weight:bold
}

/* USER ACTIONS */
.user-actions{
display:flex;
gap:6px;
margin-top:7px
}

.user-actions button{
flex:1 1 0;
min-width:0;
height:40px;
border:0;
border-radius:11px;
padding:0 5px;
cursor:pointer;
font-size:11px;
font-weight:700;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.one-one-btn{background:#eaf7ff;color:#087ea4}
.follow-btn{background:#edf8ed;color:#16833b}
.following-btn{background:#e5f5ea;color:#16833b;font-weight:bold}
.block-btn{background:#ffecec;color:#d00000}

/* LIKES */
.likes-popup{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
z-index:100
}

.likes-content{
width:92%;
max-width:430px;
max-height:75vh;
overflow:auto;
background:white;
border-radius:18px;
margin:12vh auto;
padding:15px
}

.likes-header{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:10px
}

.likes-header h3{margin:0}

.likes-close{
border:0;
background:#eee;
border-radius:20px;
padding:7px 12px;
cursor:pointer
}

.like-user{
display:flex;
align-items:center;
gap:9px;
padding:9px 4px;
border-bottom:1px solid #eee;
cursor:pointer
}

.like-user-avatar{
width:38px;
height:38px;
border-radius:50%;
object-fit:cover;
background:#ddd;
flex-shrink:0
}

.like-user-name{
font-size:13px;
font-weight:bold
}

.like-user-username{
color:#777;
font-size:11px;
margin-top:2px
}

/* COMMENTS */
.comments{
display:none;
margin-top:10px;
border-top:1px solid #eee;
padding-top:10px
}

.comment-item{
background:#f5f5f5;
border-radius:10px;
padding:8px;
margin:6px 0;
font-size:13px
}

.nested-comment{
margin-left:22px;
border-left:3px solid #d8d2ff;
background:#faf9ff
}

.comment-user{font-weight:bold}

.comment-date{
color:#888;
font-size:10px
}

.comment-delete{
border:0;
background:none;
color:#d00;
font-size:11px;
cursor:pointer;
padding:4px 0
}

.comment-reply{
border:0;
background:#eee;
color:#6c5ce7;
border-radius:14px;
padding:6px 10px;
font-size:11px;
font-weight:700;
cursor:pointer;
margin-top:5px
}

.comment-reply-box{
display:none;
background:#f0edff;
border-left:4px solid #6c5ce7;
border-radius:8px;
padding:7px 9px;
margin-top:8px;
font-size:12px
}

.comment-reply-box button{
float:right;
border:0;
background:none;
color:#d00;
cursor:pointer
}

.comment-input-row{
display:flex;
gap:6px;
margin-top:8px
}

.comment-input-row input{
flex:1;
min-width:0;
border:1px solid #ddd;
border-radius:20px;
padding:10px 12px;
outline:none
}

.comment-input-row button{
flex:0 0 auto;
border:0;
border-radius:20px;
background:#6c5ce7;
color:white;
padding:9px 15px;
font-weight:700
}

/* LOADING */
.empty,.loading{
text-align:center;
padding:25px 10px;
color:#777
}

/* BOTTOM NAV */
.bottom-nav{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:680px;
height:70px;
background:white;
border-top:1px solid #ddd;
display:flex;
align-items:center;
justify-content:space-between;
padding:5px 6px;
gap:4px;
z-index:30;
box-shadow:0 -2px 10px rgba(0,0,0,.08);
}

.bottom-nav button{
border:0;
background:none;
flex:1 1 0;
min-width:0;
height:60px;
color:#555;
cursor:pointer;
padding:5px 2px;
font-size:12px;
font-weight:700;
line-height:20px;
border-radius:12px;
white-space:nowrap;
overflow:hidden;
}

.bottom-nav button:first-child{
color:#6c5ce7;
font-weight:bold;
background:#f1edff;
}

.bottom-nav button:active{
transform:scale(.96);
background:#f3f1ff;
}

/* POPUPS */
.trending-box,.share-box{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
z-index:50
}

.trending-content,.share-content{
width:92%;
max-width:600px;
max-height:80vh;
overflow:auto;
background:white;
border-radius:18px;
margin:10vh auto;
padding:15px
}

.trending-header,.share-header{
display:flex;
justify-content:space-between;
align-items:center
}

.trending-header button,.share-header button{
border:0;
background:#eee;
border-radius:20px;
padding:8px 13px;
font-weight:bold
}

.trend-item{
padding:10px;
border-bottom:1px solid #eee
}

/* SHARE */
.share-option{
width:100%;
border:0;
background:#f5f3ff;
margin-top:10px;
padding:15px;
border-radius:14px;
text-align:left;
font-size:15px;
font-weight:bold;
cursor:pointer
}

.share-form{
display:none;
margin-top:12px
}

.category-label{
font-size:13px;
font-weight:bold;
color:#555;
display:block;
margin:8px 0 5px
}

.category-select{
width:100%;
border:1px solid #ddd;
border-radius:10px;
padding:11px;
background:white;
outline:none
}

.image-preview{
width:100%;
max-height:300px;
object-fit:cover;
border-radius:12px;
margin-top:10px;
display:none
}

.share-submit{
width:100%;
border:0;
background:#6c5ce7;
color:white;
border-radius:12px;
padding:12px;
font-weight:bold;
margin-top:10px;
cursor:pointer
}

.cancel-share{
width:100%;
border:0;
background:#eee;
color:#555;
border-radius:12px;
padding:11px;
margin-top:7px;
cursor:pointer
}

.hidden-input{display:none}

/* VOICE RECORDER */
.voice-popup{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
z-index:200;
align-items:center;
justify-content:center;
padding:20px;
}

.voice-content{
width:100%;
max-width:410px;
background:white;
border-radius:20px;
padding:20px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.voice-content h3{
margin:0 0 15px;
color:#6c5ce7;
}

.voice-status{
font-size:14px;
color:#777;
margin:12px 0;
min-height:20px
}

.voice-timer{
font-size:32px;
font-weight:bold;
color:#6c5ce7;
margin:12px 0
}

.voice-preview-box{
display:none;
background:#f7f5ff;
padding:10px;
border-radius:12px;
margin:12px 0
}

.voice-preview{
width:100%;
height:42px
}

.voice-buttons{
display:flex;
gap:8px;
margin-top:8px
}

.voice-buttons button{
flex:1;
border:0;
border-radius:12px;
padding:12px 8px;
font-weight:bold;
cursor:pointer
}

.voice-buttons button:disabled{
opacity:.45;
cursor:not-allowed
}

.voice-record-btn{
background:#ffecec;
color:#d00000
}

.voice-stop-btn{
background:#eee;
color:#555
}

.voice-send-btn{
background:#6c5ce7;
color:white
}

.voice-close-btn{
width:100%;
border:0;
background:#eee;
border-radius:12px;
padding:11px;
margin-top:10px;
font-weight:bold;
cursor:pointer
}

/* MOBILE */
@media(max-width:500px){

.header{
padding:9px 5px
}

.header-top{
gap:5px
}

.logo{
font-size:15px
}

.header-buttons{
gap:3px
}

.header-buttons button{
height:40px;
font-size:10px;
padding:0 5px;
border-radius:12px
}

.create-actions button{
flex:1 1 auto;
min-width:105px
}

.post-actions{
gap:4px
}

.post-actions button{
height:40px;
font-size:10.5px;
padding:0 2px
}

.user-actions{
gap:4px
}

.user-actions button{
height:40px;
font-size:10px
}

.bottom-nav{
height:70px;
padding:5px 4px;
gap:3px
}

.bottom-nav button{
height:60px;
font-size:10px;
line-height:19px;
padding:4px 1px
}

.nested-comment{
margin-left:12px
}

.voice-content{
padding:16px
}

.voice-buttons button{
font-size:11px;
padding:11px 5px
}
}

@media(max-width:380px){

.logo{
font-size:13px
}

.header-buttons{
gap:2px
}

.header-buttons button{
height:38px;
font-size:8.5px;
padding:0 3px
}

.post-actions{
gap:3px
}

.post-actions button{
height:38px;
font-size:9px
}

.user-actions{
gap:3px
}

.user-actions button{
height:38px;
font-size:9px
}

.bottom-nav{
height:68px;
padding:4px 3px;
gap:2px
}

.bottom-nav button{
height:59px;
font-size:8.5px;
line-height:18px;
border-radius:10px
}
}

@media(max-width:340px){

.logo{
font-size:12px
}

.header-buttons button{
font-size:7.5px;
height:37px
}

.bottom-nav button{
font-size:8px
}

.post-actions button{
font-size:8.5px
}
}
</style>
</head>

<body>

<div class="app">

<div class="header">
<div class="header-top">

<div class="logo">ChatZone 💬</div>

<div class="header-buttons">
<button onclick="showTrending()">🔥 Trending</button>
<button class="share-header-btn" onclick="openShare()">➕ Create</button>
<button onclick="location.href='notifications.html'">🔔 Alerts</button>
</div>

</div>
</div>

<div class="online-section">
<div class="online-title">🟢 Online Users <span id="onlineCount">0</span></div>
<div class="online-users" id="onlineUsers">
<div class="loading">Loading online users...</div>
</div>
</div>

<div class="welcome">Welcome to ChatZone 💜</div>

<div class="create-box">
<div class="reply-box" id="replyBox"></div>
<textarea id="postText" placeholder="What's on your mind?"></textarea>

<div class="create-actions">
<button class="send-btn" onclick="createPost()">📨 Send Post</button>
<button class="upload-btn" onclick="document.getElementById('postImage').click()">🖼️ Upload Image</button>
<button class="voice-btn" onclick="openVoiceRecorder()">🎙️ Voice</button>
</div>
<input type="file" id="postImage" class="hidden-input" accept="image/*">
</div>

<div class="feed-header">
<h3>🏠 Home Feed</h3>
<button onclick="loadFeed()" style="margin-left:auto;border:0;border-radius:10px;padding:8px 12px;background:#eee;font-weight:bold">🔄 Refresh</button>
</div>

<div id="feed">
<div class="loading">Loading posts...</div>
</div>

<div class="bottom-nav">
<button onclick="location.href='index.html'">🏠<br>Home</button>
<button onclick="location.href='private.html'">💬<br>Private</button>
<button onclick="location.href='mehfil.html'">👥<br>Mehfil</button>
<button onclick="location.href='profile.html'">👤<br>Profile</button>
<button onclick="location.href='more.html'">☰<br>More</button>
</div>

<!-- POPUPS -->
<div class="trending-box" id="trendingBox">
<div class="trending-content">
<div class="trending-header">
<h3>🔥 Trending</h3>
<button onclick="closeTrending()">✖</button>
</div>
<div id="trendingList">Loading...</div>
</div>
</div>

<div class="share-box" id="shareBox">
<div class="share-content">
<div class="share-header">
<h3>➕ Create Post</h3>
<button onclick="closeShare()">✖</button>
</div>

<button class="share-option" onclick="showShareForm('text')">📝 Text Post</button>
<button class="share-option" onclick="showShareForm('image')">🖼️ Image Post</button>
<button class="share-option" onclick="showShareForm('voice')">🎙️ Voice Post</button>

<div class="share-form" id="shareForm">
<label class="category-label">Post category</label>
<select class="category-select" id="postCategory">
<option value="General">General</option>
<option value="Funny">Funny</option>
<option value="Friendship">Friendship</option>
<option value="Love">Love</option>
<option value="Poetry">Poetry</option>
<option value="Islamic">Islamic</option>
<option value="News">News</option>
<option value="Other">Other</option>
</select>

<input type="file" id="shareImage" class="hidden-input" accept="image/*">
<img id="imagePreview" class="image-preview" alt="Preview">

<div id="voiceShareArea"></div>

<textarea id="shareText" placeholder="Write something..."></textarea>
<button class="share-submit" onclick="submitShare()">Publish</button>
<button class="cancel-share" onclick="closeShare()">Cancel</button>
</div>
</div>
</div>

<div class="voice-popup" id="voicePopup">
<div class="voice-content">
<h3>🎙️ Voice Post</h3>
<div class="voice-status" id="voiceStatus">Ready to record</div>
<div class="voice-timer" id="voiceTimer">00:00</div>
<div class="voice-preview-box" id="voicePreviewBox">
<audio id="voicePreview" class="voice-preview" controls></audio>
</div>
<div class="voice-buttons">
<button class="voice-record-btn" id="voiceRecordBtn" onclick="startRecording()">🔴 Record</button>
<button class="voice-stop-btn" id="voiceStopBtn" onclick="stopRecording()" disabled>⏹ Stop</button>
<button class="voice-send-btn" id="voiceSendBtn" onclick="sendVoicePost()" disabled>📨 Send</button>
</div>
<button class="voice-close-btn" onclick="closeVoiceRecorder()">Close</button>
</div>
</div>

<script>

function escapeHTML(value){
return String(value ?? "").replace(/[&<>"']/g,function(ch){
return {
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[ch];
});
}

function formatDate(value){
const date = new Date(value);
if(Number.isNaN(date.getTime())) return "";
const seconds = Math.floor((Date.now()-date.getTime())/1000);
if(seconds < 60) return "Just now";
if(seconds < 3600) return Math.floor(seconds/60)+" min ago";
if(seconds < 86400) return Math.floor(seconds/3600)+" hr ago";
if(seconds < 604800) return Math.floor(seconds/86400)+" day ago";
return date.toLocaleDateString();
}

  }

  if(existing && existing.action_type===actionType){
    const {error}=await supabaseClient
      .from("post_actions")
      .delete()
      .eq("id",existing.id);

    if(error) return alert("Action update nahi hua: "+error.message);
  }else if(existing){

      .from("post_actions")
      .update({action_type:actionType})

async function createPost(){

  const input=document.getElementById("postText");

  const file=document.getElementById("postImage").files[0];

  if(!content && !file) return alert("Post likhein ya image select karein.");

  let imageUrl=null;

  if(file){
    const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
    const path=currentUser.id+"/"+Date.now()+"_"+safeName;

    const {data:uploaded,error:uploadError}=await supabaseClient
      .storage.from("post-images")
      .upload(path,file,{upsert:false});

    if(uploadError){
      return alert("Image upload nahi hui. Storage bucket 'post-images' aur uski policies check karein. "+uploadError.message);
    }

    const {data:urlData}=supabaseClient
      .storage.from("post-images")
      .getPublicUrl(uploaded.path);

    imageUrl=urlData?.publicUrl||null;
  }

  const {error}=await supabaseClient
    .from("posts")
    .insert({
      user_id:currentUser.id,
      username:currentProfile?.username||"user",
      content:content,
      image_url:imageUrl,
      category:"General",
      post_type:file?"image":"text"
    });

  if(error){
    return alert("Post publish nahi hui: "+error.message);
  }

  document.getElementById("postImage").value="";
  await loadFeed();
}

function startRecording(){
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){
    return alert("Is browser mein voice recording supported nahi hai.");
  }

  navigator.mediaDevices.getUserMedia({audio:true})
    .then(stream=>{
      voiceChunks=[];
      voiceBlob=null;
      voiceSeconds=0;

      voiceRecorder=new MediaRecorder(stream);

      voiceRecorder.ondataavailable=event=>{
        if(event.data.size>0) voiceChunks.push(event.data);
      };

      voiceRecorder.onstop=()=>{
        voiceBlob=new Blob(voiceChunks,{
          type:voiceRecorder.mimeType||"audio/webm"
        });

        stream.getTracks().forEach(track=>track.stop());

        const preview=document.getElementById("voicePreview");
        preview.src=URL.createObjectURL(voiceBlob);

        document.getElementById("voicePreviewBox").style.display="block";
        document.getElementById("voiceStatus").textContent="Recording ready";
        document.getElementById("voiceSendBtn").disabled=false;
        document.getElementById("voiceStopBtn").disabled=true;
        document.getElementById("voiceRecordBtn").disabled=false;

        if(voiceInterval){
          clearInterval(voiceInterval);
          voiceInterval=null;
        }
      };

      voiceRecorder.start();

      document.getElementById("voiceStatus").textContent="Recording...";
      document.getElementById("voiceRecordBtn").disabled=true;
      document.getElementById("voiceStopBtn").disabled=false;
      document.getElementById("voiceSendBtn").disabled=true;

      voiceInterval=setInterval(()=>{
        voiceSeconds++;
        const mins=String(Math.floor(voiceSeconds/60)).padStart(2,"0");
        const secs=String(voiceSeconds%60).padStart(2,"0");
        document.getElementById("voiceTimer").textContent=mins+":"+secs;
      },1000);
    })
    .catch(error=>{
      alert("Microphone permission allow karein: "+error.message);
    });
}

function stopRecording(){
  if(voiceRecorder&&voiceRecorder.state==="recording"){
    voiceRecorder.stop();
  }
}

async function sendVoicePost(){
  if(!currentUser) return alert("Pehle login karein.");
  if(!voiceBlob) return alert("Pehle voice record karein.");

  const path=currentUser.id+"/"+Date.now()+".webm";

  const {data:uploaded,error:uploadError}=await supabaseClient
    .storage.from("post-voices")
    .upload(path,voiceBlob,{upsert:false});

  if(uploadError){
    return alert("Voice upload nahi hui. 'post-voices' bucket check karein. "+uploadError.message);
  }

  const {data:urlData}=supabaseClient
    .storage.from("post-voices")
    .getPublicUrl(uploaded.path);

  const {error}=await supabaseClient
    .from("posts")
    .insert({
      user_id:currentUser.id,
      username:currentProfile?.username||"user",
      content:document.getElementById("postText").value.trim(),
      post_type:"voice",
      image_url:null,
      category:"Voice",
      voice_url:urlData?.publicUrl||null
    });

  if(error){
    return alert("Voice post save nahi hui: "+error.message);
  }

  document.getElementById("postText").value="";
  closeVoiceRecorder();
  await loadFeed();
  alert("Voice post publish ho gayi!");
}
   async function initializeApp(){
  try{
    const user=await getSessionUser();

    if(!user){
      location.href="login.html";
      return;
    }

    await loadProfile();
    await loadUserActions();
    await startOnlineHeartbeat();

    await Promise.all([
      loadFeed(),
      loadOnlineUsers()
    ]);

    setInterval(loadOnlineUsers,60000);
  }catch(error){
    console.error("App initialization:",error);
    const feed=document.getElementById("feed");
    if(feed){
      feed.innerHTML=
        '<div class="empty">Website load nahi hui. Page refresh karein.</div>';
    }
  }
}

window.addEventListener("pageshow",()=>{
  if(currentUser){
    loadOnlineUsers();
  }
});

window.addEventListener("beforeunload",()=>{
  if(onlineHeartbeat){
    clearInterval(onlineHeartbeat);
  }
});

document.addEventListener("DOMContentLoaded",()=>{
  initializeApp();
});
</script>
