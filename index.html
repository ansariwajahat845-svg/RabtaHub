
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatZone</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Arial, sans-serif;
      background: #f3f5f9; color: #182033;
    }
    header {
      background: #5546e8; color: white; padding: 18px;
      font-size: 23px; font-weight: bold;
    }
    main { max-width: 700px; margin: auto; padding: 16px; }
    .card {
      background: white; padding: 16px; border-radius: 12px;
      margin-bottom: 14px; box-shadow: 0 2px 8px #0000000c;
    }
    textarea {
      width: 100%; min-height: 90px; padding: 12px;
      border: 1px solid #d6d9e4; border-radius: 8px;
      font: inherit; resize: vertical;
    }
    button {
      background: #5546e8; color: white; border: 0;
      border-radius: 8px; padding: 11px 16px;
      margin-top: 10px; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .muted { color: #73798a; font-size: 13px; }
    .post { white-space: pre-wrap; overflow-wrap: anywhere; }
    #status { padding: 12px 0; }
    .error { color: #b42318; }
  </style>
</head>
<body>
  <header>ChatZone</header>
  <main>
    <section class="card">
      <h3>Share a post</h3>
      <textarea id="postText" placeholder="What's on your mind?"></textarea>
      <button id="postButton">Post</button>
      <div id="postStatus" class="muted"></div>
    </section>

    <div id="status">Loading feed...</div>
    <section id="feed"></section>
  </main>

  <script>
    // Replace these with your original Supabase project credentials.
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

    const statusEl = document.getElementById("status");
    const feedEl = document.getElementById("feed");
    const postStatus = document.getElementById("postStatus");
    const postButton = document.getElementById("postButton");

    let supabaseClient = null;

    function showError(message) {
      statusEl.textContent = message;
      statusEl.className = "error";
    }

    async function loadFeed() {
      statusEl.textContent = "Loading feed...";
      statusEl.className = "";
      feedEl.replaceChildren();

      try {
        const { data, error } = await supabaseClient
          .from("posts")
          .select("*")
          .order("created_at", { ascending: false })
          .limit(50);

        if (error) throw error;

        if (!data || data.length === 0) {
          statusEl.textContent = "No posts yet. Be the first to post!";
          return;
        }

        data.forEach(post => {
          const card = document.createElement("article");
          card.className = "card";

          const author = document.createElement("div");
          author.className = "muted";
          author.textContent =
            post.username || post.display_name || post.user_id || "Member";

          const content = document.createElement("p");
          content.className = "post";
          content.textContent =
            post.content || post.body || post.text || "";

          const date = document.createElement("div");
          date.className = "muted";
          if (post.created_at) {
            const parsed = new Date(post.created_at);
            date.textContent = Number.isNaN(parsed.getTime())
              ? ""
              : parsed.toLocaleString();
          }

          card.append(author, content, date);
          feedEl.appendChild(card);
        });

        statusEl.textContent = "Latest posts";
      } catch (error) {
        console.error("Feed error:", error);
        showError(
          "Feed load nahi hui. Supabase URL/key, posts table aur SELECT RLS policy check karo. Details console mein hain."
        );
      }
    }

    async function createPost() {
      const content = document.getElementById("postText").value.trim();
      postStatus.textContent = "";

      if (!content) {
        postStatus.textContent = "Pehle post likho.";
        return;
      }

      postButton.disabled = true;

      try {
        const { data: { user }, error: authError } =
          await supabaseClient.auth.getUser();

        if (authError) throw authError;
        if (!user) {
          postStatus.textContent =
            "Post karne ke liye pehle login karna hoga.";
          return;
        }

        // Make sure these column names match your posts table.
        const { error } = await supabaseClient
          .from("posts")
          .insert({
            user_id: user.id,
            content: content
          });

        if (error) throw error;

        document.getElementById("postText").value = "";
        postStatus.textContent = "Post published!";
        await loadFeed();
      } catch (error) {
        console.error("Post error:", error);
        postStatus.textContent =
          "Post nahi hui. Login, table columns aur INSERT RLS policy check karo.";
      } finally {
        postButton.disabled = false;
      }
    }

    async function init() {
      if (
        SUPABASE_URL === "YOUR_SUPABASE_URL" ||
        SUPABASE_ANON_KEY === "YOUR_SUPABASE_ANON_KEY"
      ) {
        showError("HTML mein apna Supabase URL aur anon key set karo.");
        return;
      }

      if (!window.supabase) {
        showError("Supabase library load nahi hui. Internet connection check karo.");
        return;
      }

      supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

      postButton.addEventListener("click", createPost);
      await loadFeed();
    }

    init();
  </script>
</body>
</html>
