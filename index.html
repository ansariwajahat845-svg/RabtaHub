<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ChatZone 💬</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f1ff;
  color:#222;
  padding-bottom:70px;
}

.header{
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  color:white;
  text-align:center;
  padding:18px 10px;
}

.header h1{
  margin:0;
  font-size:25px;
}

.header p{
  margin:5px 0 0;
}

.online{
  background:white;
  padding:12px;
  border-bottom:1px solid #ddd;
}

.online-title{
  font-weight:bold;
  margin-bottom:8px;
}

.online-list{
  display:flex;
  gap:12px;
  overflow-x:auto;
}

.online-user{
  min-width:65px;
  text-align:center;
  font-size:12px;
}

.online-user img{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #2ecc71;
}

.container{
  max-width:680px;
  margin:auto;
  padding:12px;
}

.box,.post{
  background:white;
  border-radius:15px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

textarea,input,select{
  width:100%;
  padding:11px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:14px;
  margin-top:7px;
}

textarea{
  min-height:75px;
  resize:none;
}

.buttons{
  display:flex;
  gap:7px;
  margin-top:10px;
  flex-wrap:wrap;
}

button{
  border:0;
  border-radius:9px;
  padding:9px 12px;
  cursor:pointer;
  font-weight:bold;
}

.postBtn{background:#6c5ce7;color:white;flex:1}
.imageBtn{background:#3498db;color:white}
.voiceBtn{background:#e74c3c;color:white}
.refresh{background:#eee}

.post-head{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

.username{
  font-weight:bold;
}

.time{
  font-size:12px;
  color:#888;
  margin-top:3px;
}

.content{
  margin-top:12px;
  white-space:pre-wrap;
  word-break:break-word;
}

.post-image{
  width:100%;
  max-height:500px;
  object-fit:contain;
  border-radius:12px;
  margin-top:10px;
  background:#eee;
}

.category{
  display:inline-block;
  background:#eee8ff;
  color:#6c5ce7;
  padding:5px 9px;
  border-radius:15px;
  font-size:12px;
  font-weight:bold;
  margin-top:8px;
}

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:10px;
}

.actions button{
  background:#eee;
  font-size:12px;
}

.actions .active{
  background:#6c5ce7;
  color:white;
}

.actions .delete{
  background:#ffe0e0;
  color:#d63031;
}

.comment{
  background:#f5f5f5;
  padding:8px;
  border-radius:8px;
  margin-top:6px;
  font-size:13px;
}

.comment-box{
  display:flex;
  gap:6px;
  margin-top:8px;
}

.comment-box input{
  margin:0;
  flex:1;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  z-index:1000;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal-box{
  background:white;
  width:100%;
  max-width:430px;
  border-radius:16px;
  padding:18px;
}

.close{
  float:right;
  font-size:24px;
  cursor:pointer;
}

.preview{
  display:none;
  width:100%;
  max-height:280px;
  object-fit:contain;
  border-radius:10px;
  margin-top:8px;
}

.timer{
  text-align:center;
  font-size:30px;
  margin:15px;
}

audio{
  width:100%;
  margin-top:10px;
}

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  z-index:900;
}

.nav button{
  flex:1;
  background:white;
  font-size:12px;
}

.loading{
  text-align:center;
  padding:25px;
  color:#777;
}
</style>
</head>

<body>

<div class="header">
  <h1>ChatZone 💬</h1>
  <p>Connect • Share • Enjoy</p>
</div>

<!-- ONLINE USERS ONLY HOME PAGE -->
<div class="online">
  <div class="online-title">

  <div id="onlineList" class="online-list">

<div class="container">

    <!-- CATEGORY -->
    <label>

    <select id="imageCategory">

      <option value="General">

      </option>

      <option value="Funny">
        Funny
      </option>

      <option value="Sad">
        Sad
      </option>

      <option value="Love">
        Love
      </option>

      <option value="News">
        News
      </option>

      <option value="Other">
        Other
      </option>

    </select>

    <textarea
      id="imageCaption"
      placeholder="Write caption..."
    ></textarea>

    <div class="buttons">

      <button
        class="refresh"
        onclick="closeImageModal()"
      >
        Cancel
      </button>

      <button
        class="imageBtn"
        onclick="sendImagePost()"
      >
        Send Image
      </button>

    </div>

  </div>

</div>


<!-- VOICE MODAL -->
<div id="voiceModal" class="modal">

  <div class="modal-box">

    <span
      class="close"

    <h3>🎙️ Voice Recorder</h3>

    <div id="voiceStatus">

      <button
        id="recordBtn"
        class="voiceBtn"

      <button
        id="stopBtn"
        class="refresh"

        ⏹ Stop

</div>


<!-- NAV -->
<div class="nav">

  <button onclick="location.href='index.html'">
    🏠<br>Home
  </button>

  <button onclick="location.href='private.html'">
    💬<br>Private
  </button>

  <button onclick="location.href='mehfil.html'">
    👥<br>Mehfil
  </button>

  <button onclick="location.href='profile.html'">
    👤<br>Profile
  </button>

  <button onclick="location.href='more.html'">

  </button>

</div>


<script>

const SUPABASE_URL =
"https://jhcpqjmxiovvqbghpxbf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true
    }
  }
);

let currentUser=null;
let profiles={};

let recorder=null;
let chunks=[];
let voiceBlob=null;
let voiceSeconds=0;
let timerInterval=null;


/* =========================
   INIT
========================= */

async function init(){

  const {
    data:{
      session
    }
  } =
  await supabaseClient.auth.getSession();

  if(!session){

    location.href="login.html";
    return;

  }

  currentUser=session.user;

  startPresence();

  await loadFeed();

  await loadOnlineUsers();

}


/* =========================
   PRESENCE
========================= */

async function startPresence(){

  const channel =
    supabaseClient.channel(
      "chatzone-online-users",
      {
        config:{
          presence:{
            key:String(
              currentUser.id
            )
          }
        }
      }
    );

  channel.on(
    "presence",
    {event:"sync"},
    loadOnlineUsers
  );

  channel.on(
    "presence",
    {event:"join"},
    loadOnlineUsers
  );

  channel.on(
    "presence",
    {event:"leave"},
    loadOnlineUsers
  );

  await channel.subscribe(
    async status=>{

      if(status==="SUBSCRIBED"){

        await channel.track({

          user_id:
            String(
              currentUser.id
            ),

          online_at:
            new Date()
            .toISOString()

        });

      }

    }
  );

}


/* =========================
   ONLINE USERS
========================= */

async function loadOnlineUsers(){

  try{

    const channel =
      supabaseClient
      .getChannels()
      .find(
        c =>
        c.topic ===
        "realtime:chatzone-online-users"
      );

    if(!channel) return;

    const state =
      channel.presenceState();

    const ids=[];

    Object.values(state)
    .forEach(list=>{

      list.forEach(item=>{

        if(
          item.user_id &&
          !ids.includes(
            item.user_id
          )
        ){

          ids.push(
            item.user_id
          );

        }

      });

    });

    document.getElementById(
      "onlineCount"
    ).textContent=ids.length;

    if(!ids.length){

      document.getElementById(
        "onlineList"
      ).innerHTML=
      "<div>No users online</div>";

      return;

    }

    const {
      data
    } =
    await supabaseClient
    .from("profiles")
    .select(
      "id,username,name,avatar_url"
    )
    .in("id",ids);

    document.getElementById(
      "onlineList"
    ).innerHTML=
    (data||[])
    .map(p=>`

      <div class="online-user">

        <img
          src="${safe(p.avatar_url || 'https://via.placeholder.com/80')}"
        >

        <div>
          @${safe(
            p.username ||
            p.name ||
            "user"
          )}
        </div>

      </div>

    `).join("");

  }catch(e){

    console.log(
      "Online error",
      e
    );

  }

}


/* =========================
   FEED
========================= */

async function loadFeed(){

  document.getElementById(
    "feed"
  ).innerHTML=
  '<div class="loading">Loading feed...</div>';

  document.getElementById(
    "error"
  ).innerHTML="";

  try{

    /*
      IMPORTANT:
      username YAHAN NAHI HAI.
    */

    const {
      data:posts,
      error
    } =
    await supabaseClient
    .from("posts")
    .select(`
      id,
      user_id,
      content,
      created_at,
      post_type,
      category,
      image_url,
      voice_url,
      voice_duration
    `)
    .order(
      "created_at",
      {
        ascending:false
      }
    );

    if(error) throw error;

    if(!posts || !posts.length){

      document.getElementById(
        "feed"
      ).innerHTML=
      '<div class="loading">No posts yet.</div>';

      return;

    }

    const ids=[
      ...new Set(
        posts.map(
          p=>p.user_id
        )
      )
    ];

    const {
      data:userProfiles,
      error:profileError
    } =
    await supabaseClient
    .from("profiles")
    .select(
      "id,username,name,avatar_url"
    )
    .in("id",ids);

    if(profileError)
      throw profileError;

    profiles={};

    (userProfiles||[])
    .forEach(p=>{
      profiles[p.id]=p;
    });


    const postIds =
      posts.map(
        p=>p.id
      );


    let actions=[];

    const actionResult =
      await supabaseClient
      .from("post_actions")
      .select(
        "id,post_id,user_id,action_type"
      )
      .in(
        "post_id",
        postIds
      );

    if(!actionResult.error){

      actions =
        actionResult.data || [];

    }


    let comments=[];

    const commentResult =
      await supabaseClient
      .from("comments")
      .select(
        "id,post_id,user_id,username,comment,created_at"
      )
      .in(
        "post_id",
        postIds
      )
      .order(
        "created_at",
        {ascending:true}
      );

    if(!commentResult.error){

      comments =
        commentResult.data || [];

    }


    document.getElementById(
      "feed"
    ).innerHTML =
      posts
      .map(
        post =>
        renderPost(
          post,
          actions,
          comments
        )
      )
      .join("");


  }catch(e){

    console.error(e);

    document.getElementById(
      "feed"
    ).innerHTML="";

    document.getElementById(
      "error"
    ).innerHTML=
    `<div style="
      background:#ffe5e5;
      color:#c0392b;
      padding:12px;
      border-radius:10px;
    ">
      Feed load nahi ho saki.<br>
      ${safe(e.message)}
    </div>`;

  }

}


/* =========================
   RENDER
========================= */

function renderPost(
  post,
  actions,
  comments
){

  const profile =
    profiles[post.user_id] || {};

  const username =
    profile.username ||
    "user";

  const name =
    profile.name ||
    username;

  const avatar =
    profile.avatar_url ||
    "https://via.placeholder.com/100";

  const own =
    post.user_id ===
    currentUser.id;


  const pa =
    actions.filter(
      a =>
      a.post_id ===
      post.id
    );

  const likes =
    pa.filter(
      a =>
      a.action_type==="like"
    ).length;

  const dislikes =
    pa.filter(
      a =>
      a.action_type==="dislike"
    ).length;

  const mine =
    pa.find(
      a =>
      a.user_id ===
      currentUser.id
    );


  const pc =
    comments.filter(
      c =>
      c.post_id ===
      post.id
    );


  let html="";


  if(post.content){

    html+=`
      <div class="content">
        ${safe(post.content)}
      </div>
    `;

  }


  /*
    IMAGE CATEGORY DISPLAY
  */

  if(post.image_url){

    if(post.category){

      html+=`
        <div class="category">
          📂 ${safe(
            post.category
          )}
        </div>
      `;

    }

    html+=`
      <img
        class="post-image"
        src="${safe(
          post.image_url
        )}"
      >
    `;

  }


  if(post.voice_url){

    html+=`
      <audio
        controls
        src="${safe(
          post.voice_url
        )}"
      ></audio>
    `;

  }


  let buttons="";


  if(own){

    buttons+=`
      <button
        class="delete"
        onclick="deletePost(${post.id})"
      >
        🗑 Delete
      </button>
    `;

  }else{

    buttons+=`
      <button
        onclick="replyUser(
          '${post.user_id}',
          '${jsSafe(username)}'
        )"
      >
        ↩️ Reply
      </button>

      <button
        onclick="location.href='private.html?user=${encodeURIComponent(post.user_id)}'"
      >
        💬 1on1
      </button>

      <button
        onclick="followUser('${post.user_id}')"
      >
        ➕ Follow
      </button>

      <button
        onclick="blockUser('${post.user_id}')"
      >
        🚫 Block
      </button>
    `;

  }


  return `

    <div class="post">

      <div class="post-head">

        <img
          class="avatar"
          src="${safe(avatar)}"
        >

        <div>

          <div class="username">
            ${safe(name)}
          </div>

          <div class="time">
            @${safe(username)}
            •
            ${formatDate(
              post.created_at
            )}
          </div>

        </div>

      </div>

      ${html}

      <div class="actions">

        <button
          class="${
            mine &&
            mine.action_type==="like"
            ? "active"
            : ""
          }"
          onclick="actionPost(
            ${post.id},
            'like'
          )"
        >
          👍 ${likes}
        </button>

        <button
          class="${
            mine &&
            mine.action_type==="dislike"
            ? "active"
            : ""
          }"
          onclick="actionPost(
            ${post.id},
            'dislike'
          )"
        >
          👎 ${dislikes}
        </button>

        ${buttons}

      </div>

      <div>

        ${
          pc.map(c=>`

            <div class="comment">

              <b>
                @${safe(
                  c.username ||
                  "user"
                )}
              </b>

              ${safe(c.comment)}

              ${
                c.user_id ===
                currentUser.id
                ? `
                  <button
                    onclick="deleteComment(
                      ${c.id}
                    )"
                  >
                    Delete
                  </button>
                `
                : ""
              }

            </div>

          `).join("")
        }

      </div>

      <div class="comment-box">

        <input
          id="comment-${post.id}"
          placeholder="Write a comment..."
        >

        <button
          onclick="sendComment(${post.id})"
        >
          Send
        </button>

      </div>

    </div>
  `;

}


/* =========================
   TEXT POST
========================= */

async function sendTextPost(){

  const input =
    document.getElementById(
      "postText"
    );

  const text =
    input.value.trim();

  if(!text){

    alert(
      "Post likhein."
    );

    return;

  }

  const {
    error
  } =
  await supabaseClient
  .from("posts")
  .insert({

    user_id:
      currentUser.id,

    content:
      text,

    post_type:
      "text"

  });

  if(error){

    alert(error.message);
    return;

  }

  input.value="";

  await loadFeed();

}


/* =========================
   IMAGE
========================= */

function openImageModal(){

  document.getElementById(
    "imageModal"
  ).style.display="flex";

}


function closeImageModal(){

  document.getElementById(
    "imageModal"
  ).style.display="none";

}


function previewImage(){

  const file =
    document.getElementById(
      "imageFile"
    ).files[0];

  if(!file) return;

  const img =
    document.getElementById(
      "imagePreview"
    );

  img.src =
    URL.createObjectURL(file);

  img.style.display="block";

}


async function sendImagePost(){

  const file =
    document.getElementById(
      "imageFile"
    ).files[0];

  if(!file){

    alert(
      "Image select karein."
    );

    return;

  }


  const category =
    document.getElementById(
      "imageCategory"
    ).value;


  const caption =
    document.getElementById(
      "imageCaption"
    ).value.trim();


  try{

    const ext =
      file.name
      .split(".")
      .pop();

    const path =
      `${currentUser.id}/${Date.now()}.${ext}`;


    const {
      error:uploadError
    } =
    await supabaseClient
    .storage
    .from("post-images")
    .upload(
      path,
      file
    );

    if(uploadError)
      throw uploadError;


    const {
      data:urlData
    } =
    supabaseClient
    .storage
    .from("post-images")
    .getPublicUrl(
      path
    );


    /*
      IMPORTANT:
      category save ho rahi hai.
      username NAHI hai.
    */

    const {
      error:postError
    } =
    await supabaseClient
    .from("posts")
    .insert({

      user_id:
        currentUser.id,

      content:
        caption,

      post_type:
        "image",

      category:
        category,

      image_url:
        urlData.publicUrl

    });


    if(postError)
      throw postError;


    document.getElementById(
      "imageFile"
    ).value="";

    document.getElementById(
      "imageCaption"
    ).value="";

    document.getElementById(
      "imageCategory"
    ).value="General";

    document.getElementById(
      "imagePreview"
    ).style.display="none";


    closeImageModal();

    await loadFeed();


  }catch(e){

    alert(
      "Image upload error: " +
      e.message
    );

  }

}


/* =========================
   VOICE
========================= */

function openVoiceModal(){

  document.getElementById(
    "voiceModal"
  ).style.display="flex";

  voiceBlob=null;
  chunks=[];
  voiceSeconds=0;

  document.getElementById(
    "timer"
  ).textContent="00:00";

  document.getElementById(
    "voiceStatus"
  ).textContent="Ready";

  document.getElementById(
    "sendVoiceBtn"
  ).disabled=true;

}


function closeVoiceModal(){

  if(
    recorder &&
    recorder.state!=="inactive"
  ){

    recorder.stop();

  }

  clearInterval(
    timerInterval
  );

  document.getElementById(
    "voiceModal"
  ).style.display="none";

}


async function startRecording(){

  try{

    const stream =
      await navigator
      .mediaDevices
      .getUserMedia({
        audio:true
      });

    chunks=[];

    recorder =
      new MediaRecorder(
        stream
      );

    recorder.ondataavailable =
      e => {

        if(e.data.size)
          chunks.push(e.data);

      };


    recorder.onstop = ()=>{

      stream.getTracks()
      .forEach(
        t=>t.stop()
      );

      voiceBlob =
        new Blob(
          chunks,
          {
            type:"audio/webm"
          }
        );

      document.getElementById(
        "voiceStatus"
      ).textContent=
      "Recording ready ✅";

      const audio =
        document.getElementById(
          "voicePreview"
        );

      audio.src =
        URL.createObjectURL(
          voiceBlob
        );

      audio.style.display="block";

      document.getElementById(
        "sendVoiceBtn"
      ).disabled=false;

    };


    recorder.start();

    document.getElementById(
      "recordBtn"
    ).disabled=true;

    document.getElementById(
      "stopBtn"
    ).disabled=false;

    document.getElementById(
      "voiceStatus"
    ).textContent=
    "🔴 Recording...";


    voiceSeconds=0;

    timerInterval =
      setInterval(()=>{

        voiceSeconds++;

        document.getElementById(
          "timer"
        ).textContent=
        formatDuration(
          voiceSeconds
        );

      },1000);


  }catch(e){

    alert(
      "Microphone permission allow karein."
    );

  }

}


function stopRecording(){

  if(
    recorder &&
    recorder.state!=="inactive"
  ){

    recorder.stop();

  }

  clearInterval(
    timerInterval
  );

  document.getElementById(
    "recordBtn"
  ).disabled=false;

  document.getElementById(
    "stopBtn"
  ).disabled=true;

}


async function sendVoice(){

  if(!voiceBlob){

    alert(
      "Pehle voice record karein."
    );

    return;

  }

  try{

    const path =
      `voices/${currentUser.id}_${Date.now()}.webm`;


    const {
      error:uploadError
    } =
    await supabaseClient
    .storage
    .from("voice-posts")
    .upload(
      path,
      voiceBlob,
      {
        contentType:
          "audio/webm"
      }
    );

    if(uploadError)
      throw uploadError;


    const {
      data:urlData
    } =
    supabaseClient
    .storage
    .from("voice-posts")
    .getPublicUrl(
      path
    );


    const {
      error
    } =
    await supabaseClient
    .from("posts")
    .insert({

      user_id:
        currentUser.id,

      content:
        "",

      post_type:
        "voice",

      voice_url:
        urlData.publicUrl,

      voice_duration:
        voiceSeconds

    });


    if(error)
      throw error;


    closeVoiceModal();

    await loadFeed();


  }catch(e){

    alert(
      "Voice upload error: " +
      e.message
    );

  }

}


/* =========================
   LIKE DISLIKE
========================= */

async function actionPost(
  postId,
  type
){

  const {
    data:old
  } =
  await supabaseClient
  .from("post_actions")
  .select(
    "id,action_type"
  )
  .eq(
    "post_id",
    postId
  )
  .eq(
    "user_id",
    currentUser.id
  )
  .maybeSingle();


  if(old){

    if(
      old.action_type ===
      type
    ){

      await supabaseClient
      .from("post_actions")
      .delete()
      .eq(
        "id",
        old.id
      );

    }else{

      await supabaseClient
      .from("post_actions")
      .update({
        action_type:type
      })
      .eq(
        "id",
        old.id
      );

    }

  }else{

    await supabaseClient
    .from("post_actions")
    .insert({

      post_id:
        postId,

      user_id:
        currentUser.id,

      action_type:
        type

    });

  }

  await loadFeed();

}

/* =========================
   HELPERS
========================= */

function formatDate(
  value
){

  const diff =
    Math.floor(
      (
        Date.now() -
        new Date(value).getTime()
      ) / 1000
    );

  if(diff<60)
    return "Just now";

  if(diff<3600)
    return Math.floor(
      diff/60
    )+"m ago";

  if(diff<86400)
    return Math.floor(
      diff/3600
    )+"h ago";

  if(diff<604800)
    return Math.floor(
      diff/86400
    )+"d ago";

  return new Date(
    value
  ).toLocaleDateString();

}


function formatDuration(
  seconds
){

  const m =
    Math.floor(
      seconds/60
    );

  const s =
    seconds%60;

  return (
    String(m).padStart(2,"0")+
    ":"+
    String(s).padStart(2,"0")
  );

}


function safe(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function jsSafe(value){

  return String(
    value ?? ""
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  );

}
