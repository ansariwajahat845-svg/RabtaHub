<div class="app">

<div class="toast" id="toast"></div>

<script>

const SUPABASE_URL =
"https://jhcpqjmxiovvqbghpxbf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let currentReply = null;
let openCommentPost = null;


/* =========================
   INIT
========================= */

async function init(){

  try{

    const {
      data,
      error
    } = await supabaseClient.auth.getSession();

    if(error){
      showFatalError(error.message);
      return;
    }

    const session=data.session;

    if(!session){
      window.location.href="login.html";
      return;
    }

    currentUser=session.user;

    await loadFeed();

  }catch(err){

    showFatalError(
      err?.message ||
      "Home load nahi ho saki."
    );

  }

}


/* =========================
   LOAD FEED
   NEWEST FIRST + STABLE ORDER
========================= */

async function loadFeed(){

  const loading=
  document.getElementById("loading");

  const feed=
  document.getElementById("feed");

  loading.style.display="block";

  loading.textContent=
  "Feed load ho rahi hai...";

  feed.innerHTML="";

  try{

    if(!currentUser){

      const {
        data
      }=
      await supabaseClient.auth.getUser();

      currentUser=data.user;
    }

    if(!currentUser){

      window.location.href="login.html";
      return;
    }

    /*
      created_at DESC = newest first
      id DESC = same-time posts mein stable order
    */

    const {
      data,
      error
    }=
    await supabaseClient
    .from("posts")
    .select("*")
    .order(
      "created_at",
      {ascending:false}
    )
    .order(
      "id",
      {ascending:false}
    );

    if(error){

      loading.style.display="none";

      feed.innerHTML=
      `<div class="error-box">
        <b>Feed load nahi ho saki.</b><br><br>
        ${escapeHtml(error.message)}
      </div>`;

      return;
    }

    loading.style.display="none";

    if(!data || data.length===0){

      feed.innerHTML=
      `<div class="empty">
        Abhi koi post nahi hai.<br><br>
        Apni pehli post karein ❤️
      </div>`;

      return;
    }

    /*
      Extra client-side sorting:
      newest created_at first.
    */

    const posts=[...data].sort(
      (a,b)=>{

        const timeA=
        new Date(a.created_at || 0).getTime();

        const timeB=
        new Date(b.created_at || 0).getTime();

        if(timeB!==timeA){
          return timeB-timeA;
        }

        return Number(b.id || 0)-
               Number(a.id || 0);

      }
    );

    const userIds=[
      ...new Set(
        posts
        .map(p=>p.user_id)
        .filter(Boolean)
      )
    ];

    let profiles=[];

    if(userIds.length){

      const result=
      await supabaseClient
      .from("profiles")
      .select(
        "id,username,name,avatar_url"
      )
      .in("id",userIds);

      if(!result.error){
        profiles=result.data || [];
      }
    }

    const profileMap={};

    profiles.forEach(profile=>{
      profileMap[profile.id]=profile;
    });

    /*
      Sequential render keeps exact feed order.
    */

    for(const post of posts){

      const profile=
      profileMap[post.user_id] || null;

      const html=
      await renderPost(post,profile);

      feed.insertAdjacentHTML(
        "beforeend",
        html
      );
    }

    updateTrending(posts);

  }catch(err){

    loading.style.display="none";

    feed.innerHTML=
    `<div class="error-box">
      <b>Feed error:</b><br><br>
      ${escapeHtml(
        err?.message ||
        "Unknown error"
      )}
    </div>`;

  }

}


/* =========================
   RENDER POST
========================= */

async function renderPost(post,profile){

  const username=
  profile?.username ||
  post.username ||
  "User";

  const avatarUrl=
  profile?.avatar_url || "";

  const letter=
  username
  .charAt(0)
  .toUpperCase();

  const own=
  currentUser &&
  post.user_id===currentUser.id;

  let likeCount=0;
  let dislikeCount=0;
  let myAction="";

  try{

    const result=
    await supabaseClient
    .from("post_actions")
    .select(
      "user_id,action_type"
    )
    .eq("post_id",post.id);

    if(!result.error){

      (result.data || [])
      .forEach(action=>{

        if(action.action_type==="like")
          likeCount++;

        if(action.action_type==="dislike")
          dislikeCount++;

        if(
          action.user_id===currentUser.id
        ){
          myAction=
          action.action_type;
        }

      });

    }

  }catch(e){}

  let commentCount=0;

  try{

    const result=
    await supabaseClient
    .from("comments")
    .select(
      "id",
      {count:"exact",head:true}
    )
    .eq("post_id",post.id);

    commentCount=
    result.count || 0;

  }catch(e){}

  return `
  <article
    class="post"
    id="post-${post.id}">

    <div class="post-user">

      <div class="avatar">

        ${
          avatarUrl
          ?
          `<img
            src="${escapeAttribute(avatarUrl)}"
            onerror="this.style.display='none'"
          >`
          :
          escapeHtml(letter)
        }

      </div>

      <div class="user-info">

        <div class="username">
          ${escapeHtml(username)}
        </div>

        <div class="date">
          ${formatDate(post.created_at)}
        </div>

      </div>

    </div>

    <div class="post-content">
      ${escapeHtml(post.content || "")}
    </div>

    <div class="post-actions">

      <button
        class="${myAction==="like"?"active":""}"
        onclick="likePost(${post.id})">

        ❤️ Like
        <span id="like-count-${post.id}">
          ${likeCount}
        </span>

      </button>

      <button
        class="${myAction==="dislike"?"active":""}"
        onclick="dislikePost(${post.id})">

        👎 Dislike
        <span id="dislike-count-${post.id}">
          ${dislikeCount}
        </span>

      </button>

      <button
        onclick="toggleComments(${post.id})">

        💬 Comments
        <span id="comment-count-${post.id}">
          ${commentCount}
        </span>

      </button>

      <button
        onclick="replyPost(
          ${post.id},
          '${escapeJs(username)}'
        )">

        ↩️ Reply

      </button>

      ${
        own
        ?
        `
        <button
          onclick="deletePost(${post.id})">

          🗑️ Delete

        </button>
        `
        :
        `
        <button
          onclick="blockUser(
            '${escapeAttribute(post.user_id)}'
          )">

          🚫 Block

        </button>
        `
      }

    </div>

    <div
      class="comments-box"
      id="comments-${post.id}">

      <div
        id="comments-list-${post.id}">
      </div>

      <div class="comment-form">

        <input
          class="comment-input"
          id="comment-input-${post.id}"
          placeholder="Comment likhein..."
          maxlength="500"
        >

        <button
          class="comment-send"
          onclick="sendComment(${post.id})">

          Send

        </button>

      </div>

    </div>

  </article>
  `;
}


/* =========================
   CREATE POST
========================= */

async function createPost(){

  const input=
  document.getElementById("postText");

  const content=
  input.value.trim();

  if(!content){
    showToast("Post likhein.");
    input.focus();
    return;
  }

  if(!currentUser){
    window.location.href="login.html";
    return;
  }

  const username=
  currentUser.user_metadata?.username ||
  currentUser.email?.split("@")[0] ||
  "User";

  let finalContent=content;

  if(currentReply){

    finalContent=
    "↩️ Reply to @" +
    currentReply.username +
    "\n\n" +
    content;

  }

  const {
    error
  }=
  await supabaseClient
  .from("posts")
  .insert({

    user_id:currentUser.id,
    username:username,
    content:finalContent

  });

  if(error){

    showToast(error.message);
    return;

  }

  input.value="";

  cancelReply();

  showToast("Post send ho gayi ❤️");

  await loadFeed();

}


/* =========================
   REPLY
========================= */

function replyPost(postId,username){

  currentReply={
    postId:postId,
    username:username
  };

  document.getElementById(
    "replyUsername"
  ).textContent="@"+username;

  document.getElementById(
    "replyBox"
  ).style.display="block";

  const input=
  document.getElementById("postText");

  input.focus();

  input.scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

}


function cancelReply(){

  currentReply=null;

  const box=
  document.getElementById("replyBox");

  if(box)
    box.style.display="none";

}


/* =========================
   DELETE POST
========================= */

async function deletePost(id){

  if(!currentUser)
    return;

  const ok=
  confirm(
    "Apni post delete karni hai?"
  );

  if(!ok)
    return;

  const {
    error
  }=
  await supabaseClient
  .from("posts")
  .delete()
  .eq("id",id)
  .eq(
    "user_id",
    currentUser.id
  );

  if(error){

    showToast(error.message);
    return;

  }

  showToast("Post delete ho gayi.");

  await loadFeed();

}


/* =========================
   LIKE
========================= */

async function likePost(postId){

  await setPostAction(
    postId,
    "like"
  );

}


/* =========================
   DISLIKE
========================= */

async function dislikePost(postId){

  await setPostAction(
    postId,
    "dislike"
  );

}


/* =========================
   POST ACTION
========================= */

async function setPostAction(
  postId,
  actionType
){

  if(!currentUser)
    return;

  try{

    const existing=
    await supabaseClient
    .from("post_actions")
    .select("id,action_type")
    .eq("post_id",postId)
    .eq(
      "user_id",
      currentUser.id
    )
    .maybeSingle();

    if(existing.error){
      showToast(existing.error.message);
      return;
    }

    if(
      existing.data &&
      existing.data.action_type===actionType
    ){

      const result=
      await supabaseClient
      .from("post_actions")
      .delete()
      .eq(
        "id",
        existing.data.id
      );

      if(result.error){
        showToast(result.error.message);
        return;
      }

    }
    else if(existing.data){

      const result=
      await supabaseClient
      .from("post_actions")
      .update({
        action_type:actionType
      })
      .eq(
        "id",
        existing.data.id
      );

      if(result.error){
        showToast(result.error.message);
        return;
      }

    }
    else{

      const result=
      await supabaseClient
      .from("post_actions")
      .insert({

        post_id:postId,
        user_id:currentUser.id,
        action_type:actionType

      });

      if(result.error){
        showToast(result.error.message);
        return;
      }

    }

    await refreshPostActions(postId);

  }catch(err){

    showToast(
      err?.message ||
      "Action nahi ho saki."
    );

  }

}


/* =========================
   REFRESH LIKE/DISLIKE
========================= */

async function refreshPostActions(postId){

  const {
    data,
    error
  }=
  await supabaseClient
  .from("post_actions")
  .select(
    "user_id,action_type"
  )
  .eq("post_id",postId);

  if(error)
    return;

  let likes=0;
  let dislikes=0;
  let mine="";

  (data || [])
  .forEach(row=>{

    if(row.action_type==="like")
      likes++;

    if(row.action_type==="dislike")
      dislikes++;

    if(
      row.user_id===currentUser.id
    ){
      mine=row.action_type;
    }

  });

  const likeCount=
  document.getElementById(
    "like-count-"+postId
  );

  const dislikeCount=
  document.getElementById(
    "dislike-count-"+postId
  );

  if(likeCount)
    likeCount.textContent=likes;

  if(dislikeCount)
    dislikeCount.textContent=dislikes;

  const post=
  document.getElementById(
    "post-"+postId
  );

  if(post){

    const buttons=
    post.querySelectorAll(
      ".post-actions button"
    );

    buttons[0]?.classList.toggle(
      "active",
      mine==="like"
    );

    buttons[1]?.classList.toggle(
      "active",
      mine==="dislike"
    );

  }

}


/* =========================
   COMMENTS
========================= */

async function toggleComments(postId){

  const box=
  document.getElementById(
    "comments-"+postId
  );

  if(!box)
    return;

  if(
    box.style.display==="block"
  ){

    box.style.display="none";
    openCommentPost=null;
    return;

  }

  box.style.display="block";
  openCommentPost=postId;

  await loadComments(postId);

}


async function openComments(postId){

  await toggleComments(postId);

}


async function loadComments(postId){

  const list=
  document.getElementById(
    "comments-list-"+postId
  );

  if(!list)
    return;

  list.innerHTML=
  `<div style="color:#888;padding:7px">
    Comments load ho rahe hain...
  </div>`;

  const {
    data,
    error
  }=
  await supabaseClient
  .from("comments")
  .select("*")
  .eq("post_id",postId)
  .order(
    "created_at",
    {ascending:true}
  );

  if(error){

    list.innerHTML=
    `<div style="color:#b00020;padding:7px">
      ${escapeHtml(error.message)}
    </div>`;

    return;
  }

  if(!data || !data.length){

    list.innerHTML=
    `<div style="color:#888;padding:7px">
      Abhi koi comment nahi.
    </div>`;

    return;

  }

  list.innerHTML="";

  data.forEach(comment=>{

    const own=
    currentUser &&
    comment.user_id===currentUser.id;

    list.insertAdjacentHTML(
      "beforeend",

      `
      <div class="comment-item">

        <div class="comment-top">

          <div>

            <span class="comment-user">
              ${escapeHtml(
                comment.username || "User"
              )}
            </span>

            <span class="comment-date">
              · ${formatDate(
                comment.created_at
              )}
            </span>

          </div>

          ${
            own
            ?
            `
            <button
              class="comment-delete"
              onclick="deleteComment(
                ${comment.id},
                ${postId}
              )">

              Delete

            </button>
            `
            :
            ""
          }

        </div>

        <div class="comment-text">
          ${escapeHtml(
            comment.comment || ""
          )}
        </div>

      </div>
      `
    );

  });

}


/* =========================
   SEND COMMENT
========================= */

async function sendComment(postId){

  const input=
  document.getElementById(
    "comment-input-"+postId
  );

  if(!input)
    return;

  const text=
  input.value.trim();

  if(!text){
    showToast("Comment likhein.");
    return;
  }

  if(!currentUser)
    return;

  const username=
  currentUser.user_metadata?.username ||
  currentUser.email?.split("@")[0] ||
  "User";

  const {
    error
  }=
  await supabaseClient
  .from("comments")
  .insert({

    post_id:postId,
    user_id:currentUser.id,
    username:username,
    comment:text

  });

  if(error){

    showToast(error.message);
    return;

  }

  input.value="";

  await loadComments(postId);

  const count=
  document.getElementById(
    "comment-count-"+postId
  );

  if(count){

    const result=
    await supabaseClient
    .from("comments")
    .select(
      "id",
      {count:"exact",head:true}
    )
    .eq("post_id",postId);

    count.textContent=
    result.count || 0;

  }

}


/* =========================
   DELETE COMMENT
========================= */

async function deleteComment(
  commentId,
  postId
){

  if(!currentUser)
    return;

  const ok=
  confirm(
    "Apna comment delete karna hai?"
  );

  if(!ok)
    return;

  const {
    error
  }=
  await supabaseClient
  .from("comments")
  .delete()
  .eq("id",commentId)
  .eq(
    "user_id",
    currentUser.id
  );

  if(error){

    showToast(error.message);
    return;

  }

  await loadComments(postId);

  const count=
  document.getElementById(
    "comment-count-"+postId
  );

  if(count){

    const result=
    await supabaseClient
    .from("comments")
    .select(
      "id",
      {count:"exact",head:true}
    )
    .eq("post_id",postId);

    count.textContent=
    result.count || 0;

  }

}

async function blockUser(userId){

  if(!currentUser)
    return;

  if(userId===currentUser.id)
    return;

  const ok=
  confirm(
    "Is user ko block karna hai?"
  );

  if(!ok)
    return;

  const {
    error
  }=
  await supabaseClient
  .from("user_blocks")
  .insert({

    blocker_id:currentUser.id,

      error.code==="23505"

    }

    return;

  }

  showToast(
    "User block ho gaya."
  );

  await loadFeed();

}


/* =========================
   VOICE
========================= */

function startVoice(){

  if(
    !("webkitSpeechRecognition" in window) &&
    !("SpeechRecognition" in window)
  ){

    showToast(
      "Voice typing is browser mein available nahi."
    );

    return;

  }

  const Recognition=
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  const recognition=
  new Recognition();

  recognition.lang="ur-PK";
  recognition.interimResults=false;
  recognition.continuous=false;

  showToast(
    "🎤 Bolna shuru karein..."
  );

  recognition.start();

  recognition.onresult=function(event){

    const text=
    event.results[0][0].transcript;

    const input=
    document.getElementById(
      "postText"
    );

    input.value +=
    (
      input.value ? "\n" : ""
    ) + text;

  };

  recognition.onerror=function(){

    showToast(
      "Voice input nahi ho saka."
    );

  };

}

/* =========================
   DATE
========================= */

function formatDate(dateString){

  if(!dateString)
    return "";

  const date=
  new Date(dateString);

  const now=
  new Date();

  const seconds=
  Math.floor(
    (now-date)/1000
  );

  if(seconds<60)
    return "Just now";

  const minutes=
  Math.floor(seconds/60);

  if(minutes<60)
    return minutes+
      " minute"+
      (minutes===1?"":"s")+
      " ago";

  const hours=
  Math.floor(minutes/60);

  if(hours<24)
    return hours+
      " hour"+
      (hours===1?"":"s")+
      " ago";

  const days=
  Math.floor(hours/24);

  if(days<7)
    return days+
      " day"+
      (days===1?"":"s")+
      " ago";

  return date.toLocaleDateString(
    "en-PK",
    {
      day:"numeric",
      month:"short",
      year:"numeric"
    }
  );

}


/* =========================
   HELPERS
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

  return String(value ?? "")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}


function escapeJs(value){

  return String(value ?? "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/"/g,"&quot;")
    .replace(/\n/g,"\\n")
    .replace(/\r/g,"");

}


function showToast(message){

  const toast=
  document.getElementById("toast");

  toast.textContent=message;
  toast.style.display="block";

  clearTimeout(
    window.toastTimer
  );

  window.toastTimer=
  setTimeout(()=>{

    toast.style.display="none";

  },2500);

}


function showFatalError(message){

  const loading=
  document.getElementById("loading");

  const feed=
  document.getElementById("feed");

  loading.style.display="none";

  feed.innerHTML=
  `<div class="error-box">
    <b>RabtaHub Home Error</b><br><br>
    ${escapeHtml(message)}
  </div>`;

}
