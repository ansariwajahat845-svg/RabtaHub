<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ChatZone 💬</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;overflow-x:hidden}
body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#6c5ce7,#8e44ad);
min-height:100vh;
color:#222
}

.app{
width:100%;
max-width:680px;
margin:auto;
min-height:100vh;
background:#f5f5f5;
padding-bottom:82px;
}

/* HEADER */
.header{
background:linear-gradient(135deg,#6c5ce7,#8e44ad);
color:white;
padding:11px 7px;
position:sticky;
top:0;
z-index:20;
width:100%;
}

.header-top{
display:flex;
align-items:center;
width:100%;
gap:7px;
min-width:0;
}

.logo{
flex:0 0 auto;
font-size:20px;
font-weight:bold;
white-space:nowrap;
}

.header-buttons{
display:flex;
align-items:center;
justify-content:flex-end;
gap:5px;
flex:1;
min-width:0;
overflow:hidden;
}

.header-buttons button{
flex:1 1 0;
min-width:0;
height:40px;
border:0;
background:rgba(255,255,255,.20);
color:white;
border-radius:13px;
padding:0 7px;
font-size:12px;
font-weight:700;
cursor:pointer;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.share-header-btn{
background:white!important;
color:#6c5ce7!important;
font-weight:bold;
}

/* ONLINE */
.online-section{
background:white;
margin:10px 12px 0;
padding:10px 12px;
border-radius:14px;
box-shadow:0 2px 8px rgba(0,0,0,.08)
}

.online-title{
font-size:13px;
font-weight:bold;
color:#555;
margin-bottom:8px
}

.online-users{
display:flex;
gap:9px;
overflow-x:auto;
white-space:nowrap;
scrollbar-width:none
}

.online-users::-webkit-scrollbar{display:none}

.online-user{
flex:0 0 auto;
display:flex;
align-items:center;
gap:6px;
background:#f5f5f5;
border-radius:22px;
padding:4px 10px 4px 4px;
cursor:pointer
}

.online-user-avatar{
width:34px;
height:34px;
border-radius:50%;
object-fit:cover;
background:#ddd
}

.online-user-name{
font-size:12px;
font-weight:bold;
max-width:90px;
overflow:hidden;
text-overflow:ellipsis
}

.online-dot{
width:8px;
height:8px;
border-radius:50%;
background:#22c55e;
box-shadow:0 0 0 2px white
}

/* WELCOME */
.welcome{
background:white;
margin:12px;
padding:14px;
border-radius:14px;
text-align:center;
font-weight:bold;
box-shadow:0 2px 8px rgba(0,0,0,.08)
}

/* CREATE */
.create-box{
background:white;
margin:12px;
padding:12px;
border-radius:14px;
box-shadow:0 2px 8px rgba(0,0,0,.08)
}

.reply-box{
display:none;
background:#f0edff;
border-left:4px solid #6c5ce7;
padding:8px;
border-radius:8px;
margin-bottom:8px;
font-size:13px
}

textarea{
width:100%;
min-height:80px;
resize:none;
border:1px solid #ddd;
border-radius:12px;
padding:12px;
font-size:15px;
outline:none
}

.create-actions{
display:flex;
gap:7px;
margin-top:8px;
flex-wrap:wrap
}

.create-actions button{
border:0;
border-radius:13px;
padding:10px 14px;
min-height:42px;
cursor:pointer;
font-weight:700;
font-size:13px;
}

.send-btn{background:#6c5ce7;color:white}
.upload-btn,.voice-btn{background:#eee}

/* FEED */
.feed-header{
display:flex;
align-items:center;
padding:5px 12px
}

.feed-header h3{margin:8px 0}

#feed{
padding:0 12px;
min-height:50px
}

/* POST */
.post{
background:white;
border-radius:14px;
margin:10px 0;
padding:12px;
box-shadow:0 2px 8px rgba(0,0,0,.08)
}

.post-head{
display:flex;
align-items:center;
justify-content:space-between
}

.user-info{
display:flex;
align-items:center;
gap:9px;
min-width:0
}

.avatar{
width:42px;
height:42px;
border-radius:50%;
object-fit:cover;
background:#ddd;
flex-shrink:0
}

.user-name{
font-size:15px;
font-weight:800;
word-break:break-word;
line-height:1.35
}

.post-author-name{
background:linear-gradient(90deg,#6c5ce7,#e84393,#0984e3);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
background-clip:text;
font-weight:800
}

.post-author-username{
display:inline-block;
margin-left:5px;
padding:3px 8px;
border-radius:12px;
background:linear-gradient(90deg,#f0edff,#ffe8f2);
color:#6c5ce7;
font-size:11px;
font-weight:700;
vertical-align:middle
}

.post-date{
font-size:11px;
color:#888;
margin-top:3px
}

.post-menu button{
border:0;
background:transparent;
font-size:20px;
cursor:pointer
}

.post-category{
display:inline-block;
background:#f0edff;
color:#6c5ce7;
font-size:11px;
font-weight:bold;
padding:5px 9px;
border-radius:15px;
margin-top:8px
}

.post-content{
margin:12px 0;
padding:0;
font-size:15px;
line-height:1.55;
white-space:pre-wrap;
word-break:break-word;
overflow-wrap:anywhere
}

.post-image{
width:100%;
max-height:450px;
object-fit:cover;
border-radius:12px;
margin-top:8px
}

/* VOICE POST */
.post-voice{
width:100%;
margin-top:10px;
background:#f7f5ff;
padding:8px;
border-radius:12px
}

.post-voice audio{
width:100%;
height:42px
}

/* ACTIONS */
.post-actions{
display:flex;
gap:6px;
width:100%;
border-top:1px solid #eee;
padding-top:9px;
margin-top:8px;
flex-wrap:nowrap
}

.post-actions button{
flex:1 1 0;
min-width:0;
height:40px;
border:0;
background:#f3f3f3;
border-radius:11px;
padding:0 4px;
cursor:pointer;
font-size:12px;
font-weight:700;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.post-actions button:active{
transform:scale(.97)
}

.like-btn{background:#fff0f3!important}
.dislike-btn{background:#f3f3f3!important}
.comment-btn{background:#f1f5ff!important}
.reply-btn{background:#f0edff!important}
.delete-post-btn{
background:#ffe5e5!important;
color:#d00000;
font-weight:bold
}

/* USER ACTIONS */
.user-actions{
display:flex;
gap:6px;
margin-top:7px
}

.user-actions button{
flex:1 1 0;
min-width:0;
height:40px;
border:0;
border-radius:11px;
padding:0 5px;
cursor:pointer;
font-size:11px;
font-weight:700;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.one-one-btn{background:#eaf7ff;color:#087ea4}
.follow-btn{background:#edf8ed;color:#16833b}
.following-btn{background:#e5f5ea;color:#16833b;font-weight:bold}
.block-btn{background:#ffecec;color:#d00000}

/* LIKES */
.likes-popup{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
z-index:100
}

.likes-content{
width:92%;
max-width:430px;
max-height:75vh;
overflow:auto;
background:white;
border-radius:18px;
margin:12vh auto;
padding:15px
}

.likes-header{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:10px
}

.likes-header h3{margin:0}

.likes-close{
border:0;
background:#eee;
border-radius:20px;
padding:7px 12px;
cursor:pointer
}

.like-user{
display:flex;
align-items:center;
gap:9px;
padding:9px 4px;
border-bottom:1px solid #eee;
cursor:pointer
}

.like-user-avatar{
width:38px;
height:38px;
border-radius:50%;
object-fit:cover;
background:#ddd;
flex-shrink:0
}

.like-user-name{
font-size:13px;
font-weight:bold
}

.like-user-username{
color:#777;
font-size:11px;
margin-top:2px
}

/* COMMENTS */
.comments{
display:none;
margin-top:10px;
border-top:1px solid #eee;
padding-top:10px
}

.comment-item{
background:#f5f5f5;
border-radius:10px;
padding:8px;
margin:6px 0;
font-size:13px
}

.nested-comment{
margin-left:22px;
border-left:3px solid #d8d2ff;
background:#faf9ff
}

.comment-user{font-weight:bold}

.comment-date{
color:#888;
font-size:10px
}

.comment-delete{
border:0;
background:none;
color:#d00;
font-size:11px;
cursor:pointer;
padding:4px 0
}

.comment-reply{
border:0;
background:#eee;
color:#6c5ce7;
border-radius:14px;
padding:6px 10px;
font-size:11px;
font-weight:700;
cursor:pointer;
margin-top:5px
}

.comment-reply-box{
display:none;
background:#f0edff;
border-left:4px solid #6c5ce7;
border-radius:8px;
padding:7px 9px;
margin-top:8px;
font-size:12px
}

.comment-reply-box button{
float:right;
border:0;
background:none;
color:#d00;
cursor:pointer
}

.comment-input-row{
display:flex;
gap:6px;
margin-top:8px
}

.comment-input-row input{
flex:1;
min-width:0;
border:1px solid #ddd;
border-radius:20px;
padding:10px 12px;
outline:none
}

.comment-input-row button{
flex:0 0 auto;
border:0;
border-radius:20px;
background:#6c5ce7;
color:white;
padding:9px 15px;
font-weight:700
}

/* LOADING */
.empty,.loading{
text-align:center;
padding:25px 10px;
color:#777
}

/* BOTTOM NAV */
.bottom-nav{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:680px;
height:70px;
background:white;
border-top:1px solid #ddd;
display:flex;
align-items:center;
justify-content:space-between;
padding:5px 6px;
gap:4px;
z-index:30;
box-shadow:0 -2px 10px rgba(0,0,0,.08);
}

.bottom-nav button{
border:0;
background:none;
flex:1 1 0;
min-width:0;
height:60px;
color:#555;
cursor:pointer;
padding:5px 2px;
font-size:12px;
font-weight:700;
line-height:20px;
border-radius:12px;
white-space:nowrap;
overflow:hidden;
}

.bottom-nav button:first-child{
color:#6c5ce7;
font-weight:bold;
background:#f1edff;
}

.bottom-nav button:active{
transform:scale(.96);
background:#f3f1ff;
}

/* POPUPS */
.trending-box,.share-box{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
z-index:50
}

.trending-content,.share-content{
width:92%;
max-width:600px;
max-height:80vh;
overflow:auto;
background:white;
border-radius:18px;
margin:10vh auto;
padding:15px
}

.trending-header,.share-header{
display:flex;
justify-content:space-between;
align-items:center
}

.trending-header button,.share-header button{
border:0;
background:#eee;
border-radius:20px;
padding:8px 13px;
font-weight:bold
}

.trend-item{
padding:10px;
border-bottom:1px solid #eee
}

/* SHARE */
.share-option{
width:100%;
border:0;
background:#f5f3ff;
margin-top:10px;
padding:15px;
border-radius:14px;
text-align:left;
font-size:15px;
font-weight:bold;
cursor:pointer
}

.share-form{
display:none;
margin-top:12px
}

.category-label{
font-size:13px;
font-weight:bold;
color:#555;
display:block;
margin:8px 0 5px
}

.category-select{
width:100%;
border:1px solid #ddd;
border-radius:10px;
padding:11px;
background:white;
outline:none
}

.image-preview{
width:100%;
max-height:300px;
object-fit:cover;
border-radius:12px;
margin-top:10px;
display:none
}

.share-submit{
width:100%;
border:0;
background:#6c5ce7;
color:white;
border-radius:12px;
padding:12px;
font-weight:bold;
margin-top:10px;
cursor:pointer
}

.cancel-share{
width:100%;
border:0;
background:#eee;
color:#555;
border-radius:12px;
padding:11px;
margin-top:7px;
cursor:pointer
}

.hidden-input{display:none}

/* VOICE RECORDER */
.voice-popup{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
z-index:200;
align-items:center;
justify-content:center;
padding:20px;
}

.voice-content{
width:100%;
max-width:410px;
background:white;
border-radius:20px;
padding:20px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.voice-content h3{
margin:0 0 15px;
color:#6c5ce7;
}

.voice-status{
font-size:14px;
color:#777;
margin:12px 0;
min-height:20px
}

.voice-timer{
font-size:32px;
font-weight:bold;
color:#6c5ce7;
margin:12px 0
}

.voice-preview-box{
display:none;
background:#f7f5ff;
padding:10px;
border-radius:12px;
margin:12px 0
}

.voice-preview{
width:100%;
height:42px
}

.voice-buttons{
display:flex;
gap:8px;
margin-top:8px
}

.voice-buttons button{
flex:1;
border:0;
border-radius:12px;
padding:12px 8px;
font-weight:bold;
cursor:pointer
}

.voice-buttons button:disabled{
opacity:.45;
cursor:not-allowed
}

.voice-record-btn{
background:#ffecec;
color:#d00000
}

.voice-stop-btn{
background:#eee;
color:#555
}

.voice-send-btn{
background:#6c5ce7;
color:white
}

.voice-close-btn{
width:100%;
border:0;
background:#eee;
border-radius:12px;
padding:11px;
margin-top:10px;
font-weight:bold;
cursor:pointer
}

/* MOBILE */
@media(max-width:500px){

.header{
padding:9px 5px
}

.header-top{
gap:5px
}

.logo{
font-size:15px
}

.header-buttons{
gap:3px
}

.header-buttons button{
height:40px;
font-size:10px;
padding:0 5px;
border-radius:12px
}

.create-actions button{
flex:1 1 auto;
min-width:105px
}

.post-actions{
gap:4px
}

.post-actions button{
height:40px;
font-size:10.5px;
padding:0 2px
}

.user-actions{
gap:4px
}

.user-actions button{
height:40px;
font-size:10px
}

.bottom-nav{
height:70px;
padding:5px 4px;
gap:3px
}

.bottom-nav button{
height:60px;
font-size:10px;
line-height:19px;
padding:4px 1px
}

.nested-comment{
margin-left:12px
}

.voice-content{
padding:16px
}

.voice-buttons button{
font-size:11px;
padding:11px 5px
}
}

@media(max-width:380px){

.logo{
font-size:13px
}

.header-buttons{
gap:2px
}

.header-buttons button{
height:38px;
font-size:8.5px;
padding:0 3px
}

.post-actions{
gap:3px
}

.post-actions button{
height:38px;
font-size:9px
}

.user-actions{
gap:3px
}

.user-actions button{
height:38px;
font-size:9px
}

.bottom-nav{
height:68px;
padding:4px 3px;
gap:2px
}

.bottom-nav button{
height:59px;
font-size:8.5px;
line-height:18px;
border-radius:10px
}
}

@media(max-width:340px){

.logo{
font-size:12px
}

.header-buttons button{
font-size:7.5px;
height:37px
}

.bottom-nav button{
font-size:8px
}

.post-actions button{
font-size:8.5px
}
}
</style>
</head>

<body>

<div class="app">

<div class="header">
<div class="header-top">

<div class="logo">ChatZone 💬</div>

<div class="header-buttons">
<button onclick="showTrending()">🔥 Trending</button>
<button class="share-header-btn" onclick="showShare()">+ Share</button>
<button onclick="goStars()">⭐</button>
<button onclick="goNotifications()">🔔</button>
</div>

</div>
</div>

<div class="online-section">

<div class="online-title">
🟢 <span id="onlineCount">0</span> Users Online
</div>

<div id="onlineUsers" class="online-users">
<div style="color:#888;font-size:12px;padding:5px">
Online users loading...
</div>
</div>

</div>

<div class="welcome">
Welcome to ChatZone 💬 ❤️
</div>

<div class="create-box">

<div id="replyBox" class="reply-box">

<span id="replyText"></span>

<button
onclick="cancelReply()"
style="float:right;border:0;background:none;color:#d00">
✕
</button>

</div>

<textarea
id="postText"
placeholder="What's on your mind?">
</textarea>

<div class="create-actions">

<button
class="send-btn"
onclick="createPost()">
Send Post
</button>

<button
class="upload-btn"
onclick="showImagePost()">
🖼️ Image Post
</button>

<button
class="voice-btn"
onclick="startVoice()">
🎤 Voice
</button>

</div>

</div>

<div class="feed-header">
<h3>Home Feed</h3>
</div>

<div id="feed">
<div class="loading">Loading feed...</div>
</div>

</div>

<!-- LIKES -->
<div id="likesPopup" class="likes-popup">

<div class="likes-content">

<div class="likes-header">
<h3>❤️ Liked by</h3>
<button
class="likes-close"
onclick="closeLikesPopup()">
✕
</button>
</div>

<div id="likesList">
Loading...
</div>

</div>
</div>

<!-- SHARE -->
<div id="shareBox" class="share-box">

<div class="share-content">

<div class="share-header">
<h3>📤 Create Post</h3>
<button onclick="closeShare()">✕</button>
</div>

<button
class="share-option"
onclick="showTextPost()">
📝 Text Post
</button>

<button
class="share-option"
onclick="showImagePost()">
🖼️ Image Post
</button>

<div id="textPostForm" class="share-form">

<textarea
id="shareText"
placeholder="What's on your mind?">
</textarea>

<button
class="share-submit"
onclick="submitTextPost()">
📤 Share Text Post
</button>

</div>

<div id="imagePostForm" class="share-form">

<label class="category-label">
Select Category *
</label>

<select
id="imageCategory"
class="category-select">

<option value="">Select category</option>
<option value="General">General</option>
<option value="Funny">Funny</option>
<option value="News">News</option>
<option value="Islamic">Islamic</option>
<option value="Poetry">Poetry</option>
<option value="Help">Help</option>
<option value="Other">Other</option>

</select>

<label class="category-label">
Image *
</label>

<button
class="share-option"
onclick="document.getElementById('shareImageInput').click()">
🖼️ Select Image
</button>

<input
id="shareImageInput"
class="hidden-input"
type="file"
accept="image/*"
onchange="shareImageSelected()">

<img
id="shareImagePreview"
class="image-preview"
alt="Preview">

<textarea
id="imageCaption"
placeholder="Write a caption (optional)..."
style="margin-top:10px">
</textarea>

<button
class="share-submit"
onclick="submitImagePost()">
🖼️ Share Image Post
</button>

</div>

<button
class="cancel-share"
onclick="closeShare()">
Cancel
</button>

</div>
</div>

<!-- PROPER VOICE RECORDER -->
<div id="voicePopup" class="voice-popup">

<div class="voice-content">

<h3>🎤 Voice Post</h3>

<div id="voiceStatus" class="voice-status">
Ready to record
</div>

<div id="voiceTimer" class="voice-timer">
00:00
</div>

<div
id="voicePreviewBox"
class="voice-preview-box">

<audio
id="voicePreview"
class="voice-preview"
controls
preload="metadata">
</audio>

</div>

<div class="voice-buttons">

<button
id="voiceRecordBtn"
class="voice-record-btn"
onclick="recordVoice()">
🔴 Record
</button>

<button
id="voicePauseBtn"
class="voice-stop-btn"
onclick="pauseResumeVoice()"
disabled>
⏸️ Pause
</button>

<button
id="voiceStopBtn"
class="voice-stop-btn"
onclick="stopVoice()"
disabled>
⏹️ Stop
</button>

</div>

<div class="voice-buttons">

<button
id="voiceAgainBtn"
class="voice-stop-btn"
onclick="recordAgainVoice()"
disabled>
🔄 Again
</button>

<button
id="voiceSendBtn"
class="voice-send-btn"
onclick="sendVoice()"
disabled>
📤 Send
</button>

</div>

<button
class="voice-close-btn"
onclick="closeVoice()">
Cancel
</button>

</div>
</div>

<!-- TRENDING -->
<div id="trendingBox" class="trending-box">

<div class="trending-content">

<div class="trending-header">
<h3>🔥 Trending</h3>

/* =========================================

async function loadOnlineUsers(){

if(!currentUser)return;

try{

if(onlineChannel){

try{

await supabaseClient
.removeChannel(onlineChannel);

}catch(e){}

}

onlineChannel=
supabaseClient.channel(
"chatzone-online-users",
{
config:{
presence:{
key:String(currentUser.id)
}
}
}
);

onlineChannel
.on(
"presence",
{event:"sync"},
()=>{
renderOnlineUsers();
}
)
.on(
"presence",
{event:"join"},
()=>{
renderOnlineUsers();
}
)
.on(
"presence",
{event:"leave"},
()=>{
renderOnlineUsers();
}
);

onlineChannel.subscribe(
async status=>{

if(status==="SUBSCRIBED"){

try{

await onlineChannel.track({
user_id:String(currentUser.id),
online_at:new Date().toISOString()
});

renderOnlineUsers();

}catch(error){

console.error(
"Presence track error:",
error
);

}

}

});

}catch(error){

console.error(
"Online system error:",
error
);

}

}

Object.keys(state).forEach(key=>{

entries.forEach(entry=>{

const id=
entry.user_id||key;

if(id&&!ids.includes(id)){
ids.push(id);

});

ids.push(currentUser.id);

await supabaseClient

"id,username,name,avatar_url"
)
.in("id",ids);

data.forEach(profile=>{

"";

id===currentUser.id

currentUser.user_metadata?.username||

/* =========================================

========================================= */

async function loadFeed(preserveScroll=false){

const feed=
document.getElementById("feed");

if(!feed)return;

const savedScrollY=
window.scrollY;

try{

const {
data:posts,
error:postsError
}=
await supabaseClient
.from("posts")
.select(
"id,user_id,content,created_at,post_type,category,image_url,voice_url,voice_duration"
)
.order(
"created_at",
{ascending:false}
)
.order(
"id",
{ascending:false}
);

if(postsError)
throw postsError;

const safePosts=
Array.isArray(posts)
?posts
:[];

currentPosts=safePosts;
profileMap={};
followMap={};

if(safePosts.length===0){

feed.innerHTML=
`<div class="empty">
Abhi koi post nahi hai.
</div>`;

return;

}

const userIds=[
...new Set(
safePosts
.map(post=>post.user_id)
.filter(Boolean)
)
];

if(userIds.length){

const {
data:profiles,
error:profileError
}=
await supabaseClient
.from("profiles")
.select(
"id,username,name,avatar_url"
)
.in("id",userIds);

if(!profileError&&profiles){

profiles.forEach(profile=>{
profileMap[profile.id]=profile;
});

}

}

if(currentUser&&userIds.length){

const {
data:follows,
error:followError
}=
await supabaseClient
.from("user_follows")
.select("following_id")
.eq(
"follower_id",
currentUser.id
)
.in(
"following_id",
userIds
);

if(!followError&&follows){

follows.forEach(row=>{
followMap[row.following_id]=true;
});

}

}

const actionCounts={};

const {
data:actions,
error:actionsError
}=
await supabaseClient
.from("post_actions")
.select(
"post_id,user_id,action_type"
)
.in(
"post_id",
safePosts.map(post=>post.id)
);

if(!actionsError&&actions){

actions.forEach(action=>{

if(!actionCounts[action.post_id]){

actionCounts[action.post_id]={
like:0,
dislike:0
};

}

if(action.action_type==="like")
actionCounts[action.post_id].like++;

if(action.action_type==="dislike")
actionCounts[action.post_id].dislike++;

});

}

const commentCounts={};

const {
data:comments,
error:commentsError
}=
await supabaseClient
.from("comments")
.select("post_id")
.in(
"post_id",
safePosts.map(post=>post.id)
);

if(!commentsError&&comments){

comments.forEach(comment=>{

commentCounts[comment.post_id]=
(commentCounts[comment.post_id]||0)+1;

});

}

let html="";

safePosts.forEach(post=>{

html+=renderPost(
post,
actionCounts[post.id]||
{
like:0,
dislike:0
},
commentCounts[post.id]||0
);

});

feed.innerHTML=html;

updateTrending(
safePosts,
profileMap
);

if(preserveScroll){

requestAnimationFrame(()=>{

window.scrollTo({
top:savedScrollY,
left:0,
behavior:"auto"
});

});

}

}catch(error){

console.error(
"Feed error:",
error
);

feed.innerHTML=
`<div class="empty">
Feed load nahi ho saki.<br>
<small>
${escapeHtml(
error.message||
"Unknown error"
)}
</small>
</div>`;

}

}

/* =========================================
   FOLLOW
========================================= */

async function toggleFollow(userId){

if(!currentUser){

alert("Please login first.");

return;

}

if(
!userId||
userId===currentUser.id
)return;

const isFollowing=
!!followMap[userId];

try{

if(isFollowing){

const {error}=
await supabaseClient
.from("user_follows")
.delete()
.eq(
"follower_id",
currentUser.id
)
.eq(
"following_id",
userId
);

if(error)throw error;

followMap[userId]=false;

}else{

const {error}=
await supabaseClient
.from("user_follows")
.insert({
follower_id:currentUser.id,
following_id:userId
});

if(error){

if(
String(error.message||"")
.toLowerCase()
.includes("duplicate")
){

followMap[userId]=true;

}else{

throw error;

}

}else{

followMap[userId]=true;

}

}

updateFollowButtons(userId);

}catch(error){

alert(
"Follow action nahi ho saki:\n"+
error.message
);

}

}


function safeButtonId(userId){

return String(userId||"")
.replace(
/[^a-zA-Z0-9_-]/g,
"_"
);

}


function updateFollowButtons(userId){

const id=
"follow-btn-"+safeButtonId(userId);

const buttons=
document.querySelectorAll(
"#"+CSS.escape(id)
);

buttons.forEach(button=>{

if(followMap[userId]){

button.textContent="✓ Following";

button.className=
"following-btn";

}else{

button.textContent="➕ Follow";

button.className=
"follow-btn";

}

});

}

async function submitImagePost(){

if(!currentUser){

alert("Please login first.");

return;

}

const category=
document.getElementById(
"imageCategory"
).value;

const input=
document.getElementById(
"shareImageInput"
);

const caption=
document.getElementById(
"imageCaption"
).value.trim();

if(!category){

alert(
"Image post ke liye category select karna zaroori hai."
);

return;

}

if(
!input.files||
!input.files.length
){

alert(
"Pehle image select karein."
);

return;

}

const file=input.files[0];

try{

const fileExt=
file.name.split(".").pop();

const fileName=
currentUser.id+
"_"+Date.now()+
"."+fileExt;

const filePath=
"posts/"+fileName;

const {
error:uploadError
}=
await supabaseClient.storage
.from("post-images")
.upload(
filePath,
file,
{
cacheControl:"3600",
upsert:false
}
);

if(uploadError)
throw new Error(
"Image upload nahi hui.\n\n"+
uploadError.message
);

const {data:publicData}=
supabaseClient.storage
.from("post-images")
.getPublicUrl(filePath);

const imageUrl=
publicData?.publicUrl||"";

if(!imageUrl)
throw new Error(
"Image URL nahi mili."
);

const {error:postError}=
await supabaseClient
.from("posts")
.insert({
user_id:currentUser.id,
content:caption,
post_type:"image",
category:category,
image_url:imageUrl
});

if(postError)
throw postError;

document.getElementById(
"imageCategory"
).value="";

document.getElementById(
"shareImageInput"
).value="";

document.getElementById(
"imageCaption"
).value="";

document.getElementById(
"shareImagePreview"
).style.display="none";

document.getElementById(
"shareImagePreview"
).src="";

closeShare();

await loadFeed(true);

}catch(error){

alert(
"Image post send nahi hui:\n\n"+
error.message
);

}

}

async function loadComments(postId){

document.getElementById(

try{

const {
data:comments,
error
}=

.from("comments")

)
.eq(
"post_id",
postId

.order(

{ascending:true}
);

!comments||
comments.length===0
){

list.innerHTML=
`<div
style="color:#888;font-size:12px;padding:8px;text-align:center">
No comments yet.
</div>`;

return;

}

const userIds=[
...new Set(
comments
.map(c=>c.user_id)
.filter(Boolean)
)
];

let commentProfiles={};

if(userIds.length){

const {data:profiles}=
await supabaseClient
.from("profiles")
.select(
"id,username,name,avatar_url"
)
.in("id",userIds);

if(profiles){

profiles.forEach(
p=>{
commentProfiles[p.id]=p;
}
);

}

}

const childrenMap={};

comments.forEach(comment=>{

const parentId=
comment.parent_id||0;

if(!childrenMap[parentId])
childrenMap[parentId]=[];

childrenMap[parentId].push(
comment
);

});


function renderComment(
comment,
level=0
){

const profile=
commentProfiles[
comment.user_id
]||{};

let username=
profile.username||"";

let displayName=
profile.name||"";

if(
!username&&
currentUser&&
comment.user_id===
currentUser.id
){

username=
currentUser.user_metadata?.username||
currentUser.email?.split("@")[0]||
"User";

}

if(!username)
username="User";

const isOwn=
currentUser&&
comment.user_id===
currentUser.id;

const children=
childrenMap[comment.id]||[];

const avatar=
profile.avatar_url||"";

const avatarHTML=
avatar
?`<img
src="${escapeAttribute(avatar)}"
style="
width:32px;
height:32px;
border-radius:50%;
object-fit:cover">`
:`<div
style="
width:32px;
height:32px;
border-radius:50%;
background:#ddd;
display:flex;
align-items:center;
justify-content:center">
👤
</div>`;

return `
<div
class="comment-item ${
level>0
?"nested-comment"
:""
}">

<div
style="
display:flex;
align-items:center;
gap:8px">

${avatarHTML}

<div>

<div class="comment-user">

${escapeHtml(
displayName||username
)}

${
displayName&&username
?`
<span
style="
color:#777;
font-weight:normal;
font-size:11px">
@${escapeHtml(username)}
</span>
`
:""
}

</div>

<div class="comment-date">
${formatDate(
comment.created_at
)}
</div>

</div>

</div>

<div
style="
margin-top:7px;
white-space:pre-wrap;
word-break:break-word">

${escapeHtml(
comment.comment||""
)}

</div>

<div>

<button
class="comment-reply"
onclick="replyToComment(
${Number(postId)},
${Number(comment.id)},
'${escapeJs(username)}'
)">
↩️ Reply
</button>

${
isOwn
?`
<button
class="comment-delete"
onclick="deleteComment(
${Number(comment.id)},
${Number(postId)}
)">
🗑️ Delete
</button>
`
:""
}

</div>

${
children.length
?children
.map(
child=>
renderComment(
child,
level+1
)
)
.join("")
:""
}

</div>
`;

}

const topComments=
childrenMap[0]||[];

list.innerHTML=
topComments
.map(
comment=>
renderComment(
comment,
0
)
)
.join("");

}catch(error){

list.innerHTML=
`<div
style="color:#d00;padding:8px">
Comments load nahi huay.<br>
<small>
${escapeHtml(
error.message||""
)}
</small>
</div>`;

}

}

function getSupportedAudioType(){

const types=[
"audio/webm;codecs=opus",
"audio/webm",
"audio/ogg;codecs=opus",
"audio/ogg"
];

for(
const type of types
){

if(
window.MediaRecorder&&
MediaRecorder.isTypeSupported&&
MediaRecorder.isTypeSupported(type)
){

return type;

}

}

return "";

}


async function recordVoice(){

if(
voiceRecorder&&
(
voiceRecorder.state===
"recording"||
voiceRecorder.state===
"paused"
)
){

return;

}

const session=
++voiceSession;

try{

if(
!navigator.mediaDevices||
!navigator.mediaDevices.getUserMedia
){

alert(
"Voice recording is not supported in this browser."
);

return;

}

if(
typeof MediaRecorder===
"undefined"
){

alert(
"Your browser does not support voice recording."
);

return;

}

voiceChunks=[];
voiceBlob=null;
voiceSeconds=0;
voicePaused=false;

const previewBox=
document.getElementById(
"voicePreviewBox"
);

const preview=
document.getElementById(
"voicePreview"
);

if(previewBox)
previewBox.style.display="none";

if(preview){

try{

if(
preview.src&&
preview.src.startsWith("blob:")
){

URL.revokeObjectURL(
preview.src
);

}

}catch(e){}

preview.removeAttribute("src");

}

voiceStream=
await navigator.mediaDevices
.getUserMedia({
audio:{
echoCancellation:true,
noiseSuppression:true,
autoGainControl:true
}
});

if(session!==voiceSession){

voiceStream
.getTracks()
.forEach(
track=>track.stop()
);

return;

}

voiceMimeType=
getSupportedAudioType();

const options=
voiceMimeType
?{mimeType:voiceMimeType}
:{};

const recorder=
new MediaRecorder(
voiceStream,
options
);

voiceRecorder=recorder;

if(recorder.mimeType)
voiceMimeType=
recorder.mimeType;

recorder.ondataavailable=
function(event){

if(
event.data&&
event.data.size>0
){

voiceChunks.push(
event.data
);

}

};

recorder.onstop=
function(){

if(session!==voiceSession)
return;

if(voiceStream){

voiceStream
.getTracks()
.forEach(
track=>track.stop()
);

voiceStream=null;

}

const finalType=
voiceMimeType||
recorder.mimeType||
"audio/webm";

voiceBlob=
new Blob(
voiceChunks,
{
type:finalType
}
);

if(
!voiceBlob||
voiceBlob.size===0
){

const status=
document.getElementById(
"voiceStatus"
);

if(status)
status.textContent=
"Voice record nahi hui.";

return;

}

const previewUrl=
URL.createObjectURL(
voiceBlob
);

const preview=
document.getElementById(
"voicePreview"
);

const previewBox=
document.getElementById(
"voicePreviewBox"
);

if(preview){

preview.src=
previewUrl;

preview.load();

}

if(previewBox)
previewBox.style.display=
"block";

const status=
document.getElementById(
"voiceStatus"
);

const recordBtn=
document.getElementById(
"voiceRecordBtn"
);

const pauseBtn=
document.getElementById(
"voicePauseBtn"
);

const stopBtn=
document.getElementById(
"voiceStopBtn"
);

const againBtn=
document.getElementById(
"voiceAgainBtn"
);

const sendBtn=
document.getElementById(
"voiceSendBtn"
);

if(status)
status.textContent=
"✅ Voice ready — preview karein";

if(recordBtn)
recordBtn.disabled=false;

if(pauseBtn)
pauseBtn.disabled=true;

if(stopBtn)
stopBtn.disabled=true;

if(againBtn)
againBtn.disabled=false;

if(sendBtn)
sendBtn.disabled=false;

};

recorder.start(250);

const status=
document.getElementById(
"voiceStatus"
);

const recordBtn=
document.getElementById(
"voiceRecordBtn"
);

const pauseBtn=
document.getElementById(
"voicePauseBtn"
);

const stopBtn=
document.getElementById(
"voiceStopBtn"
);

const againBtn=
document.getElementById(
"voiceAgainBtn"
);

const sendBtn=
document.getElementById(
"voiceSendBtn"
);

if(status)
status.textContent=
"🔴 Recording...";

if(recordBtn)
recordBtn.disabled=true;

if(pauseBtn)
pauseBtn.disabled=false;

if(stopBtn)
stopBtn.disabled=false;

if(againBtn)
againBtn.disabled=true;

if(sendBtn)
sendBtn.disabled=true;

startVoiceTimer();

}catch(error){

console.error(
"Voice recorder error:",
error
);

if(voiceStream){

try{

voiceStream
.getTracks()
.forEach(
track=>track.stop()
);

}catch(e){}

voiceStream=null;

}

voiceRecorder=null;

alert(
"Microphone open nahi ho saka:\n"+
(
error.message||
"Permission denied"
)
);

}

}

voiceRecorder.state===
"recording"||
voiceRecorder.state===
"paused"
){

voiceRecorder.stop();

}

}catch(e){}

}

if(voiceStream){

try{

voiceStream
.getTracks()
.forEach(
track=>track.stop()
);

}catch(e){}

}

voiceRecorder=null;
voiceStream=null;
voiceChunks=[];
voiceBlob=null;
voiceSeconds=0;
voicePaused=false;

const preview=
document.getElementById(
"voicePreview"
);

if(preview){

try{

if(
preview.src&&
preview.src.startsWith("blob:")
){

URL.revokeObjectURL(
preview.src
);

}

}catch(e){}

preview.removeAttribute("src");
preview.load();

}

const previewBox=
document.getElementById(
"voicePreviewBox"
);

if(previewBox)
previewBox.style.display="none";

const popup=
document.getElementById(
"voicePopup"
);

if(popup)
popup.style.display="none";

}


/* =========================================
   TRENDING
========================================= */

function updateTrending(
posts,
profiles
){

const list=
document.getElementById(
"trendingList"
);

if(
!posts||
posts.length===0
){

list.innerHTML=
"No posts yet.";

return;

}

list.innerHTML=
posts
.slice(0,10)
.map(post=>{

const profile=
profiles[post.user_id]||{};

const username=
profile.username||
"User";

return `
<div class="trend-item">

<b>
@${escapeHtml(username)}
</b>

${
post.category
?`
<div
style="
color:#6c5ce7;
font-size:11px;
margin-top:3px">
#${escapeHtml(post.category)}
</div>
`
:""
}

<div style="margin-top:4px">
${escapeHtml(
post.content||""
).slice(0,160)}
</div>

<small style="color:#888">
${formatDate(
post.created_at
)}
</small>

</div>
`;

}).join("");

}

/* =========================================
   DATE
========================================= */

function formatDate(value){

if(!value)return "";

const date=
new Date(value);

if(
Number.isNaN(
date.getTime()
)
)
return "";

const now=
new Date();

const seconds=
Math.floor(
(
now.getTime()-
date.getTime()
)/1000
);

if(seconds<10)
return "Just now";

if(seconds<60)
return seconds+
" seconds ago";

const minutes=
Math.floor(seconds/60);

if(minutes<60){

return minutes===1
?"1 minute ago"
:minutes+" minutes ago";

}

const hours=
Math.floor(minutes/60);

if(hours<24){

return hours===1
?"1 hour ago"
:hours+" hours ago";

}

const days=
Math.floor(hours/24);

if(days<7){

return days===1
?"1 day ago"
:days+" days ago";

}

return date.toLocaleDateString(
"en-GB",
{
day:"2-digit",
month:"short",
year:"numeric"
}
);

}


/* =========================================
   SECURITY
========================================= */

function escapeHtml(value){

return String(value??"")
.replaceAll(
"&",
"&amp;"
)
.replaceAll(
"<",
"&lt;"
)
.replaceAll(
">",
"&gt;"
)
.replaceAll(
'"',
"&quot;"
)
.replaceAll(
"'",
"&#039;"
);

}


function escapeAttribute(value){

return escapeHtml(value);

}


function escapeJs(value){

return String(value??"")
.replaceAll(
"\\",
"\\\\"
)
.replaceAll(
"'",
"\\'"
)
.replaceAll(
"\n",
"\\n"
)
.replaceAll(
"\r",
"\\r"
);

}
