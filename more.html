<script>

const SUPABASE_URL =
  "https://jhcpqjmxiovvqbghpxbf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";

const supabaseClient =
  supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser = null;
let onlineChannel = null;


/* =========================
   GLOBAL ONLINE PRESENCE
========================= */

async function startGlobalPresence(){

  if(!currentUser) return;

  if(onlineChannel) return;

  try{

    onlineChannel = supabaseClient.channel(
      "chatzone-online-users",
      {
        config:{
          presence:{
            key:String(currentUser.id)
          }
        }
      }
    );

    onlineChannel.on(
      "presence",
      {event:"sync"},
      ()=>{
        console.log("Global presence synced.");
      }
    );

    onlineChannel.on(
      "presence",
      {event:"join"},
      ()=>{
        console.log("Global online user joined.");
      }
    );

    onlineChannel.on(
      "presence",
      {event:"leave"},
      ()=>{
        console.log("Global online user left.");
      }
    );

    await onlineChannel.subscribe(async status=>{

      if(status==="SUBSCRIBED"){

        try{

          await onlineChannel.track({
            user_id:String(currentUser.id),
            online_at:new Date().toISOString()
          });

          console.log("RabtaHub user is online.");

        }catch(error){

          console.error(
            "Presence track error:",
            error
          );

        }

      }

    });

  }catch(error){

    console.error(
      "Global presence error:",
      error
    );

    onlineChannel=null;

  }

}


/* =========================
   CHANGE PASSWORD
========================= */

function changePassword(){

  window.location.href="change-password.html";

}


/* =========================
   LOGOUT
========================= */

async function logoutUser(){

  const confirmLogout =
    confirm("Kya aap logout karna chahte hain?");

  if(!confirmLogout) return;

  try{

    if(onlineChannel){

      try{
        await onlineChannel.untrack();
      }catch(e){}

      try{
        await supabaseClient.removeChannel(
          onlineChannel
        );
      }catch(e){}

      onlineChannel=null;

    }

    const {error} =
      await supabaseClient.auth.signOut();

    if(error){

      alert(
        "Logout nahi ho saka: "+
        error.message
      );

      return;

    }

    window.location.href="login.html";

  }catch(error){

    alert(
      "Logout error: "+
      error.message
    );

  }

}


/* =========================
   PAGE START
========================= */

document.addEventListener(
  "DOMContentLoaded",
  async()=>{

    try{

      const {
        data:{
          session
        }
      } =
        await supabaseClient.auth.getSession();

      if(!session){

        window.location.href="login.html";
        return;

      }

      currentUser=session.user;

      await startGlobalPresence();

    }catch(error){

      console.error(
        "Page initialization error:",
        error
      );

    }

  }
);


/* =========================
   AUTH STATE
========================= */

supabaseClient.auth.onAuthStateChange(
  async(event,session)=>{

    if(event==="SIGNED_OUT"){

      if(onlineChannel){

        try{
          await onlineChannel.untrack();
        }catch(e){}

        try{
          await supabaseClient.removeChannel(
            onlineChannel
          );
        }catch(e){}

        onlineChannel=null;

      }

      window.location.href="login.html";
      return;

    }

    if(session && !currentUser){

      currentUser=session.user;

      await startGlobalPresence();

    }

  }
);


/* =========================
   PAGE EXIT
========================= */

window.addEventListener(
  "beforeunload",
  ()=>{
    if(onlineChannel){

      try{
        onlineChannel.untrack();
      }catch(e){}

    }
  }
);

</script>

</body>
