
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Private Chat - ChatZone 💬</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#f4f6fb;
}

body{
  display:flex;
  flex-direction:column;
}

.header{
  flex-shrink:0;
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  color:#fff;
  padding:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
  z-index:10;
}

.header-row{
  max-width:700px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:10px;
}

.back-btn{
  border:0;
  background:rgba(255,255,255,.16);
  color:#fff;
  border-radius:10px;
  padding:8px 12px;
  font-size:20px;
  cursor:pointer;
}

.header-user{
  flex:1;
  min-width:0;
  display:flex;
  align-items:center;
  gap:10px;
}

.header-avatar{
  width:42px;
  height:42px;
  min-width:42px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid rgba(255,255,255,.7);
  background:#eee;
}

.header-info{
  min-width:0;
}

.header-name{
  font-size:16px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.header-status{
  font-size:12px;
  margin-top:2px;
  opacity:.9;
}

.chat-area{
  flex:1;
  overflow-y:auto;
  padding:12px 10px 85px;
}

.chat-inner{
  max-width:700px;
  margin:auto;
}

.loading,
.empty{
  background:#fff;
  border-radius:14px;
  padding:25px 15px;
  text-align:center;
  color:#777;
  margin-top:20px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.message-row{
  display:flex;
  width:100%;
  margin:7px 0;
}

.message-row.mine{
  justify-content:flex-end;
}

.message-row.theirs{
  justify-content:flex-start;
}

.message-bubble{
  max-width:78%;
  padding:9px 12px;
  border-radius:16px;
  word-break:break-word;
  box-shadow:0 1px 4px rgba(0,0,0,.08);
}

.mine .message-bubble{
  background:#6c5ce7;
  color:#fff;
  border-bottom-right-radius:5px;
}

.theirs .message-bubble{
  background:#fff;
  color:#222;
  border-bottom-left-radius:5px;
}

.message-text{
  white-space:pre-wrap;
  line-height:1.4;
  font-size:15px;
}

.message-time{
  font-size:10px;
  opacity:.65;
  text-align:right;
  margin-top:4px;
}

.image-message{
  display:block;
  max-width:230px;
  max-height:300px;
  border-radius:12px;
  object-fit:cover;
}

.composer{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:#fff;
  border-top:1px solid #ddd;
  padding:8px;
  z-index:20;
}

.composer-inner{
  max-width:700px;
  margin:auto;
  display:flex;
  align-items:flex-end;
  gap:6px;
}

.input{
  flex:1;
  min-width:0;
  resize:none;
  max-height:110px;
  border:1px solid #ddd;
  border-radius:22px;
  outline:none;
  padding:11px 14px;
  font-size:15px;
  font-family:Arial,sans-serif;
}

.input:focus{
  border-color:#6c5ce7;
}

.action-btn{
  width:42px;
  height:42px;
  min-width:42px;
  border:0;
  border-radius:50%;
  background:#efedff;
  color:#6c5ce7;
  font-size:18px;
  cursor:pointer;
}

.send-btn{
  background:#6c5ce7;
  color:#fff;
}

#fileInput{
  display:none;
}

@media(max-width:500px){
  .message-bubble{
    max-width:86%;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="header-row">

    <button
      class="back-btn"
      onclick="goBack()">
      ←
    </button>

    <div class="header-user">

      <img
        id="headerAvatar"
        class="header-avatar"
        src=""
        alt="">

      <div class="header-info">

        <div
          id="headerName"
          class="header-name">
          Loading...
        </div>

        <div
          id="headerStatus"
          class="header-status">
          Private Chat
        </div>

      </div>

    </div>

  </div>

</header>


<main
  id="chatArea"
  class="chat-area">

  <div class="chat-inner">

    <div
      id="messages"
      class="loading">

      🔄 Chat load ho rahi hai...

    </div>

  </div>

</main>


<div class="composer">

  <div class="composer-inner">

    <input
      id="fileInput"
      type="file"
      accept="image/*"
      onchange="sendImage(event)">

    <button
      class="action-btn"
      onclick="document.getElementById('fileInput').click()">
      📷
    </button>

    <textarea
      id="messageInput"
      class="input"
      rows="1"
      placeholder="Message likhein..."
      onkeydown="handleKey(event)"></textarea>

    <button
      id="sendBtn"
      class="action-btn send-btn"
      onclick="sendMessage()">
      ➤
    </button>

  </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://jhcpqjmxiovvqbghpxbf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:false
    }
  }
);


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;
let otherUserId = null;
let messageChannel = null;


/* =====================================================
   GET USER ID
   Supports:
   ?user=UUID
   ?user_id=UUID
   ?id=UUID
===================================================== */

function getOtherUserId(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  let userId =
    params.get("user");

  if(!userId){
    userId =
      params.get("user_id");
  }

  if(!userId){
    userId =
      params.get("id");
  }

  if(!userId){
    return null;
  }

  return userId.trim();

}


/* =====================================================
   DEFAULT AVATAR
===================================================== */

function getDefaultAvatar(){

  return "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="100"
        height="100"
        viewBox="0 0 100 100">

        <rect
          width="100"
          height="100"
          rx="50"
          fill="#e8e6ff"/>

        <circle
          cx="50"
          cy="38"
          r="18"
          fill="#6c5ce7"/>

        <path
          d="M20 85c4-20 17-30 30-30s26 10 30 30"
          fill="#6c5ce7"/>

      </svg>
    `);

}


/* =====================================================
   SESSION
===================================================== */

async function getSession(){

  try{

    const result =
      await supabaseClient
        .auth
        .getSession();

    return (
      result &&
      result.data &&
      result.data.session
    )
    ?
      result.data.session
    :
      null;

  }catch(error){

    console.error(
      "SESSION ERROR:",
      error
    );

    return null;

  }

}


/* =====================================================
   INIT
===================================================== */

async function init(){

  /*
    IMPORTANT:
    User ID URL se yahin read hogi.
  */

  otherUserId =
    getOtherUserId();


  console.log(
    "CHAT USER ID:",
    otherUserId
  );


  if(!otherUserId){

    showError(
      "Chat user nahi mila."
    );

    return;

  }


  const session =
    await getSession();


  if(!session){

    showError(
      "Login session nahi mili."
    );

    return;

  }


  currentUser =
    session.user;


  if(
    !currentUser ||
    !currentUser.id
  ){

    showError(
      "Current user nahi mila."
    );

    return;

  }


  if(
    currentUser.id ===
    otherUserId
  ){

    showError(
      "Apne saath chat open nahi ho sakti."
    );

    return;

  }


  await loadUserProfile();

  await loadMessages();

  startRealtime();

}


/* =====================================================
   LOAD PROFILE
===================================================== */

async function loadUserProfile(){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("profiles")
    .select(
      "id,username,name,avatar_url"
    )
    .eq(
      "id",
      otherUserId
    )
    .maybeSingle();


  if(error){

    console.error(
      "PROFILE ERROR:",
      error
    );

  }


  const profile =
    data || {};


  const username =
    profile.username ||
    profile.name ||
    "User";


  document.getElementById(
    "headerName"
  ).textContent =
    "@" + username;


  const avatar =
    profile.avatar_url ||
    getDefaultAvatar();


  const image =
    document.getElementById(
      "headerAvatar"
    );


  image.src =
    avatar;


  image.onerror =
    function(){

      this.src =
        getDefaultAvatar();

    };

}


/* =====================================================
   LOAD MESSAGES
===================================================== */

async function loadMessages(){

  const box =
    document.getElementById(
      "messages"
    );


  box.innerHTML = `

    <div class="loading">
      🔄 Messages load ho rahe hain...
    </div>

  `;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("private_messages")
    .select(
      "id,sender_id,receiver_id,message_type,content,media_url,created_at"
    )
    .or(
      `and(sender_id.eq.${currentUser.id},receiver_id.eq.${otherUserId}),and(sender_id.eq.${otherUserId},receiver_id.eq.${currentUser.id})`
    )
    .order(
      "created_at",
      {
        ascending:true
      }
    );


  if(error){

    console.error(
      "MESSAGES ERROR:",
      error
    );


    box.innerHTML = `

      <div class="empty">

        ❌ Messages load nahi ho sake.

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

    return;

  }


  if(
    !data ||
    data.length === 0
  ){

    box.innerHTML = `

      <div class="empty">

        💬 Abhi koi message nahi.

        <br><br>

        Pehla message bhejein.

      </div>

    `;

    return;

  }


  box.innerHTML =
    data
      .map(
        message =>
          renderMessage(message)
      )
      .join("");


  scrollBottom();

}


/* =====================================================
   RENDER MESSAGE
===================================================== */

function renderMessage(message){

  const mine =
    message.sender_id ===
    currentUser.id;


  let content = "";


  if(
    message.message_type ===
    "image"
  ){

    content =
      message.media_url

      ?

      `
        <img
          class="image-message"
          src="${escapeAttr(message.media_url)}"
          alt="Image">
      `

      :

      "📷 Image";

  }

  else if(
    message.message_type ===
    "voice"
  ){

    content =
      message.media_url

      ?

      `
        <audio
          controls
          style="max-width:220px;width:100%;">

          <source
            src="${escapeAttr(message.media_url)}">

        </audio>
      `

      :

      "🎤 Voice";

  }

  else{

    content = `

      <div class="message-text">

        ${escapeHtml(
          message.content || ""
        )}

      </div>

    `;

  }


  return `

    <div
      class="message-row ${
        mine
        ? "mine"
        : "theirs"
      }">

      <div class="message-bubble">

        ${content}

        <div class="message-time">

          ${escapeHtml(
            formatTime(
              message.created_at
            )
          )}

        </div>

      </div>

    </div>

  `;

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

  if(
    !currentUser ||
    !otherUserId
  ){
    return;
  }


  const input =
    document.getElementById(
      "messageInput"
    );


  const content =
    input.value.trim();


  if(!content){
    return;
  }


  const button =
    document.getElementById(
      "sendBtn"
    );


  button.disabled =
    true;


  const {
    error
  } =
  await supabaseClient
    .from("private_messages")
    .insert({

      sender_id:
        currentUser.id,

      receiver_id:
        otherUserId,

      message_type:
        "text",

      content:
        content

    });


  button.disabled =
    false;


  if(error){

    console.error(
      "SEND ERROR:",
      error
    );


    alert(
      "Message send nahi hua:\n" +
      error.message
    );

    return;

  }


  input.value = "";

  input.style.height =
    "auto";


  await loadMessages();

}


/* =====================================================
   SEND IMAGE
===================================================== */

async function sendImage(event){

  const file =
    event.target.files[0];


  event.target.value =
    "";


  if(!file){
    return;
  }


  try{

    const extension =
      file.name
        .split(".")
        .pop() ||
      "jpg";


    const path =
      currentUser.id +
      "/" +
      Date.now() +
      "." +
      extension;


    const upload =
      await supabaseClient
        .storage
        .from("chat-media")
        .upload(
          path,
          file,
          {
            upsert:false
          }
        );


    if(upload.error){

      throw upload.error;

    }


    const publicUrl =
      supabaseClient
        .storage
        .from("chat-media")
        .getPublicUrl(path)
        .data
        .publicUrl;


    const {
      error
    } =
    await supabaseClient
      .from("private_messages")
      .insert({

        sender_id:
          currentUser.id,

        receiver_id:
          otherUserId,

        message_type:
          "image",

        content:
          "",

        media_url:
          publicUrl

      });


    if(error){

      throw error;

    }


    await loadMessages();


  }catch(error){

    console.error(
      "IMAGE ERROR:",
      error
    );


    alert(
      "Image send nahi hui:\n" +
      error.message
    );

  }

}


/* =====================================================
   REALTIME
===================================================== */

function startRealtime(){

  if(messageChannel){
    return;
  }


  messageChannel =
    supabaseClient
      .channel(
        "private-chat-" +
        currentUser.id +
        "-" +
        otherUserId
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"private_messages"
        },
        function(payload){

          const message =
            payload.new;


          const belongsToChat =
            (
              message.sender_id ===
              currentUser.id &&
              message.receiver_id ===
              otherUserId
            )
            ||
            (
              message.sender_id ===
              otherUserId &&
              message.receiver_id ===
              currentUser.id
            );


          if(belongsToChat){

            loadMessages();

          }

        }
      )
      .subscribe();

}


/* =====================================================
   TIME
===================================================== */

function formatTime(date){

  if(!date){
    return "";
  }


  return new Date(date)
    .toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

}


/* =====================================================
   SCROLL
===================================================== */

function scrollBottom(){

  setTimeout(
    function(){

      const area =
        document.getElementById(
          "chatArea"
        );


      area.scrollTop =
        area.scrollHeight;

    },
    50
  );

}


/* =====================================================
   KEYBOARD
===================================================== */

function handleKey(event){

  if(
    event.key ===
    "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    sendMessage();

  }

}


/* =====================================================
   BACK
===================================================== */

function goBack(){

  window.location.href =
    "private.html";

}


/* =====================================================
   ERROR
===================================================== */

function showError(message){

  document.getElementById(
    "messages"
  ).innerHTML = `

    <div class="empty">

      ❌ ${escapeHtml(message)}

      <br><br>

      <button
        onclick="goBack()"
        style="
          border:0;
          background:#6c5ce7;
          color:white;
          padding:10px 18px;
          border-radius:10px;
          cursor:pointer;
        ">

        ← Back to Private

      </button>

    </div>

  `;

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return escapeHtml(value);

}


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
  "beforeunload",
  function(){

    if(messageChannel){

      supabaseClient
        .removeChannel(
          messageChannel
        );

    }

  }
);


/* =====================================================
   START
===================================================== */

init();

</script>

</body>
</html>
```
