```html
<!DOCTYPE html>
<html lang="en">
<head>

<title>Private - RabtaHub</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;

  min-height:100%;
}

body{

  .card{padding:13px}

  .accept,

<body>

<div class="container">

  <div class="header">
    <div class="header-row">

      <button type="button" class="back" onclick="goBack()">‹</button>

      <div class="header-title">
        <h2>🔒 Private</h2>
        <small>Private Requests & Chats</small>
      </div>

      <button type="button" class="refresh-top" onclick="loadEverything()">↻</button>

    </div>
  </div>

  <div class="content">

    <div id="errorBox" class="error"></div>

    <div class="card">
      <div class="section-title">📩 Private Requests</div>

      <div id="requestsList">
        <div class="loading">Requests load ho rahi hain...</div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">💬 Private Chats</div>

      <div id="chatsList">
        <div class="loading">Private chats load ho rahi hain...</div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">🟢 Online Users</div>

      <div id="onlineUsers">
        <div class="loading">Online users load ho rahe hain...</div>
      </div>

      <button type="button" class="refresh" onclick="loadEverything()">
        🔄 Refresh
      </button>
    </div>

  </div>
</div>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://szmauhxiyjffjhrcruee.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      storageKey:"rabtahub-auth",
      detectSessionInUrl:false
    }
  }
);

let currentUser = null;


/* =====================================================
   ERROR
===================================================== */

function showError(message){
  const box=document.getElementById("errorBox");
  box.textContent=message;
  box.style.display="block";
}

function hideError(){
  const box=document.getElementById("errorBox");
  box.textContent="";
  box.style.display="none";
}


/* =====================================================
   BACK
===================================================== */

function goBack(){

  if(
    document.referrer &&
    document.referrer !== window.location.href
  ){
    window.history.back();
  }else{
    window.location.href="index.html";
  }

}


/* =====================================================
   SESSION
===================================================== */

async function getCurrentUser(){

  try{

    const result =
      await supabaseClient.auth.getSession();

    if(
      result &&
      result.data &&
      result.data.session &&
      result.data.session.user
    ){

      return result.data.session.user;

    }

    return null;

  }catch(error){

    console.error("Session error:",error);
    return null;

  }

}


/* =====================================================
   START
===================================================== */

async function startPage(){

  hideError();

  currentUser =
    await getCurrentUser();

  if(!currentUser){

    document.getElementById("requestsList").innerHTML=`
      <div class="empty">
        🔐 Login session nahi mili.
        <br><br>
        <button
          type="button"
          class="chat-btn"
          onclick="goLogin()">
          Login
        </button>
      </div>
    `;

    document.getElementById("chatsList").innerHTML=`
      <div class="empty">
        Login required.
      </div>
    `;

    document.getElementById("onlineUsers").innerHTML=`
      <div class="empty">
        Login required.
      </div>
    `;

    return;
  }

  await updateLastSeen();
  await loadEverything();

}


/* =====================================================
   LOGIN
===================================================== */

function goLogin(){
  window.location.href="login.html";
}


/* =====================================================
   LOAD EVERYTHING
===================================================== */

async function loadEverything(){

  if(!currentUser){
    return;
  }

  hideError();

  await updateLastSeen();
  await loadRequests();
  await loadAcceptedChats();
  await loadOnlineUsers();

}


/* =====================================================
   LAST SEEN
===================================================== */

async function updateLastSeen(){

  if(!currentUser){
    return;
  }

  const {error} =
    await supabaseClient
      .from("profiles")
      .update({
        last_seen:new Date().toISOString()
      })
      .eq("id",currentUser.id);

  if(error){
    console.log("Last seen:",error.message);
  }

}


/* =====================================================
   PROFILE
===================================================== */

async function getProfile(userId){

  const {data,error} =
    await supabaseClient
      .from("profiles")
      .select(
        "id,username,name,avatar_url,last_seen"
      )
      .eq("id",userId)
      .maybeSingle();

  if(error){
    console.log("Profile error:",error.message);
    return null;
  }

  return data;

}


/* =====================================================
   AVATAR
===================================================== */

function avatarHTML(url){

  if(url){

    return `
      <img
        class="avatar"
        src="${escapeHtml(url)}"
        onerror="
          this.style.display='none';
          this.nextElementSibling.style.display='flex';
        "
      >

      <div
        class="avatar-placeholder"
        style="display:none;">
        👤
      </div>
    `;

  }

  return `
    <div class="avatar-placeholder">
      👤
    </div>
  `;

}


/* =====================================================
   REQUESTS
===================================================== */

async function loadRequests(){

  if(!currentUser){
    return;
  }

  const box =
    document.getElementById("requestsList");

  box.innerHTML=`
    <div class="loading">
      Requests load ho rahi hain...
    </div>
  `;

  const {data,error} =
    await supabaseClient
      .from("private_requests")
      .select("*")
      .eq("receiver_id",currentUser.id)
      .eq("status","pending")
      .order("created_at",{ascending:false});

  if(error){

    box.innerHTML=`
      <div class="empty">
        📭 Requests load nahi ho saki.
      </div>
    `;

    showError(
      "Requests: "+error.message
    );

    return;
  }

  if(!data || data.length===0){

    box.innerHTML=`
      <div class="empty">
        📭 Koi pending request nahi.
      </div>
    `;

    return;
  }

  box.innerHTML="";

  for(const request of data){

    const profile =
      await getProfile(request.sender_id);

    const username =
      profile?.username || "Unknown User";

    const name =
      profile?.name || "";

    const avatar =
      profile?.avatar_url || "";

    const row =
      document.createElement("div");

    row.className="request";

    row.innerHTML=`

      ${avatarHTML(avatar)}

      <div class="user-info">

        <div class="username">
          @${escapeHtml(username)}
        </div>

        ${
          name
          ?
          `<div class="name">
            ${escapeHtml(name)}
          </div>`
          :
          ""
        }

        <div class="status">
          📩 Private request
        </div>

      </div>

      <div class="buttons">

        <button
          type="button"
          class="accept"
          onclick="acceptRequest('${request.id}')">
          ✓
        </button>

        <button
          type="button"
          class="decline"
          onclick="declineRequest('${request.id}')">
          ✕
        </button>

      </div>
    `;

    box.appendChild(row);
  }

}


/* =====================================================
   ACCEPT
===================================================== */

async function acceptRequest(requestId){

  if(!currentUser){
    return;
  }

  const {error} =
    await supabaseClient
      .from("private_requests")
      .update({
        status:"accepted"
      })
      .eq("id",requestId)
      .eq("receiver_id",currentUser.id);

  if(error){

    showError(
      "Accept nahi hui: "+error.message
    );

    return;
  }

  alert("✅ Private request accepted!");

  await loadRequests();
  await loadAcceptedChats();

}


/* =====================================================
   DECLINE
===================================================== */

async function declineRequest(requestId){

  if(!currentUser){
    return;
  }

  const {error} =
    await supabaseClient
      .from("private_requests")
      .update({
        status:"declined"
      })
      .eq("id",requestId)
      .eq("receiver_id",currentUser.id);

  if(error){

    showError(
      "Decline nahi hui: "+error.message
    );

    return;
  }

  await loadRequests();

}


/* =====================================================
   ACCEPTED CHATS
===================================================== */

async function loadAcceptedChats(){

  if(!currentUser){
    return;
  }

  const box =
    document.getElementById("chatsList");

  box.innerHTML=`
    <div class="loading">
      Private chats load ho rahi hain...
    </div>
  `;

  const {data,error} =
    await supabaseClient
      .from("private_requests")
      .select("*")
      .or(
        `sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
      )
      .eq("status","accepted")
      .order("created_at",{ascending:false});

  if(error){

    box.innerHTML=`
      <div class="empty">
        💬 Chats load nahi ho sakin.
      </div>
    `;

    return;
  }

  if(!data || data.length===0){

    box.innerHTML=`
      <div class="empty">
        💬 Abhi koi private chat nahi.
      </div>
    `;

    return;
  }

  const seen=new Set();
  const chats=[];

  for(const item of data){

    const otherId =
      item.sender_id===currentUser.id
      ? item.receiver_id
      : item.sender_id;

    if(!seen.has(otherId)){

      seen.add(otherId);

      chats.push({
        otherId:otherId
      });

    }

  }

  box.innerHTML="";

  for(const chat of chats){

    const profile =
      await getProfile(chat.otherId);

    const username =
      profile?.username || "User";

    const name =
      profile?.name || "";

    const avatar =
      profile?.avatar_url || "";

    const row =
      document.createElement("div");

    row.className="user-row";

    row.innerHTML=`

      ${avatarHTML(avatar)}

      <div class="user-info">

        <div class="username">
          @${escapeHtml(username)}
        </div>

        ${
          name
          ?
          `<div class="name">
            ${escapeHtml(name)}
          </div>`
          :
          ""
        }

        <div class="status">
          🔒 Private chat
        </div>

      </div>

      <button
        type="button"
        class="chat-btn"
        onclick="openChat('${chat.otherId}')">
        Chat
      </button>
    `;

    box.appendChild(row);
  }

}


/* =====================================================
   OPEN CHAT
===================================================== */

function openChat(userId){

  if(!userId){
    return;
  }

  window.location.href =
    "private-chat.html?user="+
    encodeURIComponent(userId);

}


/* =====================================================
   ONLINE USERS
===================================================== */

async function loadOnlineUsers(){

  if(!currentUser){
    return;
  }

  const box =
    document.getElementById("onlineUsers");

  box.innerHTML=`
    <div class="loading">
      Online users load ho rahe hain...
    </div>
  `;

  const fiveMinutesAgo =
    new Date(
      Date.now()-5*60*1000
    ).toISOString();

  const {data,error} =
    await supabaseClient
      .from("profiles")
      .select(
        "id,username,name,avatar_url,last_seen"
      )
      .neq("id",currentUser.id)
      .gte("last_seen",fiveMinutesAgo)
      .order("last_seen",{ascending:false});

  if(error){

    box.innerHTML=`
      <div class="empty">
        💤 Online users load nahi ho sake.
      </div>
    `;

    return;
  }

  if(!data || data.length===0){

    box.innerHTML=`
      <div class="empty">
        💤 Abhi koi aur online nahi.
      </div>
    `;

    return;
  }

  box.innerHTML="";

  for(const user of data){

    const row =
      document.createElement("div");

    row.className="user-row";

    row.innerHTML=`

      ${avatarHTML(user.avatar_url || "")}

      <div class="user-info">

        <div class="username">
          @${escapeHtml(user.username || "User")}
        </div>

        ${
          user.name
          ?
          `<div class="name">
            ${escapeHtml(user.name)}
          </div>`
          :
          ""
        }

        <div class="status">
          <span class="online-dot"></span>
          Online
        </div>

      </div>

      <button
        type="button"
        class="private-btn"
        onclick="sendRequest('${user.id}')">
        Private
      </button>
    `;

    box.appendChild(row);

  }

}


/* =====================================================
   SEND REQUEST
===================================================== */

async function sendRequest(receiverId){

  if(!currentUser){

    showError(
      "Login session nahi mili."
    );

    return;
  }

  if(
    !receiverId ||
    receiverId===currentUser.id
  ){
    return;
  }

  const {data:existing,error:checkError} =
    await supabaseClient
      .from("private_requests")
      .select(
        "id,status,sender_id,receiver_id,created_at"
      )
      .or(
        `and(sender_id.eq.${currentUser.id},receiver_id.eq.${receiverId}),and(sender_id.eq.${receiverId},receiver_id.eq.${currentUser.id})`
      )
      .order("created_at",{ascending:false})
      .limit(1);

  if(checkError){

    showError(
      "Request check error: "+
      checkError.message
    );

    return;
  }

  if(existing && existing.length>0){

    const request=existing[0];

    if(request.status==="accepted"){
      openChat(receiverId);
      return;
    }

    if(request.status==="pending"){

      if(request.sender_id===currentUser.id){

        alert(
          "📩 Request pehle hi bheji ja chuki hai."
        );

      }else{

        alert(
          "📩 Is user ki request tumhare paas pending hai."
        );

      }

      return;
    }

    if(
      request.status==="declined" &&
      request.sender_id===currentUser.id
    ){

      const {error} =
        await supabaseClient
          .from("private_requests")
          .update({
            status:"pending",
            created_at:new Date().toISOString()
          })
          .eq("id",request.id)
          .eq("sender_id",currentUser.id);

      if(error){

        showError(
          "Request dobara nahi bheji ja saki: "+
          error.message
        );

        return;
      }

      alert(
        "📩 Private request dobara bhej di gayi."
      );

      return;
    }

  }

  const {error} =
    await supabaseClient
      .from("private_requests")
      .insert({
        sender_id:currentUser.id,
        receiver_id:receiverId,
        status:"pending"
      });

  if(error){

    showError(
      "Request send nahi hui: "+
      error.message
    );

    return;
  }

  alert(
    "📩 Private request send ho gayi!"
  );

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value){

  if(value===null || value===undefined){
    return "";
  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================================
   AUTO REFRESH
===================================================== */

setInterval(
  async function(){

    if(!currentUser){
      return;
    }

    await loadEverything();

  },
  30000
);


/* =====================================================
   START
===================================================== */

startPage();

</script>

</body>
</html>
```
