<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Private - ChatZone 💬</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;overflow-x:hidden}
body{font-family:Arial,sans-serif;background:#f4f3fb;color:#222}

.header{
 background:linear-gradient(135deg,#6c5ce7,#8e44ad);
 color:white;padding:15px 12px;position:sticky;top:0;z-index:20;
 box-shadow:0 2px 8px rgba(0,0,0,.15)
}
.header-inner{max-width:680px;margin:auto}
.title{font-size:22px;font-weight:bold}
.subtitle{font-size:13px;opacity:.9;margin-top:3px}
.online-box{
 margin-top:12px;background:rgba(255,255,255,.14);
 border-radius:12px;padding:9px 10px;font-size:13px
}

.container{width:100%;max-width:680px;margin:auto;padding:12px 10px 90px}
.section-title{font-size:18px;font-weight:bold;margin:8px 2px 12px}

.loading,.empty,.error{
 background:white;border-radius:14px;padding:22px 15px;
 text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06);color:#777
}

.chat-card{
 background:white;border-radius:15px;padding:12px;margin-bottom:10px;
 display:flex;align-items:center;gap:11px;cursor:pointer;
 box-shadow:0 2px 8px rgba(0,0,0,.06);transition:.15s
}
.chat-card:active{transform:scale(.98)}

.avatar-wrap{position:relative;width:52px;height:52px;min-width:52px}
.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#eee}
.online-dot{
 position:absolute;right:0;bottom:1px;width:13px;height:13px;
 border-radius:50%;background:#bbb;border:2px solid white
}
.online-dot.online{background:#22c55e}

.chat-info{flex:1;min-width:0}
.name{font-size:16px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.username{color:#6c5ce7;font-size:13px;margin-top:2px}
.last-message{color:#777;font-size:13px;margin-top:5px}
.arrow{color:#999;font-size:22px}

.bottom-nav{
 position:fixed;left:0;right:0;bottom:0;height:64px;background:white;
 border-top:1px solid #ddd;display:flex;justify-content:center;
 z-index:30;box-shadow:0 -2px 8px rgba(0,0,0,.08)
}
.nav-inner{width:100%;max-width:680px;display:flex;justify-content:space-around;align-items:center}
.nav-btn{
 border:0;background:none;color:#777;font-size:12px;cursor:pointer;padding:7px 12px
}
.nav-btn span{display:block;font-size:21px;margin-bottom:2px}
.nav-btn.active{color:#6c5ce7;font-weight:bold}

.refresh-btn{
 border:0;background:#6c5ce7;color:white;border-radius:10px;
 padding:8px 13px;cursor:pointer;float:right;margin-top:-35px
}
.clear{clear:both}
</style>
</head>

<body>

<header class="header">
<div class="header-inner">

<div class="title">💬 Private Chat</div>

<div class="subtitle">
Your accepted private chats
</div>

<div class="online-box">
🟢 Online users:
<b id="onlineCount">0</b>
</div>

</div>
</header>


<main class="container">

<div class="section-title">

Private Chats

<button class="refresh-btn" onclick="loadChats()">
🔄
</button>

<div class="clear"></div>
</div>

<div id="chatList">
<div class="loading">
🔄 Chats load ho rahi hain...
</div>
</div>

</main>


<nav class="bottom-nav">

<div class="nav-inner">

<button class="nav-btn" onclick="go('index.html')">
<span>🏠</span>
Home
</button>

<button class="nav-btn active">
<span>💬</span>
Private
</button>

<button class="nav-btn" onclick="go('mehfil.html')">
<span>👥</span>
Mehfil
</button>

<button class="nav-btn" onclick="go('profile.html')">
<span>👤</span>
Profile
</button>

<button class="nav-btn" onclick="go('notifications.html')">
<span>🔔</span>
Alerts
</button>

</div>
</nav>


<script>

const SUPABASE_URL =
"https://jhcpqjmxiovvqbghpxbf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";

const supabaseClient =
supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY,
 {
  auth:{
   persistSession:true,
   autoRefreshToken:true,
   detectSessionInUrl:false
  }
 }
);

let currentUser=null;
let onlineUsers=new Set();


function defaultAvatar(){

return "data:image/svg+xml;charset=UTF-8,"+
encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
<rect width="100" height="100" rx="50" fill="#e9e7ff"/>
<circle cx="50" cy="38" r="18" fill="#6c5ce7"/>
<path d="M20 85c4-20 17-30 30-30s26 10 30 30" fill="#6c5ce7"/>
</svg>
`);

}


async function getCurrentUser(){

const {data,error} =
await supabaseClient.auth.getSession();

if(error){
console.error("SESSION ERROR:",error);
return null;
}

return data?.session?.user || null;

}


async function loadChats(){

const list=document.getElementById("chatList");

list.innerHTML=`
<div class="loading">
🔄 Chats load ho rahi hain...
</div>
`;

currentUser=await getCurrentUser();

if(!currentUser){

list.innerHTML=`
<div class="error">
❌ Login session nahi mili.
<br><br>
<button onclick="go('login.html')"
style="border:0;background:#6c5ce7;color:white;padding:10px 18px;border-radius:10px">
Login
</button>
</div>
`;

return;
}


const {data:requests,error:requestError} =
await supabaseClient
.from("private_requests")
.select("sender_id,receiver_id,created_at,status")
.eq("status","accepted")
.or(
`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
)
.order("created_at",{ascending:false});


if(requestError){

console.error(requestError);

list.innerHTML=`
<div class="error">
❌ Private chats load nahi hui.
<br><br>
${escapeHtml(requestError.message)}
</div>
`;

return;
}


if(!requests || requests.length===0){

list.innerHTML=`
<div class="empty">
💬 Abhi koi accepted private chat nahi.
<br><br>
Pehle kisi user ki private request accept karein.
</div>
`;

return;
}


const otherIds=[];

requests.forEach(request=>{

const otherId =
request.sender_id===currentUser.id
? request.receiver_id
: request.sender_id;

if(
otherId &&
otherId!==currentUser.id &&
!otherIds.includes(otherId)
){
otherIds.push(otherId);
}

});


if(otherIds.length===0){

list.innerHTML=`
<div class="empty">
💬 No chat users found.
</div>
`;

return;
}


const {data:profiles,error:profileError} =
await supabaseClient
.from("profiles")
.select("id,username,name,avatar_url,last_seen")
.in("id",otherIds);


if(profileError){
console.error("PROFILE ERROR:",profileError);
}


const profileMap={};

(profiles||[]).forEach(profile=>{
profileMap[profile.id]=profile;
});


const cards=[];


for(const userId of otherIds){

const profile=profileMap[userId]||{};

const username=profile.username||"user";
const name=profile.name||username;
const avatar=profile.avatar_url||defaultAvatar();

const isOnline =
onlineUsers.has(userId) ||
isRecentlyOnline(profile.last_seen);


cards.push(`

<div
class="chat-card"
data-user-id="${escapeAttr(userId)}"
onclick="openChat(this.getAttribute('data-user-id'))"
>

<div class="avatar-wrap">

<img
class="avatar"
src="${escapeAttr(avatar)}"
onerror="this.src='${defaultAvatar()}'"
>

<span class="online-dot ${isOnline?"online":""}">
</span>

</div>

<div class="chat-info">

<div class="name">
${escapeHtml(name)}
</div>

<div class="username">
@${escapeHtml(username)}
</div>

<div class="last-message">
Tap to open private chat
</div>

</div>

<div class="arrow">›</div>

</div>

`);

}


list.innerHTML=cards.join("");

}


function openChat(userId){

if(!userId){
alert("User ID nahi mili.");
return;
}

userId=String(userId).trim();

if(
!userId ||
userId==="undefined" ||
userId==="null"
){
alert("Invalid User ID.");
return;
}


/* IMPORTANT:
   ID localStorage mein save */
localStorage.setItem(
"privateChatUserId",
userId
);


/* GitHub Pages compatible URL */
const chatUrl =
new URL(
"private-chat.html",
window.location.href
);

chatUrl.searchParams.set(
"user",
userId
);

console.log(
"OPENING CHAT:",
chatUrl.href
);

window.location.assign(
chatUrl.href
);

}


function isRecentlyOnline(lastSeen){

if(!lastSeen)return false;

const time=new Date(lastSeen).getTime();

if(Number.isNaN(time))return false;

return Date.now()-time<=
5*60*1000;

}


function startPresence(){

const channel=
supabaseClient
.channel("global-chat-zone-online");

channel.on(
"presence",
{event:"sync"},
()=>{

const state=channel.presenceState();

onlineUsers=new Set();

Object.values(state).forEach(entries=>{
entries.forEach(entry=>{
if(entry.user_id){
onlineUsers.add(entry.user_id);
}
});
});


document.getElementById("onlineCount")
.textContent=onlineUsers.size;

loadChats();

}
);

channel.subscribe(async status=>{

if(status==="SUBSCRIBED"){

await channel.track({
user_id:currentUser?.id||null
});

}

});

}


function go(page){

window.location.assign(page);

}


function escapeHtml(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function escapeAttr(value){

return escapeHtml(value);

}


(async function(){

currentUser=await getCurrentUser();

if(currentUser){
startPresence();
}

await loadChats();

})();

</script>

</body>
</html>
