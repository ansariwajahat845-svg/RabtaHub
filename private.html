<!DOCTYPE html>
<html lang="en">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatZone - Private Chats</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Segoe UI,system-ui}
body{background:#0a0a12;color:#fff;display:flex;height:100vh;overflow:hidden}
.sidebar{width:360px;background:linear-gradient(180deg,#12101f 0%,#0f0d1a 100%);border-right:1px solid #2a235a;display:flex;flex-direction:column}
.top{padding:16px 18px;border-bottom:1px solid #2a235a;display:flex;align-items:center;justify-content:space-between}
.top h2{font-size:18px;letter-spacing:.5px;color:#a78bfa}
.top button{background:#1e1b34;border:1px solid #3a2e7a;color:#a78bfa;padding:6px 12px;border-radius:20px;cursor:pointer}
.chat-list{flex:1;overflow-y:auto}
.chat-item{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid #1e1b34;cursor:pointer;transition:.15s}
.chat-item:hover{background:#1c1840}
.chat-item.active{background:#251f5a;border-left:3px solid #8b5cf6}
.dp{width:48px;height:48px;border-radius:50%;background:#333;object-fit:cover;flex-shrink:0}
.info{flex:1;min-width:0}
.info .name{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.info .last{font-size:12px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.online-dot{width:8px;height:8px;background:#0f0;border-radius:50%;display:inline-block}
.main{flex:1;display:flex;flex-direction:column;background:#0c0b14}
.header{height:62px;border-bottom:1px solid #2a235a;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:linear-gradient(90deg,#15122a,#12101f)}
.header-left{display:flex;align-items:center;gap:12px}
.header-left img{width:40px;height:40px;border-radius:50%;border:2px solid #8b5cf6}
.header-actions{display:flex;gap:8px}
.header-actions button{background:#1e1b34;border:1px solid #3a2e7a;color:#c4b5fd;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.header-actions button:hover{background:#2a2560}
.messages{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;background: radial-gradient(1200px 600px at 50% -20%, #1e1b4b, transparent), #0c0b14}
.msg{max-width:68%;padding:10px 13px;border-radius:18px;font-size:14px;line-height:1.4;position:relative}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;border-bottom-right-radius:6px;box-shadow:0 4px 15px rgba(139,92,246,.3)}
.msg.other{align-self:flex-start;background:#1c1840;border:1px solid #2a235a;border-bottom-left-radius:6px}
.msg .time{font-size:10px;color:#aaa;margin-top:4px;opacity:.7}
.input-bar{display:flex;align-items:center;gap:8px;padding:12px;background:#12101f;border-top:1px solid #2a235a}
.input-bar input[type=text]{flex:1;background:#1a1730;border:1px solid #3a2e7a;color:#fff;padding:12px 14px;border-radius:24px;outline:none}
.input-bar input[type=text]:focus{border-color:#8b5cf6;box-shadow:0 0 0 2px rgba(139,92,246,.2)}
.icon-btn{width:40px;height:40px;border-radius:50%;background:#1e1b34;border:1px solid #3a2e7a;color:#c4b5fd;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px}
.icon-btn:hover{background:#2a2560}
.send{background:linear-gradient(135deg,#8b5cf6,#6d28d9);border-color:#8b5cf6;color:#fff}
.empty{display:flex;flex:1;align-items:center;justify-content:center;color:#6b5ba3;flex-direction:column;gap:10px}
@media(max-width:800px){.sidebar{width:100%;position:absolute;z-index:5;height:100%;transform:translateX(0)}.sidebar.hide{transform:translateX(-100%)}.main{width:100%}}
</style>
</head>
<body>
<div class="sidebar" id="sidebar">
  <div class="top">
    <h2>Private Chats</h2>
    <button onclick="location.href='private.html'">Refresh 🔄</button>
  </div>
  <div class="chat-list" id="chatList">
    <!-- Old chats list yahan load hogi -->
  </div>
</div>

<div class="main">
  <div class="header" id="chatHeader" style="display:none">
    <div class="header-left">
      <span class="icon-btn" onclick="document.getElementById('sidebar').classList.remove('hide')" style="display:none" id="backBtn">←</span>
      <img id="hDp" src="">
      <div>
        <div id="hName" style="font-weight:600">Select Chat</div>
        <div style="font-size:11px;color:#0f0" id="hStatus">Online</div>
      </div>
    </div>
    <div class="header-actions">
      <button onclick="leaveChat()">🚪 Leave</button>
      <button onclick="clearForMe()">🗑️ Clear (For Me)</button>
    </div>
  </div>
  
  <div class="messages" id="messages">
    <div class="empty" id="emptyState">
      <div style="font-size:48px">💬</div>
      <div>Apni purani chats list se kisi ko select karo</div>
      <div style="font-size:12px;color:#666">Old messages Supabase se auto load honge</div>
    </div>
  </div>

  <div class="input-bar" id="inputBar" style="display:none">
    <div class="icon-btn" onclick="document.getElementById('imgInput').click()">🖼️</div>
    <div class="icon-btn" id="emojiBtn">😊</div>
    <div class="icon-btn" id="voiceBtn">🎤</div>
    <input type="file" id="imgInput" accept="image/*" hidden>
    <input type="text" id="msgInput" placeholder="Message likho...">
    <div class="icon-btn send" onclick="sendMessage()">➤</div>
  </div>
</div>

<script>
// ========== CONFIG - APNI KEYS YAHAN DALO ==========
const SUPABASE_URL = "https://jhcpqjmxiovvqbghpxbf.supabase.co";
const SUPABASE_KEY = "sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Table names - agar alag hai to change kar dena
const TABLE_MESSAGES = "private_messages"; // ya "messages"
const TABLE_USERS = "users"; // ya "profiles"

// Current user - localStorage se lega
const currentUser = JSON.parse(localStorage.getItem("chatzone_user") || localStorage.getItem("user") || "null");
const currentUserId = currentUser?.id || currentUser?.user_id || localStorage.getItem("user_id");

let activeChatUserId = null;
let clearedIds = JSON.parse(localStorage.getItem("cleared_for_me") || "[]");

const chatListEl = document.getElementById("chatList");
const messagesEl = document.getElementById("messages");
const msgInput = document.getElementById("msgInput");

async function loadOldChatsList(){
  if(!currentUserId){ chatListEl.innerHTML = "<div style='padding:20px;color:#888'>Login pehle karo - user_id nahi mila</div>"; return; }
  
  chatListEl.innerHTML = "<div style='padding:20px;color:#666'>Purani chats load ho rahi...</div>";
  
  // 1. Saare private messages nikalo jahan tum sender ya receiver ho
  let { data: msgs, error } = await supabase.from(TABLE_MESSAGES)
    .select("*")
    .or(`sender_id.eq.${currentUserId},receiver_id.eq.${currentUserId}`)
    .order("created_at", {ascending:false})
    .limit(200);

  if(error){
    // fallback table name try
    let res2 = await supabase.from("messages").select("*").or(`sender_id.eq.${currentUserId},receiver_id.eq.${currentUserId}`).order("created_at",{ascending:false}).limit(200);
    msgs = res2.data; error = res2.error;
  }

  if(error || !msgs || msgs.length===0){
    chatListEl.innerHTML = "<div style='padding:20px;color:#888'>Koi purani private chat nahi mili</div>";
    return;
  }

  // 2. Unique users nikalo
  const userMap = new Map();
  msgs.forEach(m=>{
    let otherId = m.sender_id == currentUserId ? m.receiver_id : m.sender_id;
    if(!userMap.has(otherId)) userMap.set(otherId, m);
  });

  const otherIds = [...userMap.keys()];
  
  // 3. Users/profiles table se username + DP lo
  let usersData = [];
  let u1 = await supabase.from(TABLE_USERS).select("*").in("id", otherIds);
  if(u1.data && u1.data.length>0) usersData = u1.data;
  else {
    let u2 = await supabase.from("profiles").select("*").in("id", otherIds);
    if(u2.data) usersData = u2.data;
  }

  // Render list
  chatListEl.innerHTML = "";
  otherIds.forEach(uid=>{
    const lastMsg = userMap.get(uid);
    const uInfo = usersData.find(u=>u.id==uid) || {};
    const name = uInfo.username || uInfo.name || uInfo.full_name || "User "+uid.slice(0,4);
    const dp = uInfo.avatar_url || uInfo.dp || uInfo.profile_pic || `https://i.pravatar.cc/150?u=${uid}`;
    const div = document.createElement("div");
    div.className = "chat-item";
    div.onclick = ()=>openChat(uid, name, dp);
    div.innerHTML = `
      <img class="dp" src="${dp}" onerror="this.src='https://i.pravatar.cc/150?u=${uid}'">
      <div class="info">
        <div class="name">${name} <span class="online-dot"></span></div>
        <div class="last">${lastMsg.message || lastMsg.content || "📷 Image"}</div>
      </div>
    `;
    chatListEl.appendChild(div);
  });
}

async function openChat(otherId, name, dp){
  activeChatUserId = otherId;
  document.getElementById("chatHeader").style.display="flex";
  document.getElementById("inputBar").style.display="flex";
  document.getElementById("emptyState").style.display="none";
  document.getElementById("hName").innerText = name;
  document.getElementById("hDp").src = dp;
  if(window.innerWidth<=800) document.getElementById("sidebar").classList.add("hide");
  
  document.querySelectorAll(".chat-item").forEach(el=>{
    el.classList.remove("active");
    if(el.innerText.includes(name)) el.classList.add("active");
  });

  // Old messages load karo
  messagesEl.innerHTML = "<div style='color:#666;text-align:center;margin-top:20px'>Old messages load ho rahe...</div>";
  let { data, error } = await supabase.from(TABLE_MESSAGES)
    .select("*")
    .or(`and(sender_id.eq.${currentUserId},receiver_id.eq.${otherId}),and(sender_id.eq.${otherId},receiver_id.eq.${currentUserId})`)
    .order("created_at",{ascending:true});

  if(error){
    let r = await supabase.from("messages").select("*").or(`and(sender_id.eq.${currentUserId},receiver_id.eq.${otherId}),and(sender_id.eq.${otherId},receiver_id.eq.${currentUserId})`).order("created_at",{ascending:true});
    data = r.data;
  }

  messagesEl.innerHTML = "";
  if(!data || data.length===0){
    messagesEl.innerHTML = "<div style='color:#666;text-align:center;margin-top:20px'>Koi purani chat nahi, pehla message bhejo</div>";
    return;
  }

  data.forEach(m=>{
    if(clearedIds.includes(m.id)) return; // clear for me wala hide
    const isMe = m.sender_id == currentUserId;
    const div = document.createElement("div");
    div.className = "msg "+(isMe?"me":"other");
    div.innerHTML = `${m.message || m.content || ""}<div class="time">${new Date(m.created_at).toLocaleTimeString()}</div>`;
    messagesEl.appendChild(div);
  });
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function sendMessage(){
  const text = msgInput.value.trim();
  if(!text || !activeChatUserId) return;
  const payload = { sender_id: currentUserId, receiver_id: activeChatUserId, message: text, content: text, created_at: new Date().toISOString() };
  let { error } = await supabase.from(TABLE_MESSAGES).insert(payload);
  if(error) await supabase.from("messages").insert(payload);
  
  const div = document.createElement("div");
  div.className = "msg me";
  div.innerHTML = `${text}<div class="time">now</div>`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  msgInput.value="";
}

function leaveChat(){
  location.href = "private.html";
}

function clearForMe(){
  if(!confirm("Ye chat sirf tumhare liye clear hogi, dusre user ko dikhti rahegi. Clear karun?")) return;
  const allMsgs = document.querySelectorAll(".msg");
  allMsgs.forEach(el=>{
    // local me hide, Supabase se delete nahi
    el.style.display="none";
  });
  // ID save kar lo taki dubara load na ho
  // simple version - sab hide
  messagesEl.innerHTML = "<div style='color:#666;text-align:center;margin-top:20px'>Cleared for you</div>";
}

msgInput.addEventListener("keydown", e=>{ if(e.key==="Enter") sendMessage(); });

// Auto load on start
loadOldChatsList();

// Emoji simple
document.getElementById("emojiBtn").onclick = ()=>{ msgInput.value += "😊"; msgInput.focus(); };

// Voice placeholder
document.getElementById("voiceBtn").onclick = ()=>alert("Voice feature - tumhare purane code se connect kar dena");

// Image upload placeholder
document.getElementById("imgInput").onchange = async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  alert("Image: "+file.name+" - yahan tumhara Supabase Storage upload code lag jayega");
};
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
