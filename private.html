<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Private Chat - ChatZone 💬</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#f4f6fb;
}

body{
  display:flex;
  flex-direction:column;
}

.header{
  flex-shrink:0;
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  color:white;
  padding:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
  z-index:10;
}

.header-row{
  display:flex;
  align-items:center;
  gap:10px;
  max-width:700px;
  margin:auto;
}

.back-btn{
  border:0;
  background:rgba(255,255,255,.16);
  color:white;
  border-radius:10px;
  padding:8px 12px;
  font-size:20px;
  cursor:pointer;
}

.header-user{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
  flex:1;
}

.header-avatar{
  width:42px;
  height:42px;
  min-width:42px;
  border-radius:50%;
  object-fit:cover;
  background:#eee;
  border:2px solid rgba(255,255,255,.7);
}

.header-info{
  min-width:0;
}

.header-name{
  font-weight:bold;
  font-size:16px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.header-status{
  font-size:12px;
  opacity:.9;
  margin-top:2px;
}

.chat-area{
  flex:1;
  overflow-y:auto;
  padding:14px 10px 95px;
}

.chat-inner{
  max-width:700px;
  margin:auto;
}

.loading,
.empty{
  background:white;
  border-radius:14px;
  padding:25px 15px;
  text-align:center;
  color:#777;
  margin-top:20px;
}

.message-row{
  display:flex;
  margin:7px 0;
  width:100%;
}

.message-row.mine{
  justify-content:flex-end;
}

.message-row.theirs{
  justify-content:flex-start;
}

.message-bubble{
  max-width:78%;
  padding:9px 12px;
  border-radius:16px;
  box-shadow:0 1px 4px rgba(0,0,0,.08);
  word-wrap:break-word;
  overflow-wrap:anywhere;
}

.mine .message-bubble{
  background:#6c5ce7;
  color:white;
  border-bottom-right-radius:5px;
}

.theirs .message-bubble{
  background:white;
  color:#222;
  border-bottom-left-radius:5px;
}

.message-text{
  white-space:pre-wrap;
  font-size:15px;
  line-height:1.4;
}

.message-time{
  font-size:10px;
  margin-top:4px;
  opacity:.65;
  text-align:right;
}

.voice-btn{
  border:0;
  background:rgba(255,255,255,.15);
  color:inherit;
  border-radius:10px;
  padding:8px 12px;
  cursor:pointer;
}

.theirs .voice-btn{
  background:#eee;
  color:#333;
}

.image-message{
  max-width:240px;
  max-height:300px;
  border-radius:12px;
  display:block;
  object-fit:cover;
}

.composer{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:white;
  border-top:1px solid #ddd;
  padding:9px;
  z-index:20;
}

.composer-inner{
  max-width:700px;
  margin:auto;
  display:flex;
  align-items:flex-end;
  gap:6px;
}

.input{
  flex:1;
  min-width:0;
  border:1px solid #ddd;
  border-radius:22px;
  padding:11px 14px;
  outline:none;
  font-size:15px;
  resize:none;
  max-height:110px;
  font-family:Arial,sans-serif;
}

.input:focus{
  border-color:#6c5ce7;
}

.action-btn{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#f0efff;
  color:#6c5ce7;
  font-size:19px;
  cursor:pointer;
  flex-shrink:0;
}

.send-btn{
  background:#6c5ce7;
  color:white;
}

.action-btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.recording{
  background:#e74c3c!important;
  color:white!important;
}

#fileInput{
  display:none;
}

.typing{
  font-size:12px;
  color:#777;
  padding:2px 8px 5px;
  min-height:18px;
}

@media(max-width:500px){
  .message-bubble{
    max-width:85%;
  }

  .image-message{
    max-width:210px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-row">

    <button class="back-btn" onclick="goBack()">←</button>

    <div class="header-user">

      <img
        id="headerAvatar"
        class="header-avatar"
        src=""
        alt=""
      >

      <div class="header-info">

        <div
          id="headerName"
          class="header-name">
          Loading...
        </div>

        <div
          id="headerStatus"
          class="header-status">
          Private Chat
        </div>

      </div>

    </div>

  </div>
</header>


<main
  id="chatArea"
  class="chat-area">

  <div class="chat-inner">

    <div
      id="messages"
      class="loading">

      🔄 Chat load ho rahi hai...

    </div>

    <div
      id="typing"
      class="typing">
    </div>

  </div>

</main>


<div class="composer">

  <div class="composer-inner">

    <input
      type="file"
      id="fileInput"
      accept="image/*"
      onchange="sendImage(event)"
    >

    <button
      class="action-btn"
      onclick="document.getElementById('fileInput').click()"
      title="Image">
      📷
    </button>

    <button
      id="voiceBtn"
      class="action-btn"
      onclick="toggleVoice()"
      title="Voice">
      🎤
    </button>

    <textarea
      id="messageInput"
      class="input"
      rows="1"
      placeholder="Message likhein..."
      onkeydown="handleKey(event)"
    ></textarea>

    <button
      id="sendBtn"
      class="action-btn send-btn"
      onclick="sendMessage()">
      ➤
    </button>

  </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://jhcpqjmxiovvqbghpxbf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:false
    }
  }
);


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;
let otherUserId = null;
let otherProfile = null;
let messagesChannel = null;
let onlineChannel = null;

let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;


/* =====================================================
   GET USER ID FROM URL
===================================================== */

function getOtherUserId(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("user");

}


/* =====================================================
   DEFAULT AVATAR
===================================================== */

function getDefaultAvatar(){

  return "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="100"
        height="100"
        viewBox="0 0 100 100">

        <rect
          width="100"
          height="100"
          rx="50"
          fill="#e8e6ff"/>

        <circle
          cx="50"
          cy="38"
          r="18"
          fill="#6c5ce7"/>

        <path
          d="M20 85c4-20 17-30 30-30s26 10 30 30"
          fill="#6c5ce7"/>

      </svg>

    `);

}


/* =====================================================
   SESSION
===================================================== */

async function getSession(){

  try{

    const result =
      await supabaseClient
        .auth
        .getSession();

    return result?.data?.session || null;

  }catch(error){

    console.error(
      "SESSION ERROR:",
      error
    );

    return null;

  }

}


/* =====================================================
   INIT
===================================================== */

async function init(){

  otherUserId =
    getOtherUserId();

  if(!otherUserId){

    showError(
      "Chat user nahi mila."
    );

    return;

  }


  const session =
    await getSession();

  if(!session){

    showError(
      "Session available nahi hai. Pehle login karein."
    );

    return;

  }


  currentUser =
    session.user;


  if(
    otherUserId ===
    currentUser.id
  ){

    showError(
      "Apne saath private chat open nahi ki ja sakti."
    );

    return;

  }


  await loadProfile();

  await verifyAccepted();

  await loadMessages();

  startRealtime();

  startPresence();

}


/* =====================================================
   LOAD OTHER PROFILE
===================================================== */

async function loadProfile(){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("profiles")
    .select(
      "id,username,name,avatar_url"
    )
    .eq(
      "id",
      otherUserId
    )
    .maybeSingle();


  if(error){

    console.error(
      "PROFILE ERROR:",
      error
    );

  }


  otherProfile =
    data || {};


  const name =
    otherProfile.username ||
    otherProfile.name ||
    "User";


  document.getElementById(
    "headerName"
  ).textContent =
    "@" + name;


  document.getElementById(
    "headerAvatar"
  ).src =
    otherProfile.avatar_url ||
    getDefaultAvatar();


  document.getElementById(
    "headerAvatar"
  ).onerror =
    function(){

      this.src =
        getDefaultAvatar();

    };

}


/* =====================================================
   VERIFY ACCEPTED REQUEST
===================================================== */

async function verifyAccepted(){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("private_requests")
    .select(
      "id,status"
    )
    .eq(
      "status",
      "accepted"
    )
    .or(
      `and(sender_id.eq.${currentUser.id},receiver_id.eq.${otherUserId}),and(sender_id.eq.${otherUserId},receiver_id.eq.${currentUser.id})`
    )
    .limit(1);


  if(error){

    console.error(
      "REQUEST CHECK ERROR:",
      error
    );

    /*
      Agar RLS request check ko
      block kare to chat ko
      unnecessarily stop nahi karenge.
    */

    return true;

  }


  if(
    !data ||
    data.length === 0
  ){

    showError(
      "Ye private request abhi accepted nahi hai."
    );

    return false;

  }


  return true;

}


/* =====================================================
   LOAD MESSAGES
===================================================== */

async function loadMessages(){

  const box =
    document.getElementById(
      "messages"
    );


  box.innerHTML = `

    <div class="loading">
      🔄 Messages load ho rahe hain...
    </div>

  `;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("private_messages")
    .select(
      "id,sender_id,receiver_id,message_type,content,media_url,created_at"
    )
    .or(
      `and(sender_id.eq.${currentUser.id},receiver_id.eq.${otherUserId}),and(sender_id.eq.${otherUserId},receiver_id.eq.${currentUser.id})`
    )
    .order(
      "created_at",
      {
        ascending:true
      }
    );


  if(error){

    console.error(
      "MESSAGE LOAD ERROR:",
      error
    );


    box.innerHTML = `

      <div class="empty">

        ❌ Messages load nahi ho sake.

        <br><br>

        ${escapeHtml(error.message)}

      </div>

    `;

    return;

  }


  if(
    !data ||
    data.length === 0
  ){

    box.innerHTML = `

      <div class="empty">

        💬 Abhi koi message nahi.

        <br><br>

        Pehla message bhejein.

      </div>

    `;

    return;

  }


  box.innerHTML =
    data
      .map(
        message =>
          renderMessage(message)
      )
      .join("");


  scrollToBottom();

}


/* =====================================================
   RENDER MESSAGE
===================================================== */

function renderMessage(message){

  const mine =
    message.sender_id ===
    currentUser.id;


  const type =
    message.message_type ||
    "text";


  let content = "";


  if(type === "image"){

    if(message.media_url){

      content = `

        <img
          class="image-message"
          src="${escapeAttr(message.media_url)}"
          alt="Image"
          onclick="window.open('${escapeAttr(message.media_url)}','_blank')"
        >

      `;

    }else{

      content =
        "📷 Image";

    }

  }

  else if(type === "voice"){

    if(message.media_url){

      content = `

        <audio
          controls
          style="max-width:220px;width:100%;">

          <source
            src="${escapeAttr(message.media_url)}">

        </audio>

      `;

    }else{

      content =
        "🎤 Voice message";

    }

  }

  else{

    content = `

      <div class="message-text">

        ${escapeHtml(
          message.content || ""
        )}

      </div>

    `;

  }


  return `

    <div
      class="message-row ${mine ? "mine" : "theirs"}">

      <div class="message-bubble">

        ${content}

        <div class="message-time">

          ${escapeHtml(
            formatTime(message.created_at)
          )}

        </div>

      </div>

    </div>

  `;

}


/* =====================================================
   SEND TEXT MESSAGE
===================================================== */

async function sendMessage(){

  if(!currentUser || !otherUserId){
    return;
  }


  const input =
    document.getElementById(
      "messageInput"
    );


  const content =
    input.value.trim();


  if(!content){
    return;
  }


  const sendBtn =
    document.getElementById(
      "sendBtn"
    );


  sendBtn.disabled = true;


  const {
    error
  } =
  await supabaseClient
    .from("private_messages")
    .insert({

      sender_id:
        currentUser.id,

      receiver_id:
        otherUserId,

      message_type:
        "text",

      content:
        content

    });


  sendBtn.disabled = false;


  if(error){

    console.error(
      "SEND MESSAGE ERROR:",
      error
    );

    alert(
      "Message send nahi hua:\n" +
      error.message
    );

    return;

  }


  input.value = "";

  autoResize();

  await loadMessages();

}


/* =====================================================
   SEND IMAGE
===================================================== */

async function sendImage(event){

  const file =
    event.target.files[0];


  event.target.value = "";


  if(!file){
    return;
  }


  if(
    !file.type.startsWith("image/")
  ){

    alert(
      "Sirf image select karein."
    );

    return;

  }


  if(
    file.size >
    8 * 1024 * 1024
  ){

    alert(
      "Image 8MB se choti honi chahiye."
    );

    return;

  }


  try{

    const extension =
      file.name
        .split(".")
        .pop() ||
      "jpg";


    const path =
      currentUser.id +
      "/" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .slice(2) +
      "." +
      extension;


    /*
      Storage bucket ka naam:
      chat-media

      Agar tumhare Supabase mein
      bucket nahi hai to neeche
      error show hoga.
    */

    const upload =
      await supabaseClient
        .storage
        .from("chat-media")
        .upload(
          path,
          file,
          {
            cacheControl:"3600",
            upsert:false
          }
        );


    if(upload.error){

      throw upload.error;

    }


    const publicUrl =
      supabaseClient
        .storage
        .from("chat-media")
        .getPublicUrl(path)
        .data
        .publicUrl;


    const {
      error
    } =
    await supabaseClient
      .from("private_messages")
      .insert({

        sender_id:
          currentUser.id,

        receiver_id:
          otherUserId,

        message_type:
          "image",

        content:
          "",

        media_url:
          publicUrl

      });


    if(error){

      throw error;

    }


    await loadMessages();


  }catch(error){

    console.error(
      "IMAGE ERROR:",
      error
    );

    alert(
      "Image send nahi hui:\n" +
      error.message
    );

  }

}


/* =====================================================
   VOICE RECORDING
===================================================== */

async function toggleVoice(){

  if(isRecording){

    stopVoice();

  }else{

    await startVoice();

  }

}


/* =====================================================
   START VOICE
===================================================== */

async function startVoice(){

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    alert(
      "Is browser mein voice recording supported nahi."
    );

    return;

  }


  try{

    const stream =
      await navigator.mediaDevices
        .getUserMedia({
          audio:true
        });


    audioChunks = [];


    mediaRecorder =
      new MediaRecorder(stream);


    mediaRecorder.ondataavailable =
      function(event){

        if(
          event.data &&
          event.data.size > 0
        ){

          audioChunks.push(
            event.data
          );

        }

      };


    mediaRecorder.onstop =
      async function(){

        stream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );


        const blob =
          new Blob(
            audioChunks,
            {
              type:
                mediaRecorder.mimeType ||
                "audio/webm"
            }
          );


        await uploadVoice(blob);

      };


    mediaRecorder.start();

    isRecording = true;


    const btn =
      document.getElementById(
        "voiceBtn"
      );


    btn.classList.add(
      "recording"
    );


    btn.textContent =
      "⏹";


    document.getElementById(
      "messageInput"
    ).placeholder =
      "Recording... dobara 🎤 dabayein";


  }catch(error){

    console.error(
      "VOICE START ERROR:",
      error
    );

    alert(
      "Microphone permission nahi mili."
    );

  }

}


/* =====================================================
   STOP VOICE
===================================================== */

function stopVoice(){

  if(
    mediaRecorder &&
    mediaRecorder.state !==
    "inactive"
  ){

    mediaRecorder.stop();

  }


  isRecording = false;


  const btn =
    document.getElementById(
      "voiceBtn"
    );


  btn.classList.remove(
    "recording"
  );


  btn.textContent =
    "🎤";


  document.getElementById(
    "messageInput"
  ).placeholder =
    "Message likhein...";

}


/* =====================================================
   UPLOAD VOICE
===================================================== */

async function uploadVoice(blob){

  try{

    const path =
      currentUser.id +
      "/voice-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .slice(2) +
      ".webm";


    const upload =
      await supabaseClient
        .storage
        .from("chat-media")
        .upload(
          path,
          blob,
          {
            contentType:
              "audio/webm",
            upsert:false
          }
        );


    if(upload.error){

      throw upload.error;

    }


    const publicUrl =
      supabaseClient
        .storage
        .from("chat-media")
        .getPublicUrl(path)
        .data
        .publicUrl;


    const {
      error
    } =
    await supabaseClient
      .from("private_messages")
      .insert({

        sender_id:
          currentUser.id,

        receiver_id:
          otherUserId,

        message_type:
          "voice",

        content:
          "",

        media_url:
          publicUrl

      });


    if(error){

      throw error;

    }


    await loadMessages();


  }catch(error){

    console.error(
      "VOICE UPLOAD ERROR:",
      error
    );

    alert(
      "Voice send nahi hui:\n" +
      error.message
    );

  }

}


/* =====================================================
   REALTIME MESSAGES
===================================================== */

function startRealtime(){

  if(messagesChannel){
    return;
  }


  messagesChannel =
    supabaseClient
      .channel(
        "private-chat-" +
        currentUser.id +
        "-" +
        otherUserId
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"private_messages"
        },
        function(payload){

          const message =
            payload.new;


          if(
            (
              message.sender_id ===
              currentUser.id &&
              message.receiver_id ===
              otherUserId
            )
            ||
            (
              message.sender_id ===
              otherUserId &&
              message.receiver_id ===
              currentUser.id
            )
          ){

            loadMessages();

          }

        }
      )
      .subscribe();

}


/* =====================================================
   ONLINE PRESENCE
===================================================== */

function startPresence(){

  if(
    !currentUser ||
    onlineChannel
  ){

    return;

  }


  onlineChannel =
    supabaseClient
      .channel(
        "chatzone-online-users",
        {
          config:{
            presence:{
              key:
                currentUser.id
            }
          }
        }
      );


  onlineChannel.subscribe(
    async function(status){

      if(
        status ===
        "SUBSCRIBED"
      ){

        try{

          await onlineChannel.track({

            user_id:
              currentUser.id,

            online_at:
              new Date()
                .toISOString()

          });

        }catch(error){

          console.error(
            "PRESENCE ERROR:",
            error
          );

        }

      }

    }
  );

}


/* =====================================================
   TIME
===================================================== */

function formatTime(date){

  if(!date){
    return "";
  }


  return new Date(date)
    .toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

}


/* =====================================================
   SCROLL
===================================================== */

function scrollToBottom(){

  setTimeout(
    function(){

      const area =
        document.getElementById(
          "chatArea"
        );


      area.scrollTop =
        area.scrollHeight;

    },
    50
  );

}


/* =====================================================
   INPUT
===================================================== */

function handleKey(event){

  if(
    event.key ===
    "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    sendMessage();

  }

}


document
  .getElementById(
    "messageInput"
  )
  .addEventListener(
    "input",
    autoResize
  );


function autoResize(){

  const input =
    document.getElementById(
      "messageInput"
    );


  input.style.height =
    "auto";


  input.style.height =
    Math.min(
      input.scrollHeight,
      110
    ) +
    "px";

}


/* =====================================================
   BACK
===================================================== */

function goBack(){

  window.location.href =
    "private.html";

}


/* =====================================================

function showError(message){

  document.getElementById(
    "messages"
  ).innerHTML = `

    <div class="empty">

      ❌ ${escapeHtml(message)}

      <br><br>

      <button
        onclick="goBack()"
        style="
          border:0;
          background:#6c5ce7;
          color:white;
          padding:10px 18px;
          border-radius:10px;
          cursor:pointer;
        ">

        ← Back to Private

      </button>

    </div>

  `;

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return escapeHtml(value);

}

   AUTH
===================================================== */

supabaseClient
  .auth
  .onAuthStateChange(
    function(event,session){

      if(
        session &&
        session.user &&
        !currentUser
      ){

        currentUser =
          session.user;

      }

    }
  );

);
