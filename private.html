<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Private Chats - ChatZone</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f2fa;color:#242137}
header{background:#6246ea;color:#fff;padding:17px;font-size:21px;font-weight:bold}
.status{font-size:12px;font-weight:normal;margin-top:5px}
.tabs{display:flex;background:#fff;position:sticky;top:0;z-index:2;box-shadow:0 2px 6px #0001}
.tabs button{flex:1;padding:15px 5px;border:0;background:#fff;color:#777;font-weight:bold}
.tabs button.active{color:#6246ea;border-bottom:3px solid #6246ea}
#search{display:block;width:calc(100% - 24px);margin:12px;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:15px;outline-color:#6246ea}
#list{padding:0 12px 20px}
.person{display:flex;align-items:center;gap:12px;background:#fff;margin-bottom:9px;padding:13px;border-radius:14px;cursor:pointer}
.avatar{width:48px;height:48px;border-radius:50%;background:#e5defe;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;color:#6246ea;flex-shrink:0;position:relative}
.dot{position:absolute;width:12px;height:12px;background:#20bf6b;border:2px solid white;border-radius:50%;bottom:0;right:0}
.details{flex:1;min-width:0}
.name{font-weight:bold;font-size:15px;overflow-wrap:anywhere}
.preview{font-size:13px;color:#777;margin-top:5px}
.time{font-size:11px;color:#999}
.empty{text-align:center;color:#888;padding:35px 12px}
.error{color:#b42318;background:#fff0ef;padding:12px;border-radius:10px;margin:12px;font-size:13px;display:none}
.back{color:white;text-decoration:none;margin-right:10px}
</style>
</head>
<body>
<header>
  <div>💬 ChatZone</div>
  <div class="status" id="status">Connecting...</div>
</header>

<div class="tabs">
  <button class="active" data-tab="chats">CHATS</button>
  <button data-tab="requests">REQUESTS</button>
  <button data-tab="online">ONLINE</button>
</div>

<input id="search" placeholder="🔎 Search people..." autocomplete="off">
<div id="error" class="error"></div>
<div id="list"><div class="empty">Loading chats...</div></div>

<script>
const SUPABASE_URL = "https://jhcpqjmxiovvqbghpxbf.supabase.co";
const SUPABASE_KEY = "sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true }
});

let me = null;
let activeTab = "chats";
let profiles = [];
let requests = [];
let presenceChannel = null;
let onlineIds = new Set();
let refreshTimer = null;
let heartbeatTimer = null;
let loading = false;

const list = document.getElementById("list");
const search = document.getElementById("search");
const statusEl = document.getElementById("status");
const errorEl = document.getElementById("error");

function showError(message) {
  errorEl.textContent = message;
  errorEl.style.display = "block";
}

function hideError() {
  errorEl.style.display = "none";
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function displayName(p) {
  return p.full_name || p.username || p.name || "ChatZone Member";
}

function isRecentlySeen(p) {
  if (!p.last_seen) return false;
  const timestamp = new Date(p.last_seen).getTime();
  return Number.isFinite(timestamp) && Date.now() - timestamp < 90000;
}

function isOnline(p) {
  return onlineIds.has(p.id) || isRecentlySeen(p);
}

function initials(p) {
  return displayName(p).trim().charAt(0).toUpperCase() || "?";
}

function openChat(id) {
  location.href = "private-chat.html?user_id=" + encodeURIComponent(id);
}

function render() {
  const term = search.value.trim().toLowerCase();
  let rows = profiles.filter(p => p.id !== me?.id);

  if (activeTab === "online") {
    rows = rows.filter(isOnline);
  } else if (activeTab === "requests") {
    const ids = new Set(requests.map(r => r.sender_id || r.from_user_id || r.user_id));
    rows = rows.filter(p => ids.has(p.id));
  }

  if (term) {
    rows = rows.filter(p =>
      displayName(p).toLowerCase().includes(term) ||
      String(p.username || "").toLowerCase().includes(term)
    );
  }

  if (!rows.length) {
    list.innerHTML = `<div class="empty">${
      activeTab === "online" ? "No members are online right now." :
      activeTab === "requests" ? "No chat requests found." :
      "No members found."
    }</div>`;
    return;
  }

  list.innerHTML = rows.map(p => {
    const online = isOnline(p);
    return `
      <div class="person" data-id="${escapeHtml(p.id)}">
        <div class="avatar">
          ${escapeHtml(initials(p))}
          ${online ? '<span class="dot"></span>' : ''}
        </div>
        <div class="details">
          <div class="name">${escapeHtml(displayName(p))}</div>
          <div class="preview">${online ? "🟢 Online" : "Offline"}</div>
        </div>
        <div class="time">${online ? "Active now" : ""}</div>
      </div>`;
  }).join("");

  list.querySelectorAll(".person").forEach(el => {
    el.addEventListener("click", () => openChat(el.dataset.id));
  });
}

async function loadProfiles() {
  if (loading || !me) return;
  loading = true;

  try {
    const { data, error } = await db
      .from("profiles")
      .select("*")
      .order("last_seen", { ascending: false, nullsFirst: false })
      .limit(200);

    if (error) throw error;

    profiles = data || [];
    hideError();
    render();
  } catch (e) {
    console.error("Profiles load failed:", e);
    showError("Members load nahi ho rahe. Supabase profiles SELECT permission check karein.");
  } finally {
    loading = false;
  }
}

async function loadRequests() {
  if (!me) return;

  try {
    const { data, error } = await db
      .from("private_requests")
      .select("*")
      .eq("receiver_id", me.id)
      .limit(100);

    if (error) throw error;
    requests = data || [];
    if (activeTab === "requests") render();
  } catch (e) {
    console.warn("Requests load failed:", e);
    // Request table may use a different schema or RLS policy.
  }
}

async function updateLastSeen() {
  if (!me || document.visibilityState === "hidden") return;

  const { error } = await db
    .from("profiles")
    .update({ last_seen: new Date().toISOString() })
    .eq("id", me.id);

  if (error) console.warn("last_seen update failed:", error.message);
}

function startPresence() {
  if (!me || presenceChannel) return;

  presenceChannel = db.channel("chatzone-online-users", {
    config: { presence: { key: me.id } }
  });

  presenceChannel
    .on("presence", { event: "sync" }, syncPresence)
    .on("presence", { event: "join" }, syncPresence)
    .on("presence", { event: "leave" }, syncPresence)
    .subscribe(async state => {
      if (state === "SUBSCRIBED") {
        await presenceChannel.track({
          user_id: me.id,
          online_at: new Date().toISOString()
        });
        statusEl.textContent = "🟢 Connected";
      } else if (state === "CHANNEL_ERROR" || state === "TIMED_OUT") {
        statusEl.textContent = "Connection issue";
      }
    });

  if (heartbeatTimer) clearInterval(heartbeatTimer);
  heartbeatTimer = setInterval(async () => {
    await updateLastSeen();
    if (presenceChannel && document.visibilityState === "visible") {
      await presenceChannel.track({
        user_id: me.id,
        online_at: new Date().toISOString()
      });
    }
  }, 30000);
}

function syncPresence() {
  if (!presenceChannel) return;
  const state = presenceChannel.presenceState();
  const next = new Set();

  Object.entries(state).forEach(([key, entries]) => {
    if (entries && entries.length) {
      next.add(key);
      entries.forEach(entry => {
        if (entry.user_id) next.add(entry.user_id);
      });
    }
  });

  onlineIds = next;
  render();
}

async function boot() {
  try {
    const { data, error } = await db.auth.getSession();
    if (error) throw error;

    let session = data.session;

    if (!session) {
      statusEl.textContent = "Please log in";
      list.innerHTML = '<div class="empty">Login first to see your private chats.</div>';
      return;
    }

    me = session.user;
    statusEl.textContent = "Connecting...";
    await updateLastSeen();
    startPresence();

    await Promise.all([loadProfiles(), loadRequests()]);

    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(() => {
      loadProfiles();
      loadRequests();
    }, 30000);
  } catch (e) {
    console.error(e);
    statusEl.textContent = "Could not connect";
    showError("Login/session ya Supabase connection check karein.");
  }
}

document.querySelectorAll(".tabs button").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
    button.classList.add("active");
    activeTab = button.dataset.tab;
    render();
  });
});

search.addEventListener("input", render);

document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible") {
    await updateLastSeen();
    if (presenceChannel && me) {
      await presenceChannel.track({
        user_id: me.id,
        online_at: new Date().toISOString()
      });
    }
    loadProfiles();
  }
});

window.addEventListener("pagehide", () => {
  if (heartbeatTimer) clearInterval(heartbeatTimer);
  if (refreshTimer) clearInterval(refreshTimer);
  if (presenceChannel) db.removeChannel(presenceChannel);
});

boot();
</script>
</body>
</html>
