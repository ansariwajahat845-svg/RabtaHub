<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Private - RabtaHub</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  min-height:100vh;
  color:#222;
}

.container{
  width:100%;
  max-width:680px;
  margin:auto;
  min-height:100vh;
  background:#f7f7fb;
}

.header{
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  color:white;
  padding:16px;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}

.header-row{
  display:flex;
  align-items:center;
  gap:12px;
}

.back{
  border:0;
  background:rgba(255,255,255,.18);
  color:white;
  width:40px;
  height:40px;
  border-radius:50%;
  font-size:20px;
  cursor:pointer;
}

.header h2{
  margin:0;
  font-size:21px;
}

.header small{
  opacity:.9;
}

.content{
  padding:15px;
  padding-bottom:30px;
}

.card{
  background:white;
  border-radius:15px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.section-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:12px;
}

.empty{
  text-align:center;
  color:#777;
  padding:20px 10px;
}

.request{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.request:last-child{
  border-bottom:0;
}

.avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
  flex-shrink:0;
}

.user-info{
  flex:1;
  min-width:0;
}

.username{
  font-weight:bold;
  font-size:16px;
}

.status{
  font-size:12px;
  color:#777;
  margin-top:3px;
}

.buttons{
  display:flex;
  gap:6px;
}

button{
  cursor:pointer;
}

.accept,
.decline,
.chat-btn,
.request-btn{
  border:0;
  border-radius:9px;
  padding:8px 11px;
  font-weight:bold;
}

.accept{
  background:#27ae60;
  color:white;
}

.decline{
  background:#e74c3c;
  color:white;
}

.chat-btn{
  background:#6c5ce7;
  color:white;
}

.request-btn{
  width:100%;
  background:#6c5ce7;
  color:white;
  padding:12px;
  font-size:15px;
}

.sent{
  color:#777;
  font-size:13px;
  background:#f1f1f5;
  padding:9px;
  border-radius:9px;
}

.user-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.user-row:last-child{
  border-bottom:0;
}

.online-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#27ae60;
  display:inline-block;
  margin-right:5px;
}

.offline-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#aaa;
  display:inline-block;
  margin-right:5px;
}

.refresh{
  width:100%;
  border:0;
  background:#eee;
  padding:10px;
  border-radius:10px;
  font-weight:bold;
  margin-top:5px;
}

.error{
  background:#ffe5e5;
  color:#c0392b;
  padding:10px;
  border-radius:10px;
  font-size:13px;
  margin-bottom:12px;
  display:none;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="header-row">
      <button class="back" onclick="goBack()">‹</button>

      <div>
        <h2>🔒 Private</h2>
        <small>Private Requests & Chats</small>
      </div>
    </div>
  </div>

  <div class="content">

    <div id="errorBox" class="error"></div>

    <!-- REQUESTS -->
    <div class="card">
      <div class="section-title">
        📩 Private Requests
      </div>

      <div id="requestsList">
        <div class="empty">
          Requests load ho rahi hain...
        </div>
      </div>
    </div>

    <!-- ACCEPTED CHATS -->
    <div class="card">
      <div class="section-title">
        💬 Private Chats
      </div>

      <div id="chatsList">
        <div class="empty">
          Private chats load ho rahi hain...
        </div>
      </div>
    </div>

    <!-- ONLINE USERS -->
    <div class="card">
      <div class="section-title">
        🟢 Online Users
      </div>

      <div id="onlineUsers">
        <div class="empty">
          Online users load ho rahe hain...
        </div>
      </div>

      <button class="refresh" onclick="loadEverything()">
        🔄 Refresh
      </button>
    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
"https://szmauhxiyjffjhrcruee.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

let currentUser = null;


/* =========================
   ERROR
========================= */

function showError(message){

  const box =
    document.getElementById("errorBox");

  box.textContent = message;
  box.style.display = "block";
}

function hideError(){

  document.getElementById(
    "errorBox"
  ).style.display = "none";
}


/* =========================
   BACK
========================= */

function goBack(){

  window.history.back();

}


/* =========================
   CURRENT USER
========================= */

async function getCurrentUser(){

  const {
    data,
    error
  } = await supabaseClient.auth.getUser();

  if(error || !data.user){

    window.location.href =
      "login.html";

    return null;
  }

  return data.user;
}


/* =========================
   LOAD EVERYTHING
========================= */

async function loadEverything(){

  hideError();

  currentUser =
    await getCurrentUser();

  if(!currentUser) return;

  await updateLastSeen();

  await loadRequests();

  await loadAcceptedChats();

  await loadOnlineUsers();

}


/* =========================
   LAST SEEN
========================= */

async function updateLastSeen(){

  try{

    await supabaseClient
      .from("profiles")
      .update({
        last_seen:new Date().toISOString()
      })
      .eq("id",currentUser.id);

  }catch(e){

    console.log(
      "Last seen error:",
      e
    );

  }

}


/* =========================
   REQUESTS
========================= */

async function loadRequests(){

  const box =
    document.getElementById(
      "requestsList"
    );

  box.innerHTML =
    `<div class="empty">
      Requests load ho rahi hain...
    </div>`;

  const {
    data,
    error
  } =
  await supabaseClient
    .from("private_requests")
    .select("*")
    .eq("receiver_id",currentUser.id)
    .eq("status","pending")
    .order("created_at",{
      ascending:false
    });

  if(error){

    console.error(error);

    box.innerHTML =
      `<div class="empty">
        Requests load nahi ho saki.
      </div>`;

    showError(error.message);

    return;
  }

  if(!data || data.length === 0){

    box.innerHTML =
      `<div class="empty">
        📭 Koi pending request nahi.
      </div>`;

    return;
  }

  box.innerHTML = "";

  for(const request of data){

    const profile =
      await getProfile(
        request.sender_id
      );

    const username =
      profile?.username ||
      "Unknown User";

    const avatar =
      profile?.avatar_url ||
      "";

    const row =
      document.createElement("div");

    row.className =
      "request";

    row.innerHTML = `

      ${
        avatar
        ?
        `<img
          class="avatar"
          src="${escapeHtml(avatar)}"
        >`
        :
        `<div class="avatar"></div>`
      }

      <div class="user-info">

        <div class="username">
          @${escapeHtml(username)}
        </div>

        <div class="status">
          Private request
        </div>

      </div>

      <div class="buttons">

        <button
          class="accept"
          onclick="acceptRequest('${request.id}')">
          ✓
        </button>

        <button
          class="decline"
          onclick="declineRequest('${request.id}')">
          ✕
        </button>

      </div>
    `;

    box.appendChild(row);

  }

}


/* =========================
   PROFILE
========================= */

async function getProfile(userId){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("profiles")
    .select(
      "id,username,name,avatar_url,last_seen"
    )
    .eq("id",userId)
    .maybeSingle();

  if(error){

    console.log(
      "Profile error:",
      error
    );

    return null;
  }

  return data;

}


/* =========================
   ACCEPT
========================= */

async function acceptRequest(requestId){

  if(!confirm(
    "Private request accept karni hai?"
  )){
    return;
  }

  const {
    data,
    error
  } =
  await supabaseClient
    .from("private_requests")
    .update({
      status:"accepted"
    })
    .eq("id",requestId)
    .eq("receiver_id",currentUser.id)
    .select()
    .single();

  if(error){

    showError(
      "Request accept nahi hui: "
      + error.message
    );

    return;
  }

  alert(
    "✅ Private request accepted!"
  );

  await loadEverything();

}


/* =========================
   DECLINE
========================= */

async function declineRequest(requestId){

  if(!confirm(
    "Private request decline karni hai?"
  )){
    return;
  }

  const {
    error
  } =
  await supabaseClient
    .from("private_requests")
    .update({
      status:"declined"
    })
    .eq("id",requestId)
    .eq("receiver_id",currentUser.id);

  if(error){

    showError(
      "Request decline nahi hui: "
      + error.message
    );

    return;
  }

  await loadEverything();

}


/* =========================
   ACCEPTED CHATS
========================= */

async function loadAcceptedChats(){

  const box =
    document.getElementById(
      "chatsList"
    );

  box.innerHTML =
    `<div class="empty">
      Chats load ho rahi hain...
    </div>`;

  const {
    data:sent,
    error:sentError
  } =
  await supabaseClient
    .from("private_requests")
    .select("*")
    .eq("sender_id",currentUser.id)
    .eq("status","accepted")
    .order("created_at",{
      ascending:false
    });

  const {
    data:received,
    error:receivedError
  } =
  await supabaseClient
    .from("private_requests")
    .select("*")
    .eq("receiver_id",currentUser.id)
    .eq("status","accepted")
    .order("created_at",{
      ascending:false
    });

  if(sentError || receivedError){

    box.innerHTML =
      `<div class="empty">
        Chats load nahi ho sakin.
      </div>`;

    return;
  }

  const all = [
    ...(sent || []).map(x => ({
      ...x,
      other_id:x.receiver_id
    })),
    ...(received || []).map(x => ({
      ...x,
      other_id:x.sender_id
    }))
  ];

  const unique = [];

  const seen = new Set();

  for(const item of all){

    if(!seen.has(item.other_id)){

      seen.add(item.other_id);

      unique.push(item);

    }

  }

  if(unique.length === 0){

    box.innerHTML =
      `<div class="empty">
        💬 Abhi koi private chat nahi.
      </div>`;

    return;
  }

  box.innerHTML = "";

  for(const item of unique){

    const profile =
      await getProfile(
        item.other_id
      );

    const username =
      profile?.username ||
      "User";

    const avatar =
      profile?.avatar_url ||
      "";

    const row =
      document.createElement("div");

    row.className =
      "user-row";

    row.innerHTML = `

      ${
        avatar
        ?
        `<img
          class="avatar"
          src="${escapeHtml(avatar)}"
        >`
        :
        `<div class="avatar"></div>`
      }

      <div class="user-info">

        <div class="username">
          @${escapeHtml(username)}
        </div>

        <div class="status">
          🔒 Private chat
        </div>

      </div>

      <button
        class="chat-btn"
        onclick="openChat('${item.other_id}')">
        Chat
      </button>

    `;

    box.appendChild(row);

  }

}


/* =========================
   OPEN CHAT
========================= */

function openChat(userId){

  window.location.href =
    "private-chat.html?user="
    + encodeURIComponent(userId);

}


/* =========================
   ONLINE USERS
========================= */

async function loadOnlineUsers(){

  const box =
    document.getElementById(
      "onlineUsers"
    );

  box.innerHTML =
    `<div class="empty">
      Online users load ho rahe hain...
    </div>`;

  /*
    5 minutes ke andar last_seen
    = online
  */

  const fiveMinutesAgo =
    new Date(
      Date.now() -
      5 * 60 * 1000
    ).toISOString();

  const {
    data,
    error
  } =
  await supabaseClient
    .from("profiles")
    .select(
      "id,username,name,avatar_url,last_seen"
    )
    .neq("id",currentUser.id)
    .gte(
      "last_seen",
      fiveMinutesAgo
    )
    .order("last_seen",{
      ascending:false
    });

  if(error){

    console.log(
      "Online error:",
      error
    );

    box.innerHTML =
      `<div class="empty">
        Online users load nahi ho sake.
      </div>`;

    return;
  }

  if(!data || data.length === 0){

    box.innerHTML =
      `<div class="empty">
        💤 Abhi koi aur online nahi.
      </div>`;

    return;
  }

  box.innerHTML = "";

  for(const user of data){

    const row =
      document.createElement("div");

    row.className =
      "user-row";

    row.innerHTML = `

      ${
        user.avatar_url
        ?
        `<img
          class="avatar"
          src="${escapeHtml(user.avatar_url)}"
        >`
        :
        `<div class="avatar"></div>`
      }

      <div class="user-info">

        <div class="username">
          @${escapeHtml(
            user.username || "User"
          )}
        </div>

        <div class="status">
          <span class="online-dot"></span>
          Online
        </div>

      </div>

      <button
        class="chat-btn"
        onclick="sendRequest('${user.id}')">
        Private
      </button>

    `;

    box.appendChild(row);

  }

}


/* =========================
   SEND REQUEST
========================= */

async function sendRequest(receiverId){

  if(
    !receiverId ||
    receiverId === currentUser.id
  ){
    return;
  }

  /*
    Check existing request
  */

  const {
    data:existing,
    error:checkError
  } =
  await supabaseClient
    .from("private_requests")
    .select(
      "id,status,sender_id,receiver_id"
    )
    .or(
      `and(sender_id.eq.${currentUser.id},receiver_id.eq.${receiverId}),and(sender_id.eq.${receiverId},receiver_id.eq.${currentUser.id})`
    )
    .order("created_at",{
      ascending:false
    })
    .limit(1);

  if(checkError){

    showError(
      checkError.message
    );

    return;
  }

  if(existing && existing.length){

    const r =
      existing[0];

    if(r.status === "accepted"){

      openChat(receiverId);

      return;
    }

    if(r.status === "pending"){

      alert(
        r.sender_id === currentUser.id
        ?
        "📩 Request pehle hi bheji ja chuki hai."
        :
        "📩 Is user ki request tumhare paas pending hai."
      );

      return;
    }

    /*
      Declined request ko dobara bhejne
      ke liye purani row ko pending
      karne ki koshish.
    */

    if(
      r.sender_id === currentUser.id
    ){

      const {
        error
      } =
      await supabaseClient
        .from("private_requests")
        .update({
          status:"pending",
          created_at:new Date().toISOString()
        })
        .eq("id",r.id)
        .eq(
          "sender_id",
          currentUser.id
        );

      if(error){

        showError(
          error.message
        );

        return;
      }

      alert(
        "📩 Private request dobara bhej di gayi."
      );

      return;
    }

  }

  const {
    error
  } =
  await supabaseClient
    .from("private_requests")
    .insert({
      sender_id:currentUser.id,
      receiver_id:receiverId,
      status:"pending"
    });

  if(error){

    showError(
      "Request send nahi hui: "
      + error.message
    );

    return;
  }

  alert(
    "📩 Private request send ho gayi!"
  );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  if(!value){
    return "";
  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   START
========================= */

loadEverything();


/* =========================
   AUTO REFRESH
========================= */

setInterval(
  async function(){

    if(currentUser){

      await updateLastSeen();

      await loadRequests();

      await loadAcceptedChats();

      await loadOnlineUsers();

    }

  },
  30000
);

</script>

</body>
</html>
```
