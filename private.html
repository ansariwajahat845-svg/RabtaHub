<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Private Chat - ChatZone 💬</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f3fb;
  color:#222;
}

.header{
  height:76px;
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  color:white;
  display:flex;
  align-items:center;
  padding:10px 12px;
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:20;
  box-shadow:0 2px 8px rgba(0,0,0,.18);
}

.header-inner{
  width:100%;
  max-width:680px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:10px;
}

.back-btn{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.18);
  color:white;
  font-size:24px;
  cursor:pointer;
}

.chat-avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
  background:#eee;
}

.user-info{
  min-width:0;
  flex:1;
}

.chat-name{
  font-size:17px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-username{
  font-size:12px;
  opacity:.9;
  margin-top:2px;
}

.status{
  font-size:11px;
  margin-top:2px;
}

.status.online{
  color:#b8ffca;
}

.status.offline{
  color:#eee;
}

.messages{
  position:fixed;
  top:76px;
  bottom:70px;
  left:0;
  right:0;
  overflow-y:auto;
  padding:14px 10px 18px;
}

.messages-inner{
  width:100%;
  max-width:680px;
  margin:auto;
}

.loading,
.empty,
.error{
  background:white;
  border-radius:14px;
  padding:20px;
  text-align:center;
  color:#777;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.message-row{
  display:flex;
  margin:7px 0;
}

.message-row.mine{
  justify-content:flex-end;
}

.message-row.theirs{
  justify-content:flex-start;
}

.bubble{
  max-width:78%;
  padding:10px 12px;
  border-radius:16px;
  word-wrap:break-word;
  white-space:pre-wrap;
  box-shadow:0 1px 4px rgba(0,0,0,.08);
}

.mine .bubble{
  background:#6c5ce7;
  color:white;
  border-bottom-right-radius:4px;
}

.theirs .bubble{
  background:white;
  color:#222;
  border-bottom-left-radius:4px;
}

.message-time{
  font-size:10px;
  opacity:.65;
  margin-top:4px;
  text-align:right;
}

.input-area{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:70px;
  background:white;
  border-top:1px solid #ddd;
  z-index:30;
  padding:10px;
  box-shadow:0 -2px 8px rgba(0,0,0,.08);
}

.input-inner{
  max-width:680px;
  margin:auto;
  display:flex;
  gap:8px;
  align-items:center;
}

.message-input{
  flex:1;
  min-width:0;
  height:48px;
  border:1px solid #ddd;
  border-radius:24px;
  padding:0 16px;
  outline:none;
  font-size:15px;
  background:#f8f8fb;
}

.message-input:focus{
  border-color:#6c5ce7;
}

.send-btn{
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  background:#6c5ce7;
  color:white;
  font-size:20px;
  cursor:pointer;
}

.send-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.retry-btn{
  border:0;
  background:#6c5ce7;
  color:white;
  padding:9px 15px;
  border-radius:10px;
  cursor:pointer;
  margin-top:8px;
}
</style>
</head>

<body>

<header class="header">

  <div class="header-inner">

    <button class="back-btn" onclick="goBack()">‹</button>

    <img
      id="chatAvatar"
      class="chat-avatar"
      alt="avatar"
    >

    <div class="user-info">

      <div id="chatName" class="chat-name">
        Loading...
      </div>

      <div id="chatUsername" class="chat-username">
        @user
      </div>

      <div id="chatStatus" class="status offline">
        Checking...
      </div>

    </div>

  </div>

</header>


<main id="messages" class="messages">

  <div class="messages-inner" id="messagesInner">

    <div class="loading">
      🔄 Chat load ho rahi hai...
    </div>

  </div>

</main>


<div class="input-area">

  <div class="input-inner">

    <input
      id="messageInput"
      class="message-input"
      type="text"
      maxlength="2000"
      placeholder="Message likhein..."
      autocomplete="off"
    >

    <button
      id="sendBtn"
      class="send-btn"
      onclick="sendMessage()"
    >
      ➤
    </button>

  </div>

</div>


<script>

const SUPABASE_URL =
"https://jhcpqjmxiovvqbghpxbf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:false
    }
  }
);


let currentUser = null;
let targetUserId = null;
let targetProfile = null;
let messagesChannel = null;
let presenceChannel = null;
let loadingMessages = false;


/* =========================
   DEFAULT AVATAR
========================= */

function defaultAvatar(){

  return "data:image/svg+xml;charset=UTF-8,"+
  encodeURIComponent(`
  <svg xmlns="http://www.w3.org/2000/svg"
       width="100" height="100">

    <rect width="100" height="100"
          rx="50" fill="#e9e7ff"/>

    <circle cx="50" cy="38" r="18"
            fill="#6c5ce7"/>

    <path d="M20 85c4-20 17-30 30-30s26 10 30 30"
          fill="#6c5ce7"/>

  </svg>
  `);

}


/* =========================
   GET SESSION
========================= */

async function getCurrentUser(){

  const result =
  await supabaseClient.auth.getSession();

  if(result.error){

    console.error(
      "SESSION ERROR:",
      result.error
    );

    return null;
  }

  return result.data?.session?.user || null;

}


/* =========================
   GET TARGET USER
========================= */

function getTargetUserId(){

  const params =
  new URLSearchParams(
    window.location.search
  );

  let id =
  params.get("user");

  if(!id){

    id =
    localStorage.getItem(
      "privateChatUserId"
    );

  }

  if(!id){

    id =
    params.get("user_id");

  }

  if(!id){

    id =
    params.get("id");

  }

  if(!id)return null;

  id =
  String(id).trim();

  if(
    id==="undefined" ||
    id==="null" ||
    id===""
  ){

    return null;

  }

  return id;

}


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(){

  const result =
  await supabaseClient
  .from("profiles")
  .select(
    "id,username,name,avatar_url,last_seen"
  )
  .eq("id",targetUserId)
  .maybeSingle();


  if(result.error){

    console.error(
      "PROFILE ERROR:",
      result.error
    );

    showError(
      "User profile load nahi ho saki.<br><br>"+
      escapeHtml(result.error.message)
    );

    return false;

  }


  if(!result.data){

    showError(
      "❌ User profile nahi mili."
    );

    return false;

  }


  targetProfile =
  result.data;


  document.getElementById(
    "chatName"
  ).textContent =
    targetProfile.name ||
    targetProfile.username ||
    "User";


  document.getElementById(
    "chatUsername"
  ).textContent =
    "@" +
    (
      targetProfile.username ||
      "user"
    );


  const avatar =
    targetProfile.avatar_url ||
    defaultAvatar();


  document.getElementById(
    "chatAvatar"
  ).src = avatar;


  document.getElementById(
    "chatAvatar"
  ).onerror =
    function(){

      this.src =
        defaultAvatar();

    };


  updateStatus(
    targetProfile.last_seen
  );


  return true;

}


/* =========================
   ONLINE STATUS
========================= */

function updateStatus(lastSeen){

  const status =
  document.getElementById(
    "chatStatus"
  );


  if(!lastSeen){

    status.textContent =
      "⚪ Offline";

    status.className =
      "status offline";

    return;

  }


  const time =
    new Date(lastSeen).getTime();


  const online =
    !Number.isNaN(time) &&
    Date.now()-time <=
    5*60*1000;


  if(online){

    status.textContent =
      "🟢 Online";

    status.className =
      "status online";

  }else{

    status.textContent =
      "⚪ Offline";

    status.className =
      "status offline";

  }

}


/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages(){

  if(loadingMessages)return;

  loadingMessages=true;


  const box =
  document.getElementById(
    "messagesInner"
  );


  box.innerHTML = `
    <div class="loading">
      🔄 Messages load ho rahe hain...
    </div>
  `;


  const result =
  await supabaseClient
  .from("private_messages")
  .select(
    "id,sender_id,receiver_id,message_type,content,media_url,created_at"
  )
  .or(
    `and(sender_id.eq.${currentUser.id},receiver_id.eq.${targetUserId}),and(sender_id.eq.${targetUserId},receiver_id.eq.${currentUser.id})`
  )
  .order(
    "created_at",
    {ascending:true}
  );


  loadingMessages=false;


  if(result.error){

    console.error(
      "MESSAGES ERROR:",
      result.error
    );

    showError(
      "❌ Messages load nahi ho sake.<br><br>"+
      escapeHtml(
        result.error.message
      )+
      `<br>
      <button class="retry-btn"
              onclick="loadMessages()">
        🔄 Retry
      </button>`
    );

    return;

  }


  const messages =
    result.data || [];


  if(messages.length===0){

    box.innerHTML = `
      <div class="empty">
        💬 Abhi koi message nahi.
        <br>
        Pehla message bhejein.
      </div>
    `;

    return;

  }


  box.innerHTML =
    messages
    .map(renderMessage)
    .join("");


  scrollToBottom();

}


/* =========================
   RENDER MESSAGE
========================= */

function renderMessage(message){

  const mine =
    message.sender_id ===
    currentUser.id;


  let content =
    message.content || "";


  if(
    message.message_type &&
    message.message_type !== "text" &&
    !content
  ){

    content =
      "📎 Media message";

  }


  const time =
    formatTime(
      message.created_at
    );


  return `

    <div class="message-row ${
      mine ? "mine" : "theirs"
    }">

      <div class="bubble">

        ${escapeHtml(content)}

        <div class="message-time">
          ${escapeHtml(time)}
        </div>

      </div>

    </div>

  `;

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

  const input =
  document.getElementById(
    "messageInput"
  );

  const button =
  document.getElementById(
    "sendBtn"
  );


  const content =
  input.value.trim();


  if(!content)return;


  if(
    !currentUser ||
    !targetUserId
  ){

    alert(
      "Chat user nahi mila."
    );

    return;

  }


  input.disabled=true;
  button.disabled=true;


  const result =
  await supabaseClient
  .from("private_messages")
  .insert({

    sender_id:
      currentUser.id,

    receiver_id:
      targetUserId,

    message_type:
      "text",

    content:
      content,

    media_url:
      null

  })
  .select()
  .single();


  input.disabled=false;
  button.disabled=false;


  if(result.error){

    console.error(
      "SEND ERROR:",
      result.error
    );

    alert(
      "Message send nahi hua:\n"+
      result.error.message
    );

    return;

  }


  input.value="";


  await loadMessages();


  input.focus();

}


/* =========================
   REALTIME
========================= */

function startRealtime(){

  if(messagesChannel){

    supabaseClient.removeChannel(
      messagesChannel
    );

  }


  messagesChannel =
  supabaseClient
  .channel(
    "private-chat-" +
    currentUser.id +
    "-" +
    targetUserId
  );


  messagesChannel.on(
    "postgres_changes",
    {
      event:"*",
      schema:"public",
      table:"private_messages"
    },
    payload => {

      const row =
        payload.new ||
        payload.old;

      if(!row)return;


      const relevant =
        (
          row.sender_id ===
          currentUser.id &&
          row.receiver_id ===
          targetUserId
        )
        ||
        (
          row.sender_id ===
          targetUserId &&
          row.receiver_id ===
          currentUser.id
        );


      if(relevant){

        loadMessages();

      }

    }
  );


  messagesChannel.subscribe();


  /* Presence */

  if(presenceChannel){

    supabaseClient.removeChannel(
      presenceChannel
    );

  }


  presenceChannel =
  supabaseClient
  .channel(
    "private-chat-presence"
  );


  presenceChannel.on(
    "presence",
    {event:"sync"},
    async ()=>{

      const state =
        presenceChannel
        .presenceState();


      let online=false;


      Object.values(state)
      .forEach(entries=>{

        entries.forEach(entry=>{

          if(
            entry.user_id ===
            targetUserId
          ){

            online=true;

          }

        });

      });


      const status =
        document.getElementById(
          "chatStatus"
        );


      if(online){

        status.textContent =
          "🟢 Online";

        status.className =
          "status online";

      }else{

        updateStatus(
          targetProfile?.last_seen
        );

      }

    }
  );


  presenceChannel.subscribe(
    async status=>{

      if(
        status ===
        "SUBSCRIBED"
      ){

        await presenceChannel.track({

          user_id:
            currentUser.id

        });

      }

    }
  );

}


/* =========================
   BACK
========================= */

function goBack(){

  window.location.assign(
    "private.html"
  );

}


/* =========================
   TIME
========================= */

function formatTime(value){

  if(!value)return "";

  const date =
    new Date(value);

  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "";

  }


  return date.toLocaleTimeString(
    [],
    {
      hour:"numeric",
      minute:"2-digit"
    }
  );

}


/* =========================
   SCROLL
========================= */

function scrollToBottom(){

  const box =
    document.getElementById(
      "messages"
    );

  setTimeout(()=>{

    box.scrollTop =
      box.scrollHeight;

  },50);

}


/* =========================
   ERROR
========================= */

function showError(message){

  document.getElementById(
    "messagesInner"
  ).innerHTML = `
    <div class="error">
      ${message}
    </div>
  `;

}


/* =========================
   ESCAPE
========================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================
   ENTER SEND
========================= */

document
.getElementById(
  "messageInput"
)
.addEventListener(
  "keydown",
  event=>{

    if(
      event.key ===
      "Enter"
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================
   START
========================= */

(async function(){

  currentUser =
    await getCurrentUser();


  if(!currentUser){

    showError(`
      ❌ Login session nahi mili.
      <br><br>
      <button class="retry-btn"
              onclick="window.location.assign('login.html')">
        Login
      </button>
    `);

    return;

  }


  targetUserId =
    getTargetUserId();


  if(!targetUserId){

    showError(`
      ❌ User ID nahi mili.
      <br><br>
      Private page se chat dobara open karein.
      <br>
      <button class="retry-btn"
              onclick="goBack()">
        ← Private Chats
      </button>
    `);

    return;

  }


  /* Apne aap se chat prevent */

  if(
    targetUserId ===
    currentUser.id
  ){

    showError(`
      ❌ Apne aap se private chat nahi ho sakti.
      <br>
      <button class="retry-btn"
              onclick="goBack()">
        ← Back
      </button>
    `);

    return;

  }


  const profileLoaded =
    await loadProfile();


  if(!profileLoaded)return;


  await loadMessages();


  startRealtime();


  document
  .getElementById(
    "messageInput"
  )
  .focus();

})();
</script>

</body>
</html>
```
