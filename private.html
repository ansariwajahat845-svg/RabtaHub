<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Private Chat - ChatZone 💬</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#f3f1fb;
}

/* =========================
   HEADER
========================= */

.topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:76px;
  z-index:1000;

  display:flex;
  align-items:center;
  gap:10px;

  padding:10px 12px;

  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  color:white;

  box-shadow:0 2px 8px rgba(0,0,0,.20);
}

.back-btn{
  width:42px;
  height:42px;

  border:none;
  border-radius:50%;

  background:rgba(255,255,255,.18);
  color:white;

  font-size:22px;
  font-weight:bold;

  cursor:pointer;
  flex-shrink:0;
}

.back-btn:active{
  transform:scale(.94);
}

.profile-head{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
  flex:1;
}

.head-avatar{
  width:46px;
  height:46px;

  border-radius:50%;
  object-fit:cover;

  background:white;
  border:2px solid rgba(255,255,255,.8);

  flex-shrink:0;
}

.head-info{
  min-width:0;
}

.head-name{
  font-size:16px;
  font-weight:bold;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.head-username{
  font-size:12px;
  opacity:.9;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.head-status{
  font-size:12px;
  margin-top:2px;
}

.leave-btn{
  border:none;
  padding:9px 11px;

  border-radius:18px;

  background:rgba(255,255,255,.18);
  color:white;

  font-size:12px;
  font-weight:bold;

  cursor:pointer;
  flex-shrink:0;
}

.leave-btn:active{
  transform:scale(.95);
}


/* =========================
   CHAT AREA
========================= */

.chat-area{
  position:fixed;
  top:76px;
  bottom:70px;
  left:0;
  right:0;

  overflow-y:auto;
  overflow-x:hidden;

  padding:12px 10px 18px;

  scroll-behavior:smooth;
}

.chat-inner{
  width:100%;
  max-width:680px;
  margin:0 auto;
}


/* =========================
   LOADING / EMPTY
========================= */

.loading{
  text-align:center;
  color:#777;
  padding:25px 10px;
  font-size:14px;
}

.empty{
  text-align:center;
  color:#777;
  padding:40px 15px;
  font-size:14px;
}


/* =========================
   MESSAGE ROW
========================= */

.message-row{
  display:flex;
  width:100%;

  margin:6px 0;

  align-items:flex-end;
}

.message-row.mine{
  justify-content:flex-end;
}

.message-row.theirs{
  justify-content:flex-start;
}


/* =========================
   MESSAGE BUBBLE
========================= */

/*
   IMPORTANT:
   width:max-content makes the bubble
   only as wide as the message.

   max-width prevents very long messages
   from becoming wider than the screen.
*/

.bubble{
  display:block;

  width:max-content;
  max-width:min(78%,560px);

  padding:8px 11px 6px;

  border-radius:17px;

  font-size:15px;
  line-height:1.35;

  word-break:break-word;
  overflow-wrap:anywhere;
  white-space:pre-wrap;

  box-shadow:0 2px 6px rgba(0,0,0,.14);

  position:relative;
}


/* 🟣 MY MESSAGE */

.mine .bubble{
  background:#6c5ce7 !important;
  background:linear-gradient(135deg,#6c5ce7,#7d4fd1) !important;

  color:#fff !important;

  border-bottom-right-radius:5px;
}


/* 🔵 OTHER USER MESSAGE */

.theirs .bubble{
  background:#2196f3 !important;
  background:linear-gradient(135deg,#2196f3,#1976d2) !important;

  color:#fff !important;

  border-bottom-left-radius:5px;
}


/* =========================
   MESSAGE TEXT
========================= */

.message-text{
  display:inline;
  color:inherit;
}


/* =========================
   MESSAGE TIME / STATUS
========================= */

.message-meta{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:4px;

  margin-top:3px;

  font-size:10px;

  color:rgba(255,255,255,.78);

  line-height:1;
}

.message-status{
  font-size:10px;
}


/* =========================
   MEDIA FALLBACK
========================= */

.media-message{
  font-size:14px;
}


/* =========================
   INPUT AREA
========================= */

.input-area{
  position:fixed;
  left:0;
  right:0;
  bottom:0;

  height:70px;

  z-index:1000;

  background:white;

  border-top:1px solid #ddd;

  box-shadow:0 -2px 8px rgba(0,0,0,.08);

  padding:10px;
}

.input-inner{
  width:100%;
  max-width:680px;
  margin:0 auto;

  display:flex;
  gap:8px;
  align-items:center;
}

.message-input{
  flex:1;

  min-width:0;

  height:48px;

  border:1px solid #ddd;
  border-radius:25px;

  outline:none;

  padding:0 17px;

  font-size:15px;

  background:#f7f7fa;
}

.message-input:focus{
  border-color:#6c5ce7;
  background:white;
}

.send-btn{
  width:48px;
  height:48px;

  border:none;
  border-radius:50%;

  background:linear-gradient(135deg,#6c5ce7,#8e44ad);

  color:white;

  font-size:19px;

  cursor:pointer;

  flex-shrink:0;

  box-shadow:0 2px 6px rgba(108,92,231,.3);
}

.send-btn:active{
  transform:scale(.93);
}

.send-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}


/* =========================
   MOBILE
========================= */

@media(max-width:430px){

  .topbar{
    height:72px;
    padding:8px 9px;
  }

  .chat-area{
    top:72px;
    bottom:68px;

    padding:10px 8px 16px;
  }

  .input-area{
    height:68px;
    padding:9px 8px;
  }

  .back-btn{
    width:40px;
    height:40px;
    font-size:20px;
  }

  .head-avatar{
    width:42px;
    height:42px;
  }

  .head-name{
    font-size:15px;
  }

  .leave-btn{
    padding:8px 9px;
    font-size:11px;
  }

  .bubble{
    max-width:84% !important;

    padding:8px 10px 6px;

    font-size:15px;

    border-radius:16px;
  }

  .message-row{
    margin:5px 0;
  }

  .message-input{
    height:46px;
    font-size:14px;
  }

  .send-btn{
    width:46px;
    height:46px;
  }
}


/* =========================
   VERY SMALL SCREEN
========================= */

@media(max-width:340px){

  .leave-btn{
    display:none;
  }

  .bubble{
    max-width:88% !important;
  }

  .head-name{
    max-width:130px;
  }
}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<div class="topbar">

  <button
    class="back-btn"
    type="button"
    onclick="goBack()"
    aria-label="Back"
  >‹</button>

  <div class="profile-head">

    <img
      id="headAvatar"
      class="head-avatar"
      src=""
      alt="Profile"
    >

    <div class="head-info">

      <div
        id="headName"
        class="head-name"
      >Loading...</div>

      <div
        id="headUsername"
        class="head-username"
      >@user</div>

      <div
        id="headStatus"
        class="head-status"
      >Checking...</div>

    </div>

  </div>

  <button
    class="leave-btn"
    type="button"
    onclick="leaveChat()"
  >Leave</button>

</div>


<!-- =========================
     CHAT
========================= -->

<div
  id="chatArea"
  class="chat-area"
>

  <div
    id="chatInner"
    class="chat-inner"
  >

    <div class="loading">
      Loading messages...
    </div>

  </div>

</div>


<!-- =========================
     INPUT
========================= -->

<div class="input-area">

  <div class="input-inner">

    <input
      id="messageInput"
      class="message-input"
      type="text"
      autocomplete="off"
      placeholder="Type a message..."
    >

    <button
      id="sendBtn"
      class="send-btn"
      type="button"
      onclick="sendMessage()"
    >➤</button>

  </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://jhcpqjmxiovvqbghpxbf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:false
    }
  }
);


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;
let targetUserId = null;
let targetProfile = null;

let messageChannel = null;
let presenceChannel = null;

let loadingMessages = false;
let sendingMessage = false;


/* =====================================================
   DEFAULT AVATAR
===================================================== */

const DEFAULT_AVATAR =
"data:image/svg+xml;charset=UTF-8," +
encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
<rect width="100" height="100" fill="#e9e7f5"/>
<circle cx="50" cy="38" r="18" fill="#aaa"/>
<path d="M18 90c4-20 17-30 32-30s28 10 32 30"
fill="#aaa"/>
</svg>
`);


/* =====================================================
   GET CURRENT USER
===================================================== */

async function getCurrentUser(){

  const {
    data,
    error
  } = await supabaseClient.auth.getSession();

  if(
    error ||
    !data ||
    !data.session ||
    !data.session.user
  ){
    return null;
  }

  return data.session.user;
}


/* =====================================================
   GET TARGET USER ID
===================================================== */

function getTargetUserId(){

  const params =
    new URLSearchParams(window.location.search);

  const possibleIds = [

    params.get("user"),

    params.get("user_id"),

    params.get("id"),

    localStorage.getItem(
      "privateChatUserId"
    )

  ];

  for(const id of possibleIds){

    if(
      id &&
      id !== "null" &&
      id !== "undefined"
    ){

      return id;

    }

  }

  return null;
}


/* =====================================================
   LOAD PROFILE
===================================================== */

async function loadProfile(){

  const {
    data,
    error
  } = await supabaseClient
    .from("profiles")
    .select(`
      id,
      username,
      name,
      avatar_url,
      last_seen
    `)
    .eq("id",targetUserId)
    .maybeSingle();

  if(error){

    console.error(
      "Profile error:",
      error
    );

    throw error;
  }

  if(!data){

    throw new Error(
      "User profile nahi mila."
    );

  }

  targetProfile = data;

  document.getElementById(
    "headName"
  ).textContent =
    data.name ||
    data.username ||
    "User";

  document.getElementById(
    "headUsername"
  ).textContent =
    data.username
      ? "@" + data.username
      : "@user";

  document.getElementById(
    "headAvatar"
  ).src =
    data.avatar_url ||
    DEFAULT_AVATAR;

  updateStatus();

}


/* =====================================================
   ONLINE STATUS
===================================================== */

function isTargetOnline(){

  if(
    !targetProfile ||
    !targetProfile.last_seen
  ){

    return false;

  }

  const last =
    new Date(
      targetProfile.last_seen
    ).getTime();

  const now =
    Date.now();

  const difference =
    now - last;

  return difference <=
    5 * 60 * 1000;

}


function updateStatus(){

  const el =
    document.getElementById(
      "headStatus"
    );

  if(
    isTargetOnline()
  ){

    el.textContent =
      "🟢 Online";

  }else{

    el.textContent =
      "⚪ Offline";

  }

}


/* =====================================================
   MARK DELIVERED
===================================================== */

async function markMessagesDelivered(){

  if(
    !currentUser ||
    !targetUserId
  ){

    return;

  }

  try{

    await supabaseClient
      .from("private_messages")
      .update({
        delivered_at:new Date().toISOString()
      })
      .eq(
        "sender_id",
        targetUserId
      )
      .eq(
        "receiver_id",
        currentUser.id
      )
      .is(
        "delivered_at",
        null
      );

  }catch(error){

    console.log(
      "Delivered update:",
      error
    );

  }

}


/* =====================================================
   MARK SEEN
===================================================== */

async function markMessagesSeen(){

  if(
    !currentUser ||
    !targetUserId
  ){

    return;

  }

  try{

    await supabaseClient
      .from("private_messages")
      .update({
        seen_at:new Date().toISOString()
      })
      .eq(
        "sender_id",
        targetUserId
      )
      .eq(
        "receiver_id",
        currentUser.id
      )
      .is(
        "seen_at",
        null
      );

  }catch(error){

    console.log(
      "Seen update:",
      error
    );

  }

}


/* =====================================================
   LOAD MESSAGES
===================================================== */

async function loadMessages(){

  if(
    loadingMessages
  ){

    return;

  }

  loadingMessages = true;

  const chatInner =
    document.getElementById(
      "chatInner"
    );

  try{

    const {
      data,
      error
    } = await supabaseClient
      .from("private_messages")
      .select(`
        id,
        sender_id,
        receiver_id,
        message_type,
        content,
        media_url,
        created_at,
        delivered_at,
        seen_at
      `)
      .or(
        `and(sender_id.eq.${currentUser.id},receiver_id.eq.${targetUserId}),and(sender_id.eq.${targetUserId},receiver_id.eq.${currentUser.id})`
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );

    if(error){

      console.error(
        "Messages error:",
        error
      );

      chatInner.innerHTML =
        `<div class="empty">
          ❌ Messages load nahi ho sake.<br>
          ${escapeHtml(error.message || "")}
        </div>`;

      return;

    }


    if(
      !data ||
      data.length === 0
    ){

      chatInner.innerHTML =
        `<div class="empty">
          💬 No messages yet.<br>
          Start the conversation.
        </div>`;

      return;

    }


    chatInner.innerHTML = "";

    data.forEach(
      message => {

        renderMessage(
          message
        );

      }
    );


    scrollToBottom();


  }catch(error){

    console.error(
      "Load error:",
      error
    );

    chatInner.innerHTML =
      `<div class="empty">
        ❌ Chat load error.
      </div>`;

  }finally{

    loadingMessages = false;

  }

}


/* =====================================================
   MESSAGE STATUS
===================================================== */

function getMessageStatus(message){

  if(
    message.seen_at
  ){

    return "Seen";

  }

  if(
    message.delivered_at
  ){

    return "Delivered";

  }

  return "Sent";

}


/* =====================================================
   RENDER MESSAGE
===================================================== */

function renderMessage(message){

  const chatInner =
    document.getElementById(
      "chatInner"
    );

  const mine =
    message.sender_id ===
    currentUser.id;

  const row =
    document.createElement(
      "div"
    );

  row.className =
    "message-row " +
    (
      mine
        ? "mine"
        : "theirs"
    );


  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "bubble";


  let messageContent = "";


  if(
    message.message_type ===
    "text"
  ){

    messageContent =
      escapeHtml(
        message.content || ""
      );

  }else{

    messageContent =
      `<span class="media-message">
        📎 Media message
      </span>`;

  }


  const time =
    formatTime(
      message.created_at
    );


  const status =
    mine
      ? getMessageStatus(
          message
        )
      : "";


  bubble.innerHTML = `
    <span class="message-text">
      ${messageContent}
    </span>

    <span class="message-meta">
      <span>${time}</span>

      ${
        mine
          ? `<span class="message-status">
               ${status}
             </span>`
          : ""
      }
    </span>
  `;


  row.appendChild(
    bubble
  );

  chatInner.appendChild(
    row
  );

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

  if(
    sendingMessage
  ){

    return;

  }

  const input =
    document.getElementById(
      "messageInput"
    );

  const sendBtn =
    document.getElementById(
      "sendBtn"
    );

  const text =
    input.value.trim();


  if(!text){

    return;

  }


  if(
    !currentUser ||
    !targetUserId
  ){

    return;

  }


  sendingMessage = true;

  sendBtn.disabled = true;


  try{

    const {
      data,
      error
    } = await supabaseClient
      .from("private_messages")
      .insert({

        sender_id:
          currentUser.id,

        receiver_id:
          targetUserId,

        message_type:
          "text",

        content:
          text

      })
      .select()
      .single();


    if(error){

      console.error(
        "Send error:",
        error
      );

      alert(
        "Message send nahi hua:\n" +
        error.message
      );

      return;

    }


    input.value = "";


    if(data){

      renderMessage(
        data
      );

      scrollToBottom();

    }


  }catch(error){

    console.error(
      error
    );

    alert(
      "Message send nahi hua."
    );

  }finally{

    sendingMessage = false;

    sendBtn.disabled = false;

    input.focus();

  }

}


/* =====================================================
   REALTIME
===================================================== */

function setupRealtime(){

  messageChannel =
    supabaseClient
      .channel(
        "private-messages-" +
        currentUser.id +
        "-" +
        targetUserId
      )
      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"private_messages"
        },
        async payload => {

          const message =
            payload.new ||
            payload.old;

          if(!message){

            return;

          }


          const isThisChat =
            (
              message.sender_id ===
                currentUser.id &&
              message.receiver_id ===
                targetUserId
            )
            ||
            (
              message.sender_id ===
                targetUserId &&
              message.receiver_id ===
                currentUser.id
            );


          if(!isThisChat){

            return;

          }


          await loadMessages();

          await markMessagesDelivered();

          await markMessagesSeen();

        }
      )
      .subscribe();


  /* =========================
     PRESENCE
  ========================= */

  presenceChannel =
    supabaseClient
      .channel(
        "private-presence-" +
        currentUser.id +
        "-" +
        targetUserId
      );

  presenceChannel
    .on(
      "presence",
      {
        event:"sync"
      },
      () => {

        updateStatus();

      }
    )
    .on(
      "presence",
      {
        event:"join"
      },
      () => {

        updateStatus();

      }
    )
    .on(
      "presence",
      {
        event:"leave"
      },
      () => {

        updateStatus();

      }
    )
    .subscribe(
      async status => {

        if(
          status ===
          "SUBSCRIBED"
        ){

          try{

            await presenceChannel
              .track({
                user_id:
                  currentUser.id,
                online:true,
                at:
                  new Date().toISOString()
              });

          }catch(error){

            console.log(
              "Presence track error:",
              error
            );

          }

        }

      }
    );

}


/* =====================================================
   SCROLL
===================================================== */

function scrollToBottom(){

  const area =
    document.getElementById(
      "chatArea"
    );

  setTimeout(
    () => {

      area.scrollTop =
        area.scrollHeight;

    },
    30
  );

}


/* =====================================================
   TIME
===================================================== */

function formatTime(dateString){

  if(!dateString){

    return "";

  }

  const date =
    new Date(
      dateString
    );

  return date.toLocaleTimeString(
    [],
    {
      hour:"numeric",
      minute:"2-digit"
    }
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   BACK
   DIRECT PRIVATE LIST
===================================================== */

function goBack(){

  window.location.replace(
    "./private.html"
  );

}


/* =====================================================
   LEAVE
   DIRECT PRIVATE LIST
===================================================== */

async function leaveChat(){

  try{

    if(
      messageChannel
    ){

      await supabaseClient
        .removeChannel(
          messageChannel
        );

    }

    if(
      presenceChannel
    ){

      await supabaseClient
        .removeChannel(
          presenceChannel
        );

    }

  }catch(error){

    console.log(
      error
    );

  }

  window.location.replace(
    "./private.html"
  );

}


/* =====================================================
   ENTER KEY
===================================================== */

document
  .getElementById(
    "messageInput"
  )
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key ===
        "Enter"
      ){

        event.preventDefault();

        sendMessage();

      }

    }
  );


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
  "beforeunload",
  () => {

    if(
      messageChannel
    ){

      supabaseClient
        .removeChannel(
          messageChannel
        );

    }

    if(
      presenceChannel
    ){

      supabaseClient
        .removeChannel(
          presenceChannel
        );

    }

  }
);


/* =====================================================
   START
===================================================== */

async function startChat(){

  try{

    currentUser =
      await getCurrentUser();


    if(
      !currentUser
    ){

      window.location.replace(
        "./login.html"
      );

      return;

    }


    targetUserId =
      getTargetUserId();


    if(
      !targetUserId
    ){

      document.getElementById(
        "chatInner"
      ).innerHTML =
        `<div class="empty">
          ❌ User ID nahi mili.<br><br>
          Private page se chat dobara open karein.
        </div>`;

      return;

    }


    if(
      targetUserId ===
      currentUser.id
    ){

      document.getElementById(
        "chatInner"
      ).innerHTML =
        `<div class="empty">
          ❌ Aap apne aap se private chat nahi kar sakte.
        </div>`;

      return;

    }


    /* Save target for safety */

    localStorage.setItem(
      "privateChatUserId",
      targetUserId
    );


    await loadProfile();

    await markMessagesDelivered();

    await markMessagesSeen();

    await loadMessages();

    setupRealtime();


    /* Refresh profile status periodically */

    setInterval(
      async () => {

        try{

          const {
            data
          } = await supabaseClient
            .from("profiles")
            .select(
              "last_seen"
            )
            .eq(
              "id",
              targetUserId
            )
            .maybeSingle();

          if(data){

            targetProfile.last_seen =
              data.last_seen;

            updateStatus();

          }

        }catch(error){

          console.log(
            error
          );

        }

      },
      30000
    );


    document
      .getElementById(
        "messageInput"
      )
      .focus();


  }catch(error){

    console.error(
      "Start chat error:",
      error
    );

    document.getElementById(
      "chatInner"
    ).innerHTML =
      `<div class="empty">
        ❌ Chat open nahi ho saki.<br><br>
        ${escapeHtml(
          error.message || ""
        )}
      </div>`;

  }

}


startChat();

</script>
