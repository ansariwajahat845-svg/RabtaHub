<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Private Chats - ChatZone 💬</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
:root{--purple:#8e6be8;--purple-dark:#7350cf;--purple-light:#f1ebff;--line:#e8e0f6;--muted:#77718a;--text:#29233a;--online:#32b768}
body{margin:0;background:#f7f3ff;color:var(--text);font-family:Arial,Helvetica,sans-serif}
header{background:linear-gradient(120deg,#173b8f,#0b2460);color:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 7px #081b4b35;border-bottom:3px solid #071a4a}
.head{max-width:760px;margin:auto;padding:13px 15px;display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:50%;background:#ffffff35;display:grid;place-items:center;font-size:23px}
.heading{flex:1;min-width:0}.heading h1{font-size:19px;margin:0 0 4px}.heading p{font-size:12px;margin:0;color:#f8f4ff}
.iconbtn{width:39px;height:39px;border:0;border-radius:50%;background:#ffffff2b;color:white;font-size:18px;cursor:pointer}
main{max-width:760px;min-height:calc(100vh - 70px);margin:auto;background:#fff;padding-bottom:78px}
.search{padding:12px;background:#fff;position:sticky;top:68px;z-index:3;border-bottom:1px solid var(--line)}
.search input{width:100%;border:1px solid #eee7fb;outline:0;background:#f7f4ff;border-radius:24px;padding:13px 17px;font-size:14px;color:var(--text)}
.search input:focus{border-color:#b8a1f3}
.tabs{display:flex;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:128px;z-index:2}
.tab{flex:1;border:0;background:#fff;color:var(--muted);padding:14px 5px;font-weight:700;font-size:13px;border-bottom:3px solid transparent;cursor:pointer}
.tab.active{color:var(--purple-dark);border-bottom-color:#a78bfa;background:#fcfaff}
.section{font-size:12px;font-weight:700;color:var(--muted);padding:16px 16px 7px;text-transform:uppercase;letter-spacing:.5px}
.person{display:flex;align-items:center;gap:12px;padding:12px 15px;min-height:78px;border-bottom:1px solid #f5f1fb}
.avatarwrap{position:relative;flex-shrink:0}.avatar{height:52px;width:52px;border-radius:50%;object-fit:cover;background:#eee7ff;display:grid;place-items:center;color:var(--purple-dark);font-size:23px;overflow:hidden}
.dot{position:absolute;right:0;bottom:1px;width:13px;height:13px;border:2px solid white;border-radius:50%;background:#b9b4c6}.dot.online{background:var(--online)}
.details{flex:1;min-width:0}.personname{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.username,.statusline{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:6px;flex-shrink:0}.btn{border:0;border-radius:20px;padding:9px 12px;font-size:12px;font-weight:700;cursor:pointer}
.open,.accept{background:#eee6ff;color:#6541bc}.open:active,.accept:active{background:#dfd1ff}.decline{background:#f4f1f8;color:#696176}
.empty,.loading,.error{padding:30px 18px;text-align:center;color:var(--muted);font-size:14px;overflow-wrap:anywhere}.error{color:#b42318}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e8e0f6;display:flex;justify-content:center;z-index:6}
.bottom a{flex:1;max-width:150px;text-align:center;padding:10px 3px 8px;text-decoration:none;color:#77718a;font-size:11px}.bottom a span{display:block;font-size:19px;margin-bottom:3px}.bottom a.active{color:var(--purple-dark);font-weight:700}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#49366e;color:#fff;padding:11px 16px;border-radius:22px;font-size:13px;z-index:10;display:none;max-width:90%;text-align:center}
@media(max-width:430px){.head{gap:8px}.actions{gap:4px}.btn{padding:8px;font-size:11px}.person{gap:9px;padding-left:11px;padding-right:11px}.avatar{height:48px;width:48px}.tab{font-size:12px}}
</style>
</head>
<body>
<header><div class="head">
<div class="logo">💬</div>
<div class="heading"><h1>Private Chats</h1><p id="accountStatus">Connecting...</p></div>
<button class="iconbtn" title="Refresh" onclick="loadPage()">🔄</button>
<button class="iconbtn" title="Back" onclick="goBack()">←</button>
</div></header>
<main>
<div class="search"><input id="searchInput" type="search" placeholder="🔍 Search name or @username" oninput="renderCurrent()"></div>
<div class="tabs">
<button id="chatsTab" class="tab active" onclick="showTab('chats')">CHATS</button>
<button id="requestsTab" class="tab" onclick="showTab('requests')">REQUESTS <span id="requestCount"></span></button>
<button id="onlineTab" class="tab" onclick="showTab('online')">ONLINE</button>
</div>
<div id="mainContent"><div class="loading">Loading your chats...</div></div>
</main>
<nav class="bottom">
<a href="index.html"><span>🏠</span>Home</a><a href="private.html" class="active"><span>💬</span>Private</a><a href="mehfil.html"><span>👥</span>Mehfil</a><a href="profile.html"><span>👤</span>Profile</a><a href="notifications.html"><span>🔔</span>Notifications</a>
</nav>
<div id="toast"></div>
<script>
const SUPABASE_URL="https://jhcpqjmxiovvqbghpxbf.supabase.co";
const SUPABASE_KEY="sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let currentUser=null,currentTab="chats",chatPeople=[],requestPeople=[],onlinePeople=[],busy=false;
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(s){let e=document.getElementById("toast");e.textContent=s;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2600)}
function goBack(){if(history.length>1)history.back();else location.href="index.html"}
function showTab(t){currentTab=t;["chats","requests","online"].forEach(x=>document.getElementById(x+"Tab").classList.toggle("active",x===t));renderCurrent()}
function isOnline(p){let t=Date.parse(p?.last_seen||"");return Number.isFinite(t)&&Date.now()-t<300000&&Date.now()-t>=-60000}
function nameOf(p){return p.name||p.username||"ChatZone User"}
function avatar(p){return p.avatar_url?`<img class="avatar" src="${esc(p.avatar_url)}" alt="" onerror="this.onerror=null;this.outerHTML='<div class=&quot;avatar&quot;>👤</div>'">`:`<div class="avatar">👤</div>`}
function personHTML(p,type){let online=isOnline(p),sub=type==="request"?"Wants to connect with you":online?"🟢 Online":"Offline";
let buttons=type==="request"?`<div class="actions"><button class="btn accept" onclick="acceptRequest('${esc(p.id)}')">Accept</button><button class="btn decline" onclick="declineRequest('${esc(p.id)}')">Decline</button></div>`:type==="chat"?`<div class="actions"><button class="btn open" onclick="openChat('${esc(p.id)}')">Message</button></div>`:`<div class="actions"><button class="btn open" onclick="sendRequest('${esc(p.id)}')">Connect</button></div>`;
return `<div class="person"><div class="avatarwrap">${avatar(p)}<span class="dot ${online?"online":""}"></span></div><div class="details"><div class="personname">${esc(nameOf(p))}</div><div class="username">${esc(p.username?"@"+p.username:"")}</div><div class="statusline">${esc(sub)}</div></div>${buttons}</div>`}
function filtered(arr){let q=document.getElementById("searchInput").value.trim().toLowerCase().replace(/^@/,"");return q?arr.filter(p=>String(p.name||"").toLowerCase().includes(q)||String(p.username||"").toLowerCase().includes(q)):arr}
function renderCurrent(){let arr=currentTab==="chats"?filtered(chatPeople):currentTab==="requests"?filtered(requestPeople):filtered(onlinePeople),title=currentTab==="chats"?"Your private chats":currentTab==="requests"?"Private chat requests":"Online members",empty=currentTab==="chats"?"💬 No private chats yet. Accept a request to start chatting.":currentTab==="requests"?"📩 No pending requests.":"🟢 No other members are online right now.",type=currentTab==="chats"?"chat":currentTab==="requests"?"request":"online";
document.getElementById("mainContent").innerHTML=`<div class="section">${title}</div>`+(arr.length?arr.map(p=>personHTML(p,type)).join(""):`<div class="empty">${empty}</div>`)}
async function profiles(ids){ids=[...new Set(ids.filter(Boolean))];if(!ids.length)return[];let {data,error}=await db.from("profiles").select("id,username,name,avatar_url,last_seen").in("id",ids);if(error)throw error;return data||[]}
async function loadPage(){
if(busy)return;busy=true;
const content=document.getElementById("mainContent");
content.innerHTML='<div class="loading">Loading your chats...</div>';
try{
let {data:s,error:se}=await db.auth.getSession();if(se)throw se;
let session=s?.session;
if(!session){await new Promise(r=>setTimeout(r,350));let retry=await db.auth.getSession();session=retry.data?.session;if(retry.error)throw retry.error}
if(!session?.user){
currentUser=null;document.getElementById("accountStatus").textContent="Please log in";
content.innerHTML=`<div class="empty">🔐 Please log in to view private chats.<br><br><button class="btn open" onclick="location.href='login.html'">Go to Login</button></div>`;return
}
currentUser=session.user;document.getElementById("accountStatus").textContent="Your private conversations";
// Update this page's own heartbeat, but don't block loading if RLS disallows profile updates.
const heartbeat=await db.from("profiles").update({last_seen:new Date().toISOString()}).eq("id",currentUser.id);
if(heartbeat.error)console.warn("Could not update last_seen:",heartbeat.error.message);
let [sentR,recvR]=await Promise.all([
db.from("private_requests").select("id,sender_id,receiver_id,status").eq("sender_id",currentUser.id),
db.from("private_requests").select("id,sender_id,receiver_id,status").eq("receiver_id",currentUser.id)
]);
if(sentR.error)throw sentR.error;if(recvR.error)throw recvR.error;
let sent=sentR.data||[],recv=recvR.data||[];
let accepted=[...sent,...recv].filter(r=>r.status==="accepted");
let ids=accepted.map(r=>r.sender_id===currentUser.id?r.receiver_id:r.sender_id).filter(Boolean);
chatPeople=await profiles(ids);
let incoming=recv.filter(r=>r.status==="pending");
requestPeople=await profiles(incoming.map(r=>r.sender_id));
let excluded=new Set([...ids,...incoming.map(r=>r.sender_id),...sent.filter(r=>r.status==="pending").map(r=>r.receiver_id),currentUser.id]);
let {data:all,error:oe}=await db.from("profiles").select("id,username,name,avatar_url,last_seen").neq("id",currentUser.id).order("last_seen",{ascending:false}).limit(100);
if(oe)throw oe;
onlinePeople=(all||[]).filter(p=>isOnline(p)&&!excluded.has(p.id));
[chatPeople,requestPeople,onlinePeople].forEach(a=>a.sort((x,y)=>nameOf(x).localeCompare(nameOf(y))));
document.getElementById("requestCount").textContent=requestPeople.length?`(${requestPeople.length})`:"";
renderCurrent();
}catch(e){
console.error("Private list load error:",e);
content.innerHTML=`<div class="error">Could not load private chats.<br><br>${esc(e.message||"Check Supabase table permissions.")}<br><br><button class="btn open" onclick="loadPage()">Try Again</button></div>`;
}finally{busy=false}
}
async function acceptRequest(sender){if(!currentUser)return;try{let {error}=await db.from("private_requests").update({status:"accepted"}).eq("sender_id",sender).eq("receiver_id",currentUser.id).eq("status","pending");if(error)throw error;toast("Request accepted");await loadPage();showTab("chats")}catch(e){toast("Could not accept request: "+e.message)}}
async function declineRequest(sender){if(!currentUser)return;try{let {error}=await db.from("private_requests").update({status:"declined"}).eq("sender_id",sender).eq("receiver_id",currentUser.id).eq("status","pending");if(error)throw error;toast("Request declined");await loadPage();showTab("requests")}catch(e){toast("Could not decline request: "+e.message)}}
async function sendRequest(receiver){if(!currentUser||receiver===currentUser.id)return;try{
let {data:old,error}=await db.from("private_requests").select("id,status").eq("sender_id",currentUser.id).eq("receiver_id",receiver).maybeSingle();
if(error)throw error;
if(old?.status==="accepted"){toast("Already connected");return}
if(old?.status==="pending"){toast("Request already sent");return}
let result=old?.id?await db.from("private_requests").update({status:"pending"}).eq("id",old.id):await db.from("private_requests").insert({sender_id:currentUser.id,receiver_id:receiver,status:"pending"});
if(result.error)throw result.error;toast("Request sent");await loadPage();showTab("online")
}catch(e){toast("Could not send request: "+e.message)}}
function openChat(id){if(!id){toast("User ID not found");return}location.href="private-chat.html?user_id="+encodeURIComponent(id)}
db.auth.onAuthStateChange((event,session)=>{if(session?.user&&!currentUser&&!busy){currentUser=session.user;loadPage()}});
loadPage();
setInterval(()=>{if(currentUser)db.from("profiles").update({last_seen:new Date().toISOString()}).eq("id",currentUser.id).then(({error})=>{if(error)console.warn("Heartbeat failed:",error.message)})},60000);
</script>
</body>
</html>
