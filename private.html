
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Private - ChatZone 💬</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6fb;
  color:#222;
  padding-bottom:75px;
}

/* HEADER */

.header{
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  color:white;
  padding:15px;
  position:sticky;
  top:0;
  z-index:10;
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.back-btn{
  border:0;
  background:rgba(255,255,255,.16);
  color:white;
  border-radius:10px;
  padding:8px 12px;
  font-size:18px;
}

.header-title{
  font-size:20px;
  font-weight:bold;
}


/* CONTENT */

.container{
  width:100%;
  max-width:650px;
  margin:auto;
  padding:14px;
}

.section-title{
  font-size:18px;
  font-weight:bold;
  margin:5px 0 12px;
}

.loading,
.empty{
  background:white;
  border-radius:14px;
  padding:25px 15px;
  text-align:center;
  color:#777;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}


/* CHAT LIST */

.chat-card{
  background:white;
  border-radius:14px;
  padding:12px;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  cursor:pointer;
}

.chat-card:active{
  transform:scale(.99);
}

.avatar{
  width:52px;
  height:52px;
  min-width:52px;
  border-radius:50%;
  object-fit:cover;
  background:#eee;
}

.chat-info{
  flex:1;
  min-width:0;
}

.username{
  font-weight:bold;
  font-size:16px;
  margin-bottom:4px;
}

.last-message{
  color:#777;
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-time{
  color:#999;
  font-size:11px;
  margin-top:4px;
}

.arrow{
  color:#aaa;
  font-size:20px;
}


/* REFRESH */

.refresh-btn{
  width:100%;
  border:0;
  background:white;
  color:#6c5ce7;
  border-radius:12px;
  padding:11px;
  margin-bottom:15px;
  font-weight:bold;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
  cursor:pointer;
}


/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:68px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
  overflow-x:auto;
}

.nav-btn{
  border:0;
  background:none;
  color:#666;
  font-size:11px;
  text-align:center;
  cursor:pointer;
  min-width:55px;
}

.nav-icon{
  display:block;
  font-size:20px;
  margin-bottom:3px;
}

.nav-btn.active{
  color:#6c5ce7;
  font-weight:bold;
}


/* NOTICE */

.notice{
  display:none;
  background:white;
  padding:11px;
  border-radius:12px;
  text-align:center;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
  font-weight:bold;
}

</style>

</head>


<body>


<!-- HEADER -->

<header class="header">

  <div class="header-row">

    <button
      class="back-btn"
      onclick="goHome()">
      ←
    </button>

    <div class="header-title">
      🔒 Private Chats
    </div>

    <div style="width:45px;"></div>

  </div>

</header>


<!-- CONTENT -->

<main class="container">

  <div
    id="notice"
    class="notice">
  </div>


  <button
    class="refresh-btn"
    onclick="loadPrivateChats()">

    🔄 Refresh Chats

  </button>


  <div class="section-title">
    💬 Your Private Chats
  </div>


  <div
    id="chatList"
    class="loading">

    Private chats load ho rahi hain...

  </div>

</main>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <button
    class="nav-btn"
    onclick="goHome()">

    <span class="nav-icon">🏠</span>
    Home

  </button>


  <button
    class="nav-btn active"
    onclick="goPrivate()">

    <span class="nav-icon">💬</span>
    Private

  </button>


  <button
    class="nav-btn"
    onclick="goProfile()">

    <span class="nav-icon">👤</span>
    Profile

  </button>


  <button
    class="nav-btn"
    onclick="goNotifications()">

    <span class="nav-icon">🔔</span>
    Notifications

  </button>


  <button
    class="nav-btn"
    onclick="goMehfil()">

    <span class="nav-icon">🏠</span>
    Mehfil

  </button>


  <button
    class="nav-btn"
    onclick="goMore()">

    <span class="nav-icon">☰</span>
    More

  </button>

</nav>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://szmauhxiyjffjhrcruee.supabase.co";

const SUPABASE_KEY =
"sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";


const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:false
    }
  }
);


let currentUser = null;


/* =====================================================
   INIT
===================================================== */

async function init(){

  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .auth
      .getSession();


    if(
      error ||
      !data ||
      !data.session
    ){

      window.location.href =
        "login.html";

      return;

    }


    currentUser =
      data.session.user;


    await loadPrivateChats();


  }catch(error){

    console.error(
      error
    );


    document.getElementById(
      "chatList"
    ).innerHTML = `

      <div class="empty">

        ❌ Private chats load nahi ho sakin.

        <br><br>

        ${escapeHtml(
          error.message || ""
        )}

      </div>

    `;

  }

}


/* =====================================================
   LOAD PRIVATE CHATS
===================================================== */

async function loadPrivateChats(){

  if(!currentUser){
    return;
  }


  const list =
    document.getElementById(
      "chatList"
    );


  list.innerHTML = `

    <div class="loading">
      Private chats load ho rahi hain...
    </div>

  `;


  /*
     Accepted private requests
  */

  const {
    data:requests,
    error:requestError
  } =
  await supabaseClient
    .from("private_requests")
    .select(
      "sender_id,receiver_id,created_at,status"
    )
    .eq(
      "status",
      "accepted"
    )
    .or(
      `sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(requestError){

    console.error(
      "REQUEST ERROR:",
      requestError
    );


    list.innerHTML = `

      <div class="empty">

        ❌ Private chats load nahi ho sakin.

        <br><br>

        ${escapeHtml(
          requestError.message
        )}

      </div>

    `;

    return;
  }


  if(
    !requests ||
    requests.length === 0
  ){

    list.innerHTML = `

      <div class="empty">

        🔒 Abhi koi private chat nahi hai.

        <br><br>

        Private request accept hone ke baad
        chat yahan show hogi.

      </div>

    `;

    return;
  }


  /*
     Get other user IDs
  */

  const otherIds =
    [
      ...new Set(
        requests
          .map(
            request => {

              if(
                request.sender_id ===
                currentUser.id
              ){

                return request.receiver_id;

              }

              return request.sender_id;

            }
          )
          .filter(Boolean)
      )
    ];


  if(otherIds.length === 0){

    list.innerHTML = `

      <div class="empty">
        🔒 Abhi koi private chat nahi hai.
      </div>

    `;

    return;
  }


  /*
     Profiles
  */

  const {
    data:profiles,
    error:profileError
  } =
  await supabaseClient
    .from("profiles")
    .select(
      "id,username,name,avatar_url"
    )
    .in(
      "id",
      otherIds
    );


  if(profileError){

    console.error(
      "PROFILE ERROR:",
      profileError
    );

  }


  const profileMap = {};


  (profiles || [])
    .forEach(
      profile => {

        profileMap[
          profile.id
        ] = profile;

      }
    );


  /*
     Get latest message for each user
  */

  const {
    data:messages,
    error:messageError
  } =
  await supabaseClient
    .from("private_messages")
    .select(
      "sender_id,receiver_id,content,message_type,created_at"
    )
    .or(
      `sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    )
    .limit(100);


  if(messageError){

    console.error(
      "MESSAGE ERROR:",
      messageError
    );

  }


  const latestMessages = {};


  (messages || [])
    .forEach(
      message => {

        const otherId =
          message.sender_id ===
          currentUser.id

          ? message.receiver_id

          : message.sender_id;


        if(
          !latestMessages[
            otherId
          ]
        ){

          latestMessages[
            otherId
          ] = message;

        }

      }
    );


  /*
     Render
  */

  list.innerHTML =
    otherIds
      .map(
        userId => {

          return renderChat(
            userId,
            profileMap[userId],
            latestMessages[userId]
          );

        }
      )
      .join("");


}


/* =====================================================
   RENDER CHAT
===================================================== */

function renderChat(
  userId,
  profile,
  lastMessage
){

  const username =
    profile?.username ||
    profile?.name ||
    "User";


  const avatar =
    profile?.avatar_url ||
    getDefaultAvatar();


  let preview =
    "Private chat";


  if(lastMessage){

    if(
      lastMessage.message_type ===
      "image"
    ){

      preview =
        "📷 Image";

    }

    else if(
      lastMessage.message_type ===
      "voice"
    ){

      preview =
        "🎤 Voice message";

    }

    else if(
      lastMessage.content
    ){

      preview =
        lastMessage.content;

    }

  }


  const time =
    lastMessage
      ? formatDate(
          lastMessage.created_at
        )
      : "";


  return `

    <div
      class="chat-card"
      onclick="openChat('${escapeAttr(userId)}')">


      <img
        class="avatar"
        src="${escapeAttr(avatar)}"
        alt=""
        onerror="this.src=getDefaultAvatar();">


      <div class="chat-info">

        <div class="username">

          @${escapeHtml(
            username
          )}

        </div>


        <div class="last-message">

          ${escapeHtml(
            preview
          )}

        </div>


        ${
          time
          ? `
            <div class="chat-time">
              ${escapeHtml(time)}
            </div>
          `
          : ""
        }

      </div>


      <div class="arrow">
        ›
      </div>

    </div>

  `;

}


/* =====================================================
   OPEN CHAT
===================================================== */

function openChat(
  userId
){

  if(!userId){
    return;
  }


  window.location.href =
    "private-chat.html?user=" +
    encodeURIComponent(
      userId
    );

}


/* =====================================================
   DEFAULT AVATAR
===================================================== */

function getDefaultAvatar(){

  return "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="100"
        height="100"
        viewBox="0 0 100 100">

        <rect
          width="100"
          height="100"
          rx="50"
          fill="#e8e6ff"/>

        <circle
          cx="50"
          cy="38"
          r="18"
          fill="#6c5ce7"/>

        <path
          d="M20 85c4-20 17-30 30-30s26 10 30 30"
          fill="#6c5ce7"/>

      </svg>

    `);

}


/* =====================================================
   DATE
===================================================== */

function formatDate(date){

  if(!date){
    return "";
  }


  const d =
    new Date(date);

  const now =
    new Date();


  const seconds =
    Math.floor(
      (now - d) / 1000
    );


  if(seconds < 60){
    return "Just now";
  }


  const minutes =
    Math.floor(
      seconds / 60
    );


  if(minutes < 60){
    return minutes +
      " min ago";
  }


  const hours =
    Math.floor(
      minutes / 60
    );


  if(hours < 24){
    return hours +
      " hours ago";
  }


  const days =
    Math.floor(
      hours / 24
    );


  if(days < 7){
    return days +
      " days ago";
  }


  return d.toLocaleDateString();

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function escapeAttr(value){

  return escapeHtml(value);

}


/* =====================================================
   NAVIGATION
===================================================== */

function goHome(){

  window.location.href =
    "index.html";

}


function goPrivate(){

  window.location.href =
    "private.html";

}


function goProfile(){

  window.location.href =
    "profile.html";

}


function goNotifications(){

  window.location.href =
    "notifications.html";

}


function goMehfil(){

  window.location.href =
    "mehfil.html";

}


function goMore(){

  window.location.href =
    "more.html";

}


/* =====================================================
   AUTH
===================================================== */

supabaseClient
  .auth
  .onAuthStateChange(
    function(event){

      if(
        event ===
        "SIGNED_OUT"
      ){

        window.location.href =
          "login.html";

      }

    }
  );


/* =====================================================
   START
===================================================== */

init();

</script>

</body>
</html>
```
