<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Search - chatzone</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#6c5ce7,#8e44ad);
 min-height:100vh;
}
.header{
 background:white;
 padding:18px;
 text-align:center;
}
.header h2{margin:0;color:#6c5ce7}
.container{width:94%;max-width:650px;margin:18px auto}
.back{color:white;text-decoration:none;font-weight:bold}
.search-box{
 margin-top:15px;
 background:white;
 padding:15px;
 border-radius:16px;
 box-shadow:0 4px 15px #0002;
 display:flex;
 gap:8px;
}
input{
 flex:1;
 border:1px solid #ddd;
 border-radius:10px;
 padding:13px;
 outline:none;
}
button{
 border:0;
 border-radius:10px;
 padding:12px 16px;
 background:#6c5ce7;
 color:white;
 font-weight:bold;
}
.results{
 margin-top:15px;
}
.user{
 background:white;
 margin-bottom:10px;
 padding:14px;
 border-radius:14px;
 display:flex;
 align-items:center;
 gap:12px;
 cursor:pointer;
}
.avatar{
 width:45px;
 height:45px;
 border-radius:50%;
 object-fit:cover;
 background:#eee;
}
.name{font-weight:bold}
.username{color:#777;font-size:13px}
</style>
</head>

<body>

<div class="header">
<h2>🔎 Search chatzone</h2>
</div>

<div class="container">

<a class="back" href="more.html">← Back</a>

<div class="search-box">
<input id="searchInput" placeholder="Username search karein...">
<button onclick="searchUsers()">Search</button>
</div>

<div id="results" class="results"></div>

</div>

<script>

const SUPABASE_URL="https://jhcpqjmxiovvqbghpxbf.supabase.co";
const SUPABASE_KEY="sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";

const supabaseClient=supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function searchUsers(){

 const input=document.getElementById("searchInput");
 const results=document.getElementById("results");

 const term=input.value.trim();

 if(!term){
   results.innerHTML="";
   return;
 }

 results.innerHTML=
   '<div class="user">Searching...</div>';

 try{

   const {data,error}=await supabaseClient
     .from("profiles")
     .select("id,username,name,avatar_url")
     .ilike("username","%"+term+"%")
     .limit(30);

   if(error) throw error;

   if(!data || data.length===0){
     results.innerHTML=
       '<div class="user">No users found.</div>';
     return;
   }

   results.innerHTML=data.map(user=>`

     <div class="user"
       onclick="openProfile('${user.id}')">

       <img class="avatar"
         src="${user.avatar_url || 'https://via.placeholder.com/100'}">

       <div>
         <div class="name">
           ${escapeHtml(user.name || user.username || "User")}
         </div>

         <div class="username">
           @${escapeHtml(user.username || "")}
         </div>
       </div>

     </div>

   `).join("");

 }catch(error){

   results.innerHTML=
     '<div class="user">Search error: '+
     escapeHtml(error.message)+
     '</div>';

 }
}

function openProfile(id){
 window.location.href="profile.html?user="+encodeURIComponent(id);
}

function escapeHtml(value){
 return String(value)
   .replaceAll("&","&amp;")
   .replaceAll("<","&lt;")
   .replaceAll(">","&gt;")
   .replaceAll('"',"&quot;")
   .replaceAll("'","&#039;");
}

document.getElementById("searchInput")
.addEventListener("keydown",function(e){
 if(e.key==="Enter") searchUsers();
});

</script>

</body>
</html>
