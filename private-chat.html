<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat - ChatZone 💬</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3e8ff;color:#2e1065}
header{min-height:64px;background:#6d28d9;color:#fff;display:flex;align-items:center;gap:8px;padding:8px 10px;position:sticky;top:0;z-index:4}
button{cursor:pointer;border:0}#back{font-size:26px;color:#fff;background:transparent;padding:4px;flex:0 0 auto}
.header-action{font-size:11px;font-weight:700;color:#fff;background:#5b21b6;border:1px solid #c4b5fd;border-radius:8px;padding:8px 7px;white-space:nowrap;flex:0 0 auto}
#leaveBtn{background:#7f1d1d;border-color:#fecaca}
#clearBtn{background:#5b21b6}
#avatar{height:42px;width:42px;border-radius:50%;object-fit:cover;background:#dce7e3;display:grid;place-items:center;font-size:22px}
.identity{flex:1;min-width:0}.identity h1{font-size:16px;margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.identity p{font-size:12px;margin:0;color:#ede9fe}
#refresh{font-size:20px;color:white;background:transparent;padding:8px}
main{max-width:760px;margin:auto;background:#f3e8ff;height:calc(100dvh - 64px);display:flex;flex-direction:column;padding-bottom:76px}
#messages{flex:1;min-height:0;overflow-y:auto;padding:16px 12px 24px;display:flex;flex-direction:column;gap:8px;background-color:#f3e8ff;background-image:radial-gradient(#ddd6fe 0.6px,transparent .6px);background-size:12px 12px}
.notice{text-align:center;align-self:center;background:#ede9fe;color:#4c1d95;border-radius:8px;padding:8px 12px;font-size:12px;max-width:90%;margin:4px auto}
.bubble{max-width:82%;padding:8px 10px 6px;border-radius:9px;box-shadow:0 1px 1px #0001;overflow-wrap:anywhere;font-size:14px;line-height:1.4;white-space:pre-wrap}
.bubble.mine{align-self:flex-end;background:#c4b5fd;color:#2e1065;border-top-right-radius:2px}
.bubble.theirs{align-self:flex-start;background:#fff;border-top-left-radius:2px}
.message-footer{display:flex;align-items:center;justify-content:flex-end;gap:7px;margin-top:4px;min-height:17px}.time{display:inline-block;text-align:right;color:#667781;font-size:10px}.ticks{font-size:13px;letter-spacing:-4px;padding-right:3px;color:#667781;font-weight:700}.ticks.seen{color:#1686e0}.reply-msg{font-size:10px;line-height:1;color:#5b21b6;background:#f5f3ff;border:1px solid #ddd6fe;border-radius:5px;padding:4px 5px;font-weight:700}.reply-quote{border-left:3px solid #7c3aed;background:#ede9fe;border-radius:5px;padding:5px 7px;margin-bottom:6px;font-size:11px;color:#4c1d95;white-space:normal}.reply-bar{display:none;align-items:center;gap:8px;padding:7px 12px;background:#ede9fe;border-top:1px solid #c4b5fd;font-size:12px;color:#4c1d95}.reply-bar.show{display:flex}.reply-bar .reply-preview{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.reply-cancel{background:transparent;color:#7f1d1d;font-size:18px;padding:2px 7px}.delete-msg{font-size:10px;line-height:1;color:#7f1d1d;background:#f5f3ff;border:1px solid #ddd6fe;border-radius:5px;padding:4px 5px;font-weight:700}.delete-msg:disabled{opacity:.5}
.image-message{max-width:100%;max-height:280px;border-radius:6px;display:block;margin-bottom:5px}
.composer{display:flex;align-items:flex-end;gap:6px;padding:9px;background:#f3e8ff;max-width:760px;width:100%;margin:auto;border:2px solid #7c3aed;border-radius:16px;position:relative}
#messageInput{flex:1;resize:none;max-height:120px;min-height:42px;border:0;outline:0;border-radius:22px;padding:12px 15px;font-size:15px;font-family:inherit;background:#fff}
#send{height:42px;width:44px;flex:0 0 44px;border-radius:50%;background:#7c3aed;color:#fff;font-size:20px}
.tool-btn{height:42px;width:36px;flex:0 0 36px;border-radius:50%;background:#7c3aed;color:#fff;font-size:20px;border:1px solid #6d28d9;padding:0}
#emojiPanel{display:none;position:absolute;bottom:70px;left:8px;right:8px;max-width:740px;margin:auto;background:#f5f3ff;border:1px solid #7c3aed;border-radius:12px;padding:8px;box-shadow:0 4px 18px #0002;z-index:8;flex-wrap:wrap;gap:4px}
#emojiPanel button{background:#ede9fe;color:#5b21b6;font-size:24px;padding:5px;border-radius:7px}
#send:disabled{opacity:.5}
#status{font-size:12px;color:#b42318;padding:0 12px 5px;background:#f3e8ff}
@media(min-width:761px){body{background:#ede9fe}main{border-left:1px solid #ddd;border-right:1px solid #ddd}#composerWrap{left:50%;transform:translateX(-50%);border-left:1px solid #ddd;border-right:1px solid #ddd}}
</style>
</head>
<body>
<header>
<button id="back" onclick="goBack()" aria-label="Back">‹</button>
<div id="avatar">👤</div>
<div class="identity"><h1 id="chatName">Private Chat</h1><p id="chatStatus">Connecting...</p></div>
<button class="header-action" id="clearBtn" type="button" title="Delete your messages in this chat">🧹 Clear</button>
<button class="header-action" id="leaveBtn" type="button">Leave</button>
</header>
<main>
<div id="messages"><div class="notice">Messages are shown here.</div></div>
<div id="status"></div>
<div id="composerWrap" style="position:fixed;bottom:0;left:0;right:0;z-index:10;max-width:760px;width:100%;margin:0 auto;background:#f3e8ff;padding-bottom:env(safe-area-inset-bottom)">
<div id="replyBar" class="reply-bar"><div class="reply-preview" id="replyPreview"></div><button class="reply-cancel" id="cancelReply" type="button" aria-label="Cancel reply">✕</button></div>
<div id="emojiPanel" aria-label="Emoji picker"></div>
<form class="composer" id="sendForm">
<button class="tool-btn" type="button" id="emojiBtn" aria-label="Emojis">😀</button>
<button class="tool-btn" type="button" id="imageBtn" aria-label="Send image">📷</button>
<input id="imageInput" type="file" accept="image/*" hidden>
<textarea id="messageInput" rows="1" placeholder="Message" autocomplete="off"></textarea>
<button class="tool-btn" type="button" id="voiceBtn" aria-label="Record voice message">🎤</button>
<button id="send" type="submit" aria-label="Send">➤</button>
</form>
</div>
</main>
<script>
const SUPABASE_URL="https://jhcpqjmxiovvqbghpxbf.supabase.co";
const SUPABASE_KEY="sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const params=new URLSearchParams(location.search);
const otherId=params.get("user_id")||params.get("id")||params.get("receiver_id");
let me=null,other=null,sending=false,lastLoad=0,mediaRecorder=null,voiceChunks=[],recording=false,replyTarget=null,chatRows=[];
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function goBack(){location.href="private.html"}
function showStatus(t){document.getElementById("status").textContent=t||""}
function timeText(v){if(!v)return"";let d=new Date(v);return Number.isNaN(d.getTime())?"":d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}
async function init(){
try{
let {data,error}=await db.auth.getSession();if(error)throw error;let session=data?.session;
if(!session){await new Promise(r=>setTimeout(r,500));session=(await db.auth.getSession()).data?.session}
if(!session?.user){location.href="login.html";return}me=session.user;
if(!otherId||otherId===me.id){showStatus("Chat user ID is missing or invalid.");document.getElementById("chatName").textContent="Chat unavailable";return}
let {data:profile,error:pe}=await db.from("profiles").select("id,username,name,avatar_url,last_seen").eq("id",otherId).maybeSingle();
if(pe)throw pe;if(!profile){showStatus("User profile not found.");return}other=profile;
document.getElementById("chatName").textContent=profile.name||profile.username||"ChatZone User";
document.getElementById("chatStatus").textContent=profile.last_seen&&Date.now()-Date.parse(profile.last_seen)<300000?"🟢 Online":(profile.username?"@"+profile.username:"Private conversation");
if(profile.avatar_url)document.getElementById("avatar").outerHTML=`<img id="avatar" src="${esc(profile.avatar_url)}" alt="" style="height:42px;width:42px;border-radius:50%;object-fit:cover">`;
await loadMessages();
}catch(e){console.error(e);showStatus("Could not open chat: "+(e.message||"Check Supabase permissions."))}
}
function messageText(row){return row.content??row.message??""}
function onlineNow(){return !!(other?.last_seen&&Date.now()-Date.parse(other.last_seen)<300000)}
function replySnippet(r){const t=messageText(r).trim();if(t)return t;const type=r.message_type||"text";return type==="image"?"📷 Photo":type==="voice"?"🎤 Voice message":"Message"}
function renderMessages(rows){
chatRows=rows;let box=document.getElementById("messages");
if(!rows.length){box.innerHTML='<div class="notice">👋 Say hello and start the conversation.</div>';return}
box.innerHTML=rows.map(r=>{let mine=r.sender_id===me.id,text=messageText(r),type=r.message_type||"text",body="";
if(r.reply_to_content)body+=`<div class="reply-quote"><b>${r.reply_to_sender_id===me.id?"You":esc(other?.name||other?.username||"User")}</b><br>${esc(r.reply_to_content)}</div>`;
if(type==="image"&&r.media_url)body+=`<img class="image-message" src="${esc(r.media_url)}" alt="Image message">`+(text?`<div>${esc(text)}</div>`:"");
else if(type==="voice"&&r.media_url)body+=`<audio controls preload="metadata" src="${esc(r.media_url)}" style="max-width:220px;width:100%"></audio>`;
else body+=esc(text);
let tick="";if(mine){let seen=!!r.seen_at,delivered=!!r.delivered_at||onlineNow();tick=`<span class="ticks ${seen?"seen":""}" title="${seen?"Seen":delivered?"Online / delivered":"Sent"}">${seen?"✓✓":delivered?"✓✓":"✓"}</span>`}
return `<div class="bubble ${mine?"mine":"theirs"}" data-message-id="${esc(r.id)}">${body}<div class="message-footer"><span class="time">${timeText(r.created_at)}</span>${tick}<button class="reply-msg" type="button" data-reply-id="${esc(r.id)}">↩ Reply</button>${mine&&r.id!=null?`<button class="delete-msg" type="button" data-delete-id="${esc(r.id)}" title="Delete your message">Delete</button>`:""}</div></div>`}).join("");
box.scrollTop=box.scrollHeight;
}
function startReply(id){const row=chatRows.find(r=>String(r.id)===String(id));if(!row)return;replyTarget=row;const preview=document.getElementById("replyPreview");preview.textContent=`Replying to ${row.sender_id===me.id?"yourself":(other?.name||other?.username||"message")}: ${replySnippet(row)}`;document.getElementById("replyBar").classList.add("show");document.getElementById("messageInput").focus()}
function cancelReply(){replyTarget=null;document.getElementById("replyBar").classList.remove("show");document.getElementById("replyPreview").textContent=""}
async function markIncomingSeen(){if(!me||!otherId||document.visibilityState!=="visible")return false;try{const now=new Date().toISOString();const {error}=await db.from("private_messages").update({seen_at:now}).eq("sender_id",otherId).eq("receiver_id",me.id).is("seen_at",null);if(error)throw error;return true}catch(e){console.warn("Seen status update failed; check private_messages UPDATE policy/columns",e);showStatus("Seen status save nahi hua. Supabase SQL/RLS policy check karein.");return false}}
async function refreshOtherStatus(){if(!otherId)return;try{const {data}=await db.from("profiles").select("id,username,name,avatar_url,last_seen").eq("id",otherId).maybeSingle();if(data){other=data;document.getElementById("chatStatus").textContent=onlineNow()?"🟢 Online":(other.username?"@"+other.username:"Private conversation")}}catch(e){}}
async function loadMessages(){
if(!me||!otherId)return;
try{
let {data,error}=await db.from("private_messages").select("*").or(`and(sender_id.eq.${me.id},receiver_id.eq.${otherId}),and(sender_id.eq.${otherId},receiver_id.eq.${me.id})`).order("created_at",{ascending:true}).limit(300);
if(error)throw error;
await markIncomingSeen();
({data,error}=await db.from("private_messages").select("*").or(`and(sender_id.eq.${me.id},receiver_id.eq.${otherId}),and(sender_id.eq.${otherId},receiver_id.eq.${me.id})`).order("created_at",{ascending:true}).limit(300));
if(error)throw error;
await refreshOtherStatus();renderMessages(data||[]);lastLoad=Date.now();
}catch(e){console.error(e);showStatus("Messages could not load. Check private_messages table and RLS policies.")}
}
async function deleteOwnMessage(id,button){
if(!me||!id)return;
if(!confirm("Delete this message? This removes it from the chat for both people."))return;
if(button)button.disabled=true;
try{
const {error}=await db.from("private_messages").delete().eq("id",id).eq("sender_id",me.id);
if(error)throw error;
showStatus("");await loadMessages();
}catch(err){console.error(err);showStatus("Message delete nahi hua. private_messages DELETE RLS policy check karein.");if(button)button.disabled=false}
}
document.getElementById("messages").addEventListener("click",e=>{
const rb=e.target.closest("[data-reply-id]");if(rb){startReply(rb.dataset.replyId);return}const b=e.target.closest("[data-delete-id]");if(b)deleteOwnMessage(b.dataset.deleteId,b);
});
document.getElementById("clearBtn").addEventListener("click",async()=>{
if(!me||!otherId)return;
if(!confirm("Clear chat? Sirf aap ke bheje hue messages delete honge. Doosre person ke messages rahenge."))return;
const btn=document.getElementById("clearBtn");btn.disabled=true;showStatus("Clearing your messages...");
try{
const {error}=await db.from("private_messages").delete().eq("sender_id",me.id).eq("receiver_id",otherId);
if(error)throw error;
showStatus("");await loadMessages();
}catch(err){console.error(err);showStatus("Chat clear nahi hui. private_messages DELETE RLS policy check karein.")}
finally{btn.disabled=false}
});
document.getElementById("leaveBtn").addEventListener("click",()=>{
if(confirm("Leave this chat and return to Private Chat list? Messages will not be deleted."))goBack();
});
async function uploadAndSend(file,type){
if(!me||!otherId||sending||!file)return;
sending=true;showStatus("Uploading media...");
try{
const safeName=String(file.name||(`${type}-${Date.now()}`)).replace(/[^a-zA-Z0-9._-]/g,"_");
const path=`${me.id}/${Date.now()}-${safeName}`;
const {data:up,error:uploadError}=await db.storage.from("chat-media").upload(path,file,{contentType:file.type||"application/octet-stream",upsert:false});
if(uploadError)throw uploadError;
const {data:pub}=db.storage.from("chat-media").getPublicUrl(up.path);
if(!pub?.publicUrl)throw new Error("Could not create media URL.");
const payload={sender_id:me.id,receiver_id:otherId,message_type:type,content:"",media_url:pub.publicUrl};if(replyTarget){payload.reply_to_content=replySnippet(replyTarget);payload.reply_to_sender_id=replyTarget.sender_id}const {error}=await db.from("private_messages").insert(payload);
if(error)throw error;
cancelReply();showStatus("");await loadMessages();
}catch(err){console.error(err);showStatus("Media not sent: "+(err.message||"Check chat-media bucket and private_messages.media_url column."))}
finally{sending=false}
}
document.getElementById("sendForm").addEventListener("submit",async e=>{
e.preventDefault();if(sending||!me||!otherId)return;
const input=document.getElementById("messageInput"),content=input.value.trim();if(!content)return;
sending=true;document.getElementById("send").disabled=true;
try{
const payload={sender_id:me.id,receiver_id:otherId,message_type:"text",content};if(replyTarget){payload.reply_to_content=replySnippet(replyTarget);payload.reply_to_sender_id=replyTarget.sender_id}const {error}=await db.from("private_messages").insert(payload);
if(error)throw error;input.value="";input.style.height="42px";cancelReply();showStatus("");await loadMessages();
}catch(err){console.error(err);showStatus("Message not sent: "+(err.message||"Check table permissions."))}
finally{sending=false;document.getElementById("send").disabled=false;input.focus()}
});
document.getElementById("cancelReply").addEventListener("click",cancelReply);
document.getElementById("imageBtn").addEventListener("click",()=>document.getElementById("imageInput").click());
document.getElementById("imageInput").addEventListener("change",async e=>{const file=e.target.files?.[0];if(file){if(!file.type.startsWith("image/")){showStatus("Please choose an image file.");e.target.value="";return}await uploadAndSend(file,"image")}e.target.value=""});
const emojiList=["😀","😂","🥹","😍","😘","😊","😉","😭","😎","🥰","❤️","💜","💖","💕","👍","👎","🙏","👏","🔥","🎉","🤔","😴","😡","😇","🙈","💯","✅","😋","🤗","😔","🤣","😜","🌹","✨","💯","🙌","🤝","💐","😅","😆","😃","😢","😱","🤩","🫶","💗","💞","💔","👀"];
const emojiPanel=document.getElementById("emojiPanel");emojiPanel.innerHTML=emojiList.map(em=>`<button type="button" aria-label="${em}">${em}</button>`).join("");
emojiPanel.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{const inp=document.getElementById("messageInput"),a=inp.selectionStart,z=inp.selectionEnd;inp.value=inp.value.slice(0,a)+b.textContent+inp.value.slice(z);inp.focus();inp.selectionStart=inp.selectionEnd=a+b.textContent.length;emojiPanel.style.display="none"}));
document.getElementById("emojiBtn").addEventListener("click",()=>{emojiPanel.style.display=emojiPanel.style.display==="flex"?"none":"flex"});
document.getElementById("voiceBtn").addEventListener("click",async()=>{
if(recording){mediaRecorder?.stop();return}
if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){showStatus("Voice recording is not supported in this browser.");return}
try{
const stream=await navigator.mediaDevices.getUserMedia({audio:true});voiceChunks=[];mediaRecorder=new MediaRecorder(stream);
mediaRecorder.ondataavailable=e=>{if(e.data.size)voiceChunks.push(e.data)};
mediaRecorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());recording=false;document.getElementById("voiceBtn").textContent="🎤";const blob=new Blob(voiceChunks,{type:mediaRecorder.mimeType||"audio/webm"});if(blob.size)await uploadAndSend(new File([blob],`voice-${Date.now()}.webm`,{type:blob.type}),"voice")};
mediaRecorder.start();recording=true;document.getElementById("voiceBtn").textContent="⏹️";showStatus("Recording voice… tap ⏹️ to finish and send.");
}catch(err){console.error(err);showStatus("Microphone permission was not granted.")}
});
const input=document.getElementById("messageInput");
input.addEventListener("input",()=>{input.style.height="42px";input.style.height=Math.min(input.scrollHeight,120)+"px"});
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();document.getElementById("sendForm").requestSubmit()}});
db.auth.onAuthStateChange((event,session)=>{if(session?.user&&!me){me=session.user;init()}});
init();setInterval(()=>{if(Date.now()-lastLoad>2500)loadMessages()},5000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")loadMessages()});
window.addEventListener("focus",()=>loadMessages());document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")loadMessages()});
</script>
</body>
</html>
