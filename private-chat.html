<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3e8ff;color:#2e1065}
header{min-height:64px;background:#6d28d9;color:#fff;display:flex;align-items:center;gap:8px;padding:8px 10px;position:sticky;top:0;z-index:4}
button{cursor:pointer;border:0}#back{font-size:26px;color:#fff;background:transparent;padding:4px;flex:0 0 auto}
.header-action{font-size:11px;font-weight:700;color:#fff;background:#5b21b6;border:1px solid #c4b5fd;border-radius:8px;padding:8px 7px;white-space:nowrap;flex:0 0 auto}
#leaveBtn{background:#7f1d1d;border-color:#fecaca}#clearBtn{background:#5b21b6}
#avatar{height:42px;width:42px;border-radius:50%;object-fit:cover;background:#dce7e3;display:grid;place-items:center;font-size:22px}
.identity{flex:1;min-width:0}.identity h1{font-size:16px;margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.identity p{font-size:12px;margin:0;color:#ede9fe}
#themeToggle{font-size:18px;line-height:1;min-width:34px;height:34px;padding:0 7px;border-radius:9px;background:#5b21b6;color:#fff;border:1px solid #c4b5fd;flex:0 0 auto}
main{max-width:760px;margin:auto;background:#f3e8ff;height:calc(100dvh - 64px);display:flex;flex-direction:column;padding-bottom:76px}
#messages{flex:1;min-height:0;overflow-y:auto;padding:16px 12px 24px;display:flex;flex-direction:column;gap:8px;background-color:#f3e8ff;background-image:radial-gradient(#ddd6fe 0.6px,transparent .6px);background-size:12px 12px}
.notice{text-align:center;align-self:center;background:#ede9fe;color:#4c1d95;border-radius:8px;padding:8px 12px;font-size:12px;max-width:90%;margin:4px auto}
.bubble{max-width:82%;padding:8px 10px 6px;border-radius:9px;box-shadow:0 1px 1px #0001;overflow-wrap:anywhere;font-size:14px;line-height:1.4;white-space:pre-wrap}
.bubble.mine{align-self:flex-end;background:#c4b5fd;color:#2e1065;border-top-right-radius:2px}.bubble.theirs{align-self:flex-start;background:#fff;border-top-left-radius:2px}
.message-footer{display:flex;align-items:center;justify-content:flex-end;gap:7px;margin-top:4px;min-height:17px}.time{display:inline-block;text-align:right;color:#667781;font-size:10px}.ticks{font-size:13px;letter-spacing:-4px;padding-right:3px;color:#667781;font-weight:700}.ticks.seen{color:#1686e0}
.reply-msg{font-size:10px;line-height:1;color:#5b21b6;background:#f5f3ff;border:1px solid #ddd6fe;border-radius:5px;padding:4px 5px;font-weight:700}
.reply-quote{border-left:3px solid #7c3aed;background:#ede9fe;border-radius:5px;padding:5px 7px;margin-bottom:6px;font-size:11px;color:#4c1d95;white-space:normal}
.reply-bar{display:none;align-items:center;gap:8px;padding:7px 12px;background:#ede9fe;border-top:1px solid #c4b5fd;font-size:12px;color:#4c1d95}.reply-bar.show{display:flex}
.reply-bar .reply-preview{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.reply-cancel{background:transparent;color:#7f1d1d;font-size:18px;padding:2px 7px}
.delete-msg{font-size:10px;line-height:1;color:#7f1d1d;background:#f5f3ff;border:1px solid #ddd6fe;border-radius:5px;padding:4px 5px;font-weight:700}.delete-msg:disabled{opacity:.5}
.image-message{max-width:100%;max-height:280px;border-radius:6px;display:block;margin-bottom:5px}
.composer{display:flex;align-items:flex-end;gap:6px;padding:9px;background:#f3e8ff;max-width:760px;width:100%;margin:auto;border:2px solid #7c3aed;border-radius:16px;position:relative}
#messageInput{flex:1;resize:none;max-height:120px;min-height:42px;border:0;outline:0;border-radius:22px;padding:12px 15px;font-size:15px;font-family:inherit;background:#fff}
#send{height:42px;width:44px;flex:0 0 44px;border-radius:50%;background:#7c3aed;color:#fff;font-size:20px}
.tool-btn{height:42px;width:36px;flex:0 0 36px;border-radius:50%;background:#7c3aed;color:#fff;font-size:20px;border:1px solid #6d28d9;padding:0}
#emojiPanel{display:none;position:absolute;bottom:70px;left:8px;right:8px;max-width:740px;margin:auto;background:#f5f3ff;border:1px solid #7c3aed;border-radius:12px;padding:8px;box-shadow:0 4px 18px #0002;z-index:8;flex-wrap:wrap;gap:4px}
#emojiPanel button{background:#ede9fe;color:#5b21b6;font-size:24px;padding:5px;border-radius:7px}
#send:disabled{opacity:.5}#status{font-size:12px;color:#b42318;padding:0 12px 5px;background:#f3e8ff}
#loadOlder{margin:8px auto;display:none;background:#ede9fe;color:#5b21b6;border:1px solid #c4b5fd;border-radius:20px;padding:8px 16px;font-size:12px;font-weight:700}#loadOlder:disabled{opacity:.5}
@media(min-width:761px){body{background:#ede9fe}main{border-left:1px solid #ddd;border-right:1px solid #ddd}#composerWrap{left:50%;transform:translateX(-50%);border-left:1px solid #ddd;border-right:1px solid #ddd}}
html[data-theme="dark"] body{background:#111018;color:#eeeaf8}html[data-theme="dark"] header{background:#211632}html[data-theme="dark"] .header-action{background:#342248;border-color:#59456d;color:#f5efff}html[data-theme="dark"] #leaveBtn{background:#702d39;border-color:#a65b67}html[data-theme="dark"] #avatar{background:#393044}html[data-theme="dark"] #chatStatus{color:#d5c8e7}html[data-theme="dark"] main{background:#111018}html[data-theme="dark"] #messages{background-color:#111018;background-image:radial-gradient(#30253b .6px,transparent .6px)}html[data-theme="dark"] .notice{background:#282033;color:#e6d8f8}html[data-theme="dark"] .bubble.mine{background:#573b7d;color:#fff}html[data-theme="dark"] .bubble.theirs{background:#28242f;color:#f4effa}html[data-theme="dark"] .time{color:#b8acbf}html[data-theme="dark"] .reply-msg,html[data-theme="dark"] .delete-msg{background:#33283e;color:#e7d6ff;border-color:#59456d}html[data-theme="dark"] .reply-quote{background:#33263f;color:#eadcf9;border-left-color:#b794f6}html[data-theme="dark"] .reply-bar{background:#251b30;color:#eadcf9;border-color:#493657}html[data-theme="dark"] .reply-cancel{color:#ff9ba8}html[data-theme="dark"] #composerWrap{background:#17121f!important;border-color:#40304e}html[data-theme="dark"] .composer{background:#17121f;border-color:#7852a1}html[data-theme="dark"] #messageInput{background:#292331;color:#f8f4ff;border:1px solid #51415f}html[data-theme="dark"] #messageInput::placeholder{color:#b7aabd}html[data-theme="dark"] #emojiPanel{background:#211a2a;border-color:#7852a1}html[data-theme="dark"] #emojiPanel button{background:#33263f;color:#eadcff}html[data-theme="dark"] #status{background:#111018;color:#ffaaa9}html[data-theme="dark"] #loadOlder{background:#30233d;color:#eadcff;border-color:#59456d}html[data-theme="dark"] #themeToggle{background:#eadcff;color:#2d1a3d;border-color:#b794f6}
@media(min-width:761px){html[data-theme="dark"] body{background:#17121f}html[data-theme="dark"] main{border-color:#393040}html[data-theme="dark"] #composerWrap{border-color:#393040}}
</style>
</head>
<body>
<header>
<button id="back" onclick="goBack()" aria-label="Back">‹</button><div id="avatar">👤</div>
<div class="identity"><h1 id="chatName">Private Chat</h1><p id="chatStatus">Connecting...</p></div>
<button id="themeToggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">🌙</button>
<button class="header-action" id="clearBtn" type="button" title="Delete all messages in this chat for both users">🧹 Clear</button>
<button class="header-action" id="leaveBtn" type="button">Leave</button>
</header>
<main>
<div id="messages"><div class="notice">Messages are shown here.</div><button id="loadOlder" type="button">⬆️ Load older messages</button></div>
<div id="status"></div>
<div id="composerWrap" style="position:fixed;bottom:0;left:0;right:0;z-index:10;max-width:760px;width:100%;margin:0 auto;background:#f3e8ff;padding-bottom:env(safe-area-inset-bottom)">
<div id="replyBar" class="reply-bar"><div class="reply-preview" id="replyPreview"></div><button class="reply-cancel" id="cancelReply" type="button" aria-label="Cancel reply">✕</button></div>
<div id="emojiPanel" aria-label="Emoji picker"></div>
<form class="composer" id="sendForm">
<button class="tool-btn" type="button" id="emojiBtn" aria-label="Emojis">😀</button><button class="tool-btn" type="button" id="imageBtn" aria-label="Send image">📷</button>
<input id="imageInput" type="file" accept="image/*" hidden><textarea id="messageInput" rows="1" placeholder="Message" autocomplete="off"></textarea>
<button class="tool-btn" type="button" id="voiceBtn" aria-label="Record voice message">🎤</button><button id="send" type="submit" aria-label="Send">➤</button>
</form></div></main>
<script>
const SUPABASE_URL="https://jhcpqjmxiovvqbghpxbf.supabase.co";
const SUPABASE_KEY="sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
function applyTheme(theme){const chosen=theme==="dark"?"dark":"light";document.documentElement.dataset.theme=chosen;try{localStorage.setItem("chatzone-theme",chosen)}catch(e){}const btn=document.getElementById("themeToggle");if(btn){btn.textContent=chosen==="dark"?"☀️":"🌙";btn.title=chosen==="dark"?"Switch to light mode":"Switch to dark mode";btn.setAttribute("aria-label",btn.title)}const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=chosen==="dark"?"#171222":"#8b5cf6"}
function toggleTheme(){applyTheme(document.documentElement.dataset.theme==="dark"?"light":"dark")}
(function(){let saved="light";try{saved=localStorage.getItem("chatzone-theme")||"light"}catch(e){}applyTheme(saved)})();
document.getElementById("themeToggle").addEventListener("click",toggleTheme);
window.addEventListener("storage",e=>{if(e.key==="chatzone-theme"&&e.newValue)applyTheme(e.newValue)});

const params=new URLSearchParams(location.search),otherId=params.get("user_id")||params.get("id")||params.get("receiver_id");
let me=null,other=null,sending=false,mediaRecorder=null,voiceChunks=[],recording=false,replyTarget=null,chatRows=[];
let chatZonePresenceChannel=null,privateRealtimeChannel=null;
let privateRealtimeRetryTimer=null,privateRealtimeRetryCount=0,privateRealtimeStarting=false;
const PAGE_SIZE=50;
let loadedCount=0,hasMoreOlder=true,isLoadingOlder=false,isLoadingMessages=false,realtimeRefreshQueued=false;
let refreshTimer=null,lastSeenUpdate=0;

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function goBack(){location.href="private.html"}
function showStatus(t){document.getElementById("status").textContent=t||""}
function timeText(v){if(!v)return"";let d=new Date(v);return Number.isNaN(d.getTime())?"":d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}
function messageText(r){return r.content??r.message??""}
function onlineNow(){return !!(other?.last_seen&&Date.now()-Date.parse(other.last_seen)<300000)}
function replySnippet(r){let t=messageText(r).trim();if(t)return t;let type=r.message_type||"text";return type==="image"?"📷 Photo":type==="voice"?"🎤 Voice message":"Message"}

function bubbleHtml(r){
  const mine=r.sender_id===me.id,text=messageText(r),type=r.message_type||"text";
  let body="";
  if(r.reply_to_content)body+=`<div class="reply-quote"><b>${r.reply_to_sender_id===me.id?"You":esc(other?.name||other?.username||"User")}</b><br>${esc(r.reply_to_content)}</div>`;
  if(type==="image"&&r.media_url)body+=`<img class="image-message" src="${esc(r.media_url)}" alt="Image message">`+(text?`<div>${esc(text)}</div>`:"");
  else if(type==="voice"&&r.media_url)body+=`<audio controls preload="metadata" src="${esc(r.media_url)}" style="max-width:220px;width:100%"></audio>`;
  else body+=esc(text);
  let tick="";
  if(mine){let seen=!!r.seen_at,delivered=!!r.delivered_at||onlineNow();tick=`<span class="ticks ${seen?"seen":""}" title="${seen?"Seen":delivered?"Delivered":"Sent"}">${seen?"✓✓":delivered?"✓✓":"✓"}</span>`}
  return `<div class="bubble ${mine?"mine":"theirs"}" data-message-id="${esc(r.id)}">${body}<div class="message-footer"><span class="time">${timeText(r.created_at)}</span>${tick}<button class="reply-msg" type="button" data-reply-id="${esc(r.id)}">↩ Reply</button>${mine&&r.id!=null?`<button class="delete-msg" type="button" data-delete-id="${esc(r.id)}">Delete</button>`:""}</div></div>`;
}
function renderMessagesInitial(rows,preserveScroll=false){
  const box=document.getElementById("messages");
  const oldTop=box.scrollTop,wasNearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<180;
  chatRows=rows;
  const button=`<button id="loadOlder" type="button" style="display:${hasMoreOlder&&loadedCount>0?"block":"none"}">⬆️ Load older messages (${loadedCount} loaded)</button>`;
  if(!rows.length)box.innerHTML=button+'<div class="notice">👋 Say hello and start the conversation.</div>';
  else box.innerHTML=button+rows.map(bubbleHtml).join("");
  if(!preserveScroll||wasNearBottom)box.scrollTop=box.scrollHeight;
  else box.scrollTop=Math.min(oldTop,Math.max(0,box.scrollHeight-box.clientHeight));
  attachLoadOlder();
}
function attachLoadOlder(){
  const b=document.getElementById("loadOlder");
  if(!b)return;
  b.onclick=loadOlderMessages;
  b.style.display=hasMoreOlder&&loadedCount>0?"block":"none";
  b.textContent=`⬆️ Load older messages (${loadedCount} loaded)`;
}
function prependOlderMessages(rows){
  if(!rows.length)return;
  const box=document.getElementById("messages"),height=box.scrollHeight,scroll=box.scrollTop;
  const temp=document.createElement("div");temp.innerHTML=rows.map(bubbleHtml).join("");
  const first=box.querySelector(".bubble");
  if(first)Array.from(temp.children).reverse().forEach(n=>box.insertBefore(n,first));
  else rows.forEach(r=>box.appendChild(Object.assign(document.createElement("div"),{innerHTML:bubbleHtml(r)}).firstElementChild));
  chatRows=[...rows,...chatRows];box.scrollTop=box.scrollHeight-height+scroll;
}
function upsertLiveMessage(row){
  if(!row||!me||row.id==null)return;
  const id=String(row.id),index=chatRows.findIndex(r=>String(r.id)===id);
  if(index>=0){
    chatRows[index]={...chatRows[index],...row};
    const old=document.querySelector(`[data-message-id="${CSS.escape(id)}"]`);
    if(old){const temp=document.createElement("div");temp.innerHTML=bubbleHtml(chatRows[index]);old.replaceWith(temp.firstElementChild)}
    return;
  }
  chatRows.push(row);chatRows.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));loadedCount++;
  const box=document.getElementById("messages"),nearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<180;
  const notice=box.querySelector(".notice");if(notice)notice.remove();
  const temp=document.createElement("div");temp.innerHTML=bubbleHtml(row);
  const older=box.querySelector("#loadOlder");
  if(older)box.insertBefore(temp.firstElementChild,older.nextSibling);else box.appendChild(temp.firstElementChild);
  if(nearBottom||row.sender_id===me.id)box.scrollTop=box.scrollHeight;
  attachLoadOlder();
}
function removeLiveMessage(row){
  if(!row?.id)return;
  const id=String(row.id);
  const existed=chatRows.some(r=>String(r.id)===id);
  chatRows=chatRows.filter(r=>String(r.id)!==id);
  const element=document.querySelector(`[data-message-id="${CSS.escape(id)}"]`);
  if(element)element.remove();
  if(existed)loadedCount=Math.max(0,loadedCount-1);
  if(!chatRows.length){
    const box=document.getElementById("messages");
    if(!box.querySelector(".notice"))box.insertAdjacentHTML("beforeend",'<div class="notice">👋 Say hello and start the conversation.</div>');
  }
  attachLoadOlder();
}
function scheduleResync(){
  clearTimeout(refreshTimer);
  refreshTimer=setTimeout(()=>{if(!isLoadingOlder)loadMessages(true);else realtimeRefreshQueued=true},250);
}
async function markIncomingSeen(){
  if(!me||!otherId||document.visibilityState!=="visible")return;
  if(Date.now()-lastSeenUpdate<1200)return;
  lastSeenUpdate=Date.now();
  try{
    const {error}=await db.from("private_messages").update({seen_at:new Date().toISOString()})
      .eq("sender_id",otherId).eq("receiver_id",me.id).is("seen_at",null);
    if(error)throw error;
  }catch(e){console.warn("Seen update failed",e)}
}
async function refreshOtherStatus(){
  if(!otherId)return;
  try{
    const {data}=await db.from("profiles").select("id,username,name,avatar_url,last_seen").eq("id",otherId).maybeSingle();
    if(data){other=data;document.getElementById("chatStatus").textContent=onlineNow()?"🟢 Online":(other.username?"@"+other.username:"Private conversation")}
  }catch(e){console.warn("Profile status refresh failed:",e)}
}
async function loadMessages(isInitial=false,preserveScroll=false){
  if(!me||!otherId)return;
  if(isLoadingMessages||isLoadingOlder){realtimeRefreshQueued=true;return}
  isLoadingMessages=true;
  try{
    const query=db.from("private_messages").select("*")
      .or(`and(sender_id.eq.${me.id},receiver_id.eq.${otherId}),and(sender_id.eq.${otherId},receiver_id.eq.${me.id})`)
      .order("created_at",{ascending:false}).range(0,PAGE_SIZE-1);
    const result=await Promise.race([
      query,
      new Promise((_,reject)=>setTimeout(()=>reject(new Error("Chat request timed out. Check internet or Supabase API.")),20000))
    ]);
    if(result.error)throw result.error;
    const rows=result.data||[];
    loadedCount=rows.length;hasMoreOlder=rows.length===PAGE_SIZE;

    // Render messages immediately. A slow profiles query must never block chat loading.
    renderMessagesInitial(rows.slice().reverse(),preserveScroll);
    showStatus("");

    // Profile/presence is secondary and must not delay the messages.
    refreshOtherStatus();
    if(isInitial)markIncomingSeen();
  }catch(e){
    console.error("Messages load failed:",e);
    showStatus("Messages could not load: "+(e.message||e.details||"Check Supabase API/RLS."));
  }finally{
    isLoadingMessages=false;
    if(realtimeRefreshQueued){
      realtimeRefreshQueued=false;
      scheduleResync();
    }
  }
}
async function loadOlderMessages(){
  if(!me||!otherId||isLoadingOlder||isLoadingMessages||!hasMoreOlder)return;
  isLoadingOlder=true;const b=document.getElementById("loadOlder");
  if(b){b.disabled=true;b.textContent="Loading..."}
  try{
    const {data,error}=await db.from("private_messages").select("*")
      .or(`and(sender_id.eq.${me.id},receiver_id.eq.${otherId}),and(sender_id.eq.${otherId},receiver_id.eq.${me.id})`)
      .order("created_at",{ascending:false}).range(loadedCount,loadedCount+PAGE_SIZE-1);
    if(error)throw error;
    if(!data?.length)hasMoreOlder=false;
    else{prependOlderMessages(data.reverse());loadedCount+=data.length;hasMoreOlder=data.length===PAGE_SIZE}
    attachLoadOlder();
  }catch(e){console.error(e);showStatus("Older messages load nahi hue.")}
  finally{
    isLoadingOlder=false;
    const current=document.getElementById("loadOlder");if(current)current.disabled=false;
    if(realtimeRefreshQueued){realtimeRefreshQueued=false;scheduleResync()}
  }
}
function schedulePrivateRealtimeRetry(channel,status,error){
  console.warn("Private chat realtime retry:",status,error||"");
  showStatus("Realtime reconnecting…");
  if(privateRealtimeRetryTimer)return;
  if(channel&&privateRealtimeChannel===channel)privateRealtimeChannel=null;
  const delay=Math.min(30000,1000*Math.pow(2,Math.min(privateRealtimeRetryCount,5)));
  privateRealtimeRetryCount++;
  privateRealtimeRetryTimer=setTimeout(async()=>{
    privateRealtimeRetryTimer=null;
    if(channel){try{await db.removeChannel(channel)}catch(e){console.warn("Old realtime channel cleanup:",e)}}
    if(document.visibilityState==="visible"&&navigator.onLine)startPrivateRealtime();
  },delay);
}
function startPrivateRealtime(){
  if(!me||!otherId||privateRealtimeChannel||privateRealtimeStarting||!navigator.onLine)return;
  privateRealtimeStarting=true;
  const channel=db.channel("private-chat-"+me.id+"-"+otherId)
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"private_messages"},payload=>{
      const row=payload.new;if(!row)return;
      const match=(row.sender_id===me.id&&row.receiver_id===otherId)||(row.sender_id===otherId&&row.receiver_id===me.id);
      if(!match)return;
      upsertLiveMessage(row);
      if(row.receiver_id===me.id&&document.visibilityState==="visible")markIncomingSeen();
    })
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"private_messages"},payload=>{
      const row=payload.new;if(!row)return;
      const match=(row.sender_id===me.id&&row.receiver_id===otherId)||(row.sender_id===otherId&&row.receiver_id===me.id);
      if(match)upsertLiveMessage(row);
    })
    .on("postgres_changes",{event:"DELETE",schema:"public",table:"private_messages"},payload=>{
      const row=payload.old;if(row?.id)removeLiveMessage(row);else scheduleResync();
    });
  privateRealtimeChannel=channel;
  channel.subscribe((status,error)=>{
    console.log("Private chat realtime status:",status,error||"");
    privateRealtimeStarting=false;
    if(status==="SUBSCRIBED"){
      privateRealtimeRetryCount=0;
      if(privateRealtimeRetryTimer){clearTimeout(privateRealtimeRetryTimer);privateRealtimeRetryTimer=null}
      showStatus("");scheduleResync();
    }else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"||status==="CLOSED"){
      schedulePrivateRealtimeRetry(channel,status,error);
    }
  });
}
async function stopPrivateRealtime(){
  if(privateRealtimeRetryTimer){clearTimeout(privateRealtimeRetryTimer);privateRealtimeRetryTimer=null}
  privateRealtimeStarting=false;
  if(privateRealtimeChannel){const c=privateRealtimeChannel;privateRealtimeChannel=null;try{await db.removeChannel(c)}catch(e){}}
}
async function startChatZonePresence(user){
  if(!user?.id||chatZonePresenceChannel)return;
  try{
    chatZonePresenceChannel=db.channel("chatzone-online-users",{config:{presence:{key:String(user.id)}}});
    chatZonePresenceChannel.subscribe(async status=>{
      if(status==="SUBSCRIBED"){try{await chatZonePresenceChannel.track({user_id:String(user.id),online_at:new Date().toISOString(),page:"private"})}catch(e){console.warn("Presence track failed:",e)}}
    });
  }catch(e){console.warn(e);chatZonePresenceChannel=null}
}
async function stopPresence(){
  if(chatZonePresenceChannel){const c=chatZonePresenceChannel;chatZonePresenceChannel=null;try{await c.untrack()}catch(e){}try{await db.removeChannel(c)}catch(e){}}
}
window.addEventListener("pagehide",()=>{if(chatZonePresenceChannel){try{chatZonePresenceChannel.untrack()}catch(e){}}});
async function init(){
  try{
    const {data,error}=await db.auth.getSession();if(error)throw error;
    let session=data?.session;
    if(!session){await new Promise(r=>setTimeout(r,500));session=(await db.auth.getSession()).data?.session}
    if(!session?.user){location.href="login.html";return}
    me=session.user;startChatZonePresence(me);
    if(!otherId||otherId===me.id){showStatus("Chat user ID is missing or invalid.");document.getElementById("chatName").textContent="Chat unavailable";return}
    const {data:profile,error:pe}=await db.from("profiles").select("id,username,name,avatar_url,last_seen").eq("id",otherId).maybeSingle();
    if(pe)throw pe;if(!profile){showStatus("User profile not found.");return}
    other=profile;document.getElementById("chatName").textContent=profile.name||profile.username||"ChatZone User";
    document.getElementById("chatStatus").textContent=onlineNow()?"🟢 Online":(profile.username?"@"+profile.username:"Private conversation");
    if(profile.avatar_url)document.getElementById("avatar").outerHTML=`<img id="avatar" src="${esc(profile.avatar_url)}" alt="" style="height:42px;width:42px;border-radius:50%;object-fit:cover">`;
    await loadMessages(true,false);startPrivateRealtime();
  }catch(e){console.error(e);showStatus("Could not open chat: "+(e.message||"Check Supabase permissions."))}
}
function startReply(id){
  const row=chatRows.find(r=>String(r.id)===String(id));if(!row)return;
  replyTarget=row;
  document.getElementById("replyPreview").textContent=`Replying to ${row.sender_id===me.id?"yourself":(other?.name||other?.username||"message")}: ${replySnippet(row)}`;
  document.getElementById("replyBar").classList.add("show");document.getElementById("messageInput").focus();
}
function cancelReply(){replyTarget=null;document.getElementById("replyBar").classList.remove("show");document.getElementById("replyPreview").textContent=""}
document.getElementById("messages").addEventListener("click",e=>{
  const r=e.target.closest("[data-reply-id]");if(r){startReply(r.dataset.replyId);return}
  const d=e.target.closest("[data-delete-id]");if(d)deleteOwnMessage(d.dataset.deleteId,d);
});
async function deleteOwnMessage(id,button){
  if(!me||!id||!confirm("Delete this message for both people?"))return;
  if(button)button.disabled=true;
  try{
    const {error}=await db.from("private_messages").delete().eq("id",id).eq("sender_id",me.id);
    if(error)throw error;
    removeLiveMessage({id});showStatus("");
  }catch(e){console.error(e);showStatus("Message delete nahi hua. DELETE RLS policy check karein.");if(button)button.disabled=false}
}
document.getElementById("clearBtn").addEventListener("click",async()=>{
  if(!me||!otherId)return;
  if(!confirm("Clear this entire conversation for BOTH users? All messages from both sides will be permanently deleted."))return;
  const btn=document.getElementById("clearBtn");btn.disabled=true;showStatus("Clearing conversation for both users…");
  try{
    const {error}=await db.from("private_messages").delete()
      .or(`and(sender_id.eq.${me.id},receiver_id.eq.${otherId}),and(sender_id.eq.${otherId},receiver_id.eq.${me.id})`);
    if(error)throw error;
    chatRows=[];loadedCount=0;hasMoreOlder=true;cancelReply();
    renderMessagesInitial([]);showStatus("");
  }catch(e){console.error(e);showStatus("Chat clear nahi hui. Supabase DELETE RLS policy/SQL check karein.")}
  finally{btn.disabled=false}
});
document.getElementById("leaveBtn").addEventListener("click",()=>{
  if(!me||!otherId)return;
  if(!confirm("Leave this chat and return to Private Chat list? Messages will not be deleted."))return;
  try{const key="chatzone_hidden_private_chats_"+me.id,hidden=JSON.parse(localStorage.getItem(key)||"[]");if(!hidden.includes(otherId))hidden.push(otherId);localStorage.setItem(key,JSON.stringify(hidden))}catch(e){console.warn(e)}
  goBack();
});
async function insertMessage(payload){
  const {error}=await db.from("private_messages").insert(payload);
  if(error)throw error;
  // The INSERT Realtime event adds the row immediately to this chat.
}
async function uploadAndSend(file,type){
  if(!me||!otherId||sending||!file)return;
  sending=true;showStatus("Uploading media…");
  try{
    const safe=String(file.name||(`${type}-${Date.now()}`)).replace(/[^a-zA-Z0-9._-]/g,"_");
    const path=`${me.id}/${Date.now()}-${safe}`;
    const {data:up,error:ue}=await db.storage.from("chat-media").upload(path,file,{contentType:file.type||"application/octet-stream",upsert:false});
    if(ue)throw ue;
    const pub=db.storage.from("chat-media").getPublicUrl(up.path).data?.publicUrl;
    if(!pub)throw new Error("Could not create media URL.");
    const payload={sender_id:me.id,receiver_id:otherId,message_type:type,content:"",media_url:pub};
    if(replyTarget){payload.reply_to_content=replySnippet(replyTarget);payload.reply_to_sender_id=replyTarget.sender_id}
    await insertMessage(payload);cancelReply();showStatus("");
  }catch(e){console.error(e);showStatus("Media not sent: "+(e.message||"Check chat-media bucket."))}
  finally{sending=false}
}
document.getElementById("sendForm").addEventListener("submit",async e=>{
  e.preventDefault();if(sending||!me||!otherId)return;
  const input=document.getElementById("messageInput"),content=input.value.trim();if(!content)return;
  sending=true;document.getElementById("send").disabled=true;
  try{
    const payload={sender_id:me.id,receiver_id:otherId,message_type:"text",content};
    if(replyTarget){payload.reply_to_content=replySnippet(replyTarget);payload.reply_to_sender_id=replyTarget.sender_id}
    await insertMessage(payload);
    input.value="";input.style.height="42px";cancelReply();showStatus("");
  }catch(e){console.error(e);showStatus("Message not sent: "+(e.message||"Check permissions."))}
  finally{sending=false;document.getElementById("send").disabled=false;input.focus()}
});
document.getElementById("cancelReply").addEventListener("click",cancelReply);
document.getElementById("imageBtn").addEventListener("click",()=>document.getElementById("imageInput").click());
document.getElementById("imageInput").addEventListener("change",async e=>{
  const f=e.target.files?.[0];
  if(f){if(!f.type.startsWith("image/")){showStatus("Please choose an image file.");e.target.value="";return}await uploadAndSend(f,"image")}
  e.target.value="";
});
const emojiList=["😀","😂","🥹","😍","😘","😊","😉","😭","😎","🥰","❤️","💜","💖","💕","👍","👎","🙏","👏","🔥","🎉","🤔","😴","😡","😇","🙈","💯","✅","😋","🤗","😔","🤣","😜","🌹","✨","🙌","🤝","💐","😅","😆","😃","😢","😱","🤩","🫶","💗","💞","💔","👀"];
const emojiPanel=document.getElementById("emojiPanel");
emojiPanel.innerHTML=emojiList.map(x=>`<button type="button" aria-label="${x}">${x}</button>`).join("");
emojiPanel.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
  const i=document.getElementById("messageInput"),a=i.selectionStart,z=i.selectionEnd;
  i.value=i.value.slice(0,a)+b.textContent+i.value.slice(z);i.focus();i.selectionStart=i.selectionEnd=a+b.textContent.length;emojiPanel.style.display="none";
}));
document.getElementById("emojiBtn").addEventListener("click",()=>emojiPanel.style.display=emojiPanel.style.display==="flex"?"none":"flex");
document.getElementById("voiceBtn").addEventListener("click",async()=>{
  if(recording){mediaRecorder?.stop();return}
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){showStatus("Voice recording is not supported in this browser.");return}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});voiceChunks=[];
    mediaRecorder=new MediaRecorder(stream);
    mediaRecorder.ondataavailable=e=>{if(e.data.size)voiceChunks.push(e.data)};
    mediaRecorder.onstop=async()=>{
      stream.getTracks().forEach(t=>t.stop());recording=false;document.getElementById("voiceBtn").textContent="🎤";
      const blob=new Blob(voiceChunks,{type:mediaRecorder.mimeType||"audio/webm"});
      if(blob.size)await uploadAndSend(new File([blob],`voice-${Date.now()}.webm`,{type:blob.type}),"voice");
    };
    mediaRecorder.start();recording=true;document.getElementById("voiceBtn").textContent="⏹️";showStatus("Recording voice… tap ⏹️ to finish and send.");
  }catch(e){console.error(e);showStatus("Microphone permission was not granted.")}
});
const input=document.getElementById("messageInput");
input.addEventListener("input",()=>{input.style.height="42px";input.style.height=Math.min(input.scrollHeight,120)+"px"});
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();document.getElementById("sendForm").requestSubmit()}});
db.auth.onAuthStateChange((event,session)=>{if(session?.user&&!me)init()});
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"){if(!isLoadingOlder&&!isLoadingMessages)loadMessages(false,true);markIncomingSeen()}
});
window.addEventListener("focus",()=>{if(!isLoadingOlder&&!isLoadingMessages)loadMessages(false,true)});
window.addEventListener("online",()=>{
  if(privateRealtimeRetryTimer){clearTimeout(privateRealtimeRetryTimer);privateRealtimeRetryTimer=null}
  if(privateRealtimeChannel){const old=privateRealtimeChannel;privateRealtimeChannel=null;db.removeChannel(old).finally(()=>startPrivateRealtime())}
  else startPrivateRealtime();
});
window.addEventListener("offline",()=>showStatus("Internet disconnected. Realtime will reconnect when online."));
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"&&navigator.onLine&&!privateRealtimeChannel)startPrivateRealtime();
});
window.addEventListener("beforeunload",()=>{stopPrivateRealtime();stopPresence()});
init();
</script>
</body>
</html>
