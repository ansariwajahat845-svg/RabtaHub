<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Change Password - chatzone</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#6c5ce7,#8e44ad);
 min-height:100vh;
}

.header{
 background:white;
 padding:18px;
 text-align:center;
}

.header h2{
 margin:0;
 color:#6c5ce7;
}

.container{
 width:94%;
 max-width:500px;
 margin:20px auto;
}

.back{
 color:white;
 text-decoration:none;
 font-weight:bold;
}

.card{
 background:white;
 margin-top:15px;
 padding:20px;
 border-radius:16px;
 box-shadow:0 4px 15px #0002;
}

label{
 display:block;
 margin-top:14px;
 margin-bottom:6px;
 font-weight:bold;
 color:#555;
}

input{
 width:100%;
 padding:13px;
 border:1px solid #ddd;
 border-radius:10px;
 outline:none;
}

button{
 width:100%;
 margin-top:20px;
 padding:14px;
 border:0;
 border-radius:10px;
 background:#6c5ce7;
 color:white;
 font-size:16px;
 font-weight:bold;
}

#message{
 margin-top:14px;
 text-align:center;
 font-size:14px;
}
</style>
</head>

<body>

<div class="header">
<h2>🔑 Change Password</h2>
</div>

<div class="container">

<a class="back" href="more.html">← Back</a>

<div class="card">

<label>New Password</label>
<input
 id="password"
 type="password"
 placeholder="New password">

<label>Confirm Password</label>
<input
 id="confirmPassword"
 type="password"
 placeholder="Confirm password">

<button onclick="changePassword()">
Change Password
</button>

<div id="message"></div>

</div>
</div>

<script>

const SUPABASE_URL=
"https://jhcpqjmxiovvqbghpxbf.supabase.co";

const SUPABASE_KEY=
"sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";

const supabaseClient=
supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

async function changePassword(){

 const password=
 document.getElementById("password").value;

 const confirmPassword=
 document.getElementById("confirmPassword").value;

 const message=
 document.getElementById("message");

 if(!password || !confirmPassword){
   message.style.color="red";
   message.textContent="Dono fields fill karein.";
   return;
 }

 if(password.length < 6){
   message.style.color="red";
   message.textContent=
     "Password kam az kam 6 characters ka ho.";
   return;
 }

 if(password !== confirmPassword){
   message.style.color="red";
   message.textContent=
     "Passwords match nahi kar rahe.";
   return;
 }

 message.style.color="#555";
 message.textContent="Password update ho raha hai...";

 try{

   const {error}=
     await supabaseClient.auth.updateUser({
       password:password
     });

   if(error) throw error;

   message.style.color="green";
   message.textContent=
     "Password successfully change ho gaya.";

   document.getElementById("password").value="";
   document.getElementById("confirmPassword").value="";

 }catch(error){

   message.style.color="red";
   message.textContent=
     error.message;

 }

}

</script>

</body>
</html>
